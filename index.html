:{},"ans":null,"ansText":"12/25","expl":"點數和為12的樣本點共25個，其中第一次為奇數點者12個，故P(B'|A)=12/25。","flag":false,"num":1},{"id":945,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"設A、B為二事件，P(A)=3/8，P(B)=3/4，P(A∪B)=7/8，試求：(1)P(A|B) (2)P(A'|B) (3)P(A'|B')。","opts":{},"ans":null,"ansText":"(1)1/3，(2)2/3，(3)1/2","expl":"P(A∩B)=3/8+3/4-7/8=1/4，P(A|B)=(1/4)/(3/4)=1/3，P(A'|B)=1-1/3=2/3，P(A'|B')=P((A∪B)')/P(B')=(1/8)/(1/4)=1/2。","flag":false,"num":2},{"id":946,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"設袋中有8個白球4個紅球，從袋中逐次取出4球（每次取球時每一球被取中的機會相等），在抽中3個白球的條件下，求第三次抽中白球的機率（分別考慮取後放回與取後不放回）。","opts":{},"ans":null,"ansText":"3/4（取後放回與取後不放回皆為3/4）","expl":"在恰抽中3白球的條件下，由對稱性，白球出現在四次中任一次的條件機率相等，故第三次為白球的機率為3/4。","flag":false,"num":3},{"id":953,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"設A、B為樣本空間S中的二事件，且P(A)=1/3，P(B)=1/4，P(A∩B)=1/6，求(1)P(A|B) (2)P(B|A) (3)P(A'|B') (4)P(B'|A')。","opts":{},"ans":null,"ansText":"(1)2/3，(2)1/2，(3)7/9，(4)7/8","expl":"P(A∪B)=5/12，P(A'∩B')=7/12；P(A|B)=(1/6)/(1/4)=2/3，P(B|A)=1/2，P(A'|B')=(7/12)/(3/4)=7/9，P(B'|A')=(7/12)/(2/3)=7/8。","flag":false,"num":10},{"id":954,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"某鎮患有眼疾者12%，牙疾者10%，二者兼有者4%。(1)從患眼疾中選一人，恰有患牙疾之條件機率為何？(2)從患牙疾中選一人，恰有患眼疾之條件機率為何？","opts":{},"ans":null,"ansText":"(1)1/3，(2)2/5","expl":"(1)=0.04/0.12=1/3；(2)=0.04/0.10=2/5。","flag":false,"num":11},{"id":955,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"假設汽車駕駛人中有0.005是酒醉駕車，又酒醉駕車且肇事者占駕駛人的0.003，求駕駛人在酒醉的情況下肇事的機率。","opts":{},"ans":null,"ansText":"3/5","expl":"P(肇事|酒醉)=0.003/0.005=3/5。","flag":false,"num":12},{"id":956,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"某一家庭有兩個小孩，(1)若已知兩個小孩至少有一個男孩，求兩個均為男孩的機率 (2)若已知大孩子為男孩，求兩個都是男孩的機率。","opts":{},"ans":null,"ansText":"(1)1/3，(2)1/2","expl":"樣本空間{男男,男女,女男,女女}；至少一男的條件下為男男機率1/3；大孩為男的條件下為1/2。","flag":false,"num":13},{"id":957,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"擲三次均勻骰子，設三次中至少出現一次6點的事件為A，至少出現一次1點的事件為B，則P(B|A)=？","opts":{},"ans":null,"ansText":"30/91","expl":"n(A)=216-125=91；n(A∩B)=216-2×125+64=30（排容原理）；P(B|A)=30/91。","flag":false,"num":14},{"id":958,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"擲三枚相同且均勻的銅板一次，則在至少出現一個正面的條件下，恰好出現兩個正面的機率為何？","opts":{},"ans":null,"ansText":"3/7","expl":"至少一正面有7個樣本點，恰兩正面有3個，故為3/7。","flag":false,"num":15},{"id":959,"src":"甲｜講義-機率統計","ch":"條件機率｜基本題","type":"open","q":"設袋中有10個球，其中白球6個、紅球4個，自袋中取球每次取一個，取後不放回共取三次。在取出之三球中恰有二白球的條件下，求第二次抽到白球的機率。","opts":{},"ans":null,"ansText":"2/3","expl":"恰二白球的條件下，由對稱性白球落在三次中任兩次的機率相同，第二次為白球的機率=2/3。","flag":false,"num":16},{"id":947,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"一袋中有5個白球、8個黑球，從袋中連續取出3個球，取出之球不再放回。求(1)依序取出白球、黑球、白球的機率 (2)第一次取出為黑球的機率 (3)第二次取出黑球的機率。","opts":{},"ans":null,"ansText":"(1)160/1716，(2)8/13，(3)8/13","expl":"(1)=5/13×8/12×4/11=160/1716；(2)(3)由抽籤原理，每一次取出黑球的機率皆為8/13。","flag":false,"num":4},{"id":948,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"一袋內有m支籤，其中n支是獎籤(3<n<m)，甲、乙、丙依次抽籤，每人各取一次，每次從袋內任取1支籤取後不放回，則甲、乙、丙三人抽中獎籤的機率依次為何？","opts":{},"ans":null,"ansText":"三人均為 n/m","expl":"抽籤原理：不論抽籤先後順序，每人抽中獎籤的機率都等於n/m。","flag":false,"num":5},{"id":960,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"設甲袋中有5個白球、2個紅球，乙袋中有4個白球、3個紅球。今擲骰子一次，擲得1,2點則選取甲袋，擲得3,4,5,6點則選取乙袋，從選出的袋中任取2球，求選出的球為1白1紅的機率。","opts":{},"ans":null,"ansText":"34/63","expl":"(1/3)×C(5,1)C(2,1)/C(7,2)+(2/3)×C(4,1)C(3,1)/C(7,2)=(1/3)(10/21)+(2/3)(12/21)=34/63。","flag":false,"num":17},{"id":961,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"袋中有4個白球、3個黑球。(1)任取3球，求取得2白球1黑球之機率 (2)每次任取一球取後不放回，求依次取得白球、白球、黑球的機率 (3)每次任取一球取後放回共取3次，求取得2次白球、1次黑球的機率。","opts":{},"ans":null,"ansText":"(1)18/35，(2)6/35，(3)144/343","expl":"(1)C(4,2)C(3,1)/C(7,3)=18/35；(2)4/7×3/6×3/5=6/35；(3)C(3,2)(4/7)^2(3/7)=144/343。","flag":false,"num":18},{"id":962,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"某公司生產20個產品中有4個不良品，現逐一加以檢查。(1)取出後不放回，在第四次發現第二個不良品之機率為何？(2)取出後放回，在第四次發現第二個不良品之機率為何？","opts":{},"ans":null,"ansText":"(1)24/323，(2)48/625","expl":"(1)前三次恰1不良且第四次不良：C(3,1)×(4×16×15×3)/(20×19×18×17)=24/323；(2)C(3,1)(0.2)(0.8)^2×0.2=48/625。","flag":false,"num":19},{"id":963,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"袋中有5白球、4紅球，今自袋中連取3球（每次取一球）。(1)若取出不放回，求依次是紅球、白球、紅球之機率 (2)若取出再放回，求依次是紅球、白球、紅球之機率。","opts":{},"ans":null,"ansText":"(1)5/42，(2)80/729","expl":"(1)4/9×5/8×3/7=5/42；(2)4/9×5/9×4/9=80/729。（原文未附解答，此為依題意計算之結果）","flag":false,"num":20},{"id":964,"src":"甲｜講義-機率統計","ch":"條件機率｜條件機率的乘法原理","type":"open","q":"10支籤中有獎籤3支，今依甲、乙之順序抽籤（不放回），試求：(1)甲乙均抽中有獎籤的機率 (2)甲沒抽中有獎籤、乙抽中有獎籤的機率 (3)在甲沒抽中有獎籤的條件下，乙抽中有獎籤的機率 (4)甲抽中有獎籤和乙抽中有獎籤之機率各為何。","opts":{},"ans":null,"ansText":"(1)1/15，(2)7/30，(3)1/3，(4)都是3/10","expl":"(1)3/10×2/9=1/15；(2)7/10×3/9=7/30；(3)3/9=1/3；(4)由抽籤原理，甲、乙抽中的機率皆為3/10。","flag":false,"num":21},{"id":949,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"multi","q":"醫療主管機關發現若受檢人感染某傳染病就一定可檢測出來，但有4%的機率將不患病之受檢者誤檢為患病。已知全部男性人口中有0.2%患有此病。兵役體檢時某役男被告知患有該病，請問下列哪些敘述為真？","opts":{"A":"該役男確實染病的機率大於3%","B":"該役男確實染病的機率大於4%","C":"該役男確實染病的機率大於5%","D":"該役男確實染病的機率大於90%"},"ans":"AB","ansText":"(A)(B)","expl":"由貝氏定理，P(染病|檢出)=0.002×1/(0.002×1+0.998×0.04)≈0.0477，約4.8%，大於3%與4%但小於5%。","flag":false,"num":6},{"id":950,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"open","q":"某工廠由甲、乙、丙三台機器製造某一產品，甲生產全部產品的50%，乙生產30%，丙生產20%。甲的產品中有3%、乙有4%、丙有5%為不良品。從產品中任選一產品，(1)求選出之產品為不良品的機率 (2)若該產品為不良品，求此產品為甲機器製造的機率。","opts":{},"ans":null,"ansText":"(1)0.037，(2)15/37","expl":"P(不良)=0.5×0.03+0.3×0.04+0.2×0.05=0.037；由貝氏定理P(甲|不良)=0.015/0.037=15/37。","flag":false,"num":7},{"id":965,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"open","q":"調查某新興工業都市市民對市長施政的滿意情況，隨機抽樣男性600人、女性400人。調查結果男性中有36%滿意市長的施政，女性市民中有46%滿意，則滿意市長施政的樣本佔全體樣本的百分比為多少％？","opts":{},"ans":null,"ansText":"40％","expl":"(600×0.36+400×0.46)/1000=(216+184)/1000=40%。","flag":false,"num":22},{"id":966,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"open","q":"某種診斷方法，患癌症的人經檢驗後發現有癌症的可能性為0.90，不患癌症的人經同樣檢驗後發現有癌症的可能性為0.05。假設一群人中有6%的人患有癌症，現從此群人中任選一人加以檢驗，求(1)檢驗出有癌症的機率 (2)設檢驗出有癌症，求此人確有癌症的機率。","opts":{},"ans":null,"ansText":"(1)0.101，(2)54/101","expl":"(1)0.06×0.9+0.94×0.05=0.101；(2)貝氏定理：0.054/0.101=54/101。","flag":false,"num":23},{"id":967,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"single","q":"某校橋藝社由甲、乙、丙三班同學組成，各佔40%、30%、30%。社員中甲班人數的1/4、乙班人數的1/5、丙班人數的1/3也是籃球校隊的隊員。某次橋藝社推選新社長，每人當選的機會均等，則籃球隊員當選的機率為何？","opts":{"A":"11/50","B":"12/50","C":"13/50","D":"14/50","E":"15/50"},"ans":"C","ansText":"(C) 13/50","expl":"0.4×1/4+0.3×1/5+0.3×1/3=0.1+0.06+0.1=0.26=13/50。","flag":false,"num":24},{"id":968,"src":"甲｜講義-機率統計","ch":"條件機率｜貝氏定理","type":"open","q":"甲說實話的機率為7/10，乙說實話的機率為9/10。今有一袋內藏3白球、7黑球，自袋中任取一球，甲乙二人均說是白球，則此球確實為白球之機率為何？","opts":{},"ans":null,"ansText":"9/10","expl":"P(白且兩人皆實話)=3/10×7/10×9/10=189/1000；P(黑且兩人皆說謊)=7/10×3/10×1/10=21/1000；所求=189/(189+21)=9/10。","flag":false,"num":25},{"id":952,"src":"甲｜講義-機率統計","ch":"條件機率｜樹狀圖求機率","type":"open","q":"設A、B兩箱，A箱內有1黑球1白球，B箱內有1白球。甲乙兩人輪流取球，每次先由甲自A箱任取一球放入B箱，再由乙自B箱任取一球放入A箱，動作完成後稱為一局。(1)當一局結束時，A箱內兩球為一黑一白的機率為何？(2)當第三局結束時，A箱內兩球為一黑一白的機率為何？","opts":{},"ans":null,"ansText":"(1)3/4，(2)43/64","expl":"以樹狀圖列出每局後A箱狀態的轉移機率：每局後維持一黑一白的機率為3/4，全白轉回一黑一白機率為1/2，遞推得第三局後為43/64。","flag":false,"num":9},{"id":969,"src":"甲｜講義-機率統計","ch":"條件機率｜樹狀圖求機率","type":"open","q":"設A、B兩盒子內各有兩個球，其中A盒內有二白球，B盒內有一白球一黑球。甲、乙兩人輪流取球，每次先由甲自A盒任取一球放入B盒，再由乙自B盒任取一球放入A盒，動作完成後稱為一局。(1)求第一局結束時A盒內還是二白球的機率 (2)求第二局結束時A盒內還是二白球的機率 (3)求第三局結束時A盒內還是二白球的機率。","opts":{},"ans":null,"ansText":"(1)2/3，(2)5/9，(3)14/27","expl":"每局的狀態轉移：二白→二白機率2/3，一白一黑→二白機率1/3，遞推得5/9、14/27。","flag":false,"num":26},{"id":970,"src":"甲｜講義-機率統計","ch":"條件機率｜樹狀圖求機率","type":"open","q":"某人上班有甲、乙兩條路線可供選擇，早上定時從家裡出發，走甲路線有1/10的機率會遲到，走乙路線有1/5的機率會遲到。無論走哪一條路線，只要不遲到下次就走同一路線，否則就換另一條路線。假設他第一天走甲路線，則第三天也走甲路線的機率為何？","opts":{},"ans":null,"ansText":"83/100","expl":"第二天走甲機率9/10、走乙機率1/10；第三天走甲=9/10×9/10+1/10×1/5=81/100+2/100=83/100。","flag":false,"num":27},{"id":971,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"擲三粒均勻的骰子，已知點數和為5的倍數，求點數和不超過10的機率。","opts":{},"ans":null,"ansText":"33/43","expl":"點數和為5的倍數：和為5有6種、和為10有27種、和為15有10種；(6+27)/43=33/43。","flag":false,"num":28},{"id":972,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"由1到9的9個數字中任取2數，且取過的數字不再取，若其和為偶數，求二者均為偶數的機率。","opts":{},"ans":null,"ansText":"3/8","expl":"和為偶數：兩偶C(4,2)=6或兩奇C(5,2)=10，共16種；兩偶機率=6/16=3/8。","flag":false,"num":29},{"id":973,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"自一副撲克牌中任取一張，若取得紅色牌的事件為A，事件C：取出之牌為偶數點，事件D：取出之牌的點數大於或等於10點。在A發生的條件下，求C、D二事件中至少有一件發生的機率。","opts":{},"ans":null,"ansText":"8/13","expl":"P(C∪D|A)=P(C|A)+P(D|A)-P(C∩D|A)=10/26+8/26-2/26=16/26=8/13。","flag":false,"num":30},{"id":974,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"設正整數x,y,z為偶數的機率分別為1/2、1/3、1/4，在xy為偶數的條件下，xy+z為奇數的機率為何？","opts":{},"ans":null,"ansText":"3/4","expl":"xy偶的條件下，xy+z為奇需z為奇，機率=1-1/4=3/4。","flag":false,"num":31},{"id":975,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"甲乙丙三袋中，甲袋有2黑球3白球，乙袋有2黑球2白球，丙袋有1黑球2白球。今自甲乙丙三袋中各取一球，則至少取出2黑球的機率為何？","opts":{},"ans":null,"ansText":"11/30","expl":"計算恰2黑與3黑的機率和：以各袋取黑機率2/5、1/2、1/3代入得11/30。","flag":false,"num":32},{"id":976,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"一個袋子中有20個球，其中4個白球，每次取一個球，取出後不放回。若第二次取到白球，求第三次也取到白球的機率。","opts":{},"ans":null,"ansText":"3/19","expl":"第二次取到白球的條件下，剩19球中白球3個，由對稱性第三次取白球機率=3/19。","flag":false,"num":33},{"id":977,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"設袋中有12個球，其中有8個白球，從袋中逐次取出4球，每次取球時每球被取到的機會相等。試求(a)取後放回，抽中3白球的機率 (b)取後放回，在抽中3白球的條件下第三個是白球的機率 (c)取後不放回，抽中3白球的機率 (d)取後不放回，在抽中3白球的條件下第三個是白球的機率。","opts":{},"ans":null,"ansText":"(a)32/81，(b)3/4，(c)224/495，(d)3/4","expl":"(a)C(4,3)(2/3)^3(1/3)=32/81；(c)C(8,3)C(4,1)/C(12,4)=224/495；(b)(d)由對稱性皆為3/4。","flag":false,"num":34},{"id":978,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"袋中有4紅球、3白球，今自袋中每次取一球連取4次，每次均不放回，問第3次取到白球的機率為何？","opts":{},"ans":null,"ansText":"3/7","expl":"抽籤原理：P(第3次白球)=P(第1次白球)=3/7。","flag":false,"num":35},{"id":980,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"某校橋藝社由甲乙丙三班同學組成，各佔40%、30%、30%。社員中甲班人數的1/5、乙班人數的1/5、丙班人數的1/3亦為籃球校隊隊員。某次橋藝社推選新社長，每人當選的機會相等，求(a)籃球隊員當選的機率 (b)若籃球隊員當選社長，求他是甲班同學的機率。","opts":{},"ans":null,"ansText":"(a)24/100，(b)1/3","expl":"(a)0.4×1/5+0.3×1/5+0.3×1/3=0.08+0.06+0.10=0.24；(b)貝氏定理：0.08/0.24=1/3。","flag":false,"num":37},{"id":981,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"交通規則測驗時，答對有兩種可能：一種是會做而答對，一種是不會做但猜對。已知小華會做的機率是0.8，現有一題5選1的選擇題，小華會做就答對，不會做就亂猜。已知此題小華答對，試問在此條件之下，此題小華是因為會做而答對(不是亂猜)的機率是多少（以最簡分數表示）？","opts":{},"ans":null,"ansText":"20/21","expl":"P(會做|答對)=0.8/(0.8+0.2×1/5)=0.8/0.84=20/21。","flag":false,"num":38},{"id":982,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"某地區之天氣，依多年統計每年晴天佔40%、非晴天佔60%。天氣預報將晴天說成晴天的機率為0.7，將非晴天說成晴天之機率為0.2。試問：若天氣預報說明天是晴天，則明天確為晴天的機率為何？","opts":{},"ans":null,"ansText":"7/10","expl":"貝氏定理：0.4×0.7/(0.4×0.7+0.6×0.2)=0.28/0.40=7/10。","flag":false,"num":39},{"id":983,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"假設陪審團不論被告有罪或無罪，都有0.95的機率做出正確判決；且在被審判的人當中有99%事實上是有罪的。若已知陪審團判某被告無罪，則該名被告真的是無罪之機率是多少？","opts":{},"ans":null,"ansText":"約0.161","expl":"P(無罪|判無罪)=0.01×0.95/(0.01×0.95+0.99×0.05)=0.0095/0.059≈0.161。","flag":false,"num":40},{"id":984,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"某電腦工廠檢驗產品的過程中，將良品檢驗為不良品的機率為0.20，將不良品檢驗為良品的機率為0.16。又知該產品中不良品佔5％、良品佔95％。若一件產品被檢驗為良品，則該產品實際上為不良品之機率為何？","opts":{},"ans":null,"ansText":"1/96","expl":"P(不良|驗為良)=0.05×0.16/(0.05×0.16+0.95×0.80)=0.008/0.768=1/96。","flag":false,"num":41},{"id":985,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"某項胸部X光檢查的可靠程度如下：對於有結核病者，90%可發現、10%未發現；對於無結核病者，99%為正確、1%不正確。設地區廣大人口中患有結核病者佔0.1%，若其中任意一人經X光檢查有結核病嫌疑，則此人確有結核病的機率為何？","opts":{},"ans":null,"ansText":"10/121","expl":"貝氏定理：0.001×0.9/(0.001×0.9+0.999×0.01)=0.0009/0.01089=10/121。原文數字經抽字後錯亂，依答案回推無結核病者誤判率為1%。","flag":false,"num":42},{"id":986,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"宿舍大門在晚上10點到11點之間上鎖的機率為1/2。某生的抽屜中有10把鑰匙，其中有兩把是大門鑰匙。有一天中午此生任意抓走3把鑰匙外出，請問他在晚上10點半回來時，能打開宿舍大門的機率是多少？","opts":{},"ans":null,"ansText":"23/30","expl":"未上鎖機率1/2必可進門；上鎖時帶到大門鑰匙的機率=1-C(8,3)/C(10,3)=8/15；所求=1/2+1/2×8/15=23/30。","flag":false,"num":43},{"id":987,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"設每次甲訪問別人家裡而告辭時忘記帶傘的機率為1/5。某日甲帶傘出去，順次去乙、丙、丁的家訪問，最後回家時發現傘沒有帶回，問此傘遺忘在丙家之機率是多少？","opts":{},"ans":null,"ansText":"20/61","expl":"P(忘在丙)=4/5×1/5；P(忘傘)=1/5+4/5×1/5+4/5×4/5×1/5=61/125；所求=(4/25)/(61/125)=20/61。","flag":false,"num":44},{"id":988,"src":"甲｜講義-機率統計","ch":"條件機率｜綜合練習","type":"open","q":"設有甲、乙兩個袋子，甲袋內有一白球、一黑球，乙袋內有兩個白球。今從甲袋取一球放入乙袋，再從乙袋取一球放入甲袋，然後再由甲袋取一球放入乙袋，最後再由乙袋取一球放入甲袋。試求：(a)最後甲袋內有一白球一黑球的機率 (b)最後乙袋內有一白球一黑球的機率。","opts":{},"ans":null,"ansText":"(a)5/9，(b)4/9","expl":"以樹狀圖追蹤黑球位置，兩輪交換後黑球在甲袋的機率為5/9，在乙袋為4/9。","flag":false,"num":45},{"id":989,"src":"甲｜講義-機率統計","ch":"條件機率｜進階問題","type":"open","q":"有8個人(含甲乙兩人)同時乘坐一輛有4節車廂的火車，在已知剛好每兩人乘坐一車廂的情形下，求甲乙兩人同坐一車廂的機率。","opts":{},"ans":null,"ansText":"1/7","expl":"甲固定後，乙與甲同車廂的機率為1/7（其餘7人中與甲同廂者僅1個位置）。","flag":false,"num":46},{"id":990,"src":"甲｜講義-機率統計","ch":"條件機率｜進階問題","type":"open","q":"設甲袋中有5個銀幣、1個金幣，乙袋中有3個銀幣。今自甲袋中任取4個硬幣放入乙袋，再由乙袋中任取5個硬幣放入甲袋。試求(a)金幣在乙袋的機率 (b)若金幣在甲袋，則甲取得4銀幣（第一次取出的4枚皆為銀幣）的機率。","opts":{},"ans":null,"ansText":"(a)4/21，(b)7/17","expl":"(a)金幣先被移入乙袋(10/15)且未被移回(6/21)：10/15×6/21=4/21；(b)條件機率=(5/15×1)/(10/15×15/21+5/15×1)=7/17。","flag":false,"num":47},{"id":991,"src":"甲｜講義-機率統計","ch":"條件機率｜進階問題","type":"open","q":"一袋中有6個紅球、4個黑球，依次在袋中任取一球，取後不放回。在已知紅球先取完的情形下，求前6次取出皆為紅球的機率。","opts":{},"ans":null,"ansText":"1/84","expl":"P(紅球先取完)=P(第10個位置為黑球)=4/10；P(前6次皆紅)=6!×4!/10!×4=1/210；所求=(1/210)/(4/10)=1/84。","flag":false,"num":48},{"id":992,"src":"甲｜講義-機率統計","ch":"綜合演練｜單選題","type":"single","q":"袋中有5白球、3紅球，由袋中一次取出2球，則至少有一紅球之機率為下列何者？","opts":{"A":"3/5","B":"2/5","C":"5/14","D":"9/14","E":"13/14"},"ans":"D","ansText":"(D) 9/14","expl":"至少一紅=1-兩白=1-C(5,2)/C(8,2)=1-5/14=9/14。","flag":false,"num":1},{"id":993,"src":"甲｜講義-機率統計","ch":"綜合演練｜單選題","type":"single","q":"已知樣本空間有A、B兩事件，A事件發生的機率為0.4，B事件發生的機率為0.6，A發生或B發生的機率為0.8，則A與B都發生的機率為下列何者？","opts":{"A":"0.2","B":"0.24","C":"0.32","D":"0.48","E":"1"},"ans":"A","ansText":"(A) 0.2","expl":"P(A∩B)=P(A)+P(B)-P(A∪B)=0.4+0.6-0.8=0.2。","flag":false,"num":2},{"id":994,"src":"甲｜講義-機率統計","ch":"綜合演練｜多選題","type":"multi","q":"設A、B為獨立事件，且P(A)=2/3，P(B)=1/2，試選出正確的選項。","opts":{"A":"A、B為互斥事件","B":"P(A∩B)=1/3","C":"P(A∩B')=1/3","D":"P(A'∩B)=1/6","E":"P(A'∩B')=1/6"},"ans":"BCDE","ansText":"(B)(C)(D)(E)","expl":"獨立事件P(A∩B)=P(A)P(B)=1/3≠0故非互斥；A與B'、A'與B、A'與B'亦獨立，分別得1/3、1/6、1/6。","flag":false,"num":3},{"id":995,"src":"甲｜講義-機率統計","ch":"綜合演練｜多選題","type":"multi","q":"設A、B為獨立事件，若P(A)=1/3、P(B)=1/2，試選出正確的選項。","opts":{"A":"P(A)=P(A|B)","B":"P(A|B)=P(B|A)","C":"P(A|B)=1/6","D":"P(A'|B)=2/3","E":"P(B|A')=1/2"},"ans":"ADE","ansText":"(A)(D)(E)","expl":"獨立時P(A|B)=P(A)=1/3、P(A'|B)=P(A')=2/3、P(B|A')=P(B)=1/2；因P(A)≠P(B)，故P(A|B)≠P(B|A)。","flag":false,"num":4},{"id":996,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"話劇社動員了16名演員演出舞臺劇，其中有10名高二社員、6名高一社員；高二社員中有6名女生、4名男生，高一社員中有3名女生、3名男生。今任選一名社員，試求：(1)已知是高二社員的情況下，是女生的機率 (2)已知是男生的情況下，是高二社員的機率。","opts":{},"ans":null,"ansText":"(1)3/5，(2)4/7","expl":"(1)=6/10=3/5；男生共7人其中高二4人，(2)=4/7。","flag":false,"num":5},{"id":997,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"甲、乙、丙三人參加校內桌球比賽，甲、乙、丙進入決賽的機率依序為3/4、2/3、1/2，且三人能否進入決賽是獨立事件。求：(1)三人中至少有一人進入決賽的機率 (2)三人中恰有兩人進入決賽的機率。","opts":{},"ans":null,"ansText":"(1)23/24，(2)11/24","expl":"(1)=1-(1/4)(1/3)(1/2)=23/24；(2)=3/4×2/3×1/2+3/4×1/3×1/2+1/4×2/3×1/2=11/24。","flag":false,"num":6},{"id":998,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"甲、乙兩人同時解一數學問題，甲每3題能解出2題，乙每4題能解出3題，兩人解題互不影響。求：(1)恰有一人解出的機率 (2)此題被解出的機率。","opts":{},"ans":null,"ansText":"(1)5/12，(2)11/12","expl":"(1)=2/3×1/4+1/3×3/4=5/12；(2)=1-(1/3)(1/4)=11/12。","flag":false,"num":7},{"id":999,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"桌上有甲、乙、丙三個袋子：甲袋有3個白球，乙袋有2個紅球、1個白球，丙袋有1個紅球、2個白球。小偉擲兩枚均勻硬幣一次，若出現兩正面則從甲袋抽1球，兩反面則從乙袋抽1球，一正一反則從丙袋抽1球。求：(1)抽出白球的機率 (2)此白球來自乙袋的機率。","opts":{},"ans":null,"ansText":"(1)2/3，(2)1/8","expl":"(1)=1/4×1+1/4×1/3+2/4×2/3=8/12=2/3；(2)貝氏定理=(1/12)/(8/12)=1/8。","flag":false,"num":8},{"id":1000,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"甲、乙、丙三人同時打靶，每人一發，甲、乙、丙的命中率依序為0.5、0.3、0.4，且三人命中靶面的事件為獨立事件。試問：(1)靶面恰中一發的機率 (2)靶面恰中一發，是由甲命中的機率。","opts":{},"ans":null,"ansText":"(1)0.44，(2)21/44","expl":"(1)=0.5×0.7×0.6+0.5×0.3×0.6+0.5×0.7×0.4=0.21+0.09+0.14=0.44；(2)=0.21/0.44=21/44。","flag":false,"num":9},{"id":1001,"src":"甲｜講義-機率統計","ch":"綜合演練｜填充題","type":"open","q":"設A、B是樣本空間S的兩事件，且P(A)=1/2，P(A∪B)=2/3。試依下列條件求：(1)A與B是互斥事件，則P(B)=？ (2)A與B是獨立事件，則P(B)=？","opts":{},"ans":null,"ansText":"(1)1/6，(2)1/3","expl":"(1)互斥時2/3=1/2+P(B)，得P(B)=1/6；(2)獨立時2/3=1/2+P(B)-1/2·P(B)，得P(B)=1/3。","flag":false,"num":10},{"id":1002,"src":"甲｜講義-機率統計","ch":"綜合演練｜計算題","type":"open","q":"袋中有2白球3黑球，自袋中任取一球，甲、乙看過之後都說是白球。根據經驗，甲說實話的機率是4/7，乙說實話的機率為2/7，試求此球確實為白球的機率。","opts":{},"ans":null,"ansText":"16/61","expl":"取白且兩人皆實話=2/5×4/7×2/7=16/245；取黑且兩人皆說謊=3/5×3/7×5/7=45/245；所求=16/(16+45)=16/61。","flag":false,"num":11},{"id":1003,"src":"甲｜講義-機率統計","ch":"綜合演練｜計算題","type":"open","q":"科學研習社社員的年級與性別分配為：高二男16人、高一男8人、高二女12人、高一女2人。如果希望性別與年級獨立，試問應再招收幾名高一女生社員？","opts":{},"ans":null,"ansText":"4名","expl":"設招收x名，使任選一社員是女生的機率等於高一社員中是女生的機率：(14+x)/(38+x)=(2+x)/(10+x)，解得x=4。","flag":false,"num":12},{"id":1004,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"袋中裝有大小相同的紅球2顆、白球4顆。從袋中任取2顆球，並令隨機變數X表示取得紅球的顆數。(1)寫出X所有可能的取值 (2)描述X=0所表示的事件。","opts":{},"ans":null,"ansText":"(1)X的取值為0,1,2，(2)X=0表示取到0顆紅球（兩顆皆白球）的事件","expl":"取2球中紅球數可為0、1、2；X=0即{兩顆白球}。","flag":false,"num":1},{"id":1005,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"從52張撲克牌中隨機抽出5張牌，令隨機變數X表示抽到點數「K」的張數。(1)寫出X所有可能的取值 (2)描述X=1所表示的事件。","opts":{},"ans":null,"ansText":"(1)X的取值為0,1,2,3,4，(2)X=1表示抽出的5張牌中恰有1張K的事件","expl":"K共4張，抽5張中K的張數可為0至4。（原文未附解答，依題意作答）","flag":false,"num":2},{"id":1006,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"丟一枚均勻硬幣3次，並令隨機變數X表示正面出現的次數。(1)寫出X所有可能的取值 (2)求機率P(X=1)及P(X=3)的值。","opts":{},"ans":null,"ansText":"(1)0,1,2,3，(2)P(X=1)=3/8、P(X=3)=1/8","expl":"樣本空間共8個樣本點，恰一正面有3個，三正面有1個。","flag":false,"num":3},{"id":1007,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"丟一枚均勻硬幣4次，並令隨機變數X表示正面出現的次數。(1)寫出X所有可能的取值 (2)求機率P(X=2)與P(X=3)的值。","opts":{},"ans":null,"ansText":"(1)0,1,2,3,4，(2)P(X=2)=3/8、P(X=3)=1/4","expl":"P(X=2)=C(4,2)/16=6/16=3/8；P(X=3)=C(4,3)/16=4/16=1/4。（原文未附解答，依題意計算）","flag":false,"num":4},{"id":1008,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"袋中有大小相同的白球2顆、紅球3顆，每次從袋中任取一球，取後不放回，直到取到紅球才停止，稱此為一輪操作。每顆球被取到的機會均等，令隨機變數X表示一輪操作中所取出的總球數。(1)寫出隨機變數X的機率分布表 (2)求機率P(X≤2)的值。","opts":{},"ans":null,"ansText":"(1)P(X=1)=3/5、P(X=2)=3/10、P(X=3)=1/10，(2)P(X≤2)=9/10","expl":"P(X=1)=3/5；P(X=2)=2/5×3/4=3/10；P(X=3)=2/5×1/4×1=1/10；P(X≤2)=3/5+3/10=9/10。","flag":false,"num":5},{"id":1009,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜基本概念","type":"open","q":"甲、乙兩人各從1, 2與3三個數字中任選一個數字，可重複選取，每個數字被選到的機會均等。令隨機變數X表示甲、乙所選數字的差之絕對值。(1)寫出隨機變數X的機率分布表 (2)求機率P(X≥1)的值。","opts":{},"ans":null,"ansText":"(1)P(X=0)=1/3、P(X=1)=4/9、P(X=2)=2/9，(2)P(X≥1)=2/3","expl":"共9種等機率組合：差0有3種、差1有4種、差2有2種；P(X≥1)=1-1/3=2/3。（原文未附解答，依題意計算）","flag":false,"num":6},{"id":1010,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值","type":"open","q":"已知裝有100元、200元與300元的紅包袋各有1, 2, 1個，任取2個紅包袋，且每個紅包袋被取到的機會均等，令隨機變數X表示取出兩個紅包袋的總金額，求X的期望值。","opts":{},"ans":null,"ansText":"E(X)=400元","expl":"X取值300,400,500元的機率各為1/3，E(X)=300×1/3+400×1/3+500×1/3=400。","flag":false,"num":7},{"id":1011,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值","type":"open","q":"盒中有8顆巧克力，其中3顆的內餡為杏仁。自盒中任取兩顆，且每顆巧克力被取到的機會均等，令隨機變數X表示取到杏仁內餡巧克力的顆數，求X的期望值。","opts":{},"ans":null,"ansText":"E(X)=3/4","expl":"P(X=0)=C(5,2)/C(8,2)=10/28、P(X=1)=15/28、P(X=2)=3/28；E(X)=(0×10+1×15+2×3)/28=21/28=3/4。（原文未附解答，依題意計算）","flag":false,"num":8},{"id":1012,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值","type":"open","q":"袋中有100元代幣3枚、50元代幣6枚與20元代幣n枚。從袋中抽出一枚代幣，且每枚代幣被取到的機會均等，令隨機變數X表示抽出代幣的金額。已知X的期望值為40元，求n的值。","opts":{},"ans":null,"ansText":"n=12","expl":"E(X)=(100×3+50×6+20n)/(n+9)=40，整理得20n=240，故n=12。","flag":false,"num":9},{"id":1013,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值","type":"open","q":"擲一粒公正的骰子一次，當出現1, 2或3點時可得200元；出現4或5點時可得500元；出現6點時可得k元。設隨機變數X表示擲骰子一次所得的金額，已知X的期望值為400元，求k的值。","opts":{},"ans":null,"ansText":"k=800","expl":"E(X)=200×1/2+500×1/3+k×1/6=400，得100+500/3+k/6=400，解得k=800。（原文未附解答，依題意計算）","flag":false,"num":10},{"id":1014,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜變異數與標準差","type":"open","q":"袋中有編號2, 4, 6, 8的球各一顆，今從袋中取出一球，且每球被取到的機會均等。設隨機變數X表示取出球的編號，求X的期望值、變異數與標準差。","opts":{},"ans":null,"ansText":"E(X)=5，Var(X)=5，標準差=√5","expl":"E(X)=(2+4+6+8)/4=5；Var(X)=(9+1+1+9)/4=5；標準差為√5。","flag":false,"num":11},{"id":1015,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜變異數與標準差","type":"open","q":"摸彩箱中裝有標示5, 6, 7, 8折的球分別各有1, 2, 3, 4顆。從箱中取出一球，且每球被取到的機會均等。設隨機變數X表示取出球所代表的折扣數，求X的期望值、變異數與標準差。","opts":{},"ans":null,"ansText":"E(X)=7，Var(X)=1，標準差=1","expl":"E(X)=(5+12+21+32)/10=7；E(X^2)=(25+72+147+256)/10=50，Var(X)=50-49=1，標準差1。（原文未附解答，依題意計算）","flag":false,"num":12},{"id":1016,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜變異數與標準差","type":"open","q":"投擲一粒不公正的骰子，其各點數出現的機率與該點數成正比。設隨機變數X表示擲一次骰子所出現的點數，求X的期望值與變異數。","opts":{},"ans":null,"ansText":"E(X)=13/3，Var(X)=20/9","expl":"P(X=k)=k/21；E(X)=91/21=13/3；Var(X)=E(X^2)-(13/3)^2=441/21-169/9=20/9。","flag":false,"num":13},{"id":1017,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜變異數與標準差","type":"open","q":"袋中裝有大小相同、編號1, 2, 3, 4的球各一顆，自袋中任取兩顆球，且每球被取到的機會均等。隨機變數X表示取出兩顆球中的最大編號，求X的期望值、變異數與標準差。","opts":{},"ans":null,"ansText":"E(X)=10/3，Var(X)=5/9，標準差=√5/3","expl":"P(X=2)=1/6、P(X=3)=2/6、P(X=4)=3/6；E(X)=20/6=10/3；E(X^2)=70/6=35/3，Var(X)=35/3-100/9=5/9。（原文未附解答，依題意計算）","flag":false,"num":14},{"id":1018,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值變異數與標準差的性質","type":"open","q":"同時丟兩枚均勻的硬幣一次，每出現一枚正面可得200元，每出現一枚反面可得100元。設隨機變數X表示正面出現的枚數；Y表示所得的金額。(1)求X的期望值E(X)與標準差σ(X) (2)已知X與Y的關係可表示成Y=aX+b，求a, b的值 (3)利用(1)與(2)，求Y的期望值E(Y)與標準差σ(Y)。","opts":{},"ans":null,"ansText":"(1)E(X)=1、σ(X)=√2/2，(2)a=100、b=200，(3)E(Y)=300元、σ(Y)=50√2元","expl":"X取0,1,2機率1/4,1/2,1/4，E(X)=1，Var(X)=1/2；X=0,1,2對應Y=200,300,400，得Y=100X+200；E(Y)=100×1+200=300，σ(Y)=100×√2/2=50√2。","flag":false,"num":15},{"id":1019,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜期望值變異數與標準差的性質","type":"open","q":"已知隨機變數X滿足E(-2X+3)=47，Var(-2X+3)=196，求X的期望值E(X)、變異數Var(X)與標準差σ(X)。","opts":{},"ans":null,"ansText":"E(X)=-22，Var(X)=49，標準差=7","expl":"-2E(X)+3=47得E(X)=-22；4Var(X)=196得Var(X)=49，標準差7。（原文未附解答，依題意計算）","flag":false,"num":16},{"id":1020,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜觀念澄清","type":"open","q":"下列敘述對的打「○」，錯的打「×」：(1)丟一枚均勻硬幣三次，令隨機變數X表示正面出現的次數，則P(X=0)=0。(2)若隨機變數X所有可能的取值為1, 2，則P(X=1)+P(X=2)=1。(3)若隨機變數X的期望值E(X)=2，且Y=-2X+3，則E(Y)=-4。","opts":{},"ans":null,"ansText":"(1)×，(2)○，(3)×","expl":"(1)P(X=0)=1/8≠0；(2)所有取值機率和為1；(3)E(Y)=-2×2+3=-1≠-4。（原文未附解答，依題意判斷）","flag":false,"num":17},{"id":1021,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"從1, 2, 3, 4, 5中任取兩個相異的數字，並令隨機變數X表示取到偶數的個數。(1)寫出X所有可能的取值 (2)描述X=0所表示的事件。","opts":{},"ans":null,"ansText":"(1)0,1,2，(2)X=0表示取出的兩個數字皆為奇數的事件","expl":"偶數有2,4兩個，取2數中偶數個數可為0,1,2。（原文未附解答，依題意作答）","flag":false,"num":18},{"id":1022,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"袋中有紅球4顆、白球2顆。從袋中取出2顆球，且每球被取到的機會均等。令隨機變數X表示取出的紅球數。(1)寫出X所有可能的取值 (2)求機率P(X=2)的值 (3)求機率P(X≥1)的值。","opts":{},"ans":null,"ansText":"(1)0,1,2，(2)P(X=2)=2/5，(3)P(X≥1)=14/15","expl":"P(X=2)=C(4,2)/C(6,2)=6/15=2/5；P(X≥1)=1-C(2,2)/C(6,2)=1-1/15=14/15。（原文未附解答，依題意計算）","flag":false,"num":19},{"id":1023,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"甲、乙兩人各從1與2兩個數字中任選一個數字，並令隨機變數X表示甲、乙所選數字的平方和。已知每個數字被選到的機會均等，求機率P(X≤7)的值。","opts":{},"ans":null,"ansText":"P(X≤7)=3/4","expl":"X可能為2,5,8，機率各為1/4,1/2,1/4；P(X≤7)=P(X=2)+P(X=5)=3/4。（原文未附解答，依題意計算）","flag":false,"num":20},{"id":1024,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"擲一粒公正骰子2次，令隨機變數X為點數6出現的次數，求隨機變數X的期望值。","opts":{},"ans":null,"ansText":"E(X)=1/3","expl":"X服從二項分布B(2,1/6)，E(X)=2×1/6=1/3。（原文未附解答，依題意計算）","flag":false,"num":21},{"id":1025,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"箱中有黃球2顆、紅球5顆與白球n顆。從箱中取出一球，且每球被取到的機會均等。取出球的顏色為黃球、紅球與白球分別可得500元、200元與0元，並令隨機變數X表示取出一球所得的金額。已知X的期望值為100元，求n的值。","opts":{},"ans":null,"ansText":"n=13","expl":"E(X)=(500×2+200×5)/(7+n)=2000/(7+n)=100，解得n=13。（原文未附解答，依題意計算）","flag":false,"num":22},{"id":1026,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"袋中裝有大小相同的代幣1元與5元各2枚。從袋中任取2枚代幣，並令隨機變數X表示取2枚代幣所得的金額。已知每個代幣被取到的機會均等，求X的期望值與標準差。","opts":{},"ans":null,"ansText":"E(X)=6，標準差=4√3/3","expl":"X取2,6,10元的機率為1/6,4/6,1/6；E(X)=6；E(X^2)=124/3，Var(X)=124/3-36=16/3，標準差=4/√3=4√3/3。（原文未附解答，依題意計算）","flag":false,"num":23},{"id":1027,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"某射手準備3發子彈射擊一靶面，若命中靶面1發則停止射擊，否則繼續射擊直到子彈用盡。已知該射手打靶的命中率為2/3，令隨機變數X表示耗用子彈數，求X的期望值、變異數與標準差。","opts":{},"ans":null,"ansText":"E(X)=13/9，Var(X)=38/81，標準差=√38/9","expl":"P(X=1)=2/3、P(X=2)=1/3×2/3=2/9、P(X=3)=1/9；E(X)=13/9；E(X^2)=23/9，Var(X)=23/9-(13/9)^2=38/81。（原文未附解答，依題意計算）","flag":false,"num":24},{"id":1028,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-基礎題","type":"open","q":"有一粒公正的特製骰子，其六個面分別為0, 1, 1, 1, 1, 2點。今投擲此骰子一次，可得到的金額為點數的3倍再加5（元）。設隨機變數X表示擲骰子一次所出現的點數；Y表示擲骰子一次所得到的金額。(1)求X的期望值E(X)與變異數Var(X) (2)寫出X與Y的關係 (3)求Y的期望值E(Y)與變異數Var(Y)。","opts":{},"ans":null,"ansText":"(1)E(X)=1、Var(X)=1/3，(2)Y=3X+5，(3)E(Y)=8元、Var(Y)=3","expl":"P(X=0)=1/6、P(X=1)=4/6、P(X=2)=1/6，E(X)=1，E(X^2)=4/3，Var(X)=1/3；E(Y)=3×1+5=8，Var(Y)=9×1/3=3。（原文未附解答，依題意計算）","flag":false,"num":25},{"id":1029,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-進階題","type":"open","q":"設隨機變數X的機率分布表為：X取0, 1, 2, 3，對應機率依序為1/4, a, b, 1/6。設X的期望值E(X)=4/3。(1)求實數a, b的值 (2)求隨機變數X的變異數Var(X)。","opts":{},"ans":null,"ansText":"(1)a=1/3、b=1/4，(2)Var(X)=19/18","expl":"由機率和為1得a+b=7/12，由期望值得a+2b+1/2=4/3，解得a=1/3、b=1/4；E(X^2)=17/6，Var(X)=17/6-16/9=19/18。（原文未附解答，依題意計算）","flag":false,"num":26},{"id":1030,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-進階題","type":"open","q":"有100元、200元、500元的紅包袋各一個，由甲、乙兩人依序各抽取1個紅包袋，抽取後不放回，且每個紅包袋被抽取的機會均等。設隨機變數X表示甲、乙兩人紅包金額的總和，求X的期望值。","opts":{},"ans":null,"ansText":"E(X)=1600/3 元","expl":"X取300, 600, 700元的機率各為1/3，E(X)=(300+600+700)/3=1600/3。（原文未附解答，依題意計算）","flag":false,"num":27},{"id":1031,"src":"甲｜講義-機率統計","ch":"離散隨機變數｜習題-進階題","type":"open","q":"籃球校隊甄選隊員流程如下：參加者先在A處投第一球，接著在B處投第二球；若這兩球都進球則停止投籃，否則最後在B處投第三球。已知在A與B兩處每投進一球分別得3分與2分，且某生在A與B兩處的命中率分別為1/4與2/3。設隨機變數X表示該生甄選時所得的分數。(1)寫出隨機變數X的機率分布表 (2)求機率P(X>3)的值 (3)求X的期望值。","opts":{},"ans":null,"ansText":"(1)P(X=0)=1/12、P(X=2)=1/3、P(X=3)=1/36、P(X=4)=1/3、P(X=5)=2/9，(2)P(X>3)=5/9，(3)E(X)=115/36","expl":"依樹狀圖分別討論前兩球是否皆進、第三球是否投進，得各得分機率；P(X>3)=P(4)+P(5)=1/3+2/9=5/9；E(X)=115/36。（原文未附解答，依題意計算，投籃流程之解讀若有差異結果可能不同）","flag":false,"num":28},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜二項分配","type":"open","q":"某製造程序其不合格率為 5%，今隨機抽取 20 件檢驗，其中恰含 2 件不合格品之機率為多少？","opts":{},"ans":null,"ansText":"0.189","expl":"無限群體（p 固定、各次獨立）→ 二項分配。公式：C(20,2)×0.05²×0.95¹⁸ = 0.189。查表法：P{X≤2}−P{X≤1} = 0.925−0.736 = 0.189（恰好 d 件 = 兩格相減）。🖩 20 → nCr → 2 → × → 0.05 → x² → × → 0.95 → ^ → 18 → =","flag":false,"num":1,"id":1032},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜二項分配","type":"open","q":"某電子零件之不合格率為 0.1，今從生產線中隨機抽取 20 個檢驗，最多發現 2 件不合格品之機率？","opts":{},"ans":null,"ansText":"0.677","expl":"「最多 2 件」= P{X≤2} → 累積表直接查一格 = 0.677。用公式要 d=0,1,2 三項相加，慢很多。也可卜式近似：λ=np=20×0.1=2，查卜式表 P{X≤2}=0.677（無限群體時值幾乎相同）。","flag":false,"num":2,"id":1033},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜超幾何與分配判斷","type":"open","q":"一批 25 件之電晶體中包含 3 件不合格品，今隨機抽取 5 件，求不合格品恰為 1 件、恰為 2 件的機率各是多少？","opts":{},"ans":null,"ansText":"P(1)=0.413、P(2)=0.087","expl":"先判斷：n/N = 5/25 = 1/5 > 1/10 → 有限群體 → 超幾何。P(1) = C(3,1)×C(22,4)÷C(25,5) = 5700/13800 = 0.413；P(2) = C(3,2)×C(22,3)÷C(25,5) = 1200/13800 = 0.087。🖩 分子分母都用 nCr 直接按，不必展開階乘。","flag":false,"num":3,"id":1034},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜超幾何與分配判斷","type":"open","q":"一批 80 件之產品中包含 4 件不合格品，在 n=8 之隨機樣本中，最多發現 1 件不合格品之機率？","opts":{},"ans":null,"ansText":"超幾何（精確）0.9522；二項 0.9428；卜式查表（λ=0.4）0.938","expl":"n/N = 8/80 = 1/10 → 可視為無限群體，三種解法都可以。超幾何：[C(4,0)C(76,8)+C(4,1)C(76,7)]÷C(80,8)=0.9522；二項：C(8,0)0.95⁸+C(8,1)0.95⁷×0.05=0.9428；卜式：λ=np=8×0.05=0.4，查表 P{X≤1}=0.938。三值接近 → 無限群體時查表最快；若 n/N>1/10 就只能乖乖用超幾何。","flag":false,"num":4,"id":1035},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜超幾何與分配判斷","type":"open","q":"電晶體之不合格率為 0.04，在 n=100 之隨機樣本中，發現 3 件或少於 3 件不合格品之機率？","opts":{},"ans":null,"ansText":"二項 0.429；卜瓦松近似（λ=4）0.433","expl":"無限群體。二項公式要 d=0~3 四項相加 = 0.429。n>20 且 np=100×0.04=4≤7 → 可用卜式取代二項：λ=4 查卜式表 P{X≤3}=0.433，一格搞定。手寫重點：只要能算出 λ=np，直接查卜式表。","flag":false,"num":5,"id":1036},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜卜瓦松分配","type":"open","q":"某種印刷電路板之平均不合格點數為 λ=3，今隨機抽取 1 件檢驗，求至少發現 4 個不合格點之機率？","opts":{},"ans":null,"ansText":"0.353","expl":"「至少 4 個」→ 反面思考：P{X>3} = 1 − P{X≤3} = 1 − 0.647（查卜式表）= 0.353。公式解要 1−(P0+P1+P2+P3) 四項，查表一格搞定。","flag":false,"num":6,"id":1037},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜卜瓦松分配","type":"open","q":"在 20 平方公尺之地毯中，平均可發現 4 個不合格點。今檢驗 40 平方公尺之地毯，求發現 2 個不合格點之機率？","opts":{},"ans":null,"ansText":"0.011","expl":"λ 要按區間換算（λ 帶著單位區間）：λ = 4×(40÷20) = 8。公式：e⁻⁸×8²÷2! = 0.011。查表：P{X≤2}−P{X≤1} = 0.014−0.003 = 0.011。陷阱：直接用 λ=4 就錯了。","flag":false,"num":7,"id":1038},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜卜瓦松分配","type":"open","q":"某公司訂有消費者 7 天內不滿意免費退貨服務，根據過去紀錄每 7 天平均 2 件被要求退貨，問在 14 天內會被退 5 件的機率？","opts":{},"ans":null,"ansText":"0.156","expl":"λ 換算：每 7 天 2 件 → 14 天 λ = 2×(14÷7) = 4。公式：e⁻⁴×4⁵÷5! = 0.15629。查表：P{X≤5}−P{X≤4} = 0.785−0.629 = 0.156。","flag":false,"num":8,"id":1039},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"open","q":"某低脂乳酪平均每盎司含 3.50 公克脂肪，標準差 0.04 公克。根據柴比雪夫定理，至少有多少比例的產品脂肪含量介於 3.38 與 3.62 公克之間？","opts":{},"ans":null,"ansText":"至少 8/9 ≈ 89%","expl":"先畫圖：μ=3.50 在中間，標 3.38、3.62。距離 = 3.62−3.50 = 0.12 = 3σ → k=3 → 1−1/3² = 8/9 = 89%。SOP：畫圖 → 算距離 → k=距離÷σ → 套 1−1/k²。","flag":false,"num":9,"id":1040},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"open","q":"承上題（μ=3.50、σ=0.04），根據柴比雪夫定理，93.75% 以上的乳酪，其脂肪含量範圍應該是多少？","opts":{},"ans":null,"ansText":"3.34 ~ 3.66 公克","expl":"反向題：1−1/k² = 0.9375 → 1/k² = 0.0625 = 1/16 → k=4 → 範圍 = μ±4σ = 3.50±0.16 = 3.34~3.66。心算：看到 93.75% 想「差 6.25%=1/16」→ k=4。","flag":false,"num":10,"id":1041},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"open","q":"某燈泡製造廠燈泡壽命平均數為 800 小時、標準差 10 小時，依柴比雪夫定理，壽命在 770 與 830 小時範圍內之機率至少為何？","opts":{},"ans":null,"ansText":"至少 1−1/9 = 0.89","expl":"先畫圖：μ=800，端點 770/830，距離 30 = 3σ → k=3 → 1−1/3² = 0.89。","flag":false,"num":11,"id":1042},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"open","q":"承上題（μ=800、σ=10），機率至少為 75% 之壽命範圍為何？","opts":{},"ans":null,"ansText":"780 ~ 820 小時","expl":"反向題：1−1/k² = 0.75 → k=2 → μ±2σ = 800±20 = 780~820。","flag":false,"num":12,"id":1043},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"open","q":"擲一正常銅幣三次，隨機變數 X 表示出現正面之次數，試依柴比雪夫定理求平均數加減二倍標準差範圍內之機率。","opts":{},"ans":null,"ansText":"至少 1−1/4 = 0.75","expl":"先列 pmf：f(x)=1/8, 3/8, 3/8, 1/8（x=0,1,2,3）。E(X)=1.5；E(X²)=3；V(X)=E(X²)−[E(X)]²=3−2.25=0.75；σ=0.87。柴比雪夫 k=2 → ≥ 1−1/2² = 0.75。套路：先由 pmf 求 σ，再畫圖套 k。","flag":false,"num":13,"id":1044},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜柴比雪夫與經驗法則","type":"single","q":"資料組的全距（R）大約等於幾倍標準差？ (A) 2 倍 (B) 3 倍 (C) 4 倍 (D) 6 倍","opts":{"A":"2 倍","B":"3 倍","C":"4 倍","D":"6 倍"},"ans":"C","ansText":null,"expl":"由柴比雪夫與經驗法則，大部分量測值落在 μ±2σ 內 → 全距 R ≈ 4 倍標準差，故 s = R/4（有考過）。","flag":false,"num":14,"id":1045},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜期望值與變異數","type":"single","q":"A 零件的期望值為 15、標準差為 3；B 零件的期望值為 20、標準差為 4。現將兩零件合為一新產品，則新產品的標準差為何？ (A) 5 (B) 7 (C) 12 (D) 以上皆非","opts":{"A":"5","B":"7","C":"12","D":"以上皆非"},"ans":"A","ansText":null,"expl":"標準差不能直接相加！先加變異數：V = 3²+4² = 25，σ = √25 = 5。獨立變數 Var(X+Y)=Var(X)+Var(Y)。","flag":false,"num":15,"id":1046},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜期望值與變異數","type":"single","q":"隨機變數 X 及 Y 均為常態分配，X 的標準差為 4，Y 的標準差為 3，則 X−Y 的變異數為 (A) 1 (B) 5 (C) 7 (D) 25","opts":{"A":"1","B":"5","C":"7","D":"25"},"ans":"D","ansText":null,"expl":"獨立變數相減，變異數仍然相加（負負得正）：V = 4²+3² = 25。注意問的是「變異數」不是標準差，別開根號選 5。","flag":false,"num":16,"id":1047},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜期望值與變異數","type":"open","q":"離散型隨機變數 Y 之機率分配：y=1~6，P(y) 依序為 0.1、0.2、0.1、?、0.2、0.3。求 (a) P(Y=4)；(b) E(Y)、V(Y)、SD(Y)。","opts":{},"ans":null,"ansText":"P(Y=4)=0.1；E(Y)=4；V(Y)=3.2；SD(Y)=1.789","expl":"(a) Σ機率=1 → P(4)=1−0.1−0.2−0.1−0.2−0.3=0.1。(b) E(Y)=Σy·P=4；E(Y²)=Σy²·P=19.2；V(Y)=E(Y²)−[E(Y)]²=19.2−16=3.2；SD=√3.2=1.789。速算公式 V=E(Y²)−[E(Y)]² 幾乎每題都用。","flag":false,"num":17,"id":1048},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜期望值與變異數","type":"open","q":"離散型隨機變數 Y：y=1~4，P(y)=0.1、0.2、0.3、0.4（E(Y)=3、E(Y²)=10）。求 E(Y²+3Y+1)、V(3Y+4)、E(1/Y)。","opts":{},"ans":null,"ansText":"E(Y²+3Y+1)=20；V(3Y+4)=9；E(1/Y)=0.4","expl":"E(Y²+3Y+1)=E(Y²)+3E(Y)+1=10+9+1=20（逐項拆）。V(Y)=10−9=1；V(3Y+4)=3²×V(Y)=9（+4 消失、係數平方）。E(1/Y)=1×0.1+(1/2)×0.2+(1/3)×0.3+(1/4)×0.4=0.4——把 1/y 逐一乘機率加總，不是 1/E(Y)=1/3！","flag":false,"num":18,"id":1049},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜期望值與變異數","type":"open","q":"隨機變數 Y 之累積分配函數：F(y)=0 (y<0)、1/2 (0≤y<1)、3/5 (1≤y<2)、9/10 (2≤y<3.5)、1 (3.5≤y)。求 (a) Y 之機率質量函數；(b) P(0.5<Y<3.5)。","opts":{},"ans":null,"ansText":"(a) P(0)=1/2、P(1)=1/10、P(2)=3/10、P(3.5)=1/10；(b) 2/5","expl":"單點機率 = 該階 − 前一階：P(1)=3/5−1/2=1/10；P(2)=9/10−3/5=3/10；P(3.5)=1−9/10=1/10。(b) 開區間不含端點 0 與 3.5 → P(1)+P(2)=1/10+3/10=2/5。驗算：全部相加=1 ✓","flag":false,"num":19,"id":1050},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜常態分配","type":"open","q":"某品牌家電用品的使用壽命為平均數 4.5 年、標準差 1 年的常態分配。若其保證期間為 2 年，推算其退貨的比例。","opts":{},"ans":null,"ansText":"0.0062","expl":"P(X<2) = P(Z<(2−4.5)/1) = P(Z<−2.5)。Z=−2.5 用區塊拼不出來 → 查左尾表 = 0.0062。SOP：先畫圖，拼不出的 Z 值才查表。","flag":false,"num":20,"id":1051},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜常態分配","type":"open","q":"某公司生產辦公桌，裝配時間為常態分配，平均 56 分鐘、標準差 4 分鐘。客戶 1 個鐘頭後到達提貨，從現在開始裝配準時完成交貨的機率為？","opts":{},"ans":null,"ansText":"0.8413","expl":"P(X≤60) = P(Z≤(60−56)/4) = P(Z≤1)。畫圖用背的區塊拼：左半 0.5 + 34.1% = 0.8413，不用查表。","flag":false,"num":21,"id":1052},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜常態分配","type":"open","q":"某金屬製品之強度符合 N(210, 25)，規格要求強度至少 200psi，試計算符合規格之機率。","opts":{},"ans":null,"ansText":"0.97725","expl":"陷阱：N(210, 25) 的 25 是變異數 → σ=√25=5。P(X≥200)=1−P(Z<(200−210)/5)=1−P(−2)。拼法：0.5+0.341+0.136=0.977；或查左尾表 1−0.02275=0.97725。","flag":false,"num":22,"id":1053},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜常態分配","type":"open","q":"某金屬製品之抗張強度符合 N(50, 4)，試計算抗張強度低於 46 磅之機率和高於 52 磅之機率。","opts":{},"ans":null,"ansText":"P(X≤46)=0.02275；P(X≥52)=0.15866","expl":"σ=√4=2。P(X≤46)=P(Z≤−2)：拼法 0.5−0.341−0.136=0.023（左尾）。P(X≥52)=1−P(Z≤1)：拼法 0.5−0.341=0.159。先畫圖決定要「加」還是「扣」。","flag":false,"num":23,"id":1054},{"src":"甲｜講義-機率統計","ch":"機率分配例題｜常態分配","type":"open","q":"某產品之外徑為 N(10.1, 0.01)，規格設為 10±0.3 英吋。(1) 求不合格品之機率；(2) 若調整機器將平均數調為 10.0 英吋，此時之合格率為何？","opts":{},"ans":null,"ansText":"(1) 0.02275；(2) 0.9973","expl":"σ=√0.01=0.1。(1) 合格率 P(9.7≤X≤10.3)=P(Z≤2)−P(Z≤−4)=0.97725−0=0.97725 → 不合格率 0.02275。(2) 調 μ=10.0 後規格剛好是 μ±3σ → 合格率 0.9973（經驗法則 99.73%），不合格率 0.0027。品管連結：對準規格中心就是把製程調到 ±3σ。","flag":false,"num":24,"id":1055},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","num":1,"q":"有 500 個產品其平均重量為 375 克，標準差為 15.4 克，設以 100 個為一批時，問各批平均值之標準差為多少？","opts":{},"ans":null,"ansText":"1.38 克","expl":"先判斷：n/N = 100/500 = 1/5 > 1/10 → 有限群體，要乘修正係數。σx̄ = √[(N−n)/(N−1)] × σ/√n = √[(500−100)/(500−1)] × 15.4/√100 = √(400/499) × 1.54 = 1.38 克。若忘了修正係數直接算 15.4/√100 = 1.54 就錯了。","flag":false,"id":1056},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","num":2,"q":"某一化學成份之特性值，其平均為 10.2%，標準差為 1.2%。如每組取 4 個樣本測定其特性值時，樣本平均值之標準差將為多少？","opts":{},"ans":null,"ansText":"0.6%","expl":"無限群體：σx̄ = σ/√n = 1.2%/√4 = 0.6%。樣本平均值的標準差只有群體標準差的 1/√n。題目給的平均 10.2% 是煙霧彈，用不到。","flag":false,"id":1057},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","num":3,"q":"某公司為調查某問題，從工廠 1000 個工人中調查 150 人。以同一問題向總公司 80 人員工調查，為使其 σx̄ 相同，在總公司應調查幾人？（設兩者之 σ 相同）","opts":{},"ans":null,"ansText":"約 55.6 → 應調查 56 人","expl":"兩邊 n/N 都 > 1/10 → 有限群體公式。令兩個 σx̄ 相等：(σ/√150)×√(850/999) = (σ/√n₁)×√[(80−n₁)/79]，解得 n₁ ≈ 55.6 → 56 人。⚠️ 觀念陷阱：按比例抽樣（1000:150 = 15% → 80×15% = 12 人）是大錯誤——樣本數與母體大小不是等比關係，小母體反而要查近七成才有同樣精度。","flag":false,"id":1058},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"single","num":4,"q":"管制圖採用 ±3σ 管制界限時，型 I 誤差（製程正常卻誤判出界）α 約為多少？ (A) 0.27% (B) 4.55% (C) 31.74% (D) 63.34PPM","opts":{"A":"0.27%","B":"4.55%","C":"31.74%","D":"63.34PPM"},"ans":"A","ansText":null,"expl":"±3σ 涵蓋 99.73% → 出界 α = 0.27%。對照：±1σ→31.74%、±2σ→4.55%、±4σ→63.34PPM。界限放寬 α 變小但 β（漏報）變大，±3σ 是兩種錯誤的折衷。","flag":false,"id":1059},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"single","num":5,"q":"樣本平均值之標準差 σx̄ 與群體標準差 σ 的關係為何（無限群體）？ (A) σx̄ = σ/n (B) σx̄ = σ/√n (C) σx̄ = √n×σ (D) σx̄ = σ","opts":{"A":"σx̄ = σ/n","B":"σx̄ = σ/√n","C":"σx̄ = √n×σ","D":"σx̄ = σ"},"ans":"B","ansText":null,"expl":"X̄ 分配：E(X̄)=μ、σx̄ = σ/√n——樣本平均的散佈只有群體的 1/√n，n 越大越集中。這就是 X̄ 管制圖界限（μ±3σx̄）比個別值 ±3σ 窄的原因。有限群體（n/N>1/10）再乘修正係數 √[(N−n)/(N−1)]。","flag":false,"id":1060},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"試簡述品質變異之原因。","opts":{},"ans":null,"ansText":null,"expl":"沒有兩件完全相同的產品；變異來源可分件內變異、件間變異、時間變異三類，成因包括設備、材料、環境、作業員、加工方法等，總歸為機遇原因與非機遇原因兩大類。","flag":false,"num":1,"id":1331},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"何謂機遇原因？何謂非機遇原因？舉例說明之。","opts":{},"ans":null,"ansText":null,"expl":"機遇原因(Chance/Common)：不可避免、非人為之共同原因，每一影響皆微小、次數多但影響小，屬製程先天，去除不經濟(如量測微小差異)。非機遇原因(Assignable/Special)：可避免之人為/特殊原因，少數幾個即造成大變異、影響顯著，現場可追查除去(如刀具磨損、機械鬆動、材料不良、新手作業、儀器未校正)。只有機遇原因時製程在管制狀態、穩定可預測；有非機遇原因時製程不穩定、不可預測。","flag":false,"num":2,"id":1332},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"何謂第一種錯誤與第二種錯誤？","opts":{},"ans":null,"ansText":null,"expl":"第一種錯誤(Type I, α)：製程正常，點卻偶落界限外，誤判為異常而去追查，稱生產者風險、『無的放矢』。第二種錯誤(Type II, β)：製程已異常(平均值移動)，點仍落界限內，誤判為正常而未追查，稱消費者風險。","flag":false,"num":3,"id":1333},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"第一種錯誤與第二種錯誤各會造成什麼樣的損失？","opts":{},"ans":null,"ansText":null,"expl":"第一種錯誤(α)：製程本無異常卻去追查，造成停機停工、人員虛耗與尋找不存在原因的成本損失。第二種錯誤(β)：未察覺已存在的非機遇原因，任其繼續生產，導致不良品增加、製程惡化、品質受損。","flag":false,"num":4,"id":1334},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"兩種錯誤與管制界限有何關係？試簡述之。","opts":{},"ans":null,"ansText":null,"expl":"管制界限寬度變窄，第一種錯誤(α)機會變大、第二種錯誤(β)機會變小；界限變寬則相反。兩者無法同時最小，須以經濟平衡點(BEP)折衷。Shewhart證明採±3σ界限可使兩種錯誤總和為最小，故最經濟。","flag":false,"num":5,"id":1335},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"何謂有限群體與無限群體？","opts":{},"ans":null,"ansText":null,"expl":"以樣本數n與群體數N之比判別：當 n/N ≤ 1/10 時可視為無限群體，樣本平均標準差用 σx̄=σ/√n；當 n/N > 1/10 時為有限群體，須乘有限群體修正係數，σx̄=√((N−n)/(N−1))·(σ/√n)。","flag":false,"num":6,"id":1336},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"管制圖係以何者為基礎？","opts":{},"ans":null,"ansText":null,"expl":"以常態分配為理論基礎。抽取樣本平均X̄約有99.73%落於μ±3σ內，僅0.27%落於界限外(機遇原因)，據此以平均值±3σ構成管制界限。","flag":false,"num":7,"id":1337},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"所謂 Shewhart's Control Chart 係平均值加減幾個標準差？","opts":{},"ans":null,"ansText":null,"expl":"平均值加減『3個標準差』(±3σ)：UCL=平均值+3σ、CL=平均值、LCL=平均值−3σ。","flag":false,"num":8,"id":1338},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch2 管制圖原理","type":"open","q":"何謂最經濟之管制界限？","opts":{},"ans":null,"ansText":null,"expl":"以平均值±3σ為界限者稱最經濟之管制界限。因3σ界限可使第一種錯誤(α)與第二種錯誤(β)之總和達到最小(由經濟平衡點BEP求得)，工業經驗亦證明±3σ能彌補2σ太嚴與4σ太寬之缺點。","flag":false,"num":9,"id":1339},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"管制圖發明的時間是？","opts":{"A":"1916年","B":"1920年","C":"1924年","D":"1928年","E":"1932年"},"ans":"C","ansText":null,"expl":"(A)-1；Shewhart於1924年提出管制圖","flag":false,"num":1,"id":1245},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"管制圖發明者是？","opts":{"A":"Dr. WE Deming","B":"Dr. JM Juran","C":"Dr. AV Feigenbaum","D":"Dr. WA Shewhart","E":"Dr. PB Crosby"},"ans":"D","ansText":null,"expl":"(A)-2；管制圖由W.A.Shewhart發明","flag":false,"num":2,"id":1246},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"以平均值加減三個標準差為管制界限，製程雖屬正常，但落在界限以外的點子仍有？","opts":{"A":"0.35%","B":"1.00%","C":"0.135%","D":"0.27%","E":"3.00%"},"ans":"D","ansText":null,"expl":"(A)-3；3σ雙側界限外機率約0.27%","flag":false,"num":3,"id":1247},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"由於機率的關係，點子落在界限以外，而判斷製程已發生變化之錯誤稱為？","opts":{"A":"第一種錯誤","B":"第二種錯誤","C":"第三種錯誤","D":"第四種錯誤","E":"以上皆非"},"ans":"A","ansText":null,"expl":"(A)-4；虛驚(誤發警報)為第一種錯誤α","flag":false,"num":4,"id":1248},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"以數據性質來分，管制圖可分為？","opts":{"A":"兩大類","B":"三大類","C":"四大類","D":"不分類","E":"以上皆非"},"ans":"A","ansText":null,"expl":"(A)-5；分計量值與計數值兩大類","flag":false,"num":5,"id":1249},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"管制圖上下界限規定為？","opts":{"A":"實線","B":"虛線","C":"黑色虛線","D":"紅色虛線","E":"藍色虛線"},"ans":"D","ansText":null,"expl":"(A)-6；上下管制界限以紅色虛線表示","flag":false,"num":6,"id":1250},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"管制界限愈小時，則第二種錯誤是？","opts":{"A":"減少","B":"增加","C":"不一定","D":"不變","E":"以上皆非"},"ans":"A","ansText":null,"expl":"(A)-7；界限愈窄愈易偵測，β(第二種錯誤)減少","flag":false,"num":7,"id":1251},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"樣本數愈大時，則管制界限？","opts":{"A":"愈寬","B":"愈窄","C":"不一定","D":"不變","E":"以上皆非"},"ans":"B","ansText":null,"expl":"(A)-8；界限與1/√n成正比，n愈大界限愈窄","flag":false,"num":8,"id":1252},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"在管制圖中，若以二個標準差界限取代三個標準差界限，則會發生？","opts":{"A":"生產者風險減少","B":"生產者風險增大","C":"消費者風險增大","D":"消費者風險不變","E":"二者均增大"},"ans":"B","ansText":null,"expl":"(A)-9；界限變窄誤發警報增加，生產者風險(α)增大","flag":false,"num":9,"id":1253},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-1 管制圖原理與誤差","type":"single","q":"管制圖之主要用途為？","opts":{"A":"圖示指示","B":"調查調節用","C":"裝飾廣告用","D":"解析管制用","E":"交貨檢查用"},"ans":"D","ansText":null,"expl":"(A)-10；管制圖用於製程解析與管制","flag":false,"num":10,"id":1254},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-2 計量值管制圖(X̄-R、X-Rm)","type":"single","q":"X̄-R管制圖之管制界限公式內，代表三個標準差（σ_x̄）者為？","opts":{"A":"A₁σ","B":"A₂σ","C":"D₄R̄","D":"A₂R̄","E":"E₂R̄m"},"ans":"D","ansText":null,"expl":"(B)-1；UCL=X̄̄±A₂R̄，A₂R̄即代表3σ_x̄","flag":false,"num":11,"id":1255},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-2 計量值管制圖(X̄-R、X-Rm)","type":"single","q":"X̄-R管制圖每組樣本大小(n)最好採用？","opts":{"A":"1~5","B":"2~5","C":"2~6","D":"3~6","E":"4~7個"},"ans":"B","ansText":null,"expl":"(B)-2；X̄-R小組樣本一般取2~5","flag":false,"num":12,"id":1256},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-2 計量值管制圖(X̄-R、X-Rm)","type":"single","q":"我們日常工作中，將X̄管制圖與下列那一種管制圖聯合使用，較為方便而有效？","opts":{"A":"σ","B":"X̃","C":"R","D":"Rm","E":"P管制圖"},"ans":"C","ansText":null,"expl":"(B)-3；X̄-R聯用最方便有效","flag":false,"num":13,"id":1257},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-2 計量值管制圖(X̄-R、X-Rm)","type":"single","q":"計量值管制圖每組樣本數據，如果超過10個時，則必須使用？","opts":{"A":"X̄-R","B":"X̄-σ","C":"X̃-R","D":"X-Rm","E":"以上皆非"},"ans":"B","ansText":null,"expl":"(B)-4；n>10時R估計效率差，改用X̄-s(σ)圖","flag":false,"num":14,"id":1258},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-2 計量值管制圖(X̄-R、X-Rm)","type":"single","q":"假設製程個別值分配之標準差（σ），則σ等於？","opts":{"A":"X̄/R","B":"X̄/d₂","C":"X̄/R̄","D":"R̄/d₂","E":"d₂/R̄"},"ans": "E":"以上皆非"},"ans":"B","ansText":null,"expl":"(H)-5；書本分級Cp介於1.0~1.33為B級(尚佳)","flag":false,"num":75,"id":1319},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-6 製程管制與製程能力","type":"single","q":"規格上限與下限之差稱為T，製造能力所表現之標準差以6倍稱之為K，則T除以K所得之數值我們稱之為？","opts":{"A":"精準度","B":"精密度","C":"精確度","D":"準確度","E":"正確度"},"ans":"B","ansText":null,"expl":"(H)-6；T/6σ=Cp=精密度","flag":false,"num":76,"id":1320},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-6 製程管制與製程能力","type":"single","q":"Cp=1.67之常態分配，中心不偏移時，則規格值是μ±多少個標準差？","opts":{"A":"3σ","B":"4σ","C":"4.5σ","D":"5σ","E":"6σ"},"ans":"D","ansText":null,"expl":"(H)-7；T/2=3σ×Cp=3×1.67σ=5σ","flag":false,"num":77,"id":1321},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-6 製程管制與製程能力","type":"single","q":"所謂製程管制中，影響品質的四大因素者(4M)是指？","opts":{"A":"原料、機械、人、測試","B":"金錢、機械、人、測定","C":"原料、機械、方法、市場","D":"原料、機械、方法、士氣","E":"原料、機械、方法、人"},"ans":"E","ansText":null,"expl":"(H)-8；4M=原料(Material)、機械(Machine)、方法(Method)、人(Man)","flag":false,"num":78,"id":1322},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-6 製程管制與製程能力","type":"single","q":"某產品外徑尺寸作製程能力分析，獲得製程精密度Cp=0.78，應該為何等級？","opts":{"A":"A級","B":"B級","C":"C級","D":"D級","E":"以上皆非"},"ans":"D","ansText":null,"expl":"(H)-9；Cp<0.83為D級","flag":false,"num":79,"id":1323},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch10-6 製程管制與製程能力","type":"single","q":"在一個產品形成的過程中，欲從取得原料開始、準時完成交貨、符合品質要求並適宜銷售，必須在生產之前有？","opts":{"A":"精密的計劃","B":"正式的合約","C":"檢驗的設備","D":"合格的人員","E":"嚴格的訓練"},"ans":"A","ansText":null,"expl":"(H)-10","flag":false,"num":80,"id":1324},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"何謂管制圖？","opts":{},"ans":null,"ansText":null,"expl":"管制圖是依統計方法設計、於圖上設中心線(CL)與管制上限(UCL)、管制下限(LCL)的圖表。將製程資料點繪於圖上，用以判定製程是否處於管制(正常)狀態、有無非機遇(異常)原因，是同時進行測定、記錄、評估製程品質的有效工具。","flag":false,"num":1,"id":1325},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"管制圖係何人於何時發明？","opts":{},"ans":null,"ansText":null,"expl":"由美國品管大師 W. A. Shewhart 博士於 1924 年發明，為統計品質管制(SQC)之始。","flag":false,"num":2,"id":1326},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"管制圖與一般統計圖有何不同？","opts":{},"ans":null,"ansText":null,"expl":"一般統計圖僅呈現數據；管制圖另設中心線與上下管制界限(±3σ)，能判斷資料是否落於界限內、製程是否在管制狀態、有無非機遇原因，具備判定與預警功能，一般統計圖無此判定作用。","flag":false,"num":3,"id":1327},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"簡述規格界限與管制界限之意義。","opts":{},"ans":null,"ansText":null,"expl":"規格界限(上限Su、下限SL)由設計或顧客需求訂定，用來核對『個別單位產品』是否合格。管制界限(UCL、LCL)由製程本身資料以平均值±3σ計算得出，用來判斷『一群(樣本)產品或製程』是否處於正常(管制)狀態。前者人為訂定、判個別品；後者由統計算出、判製程。兩者不可混用。","flag":false,"num":4,"id":1328},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"管制圖有何種用途？試簡述之。","opts":{},"ans":null,"ansText":null,"expl":"(1)偵測並提示製程有無非機遇原因、判斷是否在管制狀態；(2)作為製造或購入產品允收/拒收之依據；(3)由小批中挑選同質產品之依據；(4)判斷大批產品品質是否均勻;(5)了解採購驗收品質，並可用於非生產性事件(如錯誤率、能源消耗)之管制。","flag":false,"num":5,"id":1329},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch1 緒言","type":"open","q":"管制圖將那三個階段之工作連成一體？","opts":{},"ans":null,"ansText":null,"expl":"將『設計、製造、檢驗』三個階段之工作連成一體，是對製程品質特性進行測定、記錄、評估的有效工具。","flag":false,"num":6,"id":1330},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch3 管制圖種類","type":"open","q":"管制圖分那幾種？","opts":{},"ans":null,"ansText":null,"expl":"依數據性質分為：(1)計量值管制圖——X̄-R、X̄-s、X̃-R、X-Rm；(2)計數值管制圖——p、pn、c、u。依用途分為：管制用管制圖與解析用管制圖(解析用又分決定方針、製程解析、製程能力研究)。","flag":false,"num":1,"id":1340},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch3 管制圖種類","type":"open","q":"試比較各類管制圖之優點與缺點。","opts":{},"ans":null,"ansText":null,"expl":"優點：①用於製程管制，最容易調查事故發生原因，可預測將發生之不良狀況；②能及時且正確找出不良原因，使品質穩定。缺點：①製造過程需經常抽樣、測定、計算並點圖，較麻煩費時；②只靠管制圖有時無法尋得不良之真正原因，可能延誤採取措施之時機。","flag":false,"num":2,"id":1341},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch3 管制圖種類","type":"open","q":"計量值管制圖與計數值管制圖之比較。","opts":{},"ans":null,"ansText":null,"expl":"計量值管制圖所依據之數據為連續可量測值(長度、重量、成份)，含X̄-R、X̄-s、X̃-R、X-Rm；計數值管制圖所依據之數據為間斷數(不合格數、缺點數)，含p、pn、c、u。計量值資訊量較豐富、可較早偵測製程變化；計數值取得簡便但敏感度較低。","flag":false,"num":3,"id":1342},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch3 管制圖種類","type":"open","q":"簡述管制圖之重要性。","opts":{},"ans":null,"ansText":null,"expl":"「眼睛是靈魂之窗，管制圖是製造之窗」。管制圖提供製程是否處於管制(穩定)狀態之重要情報，可即時洞察並掌握品質變化，作為預防與改善之依據。","flag":false,"num":4,"id":1343},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch3 管制圖種類","type":"open","q":"簡述直方圖與管制圖之不同。","opts":{},"ans":null,"ansText":null,"expl":"直方圖：於製程完成後調查全數，可粗略掌握某一時期之製程狀態(靜態、事後)。管制圖：於製程進行中調查少數樣本，能在連續之製造流程中顯示製程之變化(動態、即時)。","flag":false,"num":5,"id":1344},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"用管制圖控制品質特性時，如何選取合理樣組(rational subgroup)？","opts":{},"ans":null,"ansText":null,"expl":"合理樣組原則：組內變異只反映機遇原因(同一時間、同機台、同作業員、同材料所取，組內盡量均勻)；組間差異則反映非機遇原因。通常每組n固定(計量值常n=4或5)，依製程時間順序連續抽取20~25組以上，使組內差異小、組間差異大，才能靈敏偵測製程變化。","flag":false,"num":1,"id":1345},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"常用計量值管制圖有那些？","opts":{},"ans":null,"ansText":null,"expl":"平均值-全距圖(X̄-R)、平均值-標準差圖(X̄-s)、中位值-全距圖(X̃-R)、個別值-移動全距圖(X-Rm)。其中以X̄-R最常用。","flag":false,"num":2,"id":1346},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"常用計數值管制圖有那些？","opts":{},"ans":null,"ansText":null,"expl":"不合格率管制圖(p圖)、不合格數管制圖(pn圖/np圖)、缺點數管制圖(c圖)、單位缺點數管制圖(u圖)。","flag":false,"num":3,"id":1347},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"某零件採用X̄-s管制圖，抽驗20組計得 ΣX̄=1612.9、Σs=71.4，試計算中心線並估計群體標準差σ。","opts":{},"ans":null,"ansText":"CL_X̄=X̿=80.645；CL_s=s̄=3.57","expl":"X̿=1612.9/20=80.645(X̄圖中心線)；s̄=71.4/20=3.57(s圖中心線)。控制界限：UCL_X̄=X̿+A₃s̄、LCL_X̄=X̿−A₃s̄；UCL_s=B₄s̄、LCL_s=B₃s̄；群體標準差σ̂=s̄/C₄。A₃、B₃、B₄、C₄需依每組樣本大小n查係數表。","flag":false,"num":5,"id":1348},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"某製程用X̄-R管制圖，每天抽樣2次每次n=5，經2個月抽驗知樣本平均值之標準差σx̄=2.46，試問製程群體標準差為何？","opts":{},"ans":null,"ansText":"σ≈5.50","expl":"σx̄=σ/√n，故 σ=σx̄×√n=2.46×√5=2.46×2.236≈5.50。","flag":false,"num":7,"id":1349},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch4 管制圖繪製","type":"open","q":"某工廠每4小時取樣100個檢查產品性能，一個月平均不合格率為0.04，試計算p管制圖之管制界限。","opts":{},"ans":null,"ansText":"CL=0.04；UCL≈0.0988(9.88%)；LCL=0","expl":"p̄=0.04, n=100。σp=√(p̄(1−p̄)/n)=√(0.04×0.96/100)=0.0196。UCL=0.04+3×0.0196=0.0988；LCL=0.04−0.0588<0取0。","flag":false,"num":12,"id":1350},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"何謂正常型態之管制圖？","opts":{},"ans":null,"ansText":null,"expl":"正常(管制狀態)判定：①多數點子集中於中心線附近；②少數點子落在管制界限附近；③點子分佈成隨機、無規則可循；④沒有(或極少)點子超出管制界限之外。","flag":false,"num":1,"id":1351},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"何謂不正常型態之管制圖？","opts":{},"ans":null,"ansText":null,"expl":"指點子出現非隨機、可歸咎於非機遇原因之現象，不一定都落在管制界限外。常見型態：混合型、層別型、不穩定型、趨勢(傾向)型、週期型等。","flag":false,"num":2,"id":1352},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"何謂「混合型(Mixture)」？","opts":{},"ans":null,"ansText":null,"expl":"中心線附近幾乎無點子的型態。原因是樣本來自兩個(以上)群體，一群偏大、一群偏小，混合後點子多集中於上下兩側而遠離中心線。","flag":false,"num":3,"id":1353},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"何謂「層別型(Stratification)」？","opts":{},"ans":null,"ansText":null,"expl":"管制界限附近幾乎無點子、點子過度集中於中心線附近的型態。原因是原群體已被挑選/分層(某規格尺寸已被取走)，使變異被人為縮小。","flag":false,"num":4,"id":1354},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"何謂「不穩定型(Instability)」？","opts":{},"ans":null,"ansText":null,"expl":"有點子落出管制界限之外的型態，表示製程受非機遇原因影響、變異過大而不穩定。","flag":false,"num":5,"id":1355},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"連續三點之中有兩點超出幾個標準差即造成不正常型態？","opts":{},"ans":null,"ansText":"2個標準差(2σ，A區)","expl":"檢定規則：連續3點中有2點落在中心線同側之A區(超出2σ)或以外，判為不正常。","flag":false,"num":6,"id":1356},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"連續五點之中有四點超出幾個標準差即造成不正常型態？","opts":{},"ans":null,"ansText":"1個標準差(1σ，B區)","expl":"檢定規則：連續5點中有4點落在中心線同側之B區(超出1σ)或以外，判為不正常。","flag":false,"num":7,"id":1357},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"連續幾點出現在中心線同側即造成不正常型態？","opts":{},"ans":null,"ansText":"連續7點","expl":"點子連續出現在中心線同一側達7點以上時，判為不正常(有非機遇原因)。","flag":false,"num":8,"id":1358},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"連續七點繼續上升或下降時，應作何處置？","opts":{},"ans":null,"ansText":"必有原因，應立即採取措施","expl":"趨勢判定：連續5點上升/下降→注意以後動態；連續6點→開始調查原因；連續7點→必有原因，應立即採取措施。","flag":false,"num":9,"id":1359},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"點出現在管制界限近旁(鄰近2σ)時，連續7點中有幾點以上即可判定異常？","opts":{},"ans":null,"ansText":"3點以上","expl":"以超出2σ區域之點為基準：連續3點中2點以上、連續7點中3點以上、連續10點中4點以上，即判製程異常。","flag":false,"num":10,"id":1360},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch5 管制圖判讀","type":"open","q":"試述管制圖數據分配之連串理論(theory of runs)。","opts":{},"ans":null,"ansText":null,"expl":"以中心線(或中位線)為界，將點子分為上方、下方；一點或連續數點落在同一方稱一個「串(run)」。計算全圖總串數，對照Swed-Eisenhart臨界值表。若總串數大於臨界值則判為隨機(管制狀態)；若總串數過少則屬非隨機、具非機遇原因。","flag":false,"num":11,"id":1361},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"通常用那些方法來決定管制項目？","opts":{},"ans":null,"ansText":null,"expl":"利用柏拉圖(Pareto)找出少數重要因素、用特性要因圖(魚骨圖)分析要因，並由有關人員(操作員、領班、主管)公開研討共同決定；有計量值時優先採計量管制圖。","flag":false,"num":1,"id":1362},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"管制界限在何種情況下需要重新檢討？","opts":{},"ans":null,"ansText":null,"expl":"(1)經營政策或消費者要求改變、規格變更時；(2)技術標準、規格、作業或檢驗標準變更時；(3)製程已有變化時；(4)製程始終無法穩定且常有點子跑出界限外(不良率過高)；(5)製程狀態良好、界限太寬時可縮短檢討期間並重算縮小界限。","flag":false,"num":2,"id":1363},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"重新計算管制界限時需要注意那些事項？","opts":{},"ans":null,"ansText":null,"expl":"應剔除可查出原因之異常點後再重新計算中心線與界限；原因不明之數據仍予保留。重算後將新界限標準化並確實執行、保存記錄。","flag":false,"num":3,"id":1364},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"管制圖之最適當取樣方法為何？","opts":{},"ans":null,"ansText":null,"expl":"以取得合理樣組(rational subgroup)為主：使組內變化小、組間差異能顯現。一般採定時、等時間間隔抽樣或隨機抽樣，使樣本能代表製程並反映異常。","flag":false,"num":4,"id":1365},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"管制圖之分組取樣法其目的為何？","opts":{},"ans":null,"ansText":null,"expl":"目的有二：(1)求出組內變動之大小(組內只含機遇原因)；(2)瞭解組間變動是否處於管制狀態、是否因時間而變化，以便層別並找出可分配原因。","flag":false,"num":5,"id":1366},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"X̄-R管制圖之樣組大小應取若干為最佳？","opts":{},"ans":null,"ansText":"n=2~5，常用4或5","expl":"n=2~5為適當，常用n=4或5；資料較多時可再分組。","flag":false,"num":6,"id":1367},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"工廠中實施管制圖，最重要者為何？","opts":{},"ans":null,"ansText":null,"expl":"最重要者為全體員工合作(Team Work)，並由高階主管熱心倡導與支持；確實找出異常原因並採取改正行動，使問題不再發生。","flag":false,"num":7,"id":1368},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"如何使管制圖生效？","opts":{},"ans":null,"ansText":null,"expl":"須靠全體員工並特別注意三點：①所選管制特性使不良發生之品質特性最大；②量測方法一致(同一人、同量具)；③保留樣本次序。並依正確方法取樣、計算、繪圖，發現異常立即追查原因、追蹤改正。","flag":false,"num":8,"id":1369},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch6 管制圖應用","type":"open","q":"如何分析檢討管制圖上之異常原因？","opts":{},"ans":null,"ansText":null,"expl":"異常表現於兩現象：①X̄-R界限很寬(公差大)；②P̄或ū偏高(製程能力不足)。原因分三類：1.管理不善(未標準化、訓練不足、保養不當、材料混入、設計錯誤)；2.技術不足(機械精度、工作環境、設計矛盾、測定不當、缺技術人才)；3.其他(疏忽、未按標準、條件突變、異質材料侵入、計算錯誤、機械磨損)。利用層別法分析並消除。","flag":false,"num":9,"id":1370},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"在修正管制界限中之 K 值如何推算出來？","opts":{},"ans":null,"ansText":null,"expl":"修正界限 d=3(1−1/√n)σx=(3/d₂)(1−1/√n)R̄=K·R̄，故 K=(3/d₂)(1−1/√n)，僅與樣本數n有關，可查表得。使用前須先驗算 L·R̄ 是否小於規格公差(6σ)。","flag":false,"num":1,"id":1371},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"趨勢管制圖適用於何種工作？","opts":{},"ans":null,"ansText":null,"expl":"適用於刀具磨損、模具磨耗等使製程平均值隨時間逐漸升降、但產品仍在規格內之工作(如車床、螺絲加工)。中心線為傾斜直線 X̄=a+bh，以最小二乘法求a、b。","flag":false,"num":2,"id":1372},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"或然率界限管制圖常採用那幾種或然率界限值？","opts":{},"ans":null,"ansText":null,"expl":"常用0.002(或0.001)與0.05(或0.025)：外側(處置界限)0.002對應3.09σ、內側(警戒界限)0.05對應1.96σ。","flag":false,"num":3,"id":1373},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"複式管制圖中之內側管制界限又稱何種管制界限？","opts":{},"ans":null,"ansText":null,"expl":"內側管制界限又稱警戒界限(Warning/Inner limits)，通常取2σ或1.96σ(0.05)；外側界限稱處置/行動界限(Action/Outer limits)，取3σ(0.002)。","flag":false,"num":4,"id":1374},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"試寫出 L-S 管制圖之管制界限公式？","opts":{},"ans":null,"ansText":null,"expl":"CL_(L-S)=M̄=(L̄+S̄)/2；UCL=M̄+A₉·R̄；LCL=M̄−A₉·R̄；其中 R̄=L̄−S̄，係數A₉依樣本大小查表。","flag":false,"num":5,"id":1375},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"個別值管制圖又稱為何種管制圖？","opts":{},"ans":null,"ansText":"點圖(Dot Chart)","expl":"又稱點圖(Dot Chart)。使用個別值直接點在圖上，適用於樣本難取、破壞性試驗或不需X̄、R之場合，界限為 X̄±3σ。","flag":false,"num":6,"id":1376},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch7 雜式管制圖","type":"open","q":"變異值管制圖適用那些工作？","opts":{},"ans":null,"ansText":null,"expl":"變異值(Within Piece)管制圖適用計量值數據，衡量單一產品/零件本身之變異(如同件之不均勻、偏心、面不平行)，以及機器能力、尺寸之變異；可顯示件內、樣本間、間隔間三種變異。","flag":false,"num":7,"id":1377},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"設計者所訂規格常較實際需要嚴，其理由何在？","opts":{},"ans":null,"ansText":null,"expl":"(1)設計人員沒有足夠時間與資料，為安全計把規格訂嚴一點；(2)設計者了解藍圖規格與實際需要有差別，為配合實際需要而訂嚴一些。惟公差訂過嚴會增加製造費用。","flag":false,"num":1,"id":1378},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"試述規格之訂定方法。","opts":{},"ans":null,"ansText":null,"expl":"五種方法：①根據類似物品或零件的規格；②根據製程能力；③將製造出的產品與現有規格比較，判斷所訂規格是否合理再修正；④依設計出來的公差；⑤依上下游廠商的要求。","flag":false,"num":2,"id":1379},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"試述訂定新設計產品規格之方法。","opts":{},"ans":null,"ansText":null,"expl":"可參考X̄-R管制圖所提供的資料(了解製程是否在管制狀態、品質水準及次數分配形狀)，或參考類似產品；亦可藉實驗工廠(Pilot plant)之實驗結果設定公差，避免規格訂得過嚴。","flag":false,"num":3,"id":1380},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"試述組合物之公差與所使用零件公差之關係。","opts":{},"ans":null,"ansText":null,"expl":"裝配(組合)物之公差不等於各零件公差之算術和。獨立變數和之標準差=各標準差平方和開方：σ_s=√(σ₁²+σ₂²+…+σn²)。若公差與標準差成比例，則(U−L)組合=√[Σ(U−L)零件²]，統計合成公差比直接相加為小。前提為各變數彼此獨立不相關。","flag":false,"num":4,"id":1381},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"某產品由兩零件組合，A零件σ=0.0020、B零件σ=0.0004，求兩零件組合後之標準差。","opts":{},"ans":null,"ansText":"σ組合≈0.0020","expl":"σ組合=√(σ_A²+σ_B²)=√(0.0020²+0.0004²)=√(0.000004+0.00000016)=√0.00000416≈0.00204≈0.0020。","flag":false,"num":5,"id":1382},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch8 規格與公差","type":"open","q":"已知產品規格 0.500±0.020，最後一個過程之公差範圍為0.005，求最後第二個過程之公差範圍。","opts":{},"ans":null,"ansText":"(U−L)₁≈0.0397","expl":"成品公差範圍(U−L)和=2×0.020=0.040；最後過程(U−L)₂=0.005。(U−L)₁=√[(U−L)和²−(U−L)₂²]=√(0.040²−0.005²)=√0.001575≈0.0397。","flag":false,"num":6,"id":1383},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"何謂製程管制？","opts":{},"ans":null,"ansText":null,"expl":"製程管制即在製品之品質管制(IPQC)，又稱製程品質管制(PQC)。在製造過程中對主要管制項目(產量、品質、交期、成本)加以管制，利用工程知識與資料統計將製造條件標準化，即時發現不符規格之缺點予以矯正，確保製品品質、預防不良品再發，對下工程做品質保證。","flag":false,"num":1,"id":1384},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"何謂製程能力分析？","opts":{},"ans":null,"ansText":null,"expl":"在製程已處統計管制狀態且近似常態的前提下，用數量方法評估製程對機遇原因所產生的變異程度(自然公差=6σ̂)。常用準確度Ca=(X̄−μ)/(T/2)、精密度Cp=T/6σ̂、綜合指數Cpk=(1−|Ca|)·Cp及不良率p等指標，將製程符合規格之能力量化並分級(A/B/C/D)。","flag":false,"num":2,"id":1385},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"何謂製程管制方案(QC工程表)？","opts":{},"ans":null,"ansText":null,"expl":"又稱QC工程表。為達製程品質目標，將各工程之管制項目、管制方法、檢驗方法彙整而成的綜合圖表，內容包括製品名稱、工程別、負責單位、製造流程圖、工程名稱、管制項目、規格值、抽樣數、抽樣間隔、測量法、管制方法及負責者。","flag":false,"num":3,"id":1386},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"何謂首件檢查？","opts":{},"ans":null,"ansText":null,"expl":"對每批(或開車後)最初生產的少數(約2~10件)製品進行檢查，由作業員或QC人員以首件檢查記錄表執行。目的在確認製程已符合標準、製造條件設定正確，確保後續量產品質。","flag":false,"num":4,"id":1387},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"何謂製造流程圖？其五種符號為何？","opts":{},"ans":null,"ansText":null,"expl":"利用五種符號表示製程中所有操作、檢驗、耽擱及搬運，使人一目了然：○操作、□檢驗、D遲延、▽儲存、⇒搬運。是改善製程、降低成本的利器，改善重點在減少搬運(⇒)與儲存(▽)。","flag":false,"num":5,"id":1388},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"製程中心不偏，規格公差為 ±4σ 時，求 Cp。","opts":{},"ans":null,"ansText":"Cp≈1.33(A級)","expl":"規格公差T=Su−SL=(+4σ)−(−4σ)=8σ。Cp=T/6σ̂=8σ/6σ=8/6≈1.33，屬A級。","flag":false,"num":6,"id":1389},{"src":"甲｜管制圖與製程管制(教科書)","ch":"Ch9 製程管制","type":"open","q":"某製程硬度規格為 65±1.5，實績為 X̄±3σ̂=66±1.6，求 Ca、Cp、Cpk。","opts":{},"ans":null,"ansText":"Ca≈+66.7%(D級)、Cp≈0.94(C級)、Cpk≈0.31(C級)","expl":"μ=65，T=2×1.5=3.0，T/2=1.5；X̄=66，3σ̂=1.6→σ̂≈0.533，6σ̂=3.2。Ca=(66−65)/1.5=+66.7%(D級)。Cp=3.0/3.2≈0.94(C級)。Cpk=(1−0.667)×0.94≈0.31(=min{(66.5−66)/1.6,(66−63.5)/1.6}=0.5/1.6≈0.31，C級)。","flag":false,"num":7,"id":1390},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"下列何者不適宜描述一組數據的集中趨勢？","opts":{"A":"平均數","B":"中位數","C":"標準差","D":"眾數"},"ans":"C","ansText":null,"expl":"標準差是「散佈（離散程度）」的量數，不是集中趨勢。","flag":false,"num":1,"id":1078},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"一組樣本之數據為5、3、7，下列何者為正確？","opts":{"A":"平均數為6","B":"標準差為3","C":"標準差為2","D":"變異數為4.5"},"ans":"C","ansText":null,"expl":"平均=5、SS=8、樣本變異數=8/2=4、樣本標準差=2。","flag":false,"num":2,"id":1079},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"當一組數據為右偏時，下列敘述何者為正確？","opts":{"A":"Mode<Median<Mean","B":"Median<Mean<Mode","C":"Mean<Median<Mode","D":"Mode<Mean<Median"},"ans":"A","ansText":null,"expl":"右偏：眾數＜中位數＜平均數（平均數被右尾拉走）；左偏相反：平＜中＜眾。","flag":false,"num":3,"id":1080},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"下列何者屬於連續型分配？","opts":{"A":"二項分配","B":"卜瓦松分配","C":"常態分配","D":"超幾何分配"},"ans":"C","ansText":null,"expl":"二項、卜瓦松、超幾何都是計數值（離散）；常態是計量值（連續）。","flag":false,"num":4,"id":1081},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"試求出下列資料的中位數？資料（20筆）：5,15,25,50,10,30,5,25,45,15,10,40,25,5,20,10,25,50,30,10","opts":{"A":"15","B":"20","C":"25","D":"22.5"},"ans":"D","ansText":null,"expl":"排序後 n=20（偶數），中位數=第10、11個的平均=(20+25)/2=22.5。","flag":false,"num":13,"id":1086},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"七個樣本資料為8，5，4，9，7，5，11，下列敘述何者為錯誤？","opts":{"A":"眾數為5","B":"中位數為7","C":"全距為6","D":"標準差為2.33"},"ans":"C","ansText":null,"expl":"全距 R=Max−Min=11−4=7，不是 6，故 C 錯誤。","flag":false,"num":14,"id":1087},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"依下列次數分配表計算算術平均數？組界/次數：0~5/7、5~10/6、10~15/7、15~20/9、20~25/6","opts":{"A":"10","B":"12.5","C":"12.64","D":"15"},"ans":"C","ansText":null,"expl":"用組中點：(7×2.5+6×7.5+7×12.5+9×17.5+6×22.5)/35=12.64。","flag":false,"num":15,"id":1088},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"某一製程之平均良率為 0.99，今從生產過程中隨機抽取 20 個產品，求至少有一個會是不良品之機率？","opts":{"A":"(0.01)²⁰","B":"(0.01)(0.99)²⁰","C":"1−(0.99)²⁰","D":"1−(0.01)²⁰"},"ans":"C","ansText":null,"expl":"「至少一個不良」＝1−「全部都良」＝1−0.99²⁰。判斷關鍵：看到「至少」先想補集。","flag":false,"num":16,"id":1089},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"若隨機變數X與Y均呈常態分配且互相獨立，X的標準差為4，Y的標準差為2，則X±Y之變異數為","opts":{"A":"20","B":"12","C":"5","D":"25"},"ans":"A","ansText":null,"expl":"獨立變數和或差的變異數都相加：4²+2²=20。","flag":false,"num":17,"id":1090},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"已知製程標準差 σ=0.25。現以樣本平均數估計母體平均數，希望誤差在0.025以內之機率達0.95以上，請問至少需抽取之樣本數為多少？（Z0.025=1.96）","opts":{"A":"384","B":"385","C":"270","D":"271"},"ans":"B","ansText":null,"expl":"n=(Zσ/E)²=(1.96×0.25/0.025)²=384.16 → 樣本數無條件進位取 385。","flag":false,"num":19,"id":1092},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"某產品之長度X與寬度Y均符合常態分配且相互獨立，σX=0.2、σY=0.3。若高度 Z=2X−Y，請問Z之標準差為","opts":{"A":"0.250","B":"0.500","C":"0.170","D":"0.265"},"ans":"B","ansText":null,"expl":"V(Z)=2²×0.04+0.09=0.16+0.09=0.25 → σZ=√0.25=0.5。","flag":false,"num":23,"id":1096},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"某 LCD 製造廠所生產之液晶螢幕平均每 10 片會有 5 個亮點，今日有一工程師檢查 12 片，請問有 2 個亮點之機率為？","opts":{"A":"18e⁻⁶","B":"12.5e⁻⁵","C":"36e⁻⁶","D":"0.125e⁻⁰·⁵"},"ans":"A","ansText":null,"expl":"每片 0.5 個 → 12 片 λ=6。P(2)=e⁻⁶·6²/2!=36e⁻⁶/2=18e⁻⁶。陷阱：忘了除 2! 會誤選 36e⁻⁶。","flag":false,"num":24,"id":1097},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"某一製程之平均良率為 0.98，今從生產過程中隨機抽取 20 個產品，求至少有一個會是不良品之機率？","opts":{"A":"1−(0.98)¹⁹","B":"(0.02)(0.98)²⁰","C":"1−(0.98)²⁰","D":"1−(0.02)²⁰"},"ans":"C","ansText":null,"expl":"至少一個不良＝1−全部都良＝1−0.98²⁰。","flag":false,"num":25,"id":1098},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"在50件產品中有10件為不良，若隨機抽取5件產品，則其中恰有2件為不良的機率為何？","opts":{"A":"0.02","B":"0.04","C":"0.20","D":"以上皆非"},"ans":"C","ansText":null,"expl":"n/N=5/50=1/10 邊界，原解用超幾何（精確）：C(10,2)×C(40,3)÷C(50,5)≈0.2。","flag":false,"num":27,"id":1099},{"src":"甲｜隨堂考題(第二堂課)","ch":"統計1-2","type":"single","q":"組件Y由零件X1及X2組裝而成（Y=X1+X2），X1平均2、標準差0.3；X2平均2.4、標準差0.4，均為常態分配，則組件Y的","opts":{"A":"平均值為2.2 標準差為0.7","B":"平均值為4.4 標準差為0.7","C":"平均值為2.2 標準差為0.5","D":"平均值為4.4 標準差為0.5"},"ans":"D","ansText":null,"expl":"E(Y)=2+2.4=4.4；V(Y)=0.09+0.16=0.25 → σ=0.5。標準差不能直接加。","flag":false,"num":28,"id":1100},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"收集產品尺寸數據共100個，求得最大值為18.8，最小值為15.6，依史特吉斯(Sturges)公式，試求次數分配表之組數與組距分別是多少？","opts":{"A":"5組,0.5","B":"5組,0.4","C":"5組,0.5","D":"7組,0.4","E":"8組,0.4"},"ans":"E","ansText":null,"expl":"k = 1+3.32×log(100) = 7.64 → 無條件進位取 8 組；組距 C = (18.8−15.6)/8 = 0.4。（原卷 A、C 選項重複，照原卷收錄）","flag":false,"num":1,"id":1061},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"若已知樣本數值為22、18、17、20、21，試求群體變異數的不偏估計值：","opts":{"A":"4.3","B":"3.44","C":"5.2","D":"2.5","E":"1.9"},"ans":"A","ansText":null,"expl":"不偏估計 → 分母 n−1。平均=19.6，SS=17.2，V=17.2/4=4.3。🖩 SD 模式輸入後取 xσn−1=2.07，再 Ans→x²。","flag":false,"num":2,"id":1062},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"某電子公司使用A及B二部機器製造晶片，A機器生產全部產品之60%，B機器生產40%。A機器不良率2%，B機器不良率5%。今隨機抽取一件檢驗發現為不良，則它係生產自A機器之機率為何？","opts":{"A":"0.375","B":"0.615","C":"0.383","D":"0.607","E":"以上皆非"},"ans":"A","ansText":null,"expl":"貝氏定理（畫圖）：分母=0.6×0.02+0.4×0.05=0.032；分子=0.012；0.012/0.032=0.375。","flag":false,"num":6,"id":1066},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"X與Y為獨立的隨機變數，若σX=2，σY=4，則2X−Y的變異數為？","opts":{"A":"16","B":"24","C":"32","D":"64","E":"128"},"ans":"C","ansText":null,"expl":"V(2X−Y)=2²V(X)+V(Y)=4×4+16=32。係數平方、相減仍相加。","flag":false,"num":7,"id":1067},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"某製程其不良率0.02，取樣100件，設有0個不良品的機率為P0，則P0=？","opts":{"A":"0.123","B":"0.135","C":"0.144","D":"0.157","E":"0.162"},"ans":"B","ansText":null,"expl":"λ=np=100×0.02=2，卜式 P(0)=e⁻²=0.135（查卜式表）。","flag":false,"num":9,"id":1069},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"某產品之不良率為0.002，今抽取100件，請問樣品中至少含有2個不良品機率為","opts":{"A":"0.014","B":"0.018","C":"0.021","D":"0.024","E":"以上皆非"},"ans":"B","ansText":null,"expl":"λ=np=0.2。「至少 2」反面思考：1−P(X≤1)=1−0.982=0.018（查表）。","flag":false,"num":10,"id":1070},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"中興公司之員工薪水平均每小時132.5元，標準差為20元，若工資之分配為常態分配，則最高5%部份之薪水至少應為","opts":{"A":"140.5元","B":"150.3元","C":"160.6元","D":"165.4元","E":"175.2元"},"ans":"D","ansText":null,"expl":"右尾 5% → Z=1.645。X=μ+Zσ=132.5+1.645×20=165.4。","flag":false,"num":11,"id":1071},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"設X是一隨機變數且 Var(4X−6)=144，則X的標準差為？","opts":{"A":"2","B":"3","C":"4","D":"5","E":"6"},"ans":"B","ansText":null,"expl":"Var(4X−6)=16Var(X)=144 → Var(X)=9 → σ=3。常數 −6 消失、係數 4 要平方。","flag":false,"num":12,"id":1072},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"產品缺點數之平均值為 5，請問在此產品上會發現剛好 2 個缺點之機率為？","opts":{"A":"e⁻⁵·5²/2","B":"e⁻²·5²/120","C":"e⁻⁵·5²/120","D":"e⁻⁵·5²"},"ans":"A","ansText":null,"expl":"缺點數 → 卜瓦松。P(x)=e^(−λ)·λˣ/x!，λ=5、x=2 → e⁻⁵·5²/2!=e⁻⁵·5²/2。陷阱：分母是 x! 不是 λ!。","flag":false,"num":13,"id":1073},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"在 40 m² 之地毯中，平均可發現 2 個不合格點，今檢驗 20 m² 之地毯，發現 1 個不合格點之機率為？","opts":{"A":"e⁻¹","B":"2e⁻²","C":"0.5e⁻⁰·⁵","D":"0.5e⁻¹"},"ans":"A","ansText":null,"expl":"先換算單位面積的 λ：40 m² 有 2 個 → 20 m² 有 λ=1。P(1)=e⁻¹·1¹/1!=e⁻¹。判斷關鍵：λ 必須對應「實際檢驗的量」。","flag":false,"num":14,"id":1074},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"某一製程之平均良率為 0.9，今從生產過程中隨機抽取 20 個產品，求沒有不良品之機率？","opts":{"A":"(0.1)²⁰","B":"20(0.9)²⁰","C":"1−(0.9)²⁰","D":"(0.9)²⁰"},"ans":"D","ansText":null,"expl":"良率 0.9 → 20 個全良＝0.9²⁰。陷阱：「沒有不良品」＝全部都是良品，不是 1 減。","flag":false,"num":15,"id":1075},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習1216","type":"single","q":"A零件的期望值為30，標準差為6，B零件的期望值為40，標準差為8，現將兩零件合為一新產品，則新產品的標準差為何？","opts":{"A":"10","B":"14","C":"100","D":"48"},"ans":"A","ansText":null,"expl":"變異數相加：6²+8²=100 → σ=√100=10。標準差不能直接加（6+8=14 是陷阱）。","flag":false,"num":16,"id":1076},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習｜敘述統計","type":"single","q":"下列何者為表示數據間變異大小之統計量？","opts":{"A":"平均數","B":"眾數","C":"中位數","D":"第一四分位數","E":"標準差"},"ans":"E","ansText":null,"expl":"〔原卷11209〕標準差衡量資料的離散（變異）程度，其餘皆為集中趨勢或位置量數。","flag":false,"num":1,"id":1102},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習｜敘述統計","type":"single","q":"一組隨機樣本為［5，12，13，14，17，19，23，28］，則下列何者為錯誤？","opts":{"A":"算數平均值為16.375","B":"全距為23","C":"中位數為15.5","D":"四分位距為10","E":"標準差為7.09"},"ans":"D","ansText":null,"expl":"〔原卷11209〕Q1=12.5、Q3=21，四分位距約8.5（依取法8.5~9.75），非10；其餘敘述經驗算皆正確。","flag":false,"num":7,"id":1109},{"src":"甲｜隨堂考題(第二堂課)","ch":"總複習｜敘述統計","type":"single","q":"下列哪一個統計量能同時表示一組樣本中，薪水的變異
