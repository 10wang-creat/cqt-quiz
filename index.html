m":48,"id":1242},{"src":"乙｜品質概念(誤置補回)","ch":"Ch1 品質成本","type":"single","q":"下列是在品質控制系統中應用的成本函數，p是零件被檢查的百分比(p%)。預防與評估成本：120+7p；內部與外部失敗成本：2000/p+4(50−p)。試問最佳的檢查水準(p)為何？","opts":{"A":"30.78","B":"25.82","C":"29.12","D":"18.82"},"ans":"B","ansText":null,"expl":"TC=120+7p+2000/p+4(50−p)，逐一代入選項找最小：p=25.82 時 TC≈474.9 最小。","flag":false,"num":17,"id":1077},{"src":"甲｜隨堂考題(第四堂課)","ch":"離散型隨機變數計算題","type":"open","num":4,"q":"離散型隨機變數 Y 之機率分配為：y=1 → 1/4；y=2 → 3/8；y=3 → 1/4；y=4 → 1/8。試求：\n(a) P(1 ≤ y ≤ 3)　(b) P(y > 3)","opts":{},"ans":null,"ansText":"(a) 7/8　(b) 1/8","expl":"(a) 1/4+3/8+1/4=2/8+3/8+2/8=7/8\n(b) y>3 只有 y=4 → 1/8（也可用 1−7/8）。\n判斷關鍵：> 不含 3，≥ 才含。","flag":false,"id":1391},{"src":"甲｜隨堂考題(第四堂課)","ch":"離散型隨機變數計算題","type":"open","num":5,"q":"隨機變數 X 之機率分配為：x=0 → 1/4；x=1 → 1/2；x=2 → 1/4。試求：\n(a) E[X]　(b) V(X)　(c) σ(X)","opts":{},"ans":null,"ansText":"(a) E[X]=1　(b) V(X)=0.5　(c) σ(X)=√0.5≈0.707","expl":"E[X]=0(¼)+1(½)+2(¼)=1\nE[X²]=0(¼)+1(½)+4(¼)=1.5\nV(X)=1.5−1²=0.5；σ=√0.5≈0.707。","flag":false,"id":1392},{"src":"甲｜隨堂考題(第四堂課)","ch":"離散型隨機變數計算題","type":"open","num":6,"q":"隨機變數 X 定義為：X=4 的機率是 1/6，X=0 的機率是 5/6。則：\n(1) X 的期望值為？　(2) X 的變異數為？　(3) X 的標準差為？","opts":{},"ans":null,"ansText":"(1) E[X]=2/3≈0.667　(2) V(X)=20/9≈2.222　(3) σ≈1.491","expl":"E[X]=4(1/6)+0(5/6)=2/3\nE[X²]=16(1/6)+0=8/3\nV(X)=8/3−(2/3)²=24/9−4/9=20/9≈2.222\nσ=√(20/9)=2√5/3≈1.491。","flag":false,"id":1393},{"src":"甲｜隨堂考題(第四堂課)","ch":"離散型隨機變數計算題","type":"open","num":7,"q":"若 X 與 Y 是獨立的隨機變數，且 Var(X)=3、Var(Y)=20，則：\n(1) Var(2X+3Y)=？　(2) Var(5X−2Y)=？","opts":{},"ans":null,"ansText":"(1) 192　(2) 155","expl":"獨立時 V(aX±bY)=a²V(X)+b²V(Y)，係數要平方、且永遠是「加」。\n(1) 4×3+9×20=12+180=192\n(2) 25×3+4×20=75+80=155\n⚠️ 陷阱：相減時變異數仍相加，不會變小。","flag":false,"id":1394},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":1,"q":"搜集 25 組數據，繪製 X̄–R 管制圖，經計算得 ΣX̄=175.0，ΣR=125（A₂=0.577），則其 UCL_X̄ 為？","opts":{"A":"7.43","B":"9.89","C":"12.91","D":"10.36"},"ans":"B","expl":"UCL_X̄ = X̿ + A₂R̄。X̿=175/25=7、R̄=125/25=5 → 7+0.577×5=7+2.885=9.885≈9.89。陷阱：ΣX̄ 與 ΣR 都要先除以組數 k=25。","flag":false,"id":1395,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":2,"q":"承上題（25 組、ΣX̄=175.0、ΣR=125），若 D₄=2.114，則其 UCL_R 為？","opts":{"A":"0","B":"10.02","C":"11.41","D":"10.57"},"ans":"D","expl":"UCL_R = D₄·R̄ = 2.114×(125/25) = 2.114×5 = 10.57。（n=5 時 D₃=0，故 LCL_R=0。）","flag":false,"id":1396,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":3,"q":"搜集 30 組數據，繪製中位數管制圖，經計算得 ΣX̃=741，ΣR=686（m₃A₂=0.691），則其 UCL_X̃ 為？","opts":{"A":"10.7","B":"40.5","C":"57.8","D":"48.6"},"ans":"B","expl":"UCL_X̃ = X̃̄ + m₃A₂·R̄ = 741/30 + 0.691×(686/30) = 24.7 + 0.691×22.867 = 24.7+15.80 = 40.5。中位數管制圖用 m₃A₂，不是 A₂。","flag":false,"id":1397,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":4,"q":"搜集 25 組數據，繪製 p 管制圖，經計算得 p̄=5%，每組樣本數 n 相等且 n=100，則其 UCL 為？（註：√(0.05×0.95)=0.218）","opts":{"A":"5.61%","B":"8.32%","C":"11.54%","D":"14.98%"},"ans":"C","expl":"UCL_p = p̄ + 3√(p̄(1−p̄)/n) = 0.05 + 3×(0.218/√100) = 0.05 + 3×0.0218 = 0.05+0.0654 = 0.1154 = 11.54%。","flag":false,"id":1398,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":5,"q":"X̄–R 管制圖之管制界限公式內，代表 X̄ 的三個標準差為？","opts":{"A":"A₂σ","B":"A₂R̄","C":"D₄R̄","D":"A₄R̄"},"ans":"B","expl":"UCL_X̄ = X̿ ± A₂R̄，其中 A₂R̄ 就是 3σ_X̄（3 倍平均數的標準誤）。D₄R̄ 是 R 圖用的；A₄R̄ 是中位數圖的另一種寫法。","flag":false,"id":1399,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":6,"q":"計量值管制圖每組樣本數若超過 10 個時，則建議使用？","opts":{"A":"X̄–R","B":"X̄–S","C":"X–Rm","D":"P"},"ans":"B","expl":"n>10 時全距 R 已無法有效代表變異（只用最大最小兩點），改用標準差 S 圖。n≤10 用 X̄–R；n=1 用 X–Rm；P 圖是計數值。","flag":false,"id":1400,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":7,"q":"搜集 50 組數據，繪製 X–Rm 管制圖，經計算得 ΣX=2500、ΣRm=100（E₂=2.66），則其 LCL_X 為？","opts":{"A":"35.1","B":"37.3","C":"43.1","D":"44.7"},"ans":"D","expl":"LCL_X = X̄ − E₂·R̄m。X̄=2500/50=50；移動全距的組數是 k−1=49（本題老師以 50−2+1=49 計）→ R̄m=100/49=2.041 → 50−2.66×2.041=50−5.43=44.57≈44.7。陷阱：Rm 的個數比資料個數少 1。","flag":false,"id":1401,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":8,"q":"某產品之品質特性，已知平均數為 50、標準差為 0.1，若 n=4 時，其 X̄ 管制圖之管制上限應為？","opts":{"A":"50.30","B":"50.15","C":"50.45","D":"50.50"},"ans":"B","expl":"UCL = μ + 3σ/√n = 50 + 3×0.1/√4 = 50+0.15 = 50.15。陷阱：σ 要先除 √n 變成標準誤，直接用 3σ=0.3 會誤選 (A)。","flag":false,"id":1402,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":9,"q":"某不良個數（pn）管制圖，其平均不良率為 0.05，每組樣本大小為 300 個，其管制上限應為？","opts":{"A":"26","B":"27","C":"28","D":"29"},"ans":"A","expl":"UCL_pn = p̄n + 3√(p̄n(1−p̄)) = 15 + 3√(15×0.95) = 15+3×3.775 = 26.32 → 取 26。pn 圖是「個數」，公式裡沒有除以 n。","flag":false,"id":1403,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":10,"q":"若母體中不良率 p 未知，由 m 個樣本求得不良率的平均值 p̄ 時，則不良率管制圖中標準差 σ_p 為？","opts":{"A":"√(np̄(1−p̄))","B":"√(p̄(1−p̄))","C":"√(p̄(1−p̄))/n","D":"√(p̄(1−p̄))/√n"},"ans":"D","expl":"σ_p = √(p̄(1−p̄)/n)，等於 √(p̄(1−p̄)) ÷ √n。(A) 是 pn 圖（個數）的標準差；(C) 分母沒開根號是常見錯選。","flag":false,"id":1404,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":11,"q":"某缺點數（c）管制圖已知其中心線 CL=c̄ 等於 4，則其 UCL_c 為？","opts":{"A":"8","B":"9","C":"10","D":"11"},"ans":"C","expl":"c 圖服從卜瓦松，σ=√c̄。UCL = c̄ + 3√c̄ = 4 + 3×2 = 10。（LCL = 4−6 <0 → 取 0。）","flag":false,"id":1405,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":12,"q":"某工廠製造一批電腦桌，已知每批缺點數之中心線 CL=8.91，則其 UCL_c 為？","opts":{"A":"17.87","B":"16.90","C":"16.22","D":"15.11"},"ans":"A","expl":"⚠️【答案存疑，非缺圖】UCL_c = c̄ + 3√c̄ = 8.91 + 3√8.91 = 8.91 + 3×2.985 = 17.87 → (A)。\n⚠️ 講義上標示的答案是 ②16.90，但依公式計算應為 17.87，疑為講義標記錯誤，上課時可再向老師確認。 ⚠️另有「帶數據表格」版（隨堂考題(第七堂課)｜管制圖）：卷上答案為(B)16.90，係先算c̄=8.91再剔除失控點二次修正。兩種問法答案不同——題目沒附數據表→直接 c̄+3√c̄=17.87；附表→依卷上二次修正法取16.90。","flag":true,"id":1406,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":13,"q":"已知群體平均數為 80 及群體標準差為 6，若每組樣本大小為 4 時，其管制下限為？","opts":{"A":"89","B":"74","C":"71","D":"75.5"},"ans":"C","expl":"LCL = μ − 3σ/√n = 80 − 3×6/√4 = 80 − 9 = 71。","flag":false,"id":1407,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":14,"q":"某工廠估計每日生產 2000 件，平均每日檢驗發現不良品約 150 件，欲建立不良率管制圖，其管制上限應為？","opts":{"A":"0.085","B":"0.093","C":"0.099","D":"0.103"},"ans":"B","expl":"p̄=150/2000=0.075，n=2000。UCL=0.075+3√(0.075×0.925/2000)=0.075+3×0.00589=0.075+0.0177=0.0927≈0.093。","flag":false,"id":1408,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":15,"q":"某生產線每一段時間抽驗一批產品 200 件，共抽驗 10 批，各批不良數依序為 8、2、6、5、3、5、7、6、4、4，試求在 99.73% 信賴水準下，管制圖之上限為何？","opts":{"A":"0.0236","B":"0.0326","C":"0.0470","D":"0.0581"},"ans":"D","expl":"總不良 50 件、總檢驗 2000 件 → p̄=0.025。UCL=0.025+3√(0.025×0.975/200)=0.025+3×0.01104=0.025+0.0331=0.0581。99.73% 信賴水準就是 ±3σ。","flag":false,"id":1409,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":16,"q":"某產品要繪製不良率管制圖，若已知其過去平均不良率為 0.002，每天抽樣 1000 個，則此管制圖的管制上限為？","opts":{"A":"0.7%","B":"0.6%","C":"0.5%","D":"0.4%"},"ans":"B","expl":"UCL=0.002+3√(0.002×0.998/1000)=0.002+3×0.001413=0.002+0.00424=0.00624≈0.6%。","flag":false,"id":1410,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":17,"q":"某製程生產產品之尺寸呈現常態分配，其平均值為 6 公分、標準差為 0.01 公分，若每批樣本大小為 10，則 X̄ 管制圖之 3σ 管制上限為何？","opts":{"A":"6.0095","B":"6.10","C":"6.003","D":"6.0075"},"ans":"A","expl":"UCL = 6 + 3×0.01/√10 = 6 + 3×0.003162 = 6.0095。","flag":false,"id":1411,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":18,"q":"承上題（μ=6、σ=0.01 公分），若要求規格為 5.98～6.02 公分，則製程能力比率 Cr 為何？","opts":{"A":"1.225","B":"1.5","C":"0.667","D":"0.775"},"ans":"B","expl":"Cp=(USL−LSL)/6σ=(6.02−5.98)/(6×0.01)=0.04/0.06=0.667；Cr=1/Cp=1.5。判斷關鍵：Cr 是 Cp 的倒數，Cr 愈小愈好、Cp 愈大愈好。","flag":false,"id":1412,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":19,"q":"不良率管制圖如果有點子超出下限外，是表示？","opts":{"A":"不良率降低","B":"情況變好","C":"不穩定","D":"最理想"},"ans":"C","expl":"只要點子跑出管制界限（不論上或下）都代表製程出現非機遇原因、屬不穩定，必須追查原因。若查出確實是好的改善原因，應把它標準化並重訂管制界限；也可能是檢驗漏失造成的假象。所以不能直接說「變好」。","flag":false,"id":1413,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":20,"q":"某產品規格之平均值為 0.250 英吋，公差為 ±0.001 英吋。若該製程之產出平均值與規格相符，但其標準差為 0.0005 英吋，試求其製程能力指標 Cpk 為何？","opts":{"A":"0.333","B":"0.667","C":"1.333","D":"1.667"},"ans":"B","expl":"Cp=(0.251−0.249)/(6×0.0005)=0.002/0.003=0.667。製程平均與規格中心相符 → Ca=0 → Cpk=Cp×(1−Ca)=0.667。","flag":false,"id":1414,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":21,"q":"某工廠進行燈泡檢驗，以 100 個為一單位，隨機抽取 30 組樣本組，已知其中心線 CL_p=0.059，則其 UCL_p 為？","opts":{"A":"0.1297","B":"0.1251","C":"0.1152","D":"0.1031"},"ans":"A","expl":"⚠️【答案存疑，非缺圖】UCL_p = 0.059 + 3√(0.059×0.941/100) = 0.059 + 3×0.023558 = 0.1297 → (A)。\n⚠️ 講義上標示的答案是 ②0.1251，但依公式計算應為 0.1297，疑為講義標記錯誤，上課時可再確認。","flag":true,"id":1415,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":22,"q":"某產品之上規格界限為 22 cm、下規格界限為 18 cm，其標準差為 0.5，平均值為 21，試求其製程能力指標 Cp 為何？","opts":{"A":"0.333","B":"0.667","C":"1.333","D":"1.667"},"ans":"C","expl":"Cp=(USL−LSL)/6σ=(22−18)/(6×0.5)=4/3=1.333。Cp 只看規格寬度與變異，跟平均值偏不偏無關。","flag":false,"id":1416,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":23,"q":"承上題（USL=22、LSL=18、σ=0.5、X̄=21），試求其製程能力指標 Cpk 為何？","opts":{"A":"0.333","B":"0.667","C":"1.333","D":"1.667"},"ans":"B","expl":"Cpk = min[(USL−X̄)/3σ, (X̄−LSL)/3σ] = min[(22−21)/1.5, (21−18)/1.5] = min[0.667, 2] = 0.667。也可用 Cpk=Cp(1−Ca)=1.333×(1−0.5)=0.667。Cpk 有把「偏移」算進去，所以一定 ≤ Cp。","flag":false,"id":1417,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":24,"q":"承上題（USL=22、LSL=18、σ=0.5、X̄=21），試求其製程能力指標 Ca 為何？","opts":{"A":"0.333","B":"0.500","C":"0.667","D":"1.000"},"ans":"B","expl":"規格中心 μ=(22+18)/2=20，公差 T=4。Ca=|X̄−μ|/(T/2)=|21−20|/2=0.5。Ca 是「準確度」（偏不偏），Cp 是「精密度」（散不散）。","flag":false,"id":1418,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":25,"q":"某元件的尺寸規格上限與下限規範分別為 0.150 cm 與 0.120 cm，生產此元件之製程所生產之平均尺寸為 0.138 cm、標準差為 0.003 cm，則其製程能力指標 Cp 為何？","opts":{"A":"1.667","B":"1.333","C":"2.0","D":"1.0"},"ans":"A","expl":"Cp=(0.150−0.120)/(6×0.003)=0.030/0.018=1.667。題目給的平均值 0.138 是用來算 Cpk/Ca 的誘餌，Cp 用不到。","flag":false,"id":1419,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":26,"q":"p 管制圖樣本愈大時，則管制界線？","opts":{"A":"愈寬","B":"愈窄","C":"愈大","D":"不變"},"ans":"B","expl":"UCL/LCL = p̄ ± 3√(p̄(1−p̄)/n)，n 在分母 → n 愈大，界線與中心線的距離愈小，管制界線愈窄（愈靈敏）。","flag":false,"id":1420,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":27,"q":"下列那一項超出 1 個標準差時（落在 B 區甚或 B 區以外者），則該管制圖即屬不正常型態？","opts":{"A":"三點中有二點","B":"連續三點中有二點","C":"五點中有四點","D":"連續五點中有四點"},"ans":"D","expl":"判讀法則（1σ 判定）：連續 5 點中有 4 點落在 B 區或以外（超出 1σ）→ 異常。注意「連續」兩字是關鍵，少了就不成立。（超出 2σ 的規則是「連續 3 點中有 2 點」。）","flag":false,"id":1421,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":28,"q":"連續三點中有二點超出幾個標準差時，則該管制圖即屬不正常型態？","opts":{"A":"一個","B":"二個","C":"三個","D":"四個"},"ans":"B","expl":"2σ 判定：連續 3 點中有 2 點落在 A 區（超出 2σ）→ 異常。對照記：3 點取 2 → 2σ；5 點取 4 → 1σ。","flag":false,"id":1422,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":29,"q":"下列那一項出現在中心線同一側者，則該管制圖即屬於不正常型態？","opts":{"A":"連續 4 點","B":"連續 8 點","C":"連續 6 點","D":"連續 5 點"},"ans":"B","expl":"「連串（run）」判定：連續 8 點落在中心線同一側 → 異常。另兩個常考數字：連續 6 點持續上升或下降（趨勢）→ 異常。","flag":false,"id":1423,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"管制圖測驗題","type":"single","num":30,"q":"下列何者非常用計量值管制圖之一？","opts":{"A":"X̄–R","B":"X̄–S","C":"X–Rm","D":"P"},"ans":"D","expl":"計量值（量測得到的連續數值）：X̄–R、X̄–S、X–Rm、X̃–R。P 圖是計數值（不良率）管制圖，同類還有 pn、c、u。","flag":false,"id":1424,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":1,"q":"下列哪一種圖形方法與管制圖非常類似？","opts":{"A":"直方圖","B":"時間序列圖","C":"雷達圖","D":"矩陣圖"},"ans":"B","expl":"管制圖本質就是「加上管制界限的時間序列圖」——橫軸是時間/組序，縱軸是品質特性。","flag":false,"id":1425,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":2,"q":"下列何者是應用於腦力激盪中，用來記錄造成某一特定問題之所有可能原因？","opts":{"A":"散布圖","B":"特性要因圖","C":"直方圖","D":"矩陣圖"},"ans":"B","expl":"特性要因圖（魚骨圖／石川圖）用於腦力激盪展開 4M1E 等所有可能原因。","flag":false,"id":1426,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":3,"q":"品管七手法中之魚骨圖是由誰所發明？","opts":{"A":"Shewhart","B":"Deming","C":"Ishikawa","D":"Juran"},"ans":"C","expl":"石川馨（Ishikawa）→ 魚骨圖又稱石川圖。對照記：Shewhart＝管制圖、Deming＝PDCA/十四要點、Juran＝品質三部曲與柏拉圖命名。","flag":false,"id":1427,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":4,"q":"下列何者不適用於分析文字資料？","opts":{"A":"關連圖","B":"魚骨圖","C":"直方圖","D":"流程圖"},"ans":"C","expl":"直方圖處理的是「數值資料」的次數分配；關連圖、魚骨圖、流程圖處理的是語言（文字）資料。","flag":false,"id":1428,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":5,"q":"下列哪一種工具不屬於品管七手法或新七手法之一？","opts":{"A":"柏拉圖","B":"雷達圖","C":"親和圖","D":"魚骨圖"},"ans":"B","expl":"QC7：查檢表、柏拉圖、特性要因圖、直方圖、散布圖、層別法、管制圖。新QC7：親和圖、關連圖、系統（樹狀）圖、矩陣圖、矩陣資料解析、PDPC、箭線圖。雷達圖兩邊都不在。","flag":false,"id":1429,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":6,"q":"用來收集事實、看法和意見，並且將它們組織化的工具是？","opts":{"A":"親和圖","B":"關連圖","C":"柏拉圖","D":"矩陣圖"},"ans":"A","expl":"親和圖（KJ 法）把雜亂的語言資料依「相似性」歸類組織化。關連圖是釐清因果糾纏，兩者常混淆。","flag":false,"id":1430,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":7,"q":"下列哪一項工具可以將問題的重要性加以排序？","opts":{"A":"Affinity diagram","B":"Pareto chart","C":"Fish bone diagram","D":"Histogram"},"ans":"B","expl":"柏拉圖（Pareto chart）依影響大小由大到小排列，找出「重要的少數」（80/20 法則）。","flag":false,"id":1431,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":8,"q":"下列何種方法適合用來將顧客心聲資料整理、分類並鑑定顧客之共同看法？","opts":{"A":"柏拉圖","B":"魚骨圖","C":"關連圖","D":"親和圖"},"ans":"D","expl":"VOC（顧客心聲）屬語言資料，用親和圖分群歸納出共同看法。","flag":false,"id":1432,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":9,"q":"下列何項為描述問題之因果關係的圖形輔助工具，將原因和結果、目的和手段等糾纏在一起的問題明確化，找出適切的解決對策？","opts":{"A":"直方圖","B":"柏拉圖","C":"關聯圖","D":"管制圖"},"ans":"C","expl":"關連圖用於「原因與原因彼此糾纏」的複雜問題，把因果脈絡理清。魚骨圖是單一特性往回展開，關連圖則是多重交錯。","flag":false,"id":1433,"ansText":null},{"src":"甲｜隨堂考題(第四堂課)","ch":"QC7 手法","type":"single","num":10,"q":"為探討問題的癥結所在，按不同機器、不同操作者、不同時間、不同原料等分別觀察而使用的技巧為？","opts":{"A":"特性要因圖","B":"柏拉圖","C":"查檢表","D":"層別法"},"ans":"D","expl":"層別法＝把資料依來源（人、機、料、法、時間、班別）分層再比較，找出差異來源。看到「按不同…分別觀察」就是層別。","flag":false,"id":1434,"ansText":null},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-1】批量與樣本各以什麼符號表示？","opts":{},"ans":null,"ansText":"批量：N；樣本（樣本數）：n","expl":"另外常考：合格判定數 c（Ac）、缺點 d、不良品 D、不良率 p。","flag":false,"num":1,"id":1435},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-2】缺點一般分為那幾種？","opts":{},"ans":null,"ansText":"三種：嚴重缺點、主要缺點、次要缺點","expl":"嚴重缺點＝危害使用者/攜帶者生命或安全；主要缺點＝使用性能不能達到期望目的或顯著減低實用性；次要缺點＝實際上不影響使用目的（如外觀、顏色）。不良品同樣分嚴重/主要/次要三級。","flag":false,"num":2,"id":1436},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-3】抽樣檢驗的方式分為那幾種？","opts":{},"ans":null,"ansText":"四種：(1)不良個數計數抽樣檢驗 (2)缺點數計數抽樣檢驗 (3)標準差σ已知之計量抽樣檢驗 (4)標準差σ未知之計量抽樣檢驗","expl":"計數值兩種（比不良品數/缺點數與 c 或 d）；計量值兩種（σ已知用 x̄ 與合格判定值比較、σ未知用 x̄±ks 與規格比較）。","flag":false,"num":3,"id":1437},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-4】抽樣檢驗的形式分為那幾種？","opts":{},"ans":null,"ansText":"四種：單次抽樣、雙次抽樣、多次抽樣、逐次抽樣","expl":"「形式」依抽樣次數區分。注意與「型式」（規準型/選別型/調整型/連續生產型/逐次型）區別——考題會互相混淆。多次抽樣表中「#」表示第一次樣本不允收該批。","flag":false,"num":4,"id":1438},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-5】就總檢驗費用而言，何種抽樣計畫最少？","opts":{},"ans":null,"ansText":"多次抽樣計畫（總檢驗費用最少；單次最多）","expl":"比較表：總檢驗費用——單次最多、雙次中間、多次最少。注意別跟「行政費用」搞混：行政費用（訓練、記錄、抽樣管理）是單次最少、多次最多。","flag":false,"num":5,"id":1439},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-6】對每批製品品質估計之準確性而言，何種抽樣計畫最好？（有考過）","opts":{},"ans":null,"ansText":"單次抽樣計畫最好（雙次中間、多次最差）","expl":"單次一次抽足樣本，資訊最完整，估計最準。記法：單次「三最」——行政費最少、估計最準、決策最快。","flag":false,"num":6,"id":1440},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-7】對製程平均數估計之決策速度而言，何種抽樣計畫最好？（有考過）","opts":{},"ans":null,"ansText":"單次抽樣計畫最快（雙次較慢、多次最慢）","expl":"單次抽完立即判定，決策最快。三種計畫「對產品品質的保證」則幾乎相同——問保證好壞是陷阱。","flag":false,"num":7,"id":1441},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-8】抽樣檢驗的型式有那些？","opts":{},"ans":null,"ansText":"五種：規準型、選別型、調整型、連續生產型、逐次抽樣型","expl":"代表標準：規準型＝JIS Z9002（計數單次）；選別型＝Dodge-Romig（LTPD 型與 AOQL 型）；調整型＝CNS 2779-1（計數）/CNS 9445-1（計量）；連續生產型＝CSP-1；MIL-STD-1916 含計數、計量及連續抽樣且均為調整型（有考）。","flag":false,"num":8,"id":1442},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-9】適合抽樣檢驗的條件有那些？","opts":{},"ans":null,"ansText":"(1)產量大、批量大且連續生產無法全檢 (2)破壞性試驗 (3)允許某種程度不良品存在 (4)欲減少檢驗時間與經費 (5)刺激生產者注意品質改善 (6)滿足消費者要求","expl":"關鍵字：破壞性試驗「只能」抽樣檢驗。","flag":false,"num":9,"id":1443},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch1 抽樣檢驗基本概念","type":"open","q":"【練習1-10】適合全數檢驗的條件有那些？","opts":{},"ans":null,"ansText":"(1)批量太少，抽驗失去意義 (2)檢驗手續簡單，不費人力時間經費 (3)不允許不良品存在（不良品有致命影響） (4)工程能力不足、不良率超過規定無法保證品質 (5)欲了解該批製品實際品質狀況","expl":"與 1-9 成對比較記憶：批大/破壞性/允許不良→抽樣；批小/手續簡單/不允許不良→全檢。","flag":false,"num":10,"id":1444},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-1】採用下列何種形式的抽樣檢驗計畫，能節省較多的總檢驗費用：","opts":{"A":"單次","B":"雙次","C":"多次","D":"全檢","E":"連續"},"ans":"C","ansText":null,"expl":"總檢驗費用：單次最多、雙次中間、多次最少。別跟「行政費用」（單次最少）混淆。","flag":false,"num":1,"id":1445},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-2】根據 OC 曲線可了解抽樣之特性，試指出下列何者不正確：","opts":{"A":"自不同數量之各批中，按同一比例抽取樣本，能得到相同程度之品質保證。","B":"自不同數量之各批中，抽取一定數量樣本，可得到相當接近的品質保證。","C":"曲線之傾斜度愈大，則抽樣效率愈高。","D":"樣本 n 愈大，OC 曲線之斜度愈大。","E":"不良率很低時，允收機率愈大之抽樣計畫愈佳。"},"ans":"A","ansText":null,"expl":"比例抽檢「不能」得到相同保證（批小 n 小、OC 平緩）；定量抽檢才穩定。口訣：比例不保證，定量才穩定。","flag":false,"num":2,"id":1446},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-3】設 N=10,000，n=50，c=3 之單次抽樣計畫，若批之不良率為 p=0.05 時，則批之允收機率 Pa 為：（需查卜氏分配表）","opts":{"A":"0.736","B":"0.758","C":"0.779","D":"0.795","E":"0.815"},"ans":"B","ansText":null,"expl":"np=50×0.05=2.5，查卜氏累計表 c=3 → Pa≈0.758。","flag":false,"num":3,"id":1447},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-4】AQL 之設定方法一般為：","opts":{"A":"經驗法","B":"損益平衡點法","C":"歸納分類法","D":"以上皆是","E":"以上皆非"},"ans":"D","ansText":null,"expl":"三法皆是：經驗法、損益平衡點法（B.E.P＝檢驗成本/修理成本）、歸納分類法（風險法，最實用、考很多）。","flag":false,"num":4,"id":1448},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-5】下列何者為計數值規準型單次抽樣表：","opts":{"A":"CNS 2779-1","B":"CNS 9445-1","C":"JIS Z9002","D":"JIS Z9003","E":"Dodge & Romig 表"},"ans":"C","ansText":null,"expl":"JIS Z9002＝計數規準型單次。對照：CNS 2779-1 計數調整型、CNS 9445-1 計量調整型、JIS Z9003/9004 計量規準型（σ已知/未知）、Dodge-Romig 選別型。","flag":false,"num":5,"id":1449},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-6】設條件為 N=5,000，AQL=0.02，LTPD=0.06，α=0.05，β=0.10 時，其單次計數抽樣計畫之 n，c 分別為：（需查 JIS Z9002 表；原書誤印 LTPO）","opts":{"A":"25，0","B":"100，3","C":"120，4","D":"150，6","E":"250，10"},"ans":"D","ansText":null,"expl":"p₀=2%（1.81~2.24 列）、p₁=6%（5.61~7.10 欄）→ 查得 150 6。給 p₀+p₁ 就是規準型查 JIS Z9002。","flag":false,"num":6,"id":1450},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-7】某公司擬採用規準型抽樣計畫作進料管制，並規定批量 N=3,000，p₀=1%，p₁=2.5%，則其抽樣計畫之 n，c 分別為：（需查表）","opts":{"A":"300，6","B":"500，10","C":"616，10","D":"712，6","E":"770，10"},"ans":"C","ansText":null,"expl":"查 JIS Z9002 本表交點為＊→ 用輔助表：p₁/p₀=2.5（落 2.7~2.3）→ c=10，n=308/1+770/2.5=308+308=616。","flag":false,"num":7,"id":1451},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-8】選別型抽樣計畫提供下列那兩種品質保證：","opts":{"A":"保證平均出廠品質及在 AQL 時批之允收機率為 95%。","B":"保證平均出廠品質 (AOQ) 及平均出廠品質界限 (AOQL)。","C":"保證不良率在 LTPD 以上的送驗批之允收機率在 10% 以下，及送驗批的不良率在平均出廠品質界限 (AOQL) 值以下。","D":"保證平均檢驗總件數 (ATI) 最少及平均出廠品質。","E":"保證不良率在 LTPD 以上的送驗批之允收機率在 10% 以下，及平均檢驗總件數 (ATI) 最少。"},"ans":"C","ansText":null,"expl":"兩種保證：①單批——LTPD 以上的批允收機率壓在 10% 以下；②長期平均——出廠不良率不超過 AOQL。","flag":false,"num":8,"id":1452},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-9】設 N=2,000，LTPD=5%，β=10%，製程平均不良率 p̄=2%，則平均總檢驗件數最少之單次計數抽樣計畫之 n，c 分別為：（需查 Dodge & Romig LTPD 型表）","opts":{"A":"45，0","B":"75，1","C":"105，2","D":"230，7","E":"280，9"},"ans":"D","ansText":null,"expl":"給 LTPD＋p̄ → 查 Dodge-Romig SL-5.0% 表，依 N 與 p̄ 範圍查得 n=230、c=7（ATI 最小設計）。","flag":false,"num":9,"id":1453},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch7 綜合測驗","type":"single","q":"【7-10】設 N=3,000，AOQL=1%，製程平均不良率 p̄=0.5%，則平均總檢驗件數為最少之雙次抽樣計畫之 n₁，c₁，n₂，c₂ 分別為：（需查 Dodge & Romig AOQL 型雙次表）","opts":{"A":"65，0，80，2","B":"80，0，165，4 ̄>0.44% 拒收。","expl":"希望平均值低（m₀=0.3<m₁=0.6）→ 算 (m₁−m₀)/σ=(0.6−0.3)/0.15=2 → 查表3.1 得 n=3、G₀=0.950 → 允收上限 X̄ᵤ=m₀+G₀σ。判斷關鍵：保證『平均值』從 m₀ 出發往外推 ±G₀σ。","flag":false,"num":1,"id":1487},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.2】採購不鏽鋼皮，厚度規格下限 0.5mm；不足 0.5mm 的比率在 1% 以下判合格、6% 以上判不合格。σ=0.02mm、α=5%、β=10%，求計量值抽樣計畫（JIS Z9003 保證批不良率）。","opts":{},"ans":null,"ansText":"查表3.3 得 n=14、k=1.88；X̄ʟ=0.5+1.88×0.02=0.5376≒0.54mm。抽 14 個，x̄≥0.54mm 允收。","expl":"p₀=1%、p₁=6% 查表3.3（格子左下=n、右上=k）。下限規格 → X̄ʟ=Sʟ+kσ（往規格內加）。陷阱：保證『不良率』從規格界限出發往內縮，與保證平均值方向相反。","flag":false,"num":2,"id":1488},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.3】採購零件，平均長度 10±0.05mm 判合格、10±0.07mm 判不合格。σ=0.02mm、α=5%、β=10%，求計量值抽樣計畫（Z9003 雙邊・保證平均值）。","opts":{},"ans":null,"ansText":"n=9、G₀=0.548；允收區間 9.94mm ≤ x̄ ≤ 10.06mm。","expl":"mᵤ₀=10.05、mʟ₀=9.95、mᵤ₁=10.07、mʟ₁=9.93，|mᵤ₁−mᵤ₀|=|mʟ₁−mʟ₀| ✓。(mᵤ₁−mᵤ₀)/σ=1.00 → 表3.1 得 n=9、G₀=0.548。檢核 (mᵤ₀−mʟ₀)/(σ/√n)=(0.1)/(0.02/3)=15>1.7 → 可用。X̄ᵤ=10.05+0.548×0.02=10.06、X̄ʟ=9.95−0.548×0.02=9.94。","flag":false,"num":3,"id":1489},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.4】採購鋼珠，直徑規格 6±0.05mm；不合格品比率 1% 允收、6% 拒收。σ=0.01mm、α=5%、β=10%，求計量值抽樣計畫（Z9003 雙邊・保證不良率）。","opts":{},"ans":null,"ansText":"n=14、k=1.88；允收區間 5.97mm ≤ x̄ ≤ 6.03mm。","expl":"先做可行性檢核：(Sᵤ−Sʟ)/σ=(6.05−5.95)/0.01=10 > 表3.2 查值 6.4（p₀=1%）→ 可行。查表3.3 得 n=14、k=1.88 → X̄ᵤ=6.05−0.0188=6.03、X̄ʟ=5.95+0.0188=5.97。","flag":false,"num":4,"id":1490},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.5】同例3.2（Sʟ=0.5mm、p₀=1%、σ=0.02mm），但改為 2.5% 以上判不合格。查表3.3 為＊，求抽樣計畫。","opts":{},"ans":null,"ansText":"用公式：Kp₀=2.326、Kp₁=1.960 → n=(2.9264/(2.326−1.96))²≒64、k=0.562073×1.96+0.437927×2.326=2.12；X̄ʟ=0.5+2.12×0.02=0.5424mm，抽 64 個，x̄≥0.5424mm 允收。","expl":"表中＊＝查不到 → 改用表下公式。Kp 由輔助表查（1%→2.326、2.5%→1.960）。觀察：p₁ 從 6% 縮到 2.5%，n 從 14 暴增到 64——鑑別要求越嚴樣本越大。","flag":false,"num":5,"id":1491},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.6】採購 1,000 張不鏽鋼皮，厚度規格下限 0.5mm，p₀=1%、p₁=8%、α=5%、β=10%，σ 未知，求計量值抽樣計畫（JIS Z9004）。","opts":{},"ans":null,"ansText":"查表3.4 得 n=28、k=1.83。抽 28 張求 x̄ 與 s：x̄−1.83s ≥ 0.5mm 允收；否則拒收。","expl":"σ 未知 → JIS Z9004（表3.4）。判定式用 x̄−ks 與下限比（上限規格則 x̄+ks≤Sᵤ）。同樣 p₀/p₁ 下 Z9004 的 n 比 Z9003 大很多（σ 要用 s 估計）。","flag":false,"num":6,"id":1492},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.7】承例3.6，下次採購調整 p₁=3%（p₀=1% 不變），表3.4 交叉點為空格，求抽樣計畫。","opts":{},"ans":null,"ansText":"查輔助表：Kp₀=2.327、Kp₁=1.881、K_α=1.645、K_β=1.282 → k=(Kp₀K_β+Kp₁K_α)/(K_α+K_β)=2.08、n=(1+k²/2)((K_α+K_β)/(Kp₀−Kp₁))²=137。x̄−2.08s ≥ 0.5mm 允收。","expl":"p₁=3% 不在表上（2.81~3.55 之間）→ 空格用公式。Kp(3%) 可由輔助表 2.5%→1.96、3.15%→1.86 線性插值 ≈1.88。","flag":false,"num":7,"id":1493},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.8】設備最高操作溫度規定 60℃（規格上限），常態分配，批量 100，σ 未知，一般檢驗水準 II，AQL=2.5% 正常檢驗（CNS 9445-1 s-法）。查表得代字 F、n=13、k=1.426。量測值：53,57,49,58,59,54,58,56,50,50,55,54,57（℃），判定允收與否。","opts":{},"ans":null,"ansText":"x̄=54.62、s=3.330 → Qᵤ=(60−54.62)/3.330=1.617 ≥ k=1.426 → 允收。","expl":"單邊上限 → Qᵤ=(U−x̄)/s，Qᵤ≥k 允收。fx-350MS：SD 模式輸入 13 筆 → 取 x̄ 與 xσn−1(=s) 直接代入。","flag":false,"num":8,"id":1494},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.9】火工品延遲裝置最短延遲時間 4.0 秒（規格下限），σ 未知，批量 1,000，II 級正常檢驗，AQL=0.1%（CNS 9445-1 s-法）。查表 B.1 代字 J 遇↓箭頭，如何處理？28 個樣本 x̄=6.551、s=0.3251，判定允收與否。","opts":{},"ans":null,"ansText":"↓箭頭 → 改用箭頭所指的代字 K：n=28、k=2.580。Q_L=(6.551−4.0)/0.3251=7.847 ≥ 2.580 → 允收。","expl":"查表遇箭頭 → 依箭頭改用該計畫，代字與 n 跟著變（與 CNS 2779-1 同規則）。下限用 Q_L=(x̄−L)/s。","flag":false,"num":9,"id":1495},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例・魚雷】100 枚魚雷做水平面準確度檢驗，1km 處目標兩側偏離 10m 為規格界限（U=+10、L=−10），AQL=4%，破壞性且昂貴→特殊檢驗水準 S-2，代字 B、n=3（s-法雙邊合併管制）。試驗誤差 −5.0、6.7、8.8（m），判定允收與否。","opts":{},"ans":null,"ansText":"x̄=3.5、s=7.436；fs=0.475 → MSSD=smax=20×0.475=9.50，s=7.436<9.50 過第一關。Qᵤ=0.8741、Q_L=1.815 → √3Q/2=0.757/1.572 → 查表 F.1 得 p̂ᵤ=0.2267、p̂ʟ=0 → p̂=0.2267 > p*=0.1925 → 不允收。","expl":"兩段式：①s 與 MSSD=(U−L)fs 比，s>smax 直接拒收；②p̂=p̂ᵤ+p̂ʟ 與 p*（表 G.1）比。重要觀念：樣本 3 個全在規格內，該批仍不允收。","flag":false,"num":10,"id":1496},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.10】批量 25，直徑規格 L=82mm、U=84mm（合併管制），II 級正常檢驗，AQL=2.5%，代字 C、n=4（s-法）。測得 82.4、82.2、83.1、82.3mm，判定允收與否。","opts":{},"ans":null,"ansText":"x̄=82.50、s=0.4082；fs=0.365 → smax=(84−82)×0.365=0.730 > s 過第一關。Qᵤ=3.675≥1.5→p̂ᵤ=0；Q_L=1.2249 → p̂ʟ=0.5−1.2249/3=0.0917 → p̂=0.0917 > p*=0.0860 → 不允收。","expl":"n=4 用公式 p̂=0.5−Q/3（−1.5<Q<1.5；Q≥1.5 → 0；Q≤−1.5 → 1）。又是『樣本全在規格內仍拒收』。","flag":false,"num":11,"id":1497},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.11】設備操作溫度 L=60℃、U=70℃，批量 80，II 級正常檢驗，AQL=1.5%，代字 E、n=13、fs=0.274（s-法雙邊合併管制）。13 個量測值算得 x̄=64.223、s=2.7899，判定允收與否。若 AQL 改 2.5%（fs=0.285）呢？","opts":{},"ans":null,"ansText":"MSSD=smax=(70−60)×0.274=2.74；s=2.79 > 2.74 → 第一關就不允收。AQL=2.5% 時 smax=2.85>s，過第一關，但描點 (s,x̄) 落允收曲線外側 → 仍不允收。","expl":"n>4 的雙邊合併管制第二關用允收曲線圖（圖表 s-D~s-R）描點：(s/(U−L), (x̄−L)/(U−L))=(0.279, 0.422)。","flag":false,"num":12,"id":1498},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.12】鋼鑄件最低屈服點 L=400 N/mm²，批量 500，II 級正常檢驗，AQL=0.65%，σ 已知=21 N/mm²（σ-法）。代字 H、n=11、k=2.046。11 個樣本 Σx=4,713，判定允收與否。","opts":{},"ans":null,"ansText":"允收值 X̄ʟ=L+kσ=400+2.046×21=442.97；x̄=4713/11=428.5 < 442.97 → 不允收。","expl":"σ-法單邊：抽樣前即可算好允收值 X̄ʟ=L+kσ（上限則 X̄ᵤ=U−kσ），x̄ 直接比大小。等價於 Q_L=(x̄−L)/σ≥k。","flag":false,"num":13,"id":1499},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.13】電子元件電阻規格 (520±50)Ω，批量 1,000，II 級正常檢驗，AQL=1.5%，σ 已知=18.5Ω（σ-法雙邊合併管制）。f_σ=0.194，代字 J、n=19、k=1.677。19 個樣本 Σx=9,653，判定允收與否。","opts":{},"ans":null,"ansText":"第一關：MPSD=σmax=(570−470)×0.194=19.4，σ=18.5<19.4 → 續。第二關：X̄ᵤ=570−1.677×18.5=538.9、X̄ʟ=470+31.0=501.1；x̄=9653/19=508.0 落在 501.1~538.9 內 → 允收。","expl":"σ-法雙邊：①σ 與 MPSD=(U−L)f_σ 比（σ>σmax 抽驗無意義）；②X̄ʟ≤x̄≤X̄ᵤ 允收。備考：若 σ 已知為 20 則超過 19.4，不能抽驗。","flag":false,"num":14,"id":1500},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣例題","type":"open","q":"【例3.14】電器產品常態分配，批量 100，單邊規格下限 620Ω，AQL=0.65%，試決定計量值與計數值混合抽樣計畫。11 個樣本 Σx=7,095、SS=3,323，說明判定程序。（課本紅筆：解法必考）","opts":{},"ans":null,"ansText":"9445-1（正常、II 級）：代字 F、n=11、k=1.889；2779-1（加嚴、II 級）：代字 F→n=32、Ac=0、Re=1。x̄=645、s=√(3323/10)=18.23 → Q_L=(645−620)/18.23=1.371 < 1.889 → 不能直接允收 → 補抽 21 個（32−11），32 個中 0 不良允收、≥1 不良拒收。","expl":"混合抽樣：計量段（正常）先判，不過再轉計數段（加嚴、0收1退）。若第一樣本已有不良品直接拒收。目的：避免經 100% 剔選的批被計量值拒收、難以服眾。","flag":false,"num":15,"id":1501},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-1】某產品抗拉強度愈大愈好，平均數在 20,500 psi 以上儘可能允收、19,500 psi 以下儘量拒收。σ=1,000 psi、α=5%、β=10%，求抽樣計畫。","opts":{},"ans":null,"ansText":"|m₀−m₁|/σ=(20500−19500)/1000=1.00 → 查表3.1 得 n=9、G₀=0.548 → 希望平均值高：X̄ʟ=m₀−G₀σ=20500−548=19,952 psi。抽 9 個，x̄≥19,952 psi 允收。","expl":"Z9003 保證批平均值（單邊、希望高）。與例3.3 同一格（比值 1.00 → n=9、G₀=0.548）。","flag":false,"num":1,"id":1502},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-2】抗拉強度規格下限 20,000 psi，低於下限比例 ≤0.5% 允收、≥2% 拒收。σ=1,000 psi、α=5%、β=10%，求抽樣計畫。","opts":{},"ans":null,"ansText":"公式解：Kp₀(0.5%)=2.576、Kp₁(2%)=2.054 → n=(2.9264/0.522)²≒32、k=0.562073×2.054+0.437927×2.576≒2.28 → X̄ʟ=20000+2.28×1000=22,280 psi，x̄≥22,280 允收。（若表3.3 該格有值，以查表為準）","expl":"Z9003 保證批不良率（下限）。表3.3 若查得到直接讀 n、k；此處以公式示範。","flag":true,"num":2,"id":1503},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-3】機器裝罐一磅奶粉，σ=0.02 磅，規格 U=1.08、L=0.92，p₀=1%、p₁=6%、α=5%、β=10%，求抽樣計畫。","opts":{},"ans":null,"ansText":"檢核 (U−L)/σ=(1.08−0.92)/0.02=8 > 6.4（表3.2，p₀=1%）→ 可行。查表3.3 得 n=14、k=1.88 → X̄ᵤ=1.08−0.0376=1.0424 磅、X̄ʟ=0.92+0.0376=0.9576 磅；0.9576≤x̄≤1.0424 允收。","expl":"Z9003 雙邊保證不良率，(p₀,p₁)=(1%,6%) 與例3.2/3.4 同一格。","flag":false,"num":3,"id":1504},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-4】厚度規格下限 2.5mm，未達 2.5mm 比例 ≤0.5% 合格、≥8% 不合格，常態分配（σ 未知），α=5%、β=10%，求抽樣計畫。","opts":{},"ans":null,"ansText":"σ 未知 → Z9004。公式解：Kp₀=2.576、Kp₁=1.405、K_α=1.645、K_β=1.282 → k=(2.576×1.282+1.405×1.645)/2.927≒1.92、n=(1+k²/2)×(2.927/1.171)²≒18 → x̄−1.92s ≥ 2.5mm 允收。（表3.4 有值則以查表為準）","expl":"題目沒給 σ 值＝σ 未知 → 走 Z9004（x̄−ks 判定）。","flag":true,"num":4,"id":1505},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-5】查 CNS 9445-1（s 法、形式 k）求下列單次抽樣計畫的 n 與 k：(1) N=500、AQL=1.0%、II 級、正常 (2) N=400、AQL=0.65%、I 級、加嚴 (3) N=600、AQL=1.0%、III 級、減量。","opts":{},"ans":null,"ansText":"解題流程：批量＋檢驗水準 → 表 A.1 查代字（N=500、II 級 → 代字 H）→ 代字×AQL 查 s 法主表：正常查表 B.1、加嚴查 B.2、減量查 B.3 → 讀出 n、k（遇箭頭依箭頭改計畫）。","expl":"純查表題（附表六 P374~395）。考場記住：正常/加嚴/減量分別對應 B.1/B.2/B.3；σ 法為 C.1/C.2/C.3。","flag":true,"num":5,"id":1506},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-6】硬度規定 HRC 25~30（雙邊合併管制），批量 25，I 級檢驗水準、正常檢驗、AQL=4.0，查 CNS 9445-1 需 3 個樣本。觀測 HRC 25、27、29，此批可否允收？","opts":{},"ans":null,"ansText":"x̄=27、s=2。fs=0.475 → MSSD=smax=(30−25)×0.475=2.375，s=2<2.375 過第一關。Qᵤ=(30−27)/2=1.5、Q_L=(27−25)/2=1.0。n=3 用式[4]：Qᵤ√3/2=1.299>1 → p̂ᵤ=0；Q_L√3/2=0.866 → p̂ʟ=(2/π)arcsin(√((1−0.866)/2))=0.1667。p̂=0.1667 ≤ p*=0.1925 → 允收。","expl":"s 法 n=3 是特殊程序（代字 B、正常、AQL 4% 恰為課本規定 n=3 的情況之一，與魚雷例同一組 fs、p*）。","flag":false,"num":6,"id":1507},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-7】包裝重量最低 40 克（規格下限），常態分配，批量 300，II 級正常檢驗，AQL=1.0%，查 CNS 9445-1 求 n 與 k。","opts":{},"ans":null,"ansText":"流程：N=300＋II 級 → 表 A.1 查代字 → 代字×AQL=1.0% 查表 B.1（正常）得 n、k → 判定 Q_L=(x̄−L)/s ≥ k 允收。","expl":"查表題；參考批量對照：N=100→F、N=500→H、N=1000→J。","flag":true,"num":7,"id":1508},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-8】包裝重量規格 45±5 克（上下限同一 AQL=1.5%），常態，批量 300，II 級正常檢驗，求 MSSD。","opts":{},"ans":null,"ansText":"MSSD=smax=(U−L)×fs=(50−40)×fs=10×fs；fs 由代字（樣本大小）與 AQL=1.5% 查表 D.1（正常，P381）。樣本標準差 s>smax 時不必計算直接不允收。","expl":"MSSD 只在『雙邊合併管制＋s 法』使用；fs 依代字與 AQL 而變（例3.11：n=13、AQL1.5% 時 fs=0.274）。","flag":true,"num":8,"id":1509},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-9】電阻規格上限 40、下限 20，批量 800，II 級水準，AQL=1.0%，求 MSSD。","opts":{},"ans":null,"ansText":"MSSD=smax=(U−L)×fs=(40−20)×fs=20×fs；fs 由代字（N=800、II 級查表 A.1）與 AQL=1.0% 查表 D.1。","expl":"同 3-8，練查表流程。","flag":true,"num":9,"id":1510},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-10】設備最低操作溫度 30℃（規格下限），常態，N=50，I 級水準、正常檢驗，AQL=2.5%，求 n 與 k。","opts":{},"ans":null,"ansText":"流程：N=50＋I 級 → 表 A.1 查代字 → ×AQL=2.5% 查表 B.1 得 n、k。由 3-11 可知本題 n=4。","expl":"查表題（k 值需表 B.1）。","flag":true,"num":10,"id":1511},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-11】承 3-10，抽檢 4 個數據 31、33、35、37（℃），該批是否允收？","opts":{},"ans":null,"ansText":"x̄=34、s=√(20/3)=2.582 → Q_L=(34−30)/2.582=1.549，與表 B.1 查得之 k 比較：Q_L≥k 允收、Q_L<k 拒收。","expl":"單邊下限 s 法：Q_L=(x̄−L)/s。SS=(−3)²+(−1)²+1²+3²=20、V=20/3。","flag":true,"num":11,"id":1512},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch3 計量值抽樣練習題","type":"open","q":"【練習3-12】產品常態分配，每批 500 件，AQL=1.0%，試決定計量值與計數值混合抽樣計畫。","opts":{},"ans":null,"ansText":"仿例3.14：①查 CNS 9445-1（正常、II 級）：N=500 → 代字 H，讀 n₁、k；②查 CNS 2779-1（加嚴、II 級）得 n₂、Ac、Re；③先抽 n₁ 個算 Q_L（或 Qᵤ）≥k 允收；否則補抽 n₂−n₁ 個，依計數值加嚴判定。第一樣本已有不良品直接拒收。","expl":"混合抽樣固定搭配：計量段正常＋計數段加嚴。","flag":true,"num":12,"id":1513},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch4 MIL-STD-1916","type":"open","q":"【演練】MIL-STD-1916 計數值抽樣（VL-IV、正常檢驗）：第 1 批（N=5,000）拒收、第 2 批允收、第 3 批（N=3,000）又拒收。問：(1) 第 4 批起如何檢驗？樣本大小怎麼查？(2) 之後如何回到正常？(3) 何時可轉減量？減量中 1 批拒收怎麼辦？","opts":{},"ans":null,"ansText":"(1) 最近 2~5 批中有 2 批拒收 → 第 4 批轉加嚴；樣本大小改查表 II 中 VL-IV『左隔欄』（V 欄）。(2) 原因已矯正且連續 5 批允收 → 回正常（回 IV 欄）。(3) 連續 10 批允收＋生產穩定＋品質系統滿意＋顧客同意 → 減量（查 IV『右隔欄』III 欄）；減量中有 1 批拒收 → 下一批回正常。","expl":"課本表 4.1 的 20 批演練：批 3 後轉加嚴（N=1000 代字 B 加嚴 n=256）、批 9 回正常、批 19 減量（N=8000 代字 E 減量 n=80）、批 20 拒收回正常。0 收 1 退：不合格數 ≥1 即拒收。","flag":false,"num":1,"id":1514},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch4 MIL-STD-1916","type":"open","q":"【演練】MIL-STD-1916 計量值抽樣（K 法・單邊）：操作溫度規定最多 209℉，VL-I 級，批量 N=200，查表 I、III 得 n=5。觀測值 197、188、184、205、201，此批是否允收？","opts":{},"ans":null,"ansText":"ΣX=975、CF=(975)²/5=190,125、SS=190,435−190,125=310、V=77.5、s=8.80、x̄=195 → 品質指數 (U−x̄)/s=(209−195)/8.8=1.59 ≥ k=1.33（表 III）→ 允收。","expl":"N=200、VL-I → 表 I 代字 B → 表 III：n=5、k=1.33。單邊 K 法：|x̄−規格界限|/s ≥ k 允收。","flag":false,"num":2,"id":1515},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch4 MIL-STD-1916","type":"open","q":"【演練】MIL-STD-1916 計量值抽樣（K 法＋F 法・雙邊）：規格上限 209℉、下限 180℉，VL-I、N=200、n=5，觀測值同上（x̄=195、s=8.80），此批是否允收？","opts":{},"ans":null,"ansText":"
