小之檢驗中無任何不合格件）。","expl":"加嚴→正常是『全部條件』邏輯；對照正常→加嚴（2~5 批中 2 批拒收）是『任一條件』。","flag":false,"num":9,"id":1522},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch4 MIL-STD-1916","type":"open","q":"【練習4-7】計數值抽樣計畫 N=5,000、na=80、Ac=0、Re=1，希望允收機率 80%，求產品不良率。","opts":{},"ans":null,"ansText":"Pa=e^(−np)=0.8 → np=ln(1/0.8)=0.223 → p=0.223/80=0.00279≒0.28%。","expl":"反查：np=−ln(Pa)。fx-350MS：1 ÷ 0.8 = → ln → ÷ 80 = 。","flag":false,"num":10,"id":1523},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-1】實施抽樣檢驗時應考慮那些因素？","opts":{},"ans":null,"ansText":"四因素：①正確的檢驗方法（有國家標準採國家標準、量規儀器須校正）②適當的品質基準（跨部門在品管委員會商定，非必要不宜提高）③合理的抽樣計畫（檢討 n、費時、批量，必要時查 OC 曲線）④正確的抽樣方式（代表性樣品，不可只抽表面）。","expl":"","flag":false,"num":1,"id":1524},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-2】屬於常態分配之產品應採用何種抽樣計畫較好？","opts":{},"ans":null,"ansText":"計量值抽樣計畫。理由：判斷力較高、相同保護水準下樣本數少得多、可回饋改進製程、適合破壞性或昂貴檢驗。","expl":"","flag":false,"num":2,"id":1525},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-3】何謂隨機抽樣？","opts":{},"ans":null,"ansText":"抽樣方法不偏於群體的任何部份，不論其外觀與位置如何，每一單位均具有同樣被抽為樣本之機率。","expl":"受意識左右（挑好的或挑壞的）之抽樣不適當。","flag":false,"num":3,"id":1526},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-4】隨機抽樣的原則有那些？","opts":{},"ans":null,"ansText":"四原則：①不可讓從事製品之生產者抽樣 ②實施抽樣時必會同責任者在場 ③使抽樣有關人員徹底明瞭抽樣之目的與重要性 ④抽樣應在送驗批移動中為之、避免靜止時為之。","expl":"第 6 章最常考。靜止的煤堆、已裝船礦石抽不到代表性樣本，只能在移動中抽。","flag":false,"num":4,"id":1527},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-5】隨機抽樣之方法有那些？","opts":{},"ans":null,"ansText":"①單純隨機抽樣（亂數表、抽樣球）②分層隨機抽樣 ③系統抽樣（每隔 1/a 個抽一個；a=n/N 抽樣比）④曲折抽樣（避免系統抽樣與品質變化週期同步的偏差）。","expl":"系統抽樣若抽樣間隔與特性變化週期相同會發生偏差 → 改間隔或改曲折抽樣。","flag":false,"num":5,"id":1528},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-6】試簡述抽樣方法有那些？","opts":{},"ans":null,"ansText":"①分層抽樣法（層內變異小、層間變異大時有利，每層都抽）②區域抽樣法（區域內變異大、區域間變異小；抽中的區域全數檢驗）③分段抽樣法（先抽箱再抽件；兩段/多段）④反覆抽樣法（同一群體抽一次以上；雙次/多次/逐次即其應用）。","expl":"分層與區域的變異方向恰好相反，是最愛考的對比。","flag":false,"num":6,"id":1529},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-7】集合體有那些類別？","opts":{},"ans":null,"ansText":"四類：①流體（氣體及液體）②泥狀體（紙漿、有機化合物反應中間物）③連續體（電線、紙、鋼絲、紗）④塊粉混合物（煤、礦石）。","expl":"","flag":false,"num":7,"id":1530},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-8】氣體之抽樣可分為那幾種？","opts":{},"ans":null,"ansText":"①移動氣體：品質隨時間變化快，宜用貯氣槽/輸送管把小波變化變成緩慢大波後抽樣；抽樣管插入管中央、高溫用水冷式管。②停止氣體（含半停止氣）：容器內已充分混合、任何部份均可抽，但要先調查混合狀態；瓶中液化氣體應自液化部份抽樣。","expl":"液化氣體自『液化部份』抽（氣化部份偏含易揮發成份）是常考點。","flag":false,"num":8,"id":1531},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-9】試簡述液體之抽樣方法有那些？","opts":{},"ans":null,"ansText":"平均樣本、全層樣本、上部/中部/下部樣本、混合樣本（同槽/多槽）、頂部樣本（液面 6 吋，查液面特性）、出口樣本（檢出水份異物）、連續樣本（按流量比例）、柄杓樣本、攪拌樣本、容器樣本、排出樣本、底部樣本（查泥質塵埃水分）、穿孔樣本（軟固體）等。","expl":"全層樣本≠平均樣本（容器斷面積與取出速度不一定相同）。","flag":false,"num":9,"id":1532},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-10】泥狀體有那些特徵？","opts":{},"ans":null,"ansText":"①液/固含量不同時品質大有變化 ②液體含量隨場所時間有大波變動 ③抽樣工具需特別設計 ④抽樣後液體易被擠出而生偏差 ⑤分樣時誤差相當大。","expl":"每次取量宜加大，使液體擠出作用對品質無顯著影響。","flag":false,"num":10,"id":1533},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-11】泥狀體之抽樣方法有那些？","opts":{},"ans":null,"ansText":"用抽樣卡（約 100 張、依卡片位置抽）配合：①隨機抽樣（卡片劃區、亂數選區）②分層抽樣（層間變異大時分層，各層抽同量或按比例）③分段抽樣（各層中隨機選層再選小區域）④區域抽樣（層間變異小時隨機選一層全查）。","expl":"有經驗者能看出液體含量多寡，易生主觀偏差，故用抽樣卡避免。","flag":false,"num":11,"id":1534},{"src":"乙｜抽樣檢驗(教科書)","ch":"Ch6 抽樣技術練習題","type":"open","q":"【練習6-12】粉塊混合物取樣有那些原則？","opts":{},"ans":null,"ansText":"①原則上移動中抽樣（堆放者抽不到代表樣本；堆三尺以上表面樣本稱 Top Sample）②就全批隔一定間隔抽樣 ③自時間或場地最近者抽取 ④批量甚大時分數個小批各作一大樣 ⑤特別大塊先篩析分開抽或打碎後抽 ⑥樣本放適當容器、注意保存地點 ⑦水份測定用樣本另抽一份相同量 ⑧最好使用自動抽樣。","expl":"取量（容量）應在最大粒子的 100 倍以上、至少 10 倍。變異相加性：σx²=σS²+σR²+σM²（σS 通常最大）。","flag":false,"num":12,"id":1535},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"「重要的少數，瑣細的多數（Vital Few, Trivial Many）」一詞，是誰將柏拉法則應用到品質管理上而提出？","opts":{"A":"柏拉圖（Pareto）","B":"朱蘭（Juran）","C":"石川馨","D":"舒華特（Shewhart）"},"ans":"B","ansText":null,"expl":"80/20（柏拉法則）是 Pareto 1897 年研究財富分配所發現；把它「應用到品管」並命名「柏拉圖原理」的是美國品管專家朱蘭。陷阱：問「誰應用到品管」→朱蘭，不是柏拉圖本人。","flag":false,"num":1,"id":1536},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"1897 年研究社會經濟結構，發現「絕大多數財富掌握在極少數人手裡」（柏拉法則）的學者是？","opts":{"A":"朱蘭（Juran）","B":"石川馨","C":"柏拉圖（Pareto）","D":"費根堡（Feigenbaum）"},"ans":"C","ansText":null,"expl":"義大利學者柏拉圖（Vilfredo Pareto）1897 年分析財富分配發現 80/20 現象，稱柏拉法則。","flag":false,"num":2,"id":1537},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"品管七手法口訣中，「顯分布」與「看相關」分別對應哪兩個手法？","opts":{"A":"直方圖、散佈圖","B":"散佈圖、直方圖","C":"層別法、管制圖","D":"查檢表、柏拉圖"},"ans":"A","ansText":null,"expl":"口訣：層別作解析、查檢集數據、柏拉抓重點、魚骨追原因、直方顯分布、散布看相關、管制找異常。","flag":false,"num":3,"id":1538},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"收集數據的目的中，針對「突發性」異常，根據變異判斷製程、去除異常以恢復正常（維持現狀），屬於？","opts":{"A":"製程調節","B":"製程管理","C":"製程改善與解析","D":"檢查"},"ans":"B","ansText":null,"expl":"判斷關鍵：突發→製程「管理」（維持現狀）；慢性→製程「改善與解析」（追真因、標準化）。","flag":false,"num":4,"id":1539},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"針對「慢性」不良問題，根據事實追求真因、採取對策並建立標準化，屬於收集數據目的中的？","opts":{"A":"製程管理","B":"製程調節","C":"製程改善與解析","D":"報告用"},"ans":"C","ansText":null,"expl":"慢性問題→製程改善與解析；突發異常→製程管理。成對記。","flag":false,"num":5,"id":1540},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"收集數據以 5W1H 明確化時，「為何要做（目的＝管理項目）」對應哪一個 W／H？","opts":{"A":"WHAT","B":"WHY","C":"HOW","D":"WHO"},"ans":"B","ansText":null,"expl":"WHAT＝做什麼事（主題）；WHY＝為何要做（目的＝管理項目）；WHERE＝地點工程；WHEN＝期間；WHO＝誰做；HOW＝如何做（量測具、樣本）。","flag":false,"num":6,"id":1541},{"src":"甲｜第七堂-QC七手法","ch":"1 總覽與收集數據","type":"single","q":"QC Story 改善步驟中，「要因分析（解析）」階段最特別適用（◎）的手法是？","opts":{"A":"柏拉圖","B":"查檢表","C":"特性要因圖","D":"推移圖"},"ans":"C","ansText":null,"expl":"要因分析＝魚骨圖的主場（另直方圖、散佈圖、管制圖也適用）。記法：選題靠柏拉、找因靠魚骨、收數靠查檢。","flag":false,"num":7,"id":1542},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"「白天和晚上的加工製品數據」「夏天和冬天的數據」的層別，屬於哪一類層別對象？","opts":{"A":"作業者別","B":"時間別","C":"機械設備別","D":"檢查別"},"ans":"B","ansText":null,"expl":"晝夜、季節都屬「時間別」。層別對象 9 類：時間、作業者、機械設備、作業方法條件、原材料、測定、檢查、環境天候、其他。","flag":false,"num":8,"id":1543},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"層別法製作步驟的最後一步「比較分析」，正確的做法是？","opts":{"A":"憑現場經驗直覺判斷","B":"用統計方法判斷各條件間是否有差異","C":"只比較平均數即可","D":"由主管裁定"},"ans":"B","ansText":null,"expl":"課本明示：不要用主觀的判斷，最好用統計方法來判斷。","flag":false,"num":9,"id":1544},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"某工場 5 條生產線生產同一產品，總不良率約 7% 居高不下；按生產線層別後發現 NO.4 線高達 18%、其他線約 3%，停線檢查發現排氣台有一小缺口，修復後全廠不良率降至 3% 左右。此案例主要說明？","opts":{"A":"查檢表可防止不小心失誤","B":"層別法可找出問題所在（哪個維度差異大，問題就在哪）","C":"直方圖可測知製程能力","D":"散佈圖可判斷兩變數相關"},"ans":"B","ansText":null,"expl":"混在一起看不出來、分開統計立見高下——層別法的經典例（真空管工場）。","flag":false,"num":10,"id":1545},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"關於長條圖與推移圖的縱軸基準，下列何者正確？","opts":{"A":"兩者都必須以 0 為基點","B":"兩者都不必以 0 為基點","C":"長條圖必以 0 為基點；推移圖不一定要以 0 為基點","D":"推移圖必以 0 為基點；長條圖不一定"},"ans":"C","ansText":null,"expl":"長條圖比「量的大小」，從 0 起才不會誇大差異；推移圖看「趨勢」，可取局部區間放大變化。共同鐵則：刻度必須涵蓋全部數據、不可截斷。","flag":false,"num":11,"id":1546},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"圓形圖（扇形圖）的繪製，下列何者正確？","opts":{"A":"以 3 點鐘方向為起點，逆時針由小而大","B":"以 12 點鐘方向為起點，順時針由大而小，「其他」排最後","C":"項目一律依筆畫順序排列","D":"「其他」放在最大的位置"},"ans":"B","ansText":null,"expl":"12 點鐘起、順時針、由大而小、「其他」最後；有指定順序者（如滿意度等級）依其順序為例外。","flag":false,"num":12,"id":1547},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"活動計畫表（甘特圖）中，預定進度線與實際進度線的畫法分別是？","opts":{"A":"預定＝粗實線、實際＝細虛線","B":"預定＝細虛線、實際＝粗實線","C":"兩者都用實線","D":"兩者都用虛線"},"ans":"B","ansText":null,"expl":"預定（計畫）＝細虛線；實際＝粗實線。預定與實際有差異時備註說明即可。","flag":false,"num":13,"id":1548},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"雷達圖的刻度慣例，一般而言下列何者正確？","opts":{"A":"目標值在內側刻度、實際達成在外側","B":"目標值在外側刻度、實際達成在內側","C":"目標與實際畫在同一圈","D":"沒有慣例"},"ans":"B","ansText":null,"expl":"一般：目標值外側、實際達成內側。品管圈活動常改用「改善前在內側、改善後在外側」比較進步。","flag":false,"num":14,"id":1549},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"圖與表的主題（標題）標示位置，下列何者正確？","opts":{"A":"圖在上方、表在下方","B":"圖在下方、表在上方","C":"都在上方","D":"都在下方"},"ans":"B","ansText":null,"expl":"口訣：圖下表上。","flag":false,"num":15,"id":1550},{"src":"甲｜第七堂-QC七手法","ch":"2 層別法與圖表","type":"single","q":"推移圖又稱為？","opts":{"A":"柱形圖","B":"歷史線圖（折線圖）","C":"扇形圖","D":"帶狀圖"},"ans":"B","ansText":null,"expl":"推移圖＝歷史線圖＝折線圖：表示隨時間變動的趨勢。長條圖＝柱形圖＝棒圖；圓形圖＝扇形圖。","flag":false,"num":16,"id":1551},{"src":"甲｜第七堂-QC七手法","ch":"3 查檢表","type":"single","q":"「防止不小心失誤的查檢表」（點檢用），檢查後的記錄符號通常用？","opts":{"A":"正字劃記（⧻）","B":"○、×、✓","C":"阿拉伯數字累計","D":"條碼"},"ans":"B","ansText":null,"expl":"點檢用（防失誤）→○×✓；記錄用（收集數據）→正字或劃記。兩類型記錄符號不同，必考。","flag":false,"num":17,"id":1552},{"src":"甲｜第七堂-QC七手法","ch":"3 查檢表","type":"single","q":"「收集數據資料的查檢表」以正字或劃記記錄，整理統計後一般可作成哪些圖？","opts":{"A":"推移圖、柏拉圖","B":"雷達圖、甘特圖","C":"圓形圖、莖葉圖","D":"魚骨圖、系統圖"},"ans":"A","ansText":null,"expl":"查檢表設計要點：每日統計欄供「推移圖」用、各管理項目統計供「柏拉圖」用。","flag":false,"num":18,"id":1553},{"src":"甲｜第七堂-QC七手法","ch":"3 查檢表","type":"single","q":"查檢表的設計要領，下列何者不正確？","opts":{"A":"縱向、橫向都要有合計欄","B":"初期可留幾個空欄，備臨時新增項目之用","C":"原因和結果的項目可以混在一起，以節省欄位","D":"查檢以當場記錄為原則"},"ans":"C","ansText":null,"expl":"原因和結果之項目「不可」混在一起，且各項目間的判斷基準要避免重疊。","flag":false,"num":19,"id":1554},{"src":"甲｜第七堂-QC七手法","ch":"3 查檢表","type":"single","q":"以特性要因圖的「小要因」做為管制項目去檢核，稱為？","opts":{"A":"結果檢核","B":"原因檢核","C":"重點檢核","D":"全數檢核"},"ans":"B","ansText":null,"expl":"小要因→原因檢核；小要因太多或原因不明時用大要因（分類項目）→結果檢核。","flag":false,"num":20,"id":1555},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"柏拉圖橫軸項目的排列，下列何者正確？","opts":{"A":"依大小順序由高而低，「其他」項不論大小一律排最後","B":"完全依大小排列，「其他」也按大小插入","C":"依發生時間順序排列","D":"依部門編號排列"},"ans":"A","ansText":null,"expl":"「其他」即使數值比前面某些項目大，仍放橫軸最右端。","flag":false,"num":21,"id":1556},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"柏拉圖縱軸的表示方式，課本建議盡量採用？","opts":{"A":"不良數","B":"不良率","C":"損失金額","D":"件數"},"ans":"C","ansText":null,"expl":"柏拉圖目的在找出影響成本最大的項目，縱軸盡量用金額；且用金額排出的順位可能與用不良數不同。","flag":false,"num":22,"id":1557},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"同一批數據：材料不良 48 個（單價 20 元）、尺寸不合 32 個（單價 100 元）。分別以「不良數」與「損失金額」為縱軸畫柏拉圖，第一位項目為？","opts":{"A":"都是材料不良","B":"都是尺寸不合","C":"不良數→材料不良；損失金額→尺寸不合","D":"不良數→尺寸不合；損失金額→材料不良"},"ans":"C","ansText":null,"expl":"不良數 48＞32→材料不良第一；金額 32×100＝3,200 元＞48×20＝960 元→尺寸不合第一。縱軸單位改變，順位就可能改變。","flag":false,"num":23,"id":1558},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"比較改善前後的柏拉圖以查核改善效果時，應注意？","opts":{"A":"兩張圖縱軸刻度要一致","B":"縱軸刻度改小讓改善看起來更明顯","C":"只需比較累積曲線","D":"改用不同的分類方式"},"ans":"A","ansText":null,"expl":"刻度不一致就無法比較柱高差（效果）。另柏拉圖圖形要約略正方形。","flag":false,"num":24,"id":1559},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"柏拉圖整理數據時，項目數以幾項為原則？","opts":{"A":"2~3 項","B":"5~7 項","C":"10~12 項","D":"越多越好"},"ans":"B","ansText":null,"expl":"項目 5~7 為原則；次數少的項目歸入「其他」排最後。","flag":false,"num":25,"id":1560},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"依講義，柏拉圖前 2~3 項的累計影響度應在多少以上，才算有效抓到重點？","opts":{"A":"30%","B":"50%","C":"70%","D":"95%"},"ans":"C","ansText":null,"expl":"前 2~3 項累計影響度應在 70% 以上；目標設定時取累積比率 60~100% 之間的重要項目。","flag":false,"num":26,"id":1561},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"open","q":"柏拉圖目標設定：現狀不良 50 個，選定 A、B 兩項（累積比率 68%）為改善項目，改善能力 80%。求「改善值」與「目標值」。","opts":{},"ans":null,"ansText":"改善值＝50×0.68×0.8＝27.2；目標值＝50−27.2＝22.8","expl":"公式：改善值＝現狀值×累積比率×改善能力；目標值＝現狀值−改善值。fx-350MS：50 × 0.68 × 0.8 = →27.2；50 − 27.2 = →22.8。","flag":false,"num":27,"id":1562},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"樹脂部品外觀不良 N＝137，第一位無光澤 56 件、第二位異物 38 件，前兩項累積比率約為？","opts":{"A":"40.8%","B":"68.5%","C":"79.4%","D":"86.7%"},"ans":"B","ansText":null,"expl":"(56＋38)/137＝94/137≒68.6%（課本表以各項比率相加 40.8＋27.7＝68.5%，尾差來自四捨五入）。fx-350MS：94 ÷ 137 × 100 =。","flag":false,"num":28,"id":1563},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"柏拉圖選出最重要的兩項後，要進一步展開「要因」與「對策」，分別宜串聯哪種圖？","opts":{"A":"要因→魚骨圖；對策→系統圖","B":"要因→系統圖；對策→魚骨圖","C":"兩者都用魚骨圖","D":"兩者都用查檢表"},"ans":"A","ansText":null,"expl":"展開要因＝魚骨圖（原因型）；展開對策＝系統圖（對策型）。","flag":false,"num":29,"id":1564},{"src":"甲｜第七堂-QC七手法","ch":"4 柏拉圖","type":"single","q":"柏拉圖上的符號 n、pn、p 分別代表？","opts":{"A":"檢查總數、不良總件數、不良率","B":"不良率、檢查總數、不良件數","C":"組數、樣本大小、比率","D":"樣本大小、缺點數、缺點率"},"ans":"A","ansText":null,"expl":"例：n＝7251、pn＝111、p＝111/7251≒1.53%。","flag":false,"num":30,"id":1565},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"製作特性要因圖：對問題掌握「比較清楚」時，與要「全員共同討論瞭解」時，分別宜採用？","opts":{"A":"大骨展開法；小骨集約法","B":"小骨集約法；大骨展開法","C":"都用大骨展開法","D":"都用小骨集約法"},"ans":"A","ansText":null,"expl":"大骨展開法＝先定大要因分類（4~6 項）再往下展開；小骨集約法＝先腦力激盪列原因再分類集約（4~6 類）。","flag":false,"num":31,"id":1566},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"魚骨圖圈選主要原因，下列何者正確？","opts":{"A":"圈在大要因（分類項目）上","B":"圈在末端要因上，以 4~6 項為宜","C":"圈越多越好","D":"只能圈 1 項"},"ans":"B","ansText":null,"expl":"改善以末端要因為基礎，所以圈選要圈在末端要因；4~6 項為宜（已設挑戰值時可視需要增減）。","flag":false,"num":32,"id":1567},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"真因驗證的四種方式中，哪一種「只能在改善案檢討及效果確認中去證實是否為主要原因」？","opts":{"A":"以要因收集數據製作柏拉圖","B":"三現原則逐一確認","C":"以實驗方式確認","D":"以經驗法則評價表決"},"ans":"D","ansText":null,"expl":"四法：①數據做柏拉圖 ②三現原則（到現場、看現場、瞭解現況）③實驗 ④經驗法則——第④種只能事後在效果確認中證實。","flag":false,"num":33,"id":1568},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"原因型與對策型魚骨圖的「特性」寫法分別是？","opts":{"A":"原因型＝動詞＋名詞；對策型＝名詞＋形容詞","B":"原因型＝名詞＋形容詞；對策型＝動詞＋名詞","C":"兩者都用名詞","D":"兩者都用動詞"},"ans":"B","ansText":null,"expl":"問題點反轉法：原因型「交通阻塞」（名詞＋形容詞）→對策型「疏導交通」（動詞＋名詞）；圖形箭頭方向也反轉（原因型收斂、對策型展開）。","flag":false,"num":34,"id":1569},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"魚骨圖與柏拉圖之比較，下列何者正確？","opts":{"A":"魚骨圖注重事實數據；柏拉圖偏向經驗","B":"魚骨圖偏向經驗導向；柏拉圖注重事實的數據","C":"兩者都不使用數據","D":"兩者的主要原因都靠經驗法則"},"ans":"B","ansText":null,"expl":"魚骨圖：經驗導向、主要原因多靠經驗法則、設計查檢表收集數據；柏拉圖：注重事實數據、靠收集數據證實、以日常報表為根據。","flag":false,"num":35,"id":1570},{"src":"甲｜第七堂-QC七手法","ch":"5 特性要因圖","type":"single","q":"魚骨圖中骨（中要因線）的畫法，下列何者正確？","opts":{"A":"中骨與主骨平行，文字寫在箭頭的另一端","B":"中骨與主骨垂直，文字寫在線上","C":"中骨方向任意","D":"中骨不必畫箭頭"},"ans":"A","ansText":null,"expl":"中骨與主骨平行、小骨朝向中骨；文字寫箭頭另一端不要寫在線上；要因用「名詞＋形容詞」表達明確。","flag":false,"num":36,"id":1571},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"製作直方圖收集數據，一般約需多少個？","opts":{"A":"10~20 個","B":"50~200 個","C":"5~10 個","D":"1,000 個以上"},"ans":"B","ansText":null,"expl":"直方圖收集數據一般 50~200 個（散佈圖是至少 30 對、約 100 組，勿混淆）。","flag":false,"num":37,"id":1572},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"open","q":"n＝100、最大值 L＝82.8、最小值 S＝77.5、測定單位（解析度）0.1。求組數 K、組距 h 與第一組下組界。","opts":{},"ans":null,"ansText":"K＝√100＝10；h＝(82.8−77.5)/10＝0.53→修整為 0.5（測定單位的整數倍）；第一組下界＝77.5−0.1/2＝77.45","expl":"三個必考步驟：①K＝√n 取整數 ②h 算出後要修整成測定單位的整數倍（常取 5 或 2 的倍數）③第一組下界＝最小值−測定單位/2（避免數據剛好落在組界上）。fx-350MS：( 82.8 − 77.5 ) ÷ 10 =。","flag":false,"num":38,"id":1573},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"直方圖第一組「下組界」的求法為？","opts":{"A":"最小值","B":"最小值−（最小測定單位/2）","C":"最小值＋組距","D":"最小值−組距"},"ans":"B","ansText":null,"expl":"例：S＝77.5、測定單位 0.1 → 第一組下界＝77.45。目的是避免數據剛好落在組界上。","flag":false,"num":39,"id":1574},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"直方圖主體分布外側出現「孤立小島」（離島型），其原因通常是？","opts":{"A":"正常製程的隨機變異","B":"測定錯誤、工程調節錯誤或使用不同原材料","C":"分組數太多","D":"規格訂得太嚴"},"ans":"B","ansText":null,"expl":"離島型＝一定有異常原因存在，去除即可製出合格品。","flag":false,"num":40,"id":1575},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"直方圖靠近規格界限處呈「陡壁切斷」狀（絕壁型／削壁型），常見於？","opts":{"A":"製程能力十分充足","B":"工程能力不足，為求產品合乎規格而實行全數檢驗（剔除規格外品）","C":"兩台機器混合生產","D":"加工習慣所致"},"ans":"B","ansText":null,"expl":"絕壁型也用來「測知有無假數據」。兩台機器混合＝雙峰型（應層別）；加工習慣＝偏態型。","flag":false,"num":41,"id":1576},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"直方圖頂部平坦如高原（高原型），其成因為？","opts":{"A":"多個不同平均值的分配混合在一起","B":"全數檢驗剔除","C":"數據造假","D":"測定儀器故障"},"ans":"A","ansText":null,"expl":"高原型＝不同平均值的分配混合；鋸齒型＝作圖方法或數據收集（分組、測定）不當。","flag":false,"num":42,"id":1577},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"直方圖與規格比較：「中心偏向規格一側」與「兩邊超出規格（分散過大）」分別應追查？","opts":{"A":"變動因素；固定因素","B":"固定因素（設備、機器、原料）；變動因素（人員、方法）","C":"兩者都查人員","D":"兩者都查設備"},"ans":"B","ansText":null,"expl":"平均位置偏差→查「固定」因素（設備、機器、原料）；標準差太大→查「變動」因素（人員、方法）。","flag":false,"num":43,"id":1578},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"若次數分配為常態分配，利用直方圖訂定規格界限時可採用？","opts":{"A":"平均數±1×標準差","B":"平均數±2×標準差","C":"平均數±3×標準差","D":"平均數±4×標準差"},"ans":"D","ansText":null,"expl":"課本（7.8 直方圖之應用）：規格下限＝平均數−4×標準差、規格上限＝平均數＋4×標準差。注意與自然公差（X̿±3σ，二十六／二十八章）區分。","flag":false,"num":44,"id":1579},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"open","q":"簡捷法（u 變換）：次數最多組的組中點 x₀＝80.2、組距 h＝0.5、n＝100、Σuf＝−8、Σu²f＝404。求 X̄ 與 S。","opts":{},"ans":null,"ansText":"X̄＝80.2＋(−8/100)×0.5＝80.16；S＝0.5×√[(404−(−8)²/100)/99]＝0.5×√(403.36/99)≒1.01","expl":"公式：X̄＝x₀＋(Σuf/Σf)×h；S＝h×√[(Σu²f−(Σuf)²/n)÷(Σf−1)]。fx-350MS 亦可直接 SD 模式輸入「組中點×次數」：MODE 2 → 77.7 SHIFT , 2 M+ … → SHIFT 2 1 = 得 X̄；SHIFT 2 3 = 得 xσn−1。","flag":false,"num":45,"id":1580},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"open","q":"規格 78.45~83.55、X̄＝80.16、S＝1.01。求 Cp、偏度 K 與 Cpk，並判斷製程能力。","opts":{},"ans":null,"ansText":"Cp＝(83.55−78.45)/(6×1.01)＝5.1/6.06≒0.84；K＝|81.00−80.16|/2.55＝0.84/2.55≒0.329；Cpk＝(1−0.329)×0.84≒0.56。Cp 在 0.67~1.00 → 能力不足","expl":"公式：Cp＝(Su−SL)/6S；K＝|規格中心−X̄|÷(T/2)；Cpk＝(1−K)×Cp。判斷基準：≧1.67 過份充足／1.33~1.67 充分／1.00~1.33 避免不良／0.67~1.00 不足／＜0.67 非常不足。詳見二十八章。","flag":false,"num":46,"id":1581},{"src":"甲｜第七堂-QC七手法","ch":"6 直方圖","type":"single","q":"進行製程能力調查，作直方圖、計算能力指數「之前」應先？","opts":{"A":"製作管制圖，確認製程是否安定","B":"先向主管報告","C":"先實行全數檢驗","D":"先訂改善目標"},"ans":"A","ansText":null,"expl":"調查步驟：①明確品質特性、收集數據→②作管制圖確認製程安定→③作直方圖、算能力指數→④判定並改善。製程不安定時算出的能力指數沒有意義。","flag":false,"num":47,"id":1582},{"src":"甲｜第七堂-QC七手法","ch":"7 散佈圖","type":"single","q":"製作散佈圖收集成對數據，至少應有幾組（對）以上？","opts":{"A":"10 組","B":"20 組","C":"30 組","D":"500 組"},"ans":"C","ansText":null,"expl":"約 100 組、至少 30 組（30 對）以上。與直方圖的 50~200 個勿混淆。","flag":false,"num":48,"id":1583},{"src":"甲｜第七堂-QC七手法","ch":"7 散佈圖","type":"single","q":"散佈圖座標軸的配置，「要因（原因）」與「特性（結果）」應分別放在？","opts":{"A":"橫軸 x＝要因；縱軸 Y＝特性","B":"橫軸 x＝特性；縱軸 Y＝要因","C":"任意配置即可","D":"都放縱軸"},"ans":"A","ansText":null,"expl":"x（橫）＝原因、Y（縱）＝結果；同為原因或同為結果時可任取一軸。刻度取範圍使圖面近似正方形。","flag":false,"num":49,"id":1584},{"src":"甲｜第七堂-QC七手法","ch":"7 散佈圖","type":"single","q":"散佈圖全部數據點入後整體看不出相關時，第一步應該？","opts":{"A":"放棄分析","B":"先予層別，再分別點入判讀","C":"增加數據到 1,000 組再說","D":"直接下結論「無相關」"},"ans":"B","ansText":null,"expl":"混有不同來源的數據會互相抵銷看不出相關；層別後各群常各自呈現相關。","flag":false,"num":50,"id":1585},{"src":"甲｜第七堂-QC七手法","ch":"7 散佈圖","type":"open","q":"符號檢定法：n＝30 的散佈圖以 x、Y 中位數分成四個象限，自右上起「逆時針」編號，各區點數 n(1)＝12、n(2)＝3、n(3)＝12、n(4)＝3；查符號檢定表 N＝30 之判定數：α＝0.01 為 7、α＝0.05 為 9。判定相關性。","opts":{},"ans":null,"ansText":"對角和：n(1)+n(3)＝24、n(2)+n(4)＝6。判定數 7＞6（α=0.01）且 9＞6（α=0.05）→ 危險率 1% 下判定「有正相關」","expl":"判定規則：判定數＞n(2)+n(4)（左上＋右下）→正相關；判定數＞n(1)+n(3)（右上＋左下）→負相關。判斷關鍵：拿「較少的那組對角和」與判定數比，判定數比它大才成立。","flag":false,"num":51,"id":1586},{"src":"甲｜第七堂-QC七手法","ch":"7 散佈圖","type":"single","q":"散佈圖的判讀注意事項，下列何者「不」正確？","opts":{"A":"注意有無異常點","B":"看是否有層別必要","C":"留意是否為假相關","D":"數據越少，判讀越準確"},"ans":"D","ansText":null,"expl":"數據太少易發生誤判；另勿依技術、經驗作直覺判斷。","flag":false,"num":52,"id":1587},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"single","q":"管制圖上的點「恰好落在管制界限線上」時，應視為？","opts":{"A":"在管制狀態內","B":"超出界限外（異常）","C":"重新測定一次","D":"剔除該點"},"ans":"B","ansText":null,"expl":"課本第 7 章明示：點恰好在管制界限線上時，認為超出界限外。常考陷阱。","flag":false,"num":53,"id":1588},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"single","q":"課本第 7 章（QCC 版）：點連續出現於中心線同一側，5 點、6 點、7 點分別代表？","opts":{"A":"5 點注意工程進行、6 點開始原因調查、7 點有異常採取處理措施","B":"5 點異常、6 點注意、7 點調查","C":"都只是注意即可","D":"7 點以上才需要注意"},"ans":"A","ansText":null,"expl":"連串判定：5 注意→6 調查→7 處理。注意此為七手法章（QCC 教材）版本，與二十三章判異規則數字略有出入，考題出自哪本用哪套。","flag":false,"num":54,"id":1589},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"single","q":"解析過去數據時，下列何者可視為「管制狀態」？連續 35 點中超出界限最多幾點、連續 100 點中最多幾點？","opts":{"A":"0 點；0 點","B":"1 點以內；2 點以內","C":"2 點以內；4 點以內","D":"3 點以內；5 點以內"},"ans":"B","ansText":null,"expl":"管制狀態認定三條件：連續 25 點以上全在界限內／連續 35 點中界外 1 點以內／連續 100 點中界外 2 點以內。","flag":false,"num":55,"id":1590},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"open","q":"P 管制圖：共 25 批、每批 n＝50、總不良數 187。求 P̄ 與 UCL、LCL。","opts":{},"ans":null,"ansText":"P̄＝187/(50×25)＝187/1250＝0.150；UCL＝0.150＋3√(0.150×0.850/50)＝0.150＋0.152＝0.302；LCL＝0.150−0.152＜0 → 不考慮","expl":"P̄＝總不良數÷總檢查數（不是把各批不良率平均！）。fx-350MS：187 ÷ 1250 = →0.1496≒0.150；3 × √( 0.15 × 0.85 ÷ 50 ) = →0.152。","flag":false,"num":56,"id":1591},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"single","q":"計數值管制圖的選用：樣本大小「每次不同」時管制不良率、樣本大小「一定」時管制不良數，分別用？","opts":{"A":"P 圖；Pn 圖","B":"Pn 圖；P 圖","C":"C 圖；U 圖","D":"U 圖；C 圖"},"ans":"A","ansText":null,"expl":"P＝不良率（n 不一定）；Pn＝不良數（n 一定）；C＝缺點數（樣本大小一定）；U＝每單位缺點數（n 不一定）。詳見二十二章。","flag":false,"num":57,"id":1592},{"src":"甲｜第七堂-QC七手法","ch":"8 管制圖補充","type":"single","q":"管制圖依用途分為「解析用」與「管制用」，其數據與管制界限的先後關係為？","opts":{"A":"解析用＝先有管制界限、後有數據","B":"管制用＝先有數據、後有界限","C":"解析用＝先有數據、後有管制界限；管制用＝先有管制界限、後有數據","D":"兩者相同，沒有先後之分"},"ans":"C","ansText":null,"expl":"解析用：收集數據算出界限（決定方針、製程解析、能力研究、管制準備）；管制用：界限先延用、新數據點上去判異。「先有誰」是常考陷阱。","flag":false,"num":58,"id":1593},{"ch":"綜合選擇題","type":"single","q":"針對下列資料計算其算術平均數？分組資料：組界 0~5 次數 7；5~10 次數 6；10~15 次數 7；15~20 次數 9；20~25 次數 6","opts":{"A":"10","B":"12.5","C":"12.64","D":"15"},"ans":"C","ansText":null,"expl":"（卷上無附答案，答案為解題所得）取組中點 2.5, 7.5, 12.5, 17.5, 22.5。x̄ = (2.5×7+7.5×6+12.5×7+17.5×9+22.5×6)/35 = (17.5+45+87.5+157.5+135)/35 = 442.5/35 ≈ 12.64。","flag":false,"num":15,"src":"甲｜隨堂考題(第七堂課)","id":1594},{"ch":"綜合選擇題","type":"single","q":"某一地毯公司之檢驗計畫係每生產 100 公尺之地毯即隨機抽取 3 公尺長之樣本檢查，若無缺點則允收，反之，則拒收。試求「每 3 公尺中平均有一個缺點」之樣本會被拒收之機率為何？","opts":{"A":"0.05","B":"0.95","C":"0.72","D":"0.28"},"ans":"C","ansText":null,"expl":"⚠️答案為自行解題判定，請覆核：依題意 3 公尺樣本之 λ=1，P(拒收) = P(X≥1) = 1−e⁻¹ ≈ 0.632，四個選項皆不吻合，取最接近的 (C)0.72。若題意實為「平均每公尺 1 個缺點」則 λ=3、1−e⁻³≈0.95 → (B)。此題題意/選項疑有出入，建議覆核原書解答。","flag":true,"num":21,"src":"甲｜隨堂考題(第七堂課)","id":1595},{"ch":"綜合選擇題","type":"single","q":"若某產品之長度 X 與寬度 Y 均符合常態分配（X~N(12,0.04)，Y~N(8,0.09)），且此兩變數相互獨立，若我們知道高度 Z 為 2 倍的長度減 1 倍的寬度（Z = 2X−Y），請問 Z 之標準差為","opts":{"A":"0.250","B":"0.500","C":"0.170","D":"0.265"},"ans":"B","ansText":null,"expl":"（卷上無附答案，答案為解題所得）V(Z) = 2²V(X)+1²V(Y) = 4×0.04+0.09 = 0.16+0.09 = 0.25，σz = √0.25 = 0.5。判斷關鍵：N(μ,σ²) 括號內第二個數是變異數；係數要平方後乘變異數。","flag":false,"num":23,"src":"甲｜隨堂考題(第七堂課)","id":1596},{"ch":"綜合選擇題","type":"single","q":"組件 Y 是由零件 X1 及 X2 所組裝而成，即 Y=X1+X2，若每一零件均為常態分配，且 X1 的平均值為 2，標準差為 0.3，X2 的平均值為 2.4，標準差為 0.4，則組件 Y 的","opts":{"A":"平均值為 2.2 標準差為 0.7","B":"平均值為 4.4 標準差為 0.7","C":"平均值為 2.2 標準差為 0.5","D":"平均值為 4.4 標準差為 0.5"},"ans":"D","ansText":null,"expl":"（卷上無附答案，答案為解題所得）E[Y] = 2+2.4 = 4.4；σ = √(0.3²+0.4²) = √0.25 = 0.5。陷阱：標準差不能直接相加（0.3+0.4=0.7 是錯的）。","flag":false,"num":28,"src":"甲｜隨堂考題(第七堂課)","id":1597},{"ch":"離散型隨機變數","type":"open","q":"假設一隨機變數 Y 之累積分配函數（累積機率分配）如下所示，試求：(a) Y 之機率質量函數（probability mass function）；(b) P(0.5<Y<3.5)。\nF(y) = 0（y<0）；1/2（0≤y<1）；3/5（1≤y<2）；9/10（2≤y<3.5）；1（3.5≤y）","opts":{},"ans":null,"ansText":"(a) p(0)=1/2、p(1)=1/10、p(2)=3/10、p(3.5)=1/10，其餘為 0；(b) P(0.5<Y<3.5)=2/5=0.4","expl":"（卷上無附答案，答案為解題所得）(a) pmf = 累積分配函數 F(y) 在各跳躍點的跳躍量：p(0)=1/2−0=1/2；p(1)=3/5−1/2=1/10；p(2)=9/10−3/5=3/10；p(3.5)=1−9/10=1/10。(b) 0.5<Y<3.5 只包含 Y=1 與 Y=2（不含端點 3.5）：P = 1/10+3/10 = 4/10 = 0.4。陷阱：開區間不含 3.5，別把 p(3.5) 算進去。","flag":false,"num":1,"src":"甲｜隨堂考題(第七堂課)","id":1598},{"ch":"離散型隨機變數","type":"open","q":"離散型隨機變數 Y 之機率分配如下表，試求：(a) P(Y=4)；(b) 期望值 E[Y]、變異數 V(Y)、標準差 SD(Y)。\ny：1, 2, 3, 4, 5, 6；p(y)：0.1, 0.2, 0.1, ?, 0.2, 0.3","opts":{},"ans":null,"ansText":"(a) P(Y=4)=0.1；(b) E[Y]=4.0、V(Y)=3.2、SD(Y)=√3.2≈1.789","expl":"（卷上無附答案，答案為解題所得）(a) 機率總和=1：P(Y=4)=1−(0.1+0.2+0.1+0.2+0.3)=0.1。(b) E[Y]=1(0.1)+2(0.2)+3(0.1)+4(0.1)+5(0.2)+6(0.3)=0.1+0.4+0.3+0.4+1.0+1.8=4.0；E[Y²]=1(0.1)+4(0.2)+9(0.1)+16(0.1)+25(0.2)+36(0.3)=19.2；V(Y)=E[Y²]−(E[Y])²=19.2−16=3.2；SD(Y)=√3.2≈1.789。","flag":false,"num":2,"src":"甲｜隨堂考題(第七堂課)","id":1599},{"ch":"5-2 應用統計學","type":"open","q":"離散型隨機變數 Y 之機率分配如下表（y=1,2,3,4；p(y)=0.1,0.2,0.3,0.4），試求：(a) E[Y]、E[Y²+3Y+1]；(b) V(Y)、V(3Y+4)；(c) E[1/Y]","opts":{},"ans":null,"ansText":"(a) E[Y]=3.0，E[Y²+3Y+1]=20；(b) V(Y)=1.0，V(3Y+4)=9；(c) E[1/Y]=0.4","expl":"（卷上解答欄空白，答案為解題所得）(a) E[Y]=Σy·p(y)=1×0.1+2×0.2+3×0.3+4×0.4=0.1+0.4+0.9+1.6=3.0。E[Y²]=1×0.1+4×0.2+9×0.3+16×0.4=0.1+0.8+2.7+6.4=10.0，故 E[Y²+3Y+1]=E[Y²]+3E[Y]+1=10+9+1=20。(b) V(Y)=E[Y²]−(E[Y])²=10−9=1.0；V(3Y+4)=3²×V(Y)=9×1=9（常數 +4 不影響變異數）。(c) E[1/Y]=Σ(1/y)·p(y)=0.1/1+0.2/2+0.3/3+0.4/4=0.1+0.1+0.1+0.1=0.4。判斷關鍵：期望值可線性拆開 E[aY+b]=aE[Y]+b，但變異數是 V(aY+b)=a²V(Y)；E[1/Y]≠1/E[Y]（0.4≠1/3），要逐點代入計算。","flag":false,"num":3,"src":"甲｜隨堂考題(第七堂課)","id":1600},{"ch":"5-2 應用統計學","type":"open","q":"離散型隨機變數 Y 之機率分配如下表（y=1,2,3,4；p(y)=1/4,3/8,1/4,1/8），試求：(a) P(1≦y≦3)；(b) P(y>3)","opts":{},"ans":null,"ansText":"(a) P(1≦y≦3)=7/8=0.875；(b) P(y>3)=1/8=0.125","expl":"（卷上解答欄空白，答案為解題所得）先驗證機率總和：1/4+3/8+1/4+1/8=2/8+3/8+2/8+1/8=8/8=1 ✓。(a) P(1≦y≦3)=p(1)+p(2)+p(3)=1/4+3/8+1/4=2/8+3/8+2/8=7/8。(b) P(y>3)=p(4)=1/8。也可用餘事件驗算：1−P(1≦y≦3)=1−7/8=1/8 ✓。判斷關鍵：離散型「y>3」不含 y=3，只剩 y=4；若題目改成「y≧3」則是 1/4+1/8=3/8，注意等號有無。","flag":false,"num":4,"src":"甲｜隨堂考題(第七堂課)","id":1601},{"ch":"5-2 應用統計學","type":"open","q":"離散型隨機變數 X 之機率分配如下表（x=0,1,2；f(x)=1/4,1/2,1/4），試求：(a) E[X]；(b) V(X)；(c) σ(X)","opts":{},"ans":null,"ansText":"(a) E[X]=1；(b) V(X)=0.5；(c) σ(X)=√0.5=√2/2≈0.707","expl":"（卷上解答欄空白，答案為解題所得）(a) E[X]=0×1/4+1×1/2+2×1/4=0+0.5+0.5=1。(b) E[X²]=0×1/4+1×1/2+4×1/4=0.5+1=1.5，V(X)=E[X²]−(E[X])²=1.5−1=0.5。(c) σ(X)=√V(X)=√0.5≈0.707。判斷關鍵：標準差是變異數開根號，不要把 V(X) 直接當 σ(X) 填。fx-350MS 按法（c）：0.5 √ = 得 0.7071。","flag":false,"num":5,"src":"甲｜隨堂考題(第七堂課)","id":1602},{"ch":"5-2 應用統計學","type":"open","q":"(1) 設 X 是一隨機變數且 Var(4X−6)=144，則 X 的標準差為？(2) 設 X 是一隨機變數滿足 E(5X²)=200，且 E(X)=6，則 X 的標準差為？","opts":{},"ans":null,"ansText":"(1) σ(X)=3；(2) σ(X)=2","expl":"（卷上解答欄空白，答案為解題所得）(1) Var(4X−6)=4²Var(X)=16Var(X)=144 → Var(X)=9 → σ(X)=√9=3（−6 是常數，不影響變異數）。(2) E(5X²)=5E(X²)=200 → E(X²)=40；Var(X)=E(X²)−(E(X))²=40−6²=40−36=4 → σ(X)=√4=2。判斷關鍵：(1) 先把係數平方除掉再開根號；(2) 先把 5 除掉得 E(X²)，再套 Var=E(X²)−(E(X))²，最後記得開根號求標準差。","flag":false,"num":8,"src":"甲｜隨堂考題(第七堂課)","id":1603},{"ch":"管制圖","type":"single","q":"某工廠製造一批電腦桌，已知其每批缺點數如下表所示，其中心線 CL=8.91，則其 UCLc 為：（樣本1~35之缺點數依序=9,6,10,5,8,12,6,5,2,12,9,4,10,11,7,15,6,15,7,8,7,7,6,5,10,4,8,13,12,8,13,20,19,5,8）","opts":{"A":"17.87","B":"16.90","C":"16.22","D":"15.11"},"ans":"B","ansText":null,"expl":"⚠️此題有陷阱，卷上附答案(2) 16.90，驗算後確認其解題邏輯如下：第一次計算 c̄=Σc/k=312/35=8.914≈8.91，UCLc=8.91+3√8.91=8.91+8.96=17.87（即選項A）。但檢視數據，樣本32(缺點數20)與樣本33(缺點數19)超出 UCL=17.87，屬管制外點，剔除後重新計算：c̄=(312−20−19)/33=273/33=8.273，修正後 UCLc=8.273+3√8.273=8.273+8.63=16.90。判斷關鍵：這類題給整批數據時，要做「剔除管制外點→修正管制界限」的二次計算；若只用題目給的 CL=8.91 直接算會誤選 17.87（選項A就是設來釣直接套公式的人）。 ⚠️另有「簡化題幹」版（隨堂考題(第四堂課)｜管制圖測驗題）：只給CL=8.91不附表，該版答案為17.87（直接 c̄+3√c̄）。考試依題目是否附數據表判斷用哪種算法。","flag":false,"num":12,"src":"甲｜隨堂考題(第七堂課)","id":1604},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":1,"q":"吾輩欲探討送樣組數據的關聯性，用以下哪種方法會比較適當？","opts":{"A":"直方圖(histogram)","B":"特性要因圖(cause and effect diagram)","C":"散佈圖(scatter diagram)","D":"柏拉圖(Pareto chart)"},"ans":"C","ansText":null,"expl":"看兩組數據的「關聯性／相關性」→ 散佈圖。直方圖看分布、特性要因圖找原因、柏拉圖抓重點少數。","flag":false,"id":1605},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":2,"q":"我們想知道材料的成份與硬度間的相關性可以透過何種方法？","opts":{"A":"散佈圖","B":"直方圖","C":"魚骨圖","D":"關聯圖"},"ans":"A","ansText":null,"expl":"兩變數（成份 vs 硬度）的相關性 → 散佈圖。注意別選「關聯圖」——關聯圖是新七手法，用於整理複雜因果關係，不是看數據相關。","flag":false,"id":1606},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":3,"q":"關於查檢表的敘述何者不正確？","opts":{"A":"查檢表可分為點檢用查檢表與記錄用查檢表","B":"為數據收集的基本工具","C":"有固定的格式","D":"要符合目的"},"ans":"C","ansText":null,"expl":"查檢表「沒有」固定格式，應依使用目的自行設計，簡單、方便記錄即可。其餘敘述皆正確。","flag":false,"id":1607},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":4,"q":"避免作業遺漏或疏失，可用何種品管手法來輔助工作的執行？","opts":{"A":"直方圖","B":"記錄用之檢核表","C":"柏拉圖","D":"點檢用之檢核表"},"ans":"D","ansText":null,"expl":"防止「遺漏、疏失」→ 點檢用查檢表（像起飛前檢查清單，逐項打勾確認）。記錄用查檢表是收集數據（畫正字）用的。","flag":false,"id":1608},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":5,"q":"為了讓活動的準備無所疏漏，通常我們會利用何種工具來協助？","opts":{"A":"檢核表","B":"柏拉圖","C":"特性要因圖","D":"管制圖"},"ans":"A","ansText":null,"expl":"準備工作不遺漏 → 檢核表（點檢用）。與上一題同觀念。","flag":false,"id":1609},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":6,"q":"顧客向某公司表示在其產品中所附的使用手冊裡有很多錯誤，某公司想要改善這個現象，但又不確定使用手冊為什麼會出錯。請從以下選項中選出一個在這階段最適合推薦給該公司使用的品管七工具，於解決這個問題：","opts":{"A":"散佈圖","B":"特性要因圖","C":"直方圖","D":"管制圖"},"ans":"B","ansText":null,"expl":"關鍵句是「不確定為什麼會出錯」→ 要找原因 → 特性要因圖（魚骨圖）。","flag":false,"id":1610},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":7,"q":"以下有關於管制圖的敘述何者正確？","opts":{"A":"管制圖是戴明(Deming)所發明的","B":"管制圖的設計是指管制界限的訂定","C":"在製程穩定的情況下，平均連串長度（average run length）的值越大，表示管制圖的管制效力越好","D":"以上三個選項都是正確的"},"ans":"C","ansText":null,"expl":"(A)錯：管制圖是修華特(Shewhart)發明。(B)錯：管制圖的設計包含樣本大小、抽樣頻率與管制界限三者，不只訂界限。(C)對：製程穩定（管制內）時 ARL 越大越好，代表假警報越少；反之失控時 ARL 越小越好。","flag":false,"id":1611},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":8,"q":"以下有關於計數值管制圖的敘述哪個是正確的？ (I)不良品數管制圖(np chart)只能適用於樣本數固定的情況下； (II)可以將平均缺點數管制圖(u chart)應用於樣本數不固定的情況； (III)缺點數管制圖(c chart)是基於超幾何分配(hyper-geometric distribution)建立的； (IV)不良率管制圖(p chart)是基於二項分配(binomial distribution)建立的","opts":{"A":"只有 (I)、(II)與(IV)","B":"只有 (I)、(II)與(III)","C":"只有 (II)、(III)與(IV)","D":"只有 (I)與(IV)"},"ans":"A","ansText":null,"expl":"(III)錯：c chart 基於卜瓦松(Poisson)分配，不是超幾何分配。其餘正確：np 需樣本數固定、u 可用於樣本數不固定、p 基於二項分配。","flag":false,"id":1612},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":9,"q":"品質特性 (Ⅰ)產品標籤表面的缺點數 (Ⅱ)鋼管外徑 (Ⅲ)產品外殼硬度 (Ⅳ)每平方公尺布的線頭數量，下列何者應採計量值管制圖進行管制?","opts":{"A":"Ⅰ、Ⅱ","B":"Ⅱ、Ⅲ","C":"Ⅰ、Ⅳ","D":"Ⅱ、Ⅲ、Ⅳ"},"ans":"B","ansText":null,"expl":"能用儀器「量測出連續數值」的才是計量值：外徑、硬度。缺點數、線頭數量是「用數的」→ 計數值。","flag":false,"id":1613},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":10,"q":"疾管局每年會公佈國人十大死因，所利用的是何種品質管理工具？","opts":{"A":"管制圖","B":"散佈圖","C":"柏拉圖","D":"特性要因圖(魚骨圖)"},"ans":"C","ansText":null,"expl":"十大死因是「按發生次數排序找出重點項目」→ 柏拉圖。","flag":false,"id":1614},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":11,"q":"下列有關管制圖之敘述，何者為真？","opts":{"A":"使用瞬時法是為了使組間的差異為最大而組內的差異為最小","B":"平均管制圖可監測樣本組內的變異","C":"計量管制圖的缺點為調查製程失控發生之原因較為費時","D":"全距管制圖目的在監測樣本組間的變異"},"ans":"A","ansText":null,"expl":"(A)對：瞬時法在同一時點抽樣，組內只剩機遇變異（最小），讓組間差異凸顯（最大），失控才容易被偵測。(B)(D)相反：X̄圖監測「組間」（平均值位置）、R圖監測「組內」變異。(C)錯：計量值管制圖較容易追查原因；是「計數值」管制圖涵蓋多特性、追查原因較費時。","flag":false,"id":1615},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":12,"q":"下列關於管制圖之敘述，何者為正確？","opts":{"A":"管制下限以 USL 表示","B":"管制圖係由 Juran 所發明","C":"分為計量值和計數值管制圖兩類","D":"屬於品管新七大手法之一種"},"ans":"C","ansText":null,"expl":"(A)錯：管制下限是 LCL；USL 是規格上限（規格≠管制界限）。(B)錯：發明人是修華特(Shewhart)。(D)錯：管制圖屬「舊」QC七手法。","flag":false,"id":1616},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":13,"q":"在管制圖中，「管制界限（control limits）」的作用是什麼？以下哪一項最正確地說明警戒界限的功能與用途？","opts":{"A":"管制界限是代表產品規格的上下限，用於判斷是否符合客戶需求","B":"管制界限表示可接受的誤差範圍，通常設在 ±1σ，用於日常品質管制","C":"管制界限是根據統計方法計算的界限，用來判斷製程是否處於穩定狀態","D":"管制界限的設定由工程師主觀決定，不必依據統計數據"},"ans":"C","ansText":null,"expl":"管制界限由統計計算（一般 ±3σ），用來判斷製程穩定與否。(A)混淆規格界限與管制界限——規格是客戶訂的、管制界限是製程數據算出來的。","flag":false,"id":1617},{"src":"甲｜課後練習(第七堂課)","ch":"管制圖","type":"single","num":14,"q":"下列敘述何者正確？","opts":{"A":"管制圖是 Sullivan 博士所發明","B":"即使製程未變化，管制圖上也可能會出現超出管制界限外的點","C":"管制圖的目的在於偵測製程機遇性原因的變異，以便採取矯正行動","D":"只要樣本點都落在管制界限內，則可視製程在統計管制內，無需考慮非隨機性變化"},"ans":"B","ansText":null,"expl":"(B)對：這就是型Ⅰ誤差（假警報，±3σ 下機率約 0.27%）——製程沒變也可能有點超出界限。(A)錯：Shewhart。(C)錯：要偵測的是「非機遇（可歸屬）」原因，機遇原因是無法避免的正常變異。(D)錯：點在界限內仍要檢查連串、趨勢等非隨機性型態。","flag":false,"id":1618},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":15,"q":"日本品質大師石川馨(Ishikawa)對品質管理方面的貢獻，何者不正確？","opts":{"A":"倡導「全公司品管」(CWQC)","B":"發明「特性要因圖」(cause-and-effect diagram)","C":"為「品管圈之父」","D":"發明「品質機能展開」(QFD)"},"ans":"D","ansText":null,"expl":"QFD 是赤尾洋二與水野滋提出的，不是石川馨。石川馨：特性要因圖（魚骨圖／石川圖）、品管圈之父、倡導 CWQC。","flag":false,"id":1619},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":16,"q":"日本品質大師石川馨(Ishikawa)對品質管理方面的貢獻，何者不正確？（同前題、選項順序不同）","opts":{"A":"發明「特性要因圖」(cause-and-effect diagram)","B":"發明「品質機能展開」(QFD)","C":"倡導「全公司品管」(CWQC)","D":"為「品管圈之父」"},"ans":"B","ansText":null,"expl":"同前題觀念：QFD 不是石川馨的貢獻（是赤尾洋二與水野滋）。此題練習「認觀念不要背選項位置」。","flag":false,"id":1620},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":17,"q":"在品管七大手法中，針對不同的機台、時間、工作環境、操作員而分類的方法稱為：","opts":{"A":"特性要因圖法","B":"層別法","C":"查檢表法","D":"柏拉圖法"},"ans":"B","ansText":null,"expl":"「按機台、時間、人員等條件分類（分層）比較」→ 層別法。","flag":false,"id":1621},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":18,"q":"不良率每日變化趨勢，最好選用那一種圖形來顯示？","opts":{"A":"親和圖","B":"推移圖","C":"關聯圖","D":"散佈圖"},"ans":"B","ansText":null,"expl":"看「隨時間的變化趨勢」→ 推移圖(run chart)。","flag":false,"id":1622},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":19,"q":"為表示各品質特性參數在時間上的變化，如不良率每日變化趨勢，宜選擇的圖形為何？","opts":{"A":"推移圖(run chart)","B":"親和圖(affinity diagram)","C":"關聯圖(interrelationship diagram)","D":"散佈圖(scatter plot)"},"ans":"A","ansText":null,"expl":"同前題：時間趨勢 → 推移圖。","flag":false,"id":1623},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":20,"q":"想知道不良率每日變化趨勢，最適合表達的圖形為何？","opts":{"A":"親和圖(affinity diagram)","B":"散佈圖(scatter plot)","C":"關聯圖(interrelationship diagram)","D":"推移圖(run chart)"},"ans":"D","ansText":null,"expl":"同觀念第三題：時間趨勢 → 推移圖。注意選項位置會換，認內容不要背位置。","flag":false,"id":1624},{"src":"甲｜課後練習(第七堂課)","ch":"品管七手法","type":"single","num":21,"q":"以下哪種手法可以顯示產品特性分布情形，瞭解該批產品品質之好壞","opts":{"A":"直方圖","B":"關聯圖","C":"柏拉圖","D":"管制圖"},"ans":"A","ansText":null,"expl":"看「分布情形」（集中趨勢、散布、形狀）→ 直方圖。","flag":false,"id":1625},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":1,"q":"發掘問題時，可應用：","opts":{"A":"5W2H","B":"腦力激盪法","C":"奧斯朋檢核表法","D":"QC 七大手法","E":"以上均可"},"ans":"E","ansText":null,"expl":"發掘問題階段各種工具都可用：5W2H、腦力激盪、奧斯朋檢核表、QC七手法皆是。","flag":false,"id":1626},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":2,"q":"現狀分析做重點改善用：","opts":{"A":"系統圖","B":"魚骨圖","C":"柏拉圖","D":"推移圖","E":"管制圖"},"ans":"C","ansText":null,"expl":"「重點改善」→ 柏拉圖（找出影響最大的少數項目，80/20 原則）。","flag":false,"id":1627},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":3,"q":"分析問題列出改善計劃之優先順序，所常用的方法是：","opts":{"A":"成本比較法","B":"柏拉圖分析法","C":"投資報酬法","D":"腦力激盪法","E":"要因分析法"},"ans":"B","ansText":null,"expl":"排「優先順序」→ 柏拉圖分析（按影響度大小排序，先改善前幾大項）。","flag":false,"id":1628},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":4,"q":"下列那一種是舊 QC 手法之一：","opts":{"A":"柏拉圖","B":"KJ 法","C":"箭線圖","D":"關連圖","E":"系統圖"},"ans":"A","ansText":null,"expl":"柏拉圖屬「舊」QC七手法。KJ法（親和圖）、箭線圖、關連圖、系統圖都是「新」QC七手法。","flag":false,"id":1629},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":5,"q":"為探討問題癥結所在，按不同機台別，不同工作者，不同時間等分別觀察，所使用的手法：","opts":{"A":"柏拉圖","B":"特性要因圖","C":"層別法","D":"查檢表","E":"管制圖"},"ans":"C","ansText":null,"expl":"按機台、人員、時間「分類觀察」→ 層別法。","flag":false,"id":1630},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":6,"q":"下列何項手法對發現原因及結果間關係，能一看即了解：","opts":{"A":"管制圖","B":"魚骨圖","C":"直方圖","D":"散佈圖","E":"層別圖法"},"ans":"B","ansText":null,"expl":"原因與結果的關係一目了然 → 魚骨圖（特性要因圖）：骨幹是結果、魚刺是原因。","flag":false,"id":1631},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":7,"q":"如果將有相關之幾組數據都繪在散佈圖上，但仍無法判定其關係時應採取之步驟為：","opts":{"A":"放大數據倍數","B":"圖上橫縱軸對調","C":"對數據予以層別","D":"橫軸單位再放大","E":"改用魚骨圖分析"},"ans":"C","ansText":null,"expl":"散佈圖看不出關係時，先「層別」——按機台、批次等分開畫，混在一起的不同群體分開後相關性常會浮現。","flag":false,"id":1632},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":8,"q":"何項手法可以收集大量意見，但較易偏離主題：","opts":{"A":"層別法","B":"柏拉圖","C":"查檢表","D":"腦力激盪法","E":"管制圖"},"ans":"D","ansText":null,"expl":"腦力激盪：自由發想、意見量大，但天馬行空容易偏離主題。","flag":false,"id":1633},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":9,"q":"何者非基本品質七工具：","opts":{"A":"直方圖","B":"柏拉圖","C":"關連圖","D":"特性要因圖","E":"管制圖"},"ans":"C","ansText":null,"expl":"關連圖是「新」QC七手法，不在基本（舊）七工具內。","flag":false,"id":1634},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":10,"q":"何項品管工具無需使用現場數據：","opts":{"A":"直方圖","B":"柏拉圖","C":"散佈圖","D":"管制圖","E":"因果圖"},"ans":"E","ansText":null,"expl":"因果圖（魚骨圖）靠腦力激盪整理原因，不需數據；其餘四種都要有現場數據才畫得出來。","flag":false,"id":1635},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":11,"q":"製作直方圖時，取樣 n=100，試問要分成幾組數據：","opts":{"A":"5 組","B":"7.64 組","C":"8 組","D":"12 組","E":"以上皆非"},"ans":"C","ansText":null,"expl":"史特吉斯公式 K=1+3.32·log n=1+3.32×2=7.64，組數要取整數 → 約 8 組。7.64 是陷阱——組數不能有小數。","flag":false,"id":1636},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":12,"q":"何項品管工具經「腦力激盪法」而更容易與成功：","opts":{"A":"直方圖","B":"柏拉圖","C":"散佈圖","D":"魚骨圖","E":"管制圖"},"ans":"D","ansText":null,"expl":"魚骨圖的原因展開靠團隊腦力激盪，兩者搭配使用。","flag":false,"id":1637},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":13,"q":"運用團體思考問題時，常用「腦力激盪法」，何者非此法之運作原則：","opts":{"A":"歡迎互相批評","B":"主持人帶頭發出想法","C":"意見越多越好","D":"天馬行空之想法也不錯","E":"鼓勵順著他人意見，發展自己創意"},"ans":"A","ansText":null,"expl":"腦力激盪的鐵則是「嚴禁批評」，其餘皆是原則（量重於質、自由奔放、搭便車）。","flag":false,"id":1638},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":14,"q":"何者為直方圖之用途：","opts":{"A":"計算不合格率","B":"測知製程穩定","C":"檢查是否混入兩個不同群體","D":"檢查數據之偏態或常態分佈","E":"以上皆是"},"ans":"E","ansText":null,"expl":"直方圖可看分布形狀（常態/偏態）、雙峰（混入兩群體）、與規格比較估不合格率、判斷製程狀況——以上皆是。","flag":false,"id":1639},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":15,"q":"特性要因圖是誰發明的：","opts":{"A":"修瓦特","B":"戴明","C":"朱蘭","D":"石川馨","E":"費根堡"},"ans":"D","ansText":null,"expl":"特性要因圖＝石川圖＝魚骨圖，石川馨發明。修瓦特→管制圖；費根堡→TQC。","flag":false,"id":1640},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":16,"q":"品管七手法中，用以明確整理出各種因果關係之最常用且有效手法為：","opts":{"A":"管制圖","B":"層別法","C":"特性要因圖","D":"散佈圖","E":"直方圖"},"ans":"C","ansText":null,"expl":"整理「因果關係」→ 特性要因圖。","flag":false,"id":1641},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":17,"q":"下列何者屬於運用成對數據之分析手法：","opts":{"A":"管制圖","B":"層別法","C":"特性要因圖","D":"散佈圖","E":"直方圖"},"ans":"D","ansText":null,"expl":"「成對數據」(x,y) → 散佈圖。","flag":false,"id":1642},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":18,"q":"何者非「腦力激盪法」之原則：","opts":{"A":"修出奔放、無窮的創意","B":"歡迎對他人的創意，作補充或改善","C":"禁止做任何批評","D":"盡量提出自己的創意","E":"看法與討論不能有不同之角度或意見"},"ans":"E","ansText":null,"expl":"腦力激盪鼓勵不同角度的看法，(E)說「不能有不同角度」違反原則。","flag":false,"id":1643},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":19,"q":"柏拉圖之應用，以下何者錯誤：","opts":{"A":"可計算出製程變異之大小","B":"可找出真正影響的 2-3 項大原因","C":"可從中獲得情報，採取對策","D":"可搭配特性要因圖使用","E":"可決定改善目標，找出問題點"},"ans":"A","ansText":null,"expl":"柏拉圖是排序找重點用的，無法計算製程變異大小（那是標準差／管制圖的事）。","flag":false,"id":1644},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":20,"q":"柏拉圖最重要目的為何：","opts":{"A":"了解每一項產品之影響度","B":"鑑別重點之不合格項目","C":"檢討降低每一項產品之不合格率","D":"了解製程之集中趨勢與離中趨勢","E":"判定品質是否在製程穩定下受到管制"},"ans":"B","ansText":null,"expl":"柏拉圖核心：抓「重點少數」——鑑別最重要的不合格項目優先改善，不是每一項都處理。","flag":false,"id":1645},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":21,"q":"品管七手法中，哪個手法可以用來處理屬性資料：","opts":{"A":"直方圖","B":"管制圖","C":"魚骨圖","D":"散佈圖","E":"柏拉圖"},"ans":"C","ansText":null,"expl":"魚骨圖整理的是原因（語言／屬性資料），不需數值數據；直方圖、散佈圖等都要計量數據。","flag":false,"id":1646},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":22,"q":"何者非查檢表製作應注意事項：","opts":{"A":"決定查檢表之完美","B":"決定紀錄之方式","C":"決定查檢表的格式","D":"決定查檢與人員的方法","E":"決定查檢的頻率"},"ans":"A","ansText":null,"expl":"查檢表求簡單實用、符合目的，不是追求「完美」；格式、記錄方式、人員、頻率才是設計重點。","flag":false,"id":1647},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":23,"q":"工業界設計一些措施，為防止錯誤發生使用何種手法：","opts":{"A":"管制圖","B":"柏拉圖","C":"防呆法","D":"系統圖法","E":"以上皆是"},"ans":"C","ansText":null,"expl":"防止錯誤發生 → 防呆法（Poka-Yoke，愚巧法）。","flag":false,"id":1648},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":24,"q":"品管七大手法可看出因果關聯性，並計算出相關程度者為何項手法：","opts":{"A":"直方圖","B":"管制圖","C":"魚骨圖","D":"散佈圖","E":"柏拉圖"},"ans":"D","ansText":null,"expl":"關鍵在「計算出相關程度」→ 散佈圖（可算相關係數 r）。魚骨圖只能定性整理因果，算不出程度。","flag":false,"id":1649},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":25,"q":"有關散佈圖之敘述何者正確：","opts":{"A":"發現因果關係","B":"橫軸為因","C":"縱軸為果","D":"以上皆是","E":"以上皆非"},"ans":"D","ansText":null,"expl":"散佈圖慣例：橫軸放原因(x)、縱軸放結果(y)，用來觀察因果（相關）關係——三者皆對。","flag":false,"id":1650},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":26,"q":"品管七大手法中，下列何者為非：","opts":{"A":"利用柏拉圖，選擇重要問題","B":"利用直方圖，以便全盤瞭解","C":"利用查檢表，以便記錄、檢查所收集之資料","D":"利用散佈圖，以便從現況選擇重大要因","E":"利用管制圖，隨著時間推移，從圖示中檢討變異"},"ans":"D","ansText":null,"expl":"「選擇重大要因」是柏拉圖／特性要因圖的工作；散佈圖是看兩變數相關性，不是選要因。","flag":false,"id":1651},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":27,"q":"某汽水製罐廠有三條新生產線，同步試車生產相同之鋁罐身，三月份試車後發現罐身破裂率高達 15%，欲降低此種不良率，問用何種方法：","opts":{"A":"柏拉圖","B":"抽樣檢驗","C":"查檢表","D":"層別法","E":"管制圖"},"ans":"D","ansText":null,"expl":"三條生產線做相同產品 → 先「按生產線層別」比較，找出不良集中在哪條線。看到「多條機台／線別」就想層別法。","flag":false,"id":1652},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":28,"q":"有關特性要因圖之應用，何者不正確：","opts":{"A":"分析原因與結果之關係","B":"協助解決問題","C":"排列改進優先順序","D":"一種動態隨時修正之資訊","E":"一種多層展開分析工具"},"ans":"C","ansText":null,"expl":"「排優先順序」是柏拉圖的功能，不是魚骨圖。魚骨圖是可隨時增修的多層展開因果分析工具。","flag":false,"id":1653},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":29,"q":"有關散佈圖之敘述何者正確：","opts":{"A":"發現因果關係","B":"圖之橫軸為人名","C":"圖之縱軸為人名","D":"可收一目了然之效","E":"r＝1 為完全負相關"},"ans":"A","ansText":null,"expl":"散佈圖用於發現因果（相關）關係。軸放的是變數不是人名；r=1 是完全「正」相關（完全負相關是 r=−1）。","flag":false,"id":1654},{"src":"甲｜七大手法練習題","ch":"練習題-1","type":"single","num":30,"q":"品管七手法中最適合生產線上作業員使用且易於了解之手法為：","opts":{"A":"層別法","B":"柏拉圖","C":"查檢表","D":"腦力激盪法","E":"管制圖"},"ans":"C","ansText":null,"expl":"查檢表最簡單、現場作業員打勾畫正字即可，是最易上手的手法。","flag":false,"id":1655},{"src":"乙｜品質概念(考題)","ch":"品質觀念與演化","type":"single","q":"「品質」觀念的演化歷史為","opts":{"A":"領班的品質管制→作業員的品質管制→檢驗員的品質管制→全面品質保證","B":"作業員的品質管制→檢驗員的品質管制→領班的品質管制→全面品質保證","C":"作業員的品質管制→領班的品質管制→檢驗員的品質管制→全面品質保證","D":"檢驗員的品質管制→作業員的品質管制→領班的品質管制→全面品質保證"},"ans":"C","ansText":null,"expl":"「誰來管品質」的演化：1900年代作業員自管→1920年代設領班監督→裝配線時代設專任檢驗員→最後走向全面品質保證。口訣：作→領→檢→全。","flag":false,"num":1,"id":1656},{"src":"乙｜品質概念(考題)","ch":"品質觀念與演化","type":"single","q":"「品質」觀念的演化為","opts":{"A":"品質是製造出來的→品質是檢查出來的→品質是設計出來的→品質是管理出來的","B":"品質是檢查出來的→品質是製造出來的→品質是設計出來的→品質是管理出來的","C":"品質是製造出來的→品質是設計出來的→品質是檢查出來的→品質是管理出來的","D":"品質是檢查出來的→品質是製造出來的→品質是管理出來的→品質是設計出來的"},"ans":"B","ansText":null,"expl":"觀念演化順序：檢查（1900s）→製造（1940s SQC）→設計（二戰）→管理（1960s TQC）→習慣（1980s）。與上一題「誰來管」的順序是兩條不同的線，別背混。","flag":false,"num":2,"id":1657},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"「柏拉圖」的導入者為","opts":{"A":"戴明(Deming)","B":"裘蘭(Juran)","C":"費根堡(Feigenbaum)","D":"石川馨(Ishikawa)"},"ans":"B","ansText":null,"expl":"柏拉圖原理由經濟學家 Pareto 提出，但把它「導入品管」（重要的少數、瑣細的多數）的是裘蘭 Juran。","flag":false,"num":3,"id":1658},{"src":"乙｜品質概念(考題)","ch":"TQM與品質管理","type":"single","q":"品質規劃之首要工作在於","opts":{"A":"參與設計評核活動","B":"決定製程能力","C":"評估供應商之品質系統","D":"鑑定顧客並決定顧客之需求"},"ans":"D","ansText":null,"expl":"裘蘭品質三部曲中「品質規劃」的第一、二步就是：確認顧客→發現顧客需求。品質規劃從顧客出發。","flag":false,"num":4,"id":1659},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"「品管圈」的導入者為","opts":{"A":"克勞斯比(Crosby)","B":"裘蘭(Juran)","C":"費根堡(Feigenbaum)","D":"石川馨(Ishikawa)"},"ans":"D","ansText":null,"expl":"石川馨＝日本品管圈之父（1962《現場與品管》創刊、1963 舉辦發表會），另發明特性要因圖（魚骨圖）、倡導 CWQC。","flag":false,"num":5,"id":1660},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"提出零缺點(ZD)制度為","opts":{"A":"戴明(Deming)","B":"克勞斯比(Crosby)","C":"費根堡(Feigenbaum)","D":"石川馨(Ishikawa)"},"ans":"B","ansText":null,"expl":"零缺點（ZD）＝克勞斯比 Crosby（1961），著有《品質免費》，主張第一次就做對、預防勝於檢驗。","flag":false,"num":6,"id":1661},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"下列敘述何者為錯誤？","opts":{"A":"Juran 提出品質三部曲","B":"Deming 提出 PDCA 循環","C":"Shewhart 提出管制圖之觀念","D":"Pareto 提出柏拉圖"},"ans":"D","ansText":null,"expl":"柏拉圖（品管工具）是 Juran 導入品管的；Pareto 是義大利經濟學家，提出的是 80/20 所得分配觀察，並沒有提出「柏拉圖」這個品管手法。其餘三項皆正確。","flag":false,"num":7,"id":1662},{"src":"乙｜品質概念(考題)","ch":"Kano模式","type":"single","q":"使用 KANO 的二元性品質需求模式，請問在產品生命週期的成熟期時，企業最需加強哪一類品質需求？","opts":{"A":"應該的品質需求","B":"魅力的品質需求","C":"反品質需求","D":"無差異的品質需求"},"ans":"B","ansText":null,"expl":"成熟期市場競爭者眾、基本功能大家都有（應該品質已是門檻），要靠「魅力品質」創造驚喜、做出差異化才能勝出。","flag":false,"num":8,"id":1663},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"全面品質管制的創始人是","opts":{"A":"裘蘭","B":"費根堡","C":"戴明","D":"石川馨"},"ans":"B","ansText":null,"expl":"費根堡 Feigenbaum 於 1951 年提出 TQC（全面品質管制）；石川馨後來在日本發展為 CWQC（全公司品質管制）。","flag":false,"num":9,"id":1664},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"主張利用品質損失函數做為品質績效評估的品管大師為","opts":{"A":"石川馨","B":"田口玄一","C":"費根堡","D":"蕭華特"},"ans":"B","ansText":null,"expl":"田口玄一＝品質工程／損失函數：品質是產品出廠後對社會造成的損失，偏離規格中心愈遠損失愈大（拋物線）。","flag":false,"num":10,"id":1665},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"下列哪一項目不包括在戴明十四項原則之中？","opts":{"A":"區分可控制與不可控制因素","B":"採用新哲學","C":"停止依賴大量檢驗","D":"打破部門間障礙"},"ans":"A","ansText":null,"expl":"「區分可控制與不可控制（管理可控 vs 作業員可控）因素」是裘蘭的觀念。採用新哲學、停止依賴大量檢驗、打破部門間障礙都在戴明十四點內。","flag":false,"num":11,"id":1666},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"哪位品質大師於「品質免費」一書中，提出第一次就做好(Do it right the first time)的口號？","opts":{"A":"田口玄一(Taguchi)","B":"戴明(Deming)","C":"裘蘭(Juran)","D":"克勞斯比(Crosby)"},"ans":"D","ansText":null,"expl":"《品質免費》（Quality is Free，1983）＝克勞斯比；「第一次就做好」是其品管四大定理之一（品質＝符合要求標準）。","flag":false,"num":12,"id":1667},{"src":"乙｜品質概念(考題)","ch":"TQM與品質管理","type":"single","q":"全面品質管理中，用以連結產品設計與生產製程以提升品質水準的工具或方法為","opts":{"A":"品管圈","B":"驗收抽樣計劃","C":"品質機能展開","D":"統計製程管制"},"ans":"C","ansText":null,"expl":"QFD 品質機能展開：把顧客需求（VOC）轉換展開到設計、零件、製程、生產的工具，正是「連結產品設計與生產製程」的橋樑。","flag":false,"num":13,"id":1668},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"提出穩健設計(Robust design)觀念是那一位學者？","opts":{"A":"田口玄一(Taguchi)","B":"裘蘭(Juran)","C":"戴明(Deming)","D":"石川馨(Ishikawa)"},"ans":"A","ansText":null,"expl":"穩健設計（Robust design）＝田口玄一：透過參數設計使產品品質對雜訊不敏感（變異小、成本低）。","flag":false,"num":14,"id":1669},{"src":"乙｜品質概念(考題)","ch":"TQM與品質管理","type":"single","q":"中華民國國家品質獎的評審是以何者的推行為核心？","opts":{"A":"TQM","B":"Six Sigma","C":"QCC","D":"TQC"},"ans":"A","ansText":null,"expl":"中華民國國家品質獎以「全面品質管理（TQM）」的推行為評審核心。","flag":false,"num":15,"id":1670},{"src":"乙｜品質概念(考題)","ch":"品質觀念與演化","type":"single","q":"下列哪一項關於品質之敘述為非？","opts":{"A":"「顧客」是指受到產品或製(流)程影響之任何人","B":"現代化的品質觀念追求的是「符合規格」","C":"品質的意涵會隨著時間和環境變遷而有所改變","D":"「品質保證」屬於事前之品質管理手法"},"ans":"B","ansText":null,"expl":"「符合規格」是 Crosby 時代的舊定義；現代品質觀念追求的是顧客滿意／適用性（甚至超越顧客期望）。QA 屬事前（前饋）是正確敘述。","flag":false,"num":16,"id":1671},{"src":"乙｜品質概念(考題)","ch":"品管大師","type":"single","q":"二次大戰時，美國要求軍事產品需為零缺點，請問此為哪一位學者之觀點？","opts":{"A":"蕭華特","B":"戴明","C":"克勞斯比","D":"裘蘭"},"ans":"C","ansText":null,"expl":"零缺點（ZD）＝克勞斯比（實際上是 1961~62 年馬丁公司飛彈計畫時提出，題幹「二次大戰」為題目慣用敘述），核心：軍事產品不容許缺點、第一次就做對。","flag":false,"num":17,"id":1672},{"src":"乙｜品質概念(考題)","ch":"Kano模式","type":"single","q":"根據狩野模式(Kano model)的主張，當產品或服務愈充分，顧客會愈高興。試問顧客滿意度與下列何種品質要素之具備程度成正比？","opts":{"A":"必要品質(must-be quality)","B":"魅力品質(attractive quality)","C":"無差異品質(indifferent quality)","D":"一維品質(one-dimensional quality)"},"ans":"D","ansText":null,"expl":"「成正比（線性）」＝一維品質：具備愈多愈滿意、不具備就不滿意（如加量不加價）。必要品質做好不加分；魅力品質沒有也不會不滿意。","flag":false,"num":18,"id":1673},{"src":"乙｜品質概念(考題)","ch":"TQM與品質管理","type":"single","q":"關於 PDCA 循環，下列敘述，何者正確？","opts":{"A":"教育訓練屬於實施(do)階段","B":"效果確認與標準化屬於查核(check)階段","C":"訂定產品的品質水準屬於處置(action)階段","D":"決定是否採取矯正行動屬於計畫(plan)階段"},"ans":"A","ansText":null,"expl":"教育訓練＝實施（Do）階段。B 錯：效果確認屬 Check、但標準化屬 Action；C 錯：訂品質水準屬 Plan；D 錯：決定矯正行動屬 Action。","flag":false,"num":19,"id":1674},{"src":"乙｜品質概念(考題)","ch":"TQM與品質管理","type":"single","q":"品質管制與品質保證的說明何者正確?","opts":{"A":"品質管制為回饋系統(feedback)，品質保證為前饋系統(feed forward)","B":"品質管制著重事前的管理（產品開發階段），品質保證則著重事後的管理（產品在製程中或已完成）","C":"品質管制的範疇涵蓋品質保證","D":"品質管制等同於品質管理"},"ans":"A","ansText":null,"expl":"QC＝製程中量測、比較、矯正＝回饋系統；QA＝事前預防、建立讓顧客信賴的體系＝前饋系統。B 把兩者顛倒；範疇上品質管理⊃品質保證⊃品質管制，故 C、D 皆錯。","flag":false,"num":20,"id":1675},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"成功的品管圈計畫，應該獲得下列所有的效益，除了","opts":{"A":"改善操作員的士氣","B":"減少維持品質所需的管理活動","C":"改善管理者與品管圈人員的溝通","D":"參考解決問題而獲得的成本節省","E":"以上皆是"},"ans":"B","ansText":null,"expl":"品管圈能提升士氣、改善溝通、節省成本，但「維持品質所需的管理活動」不會因此減少——主管的參與、輔導與評價反而是活動成功的關鍵，管理投入不減反增。","flag":false,"num":1,"id":1676},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"下列何項不是管理所引發的錯誤?","opts":{"A":"優先權衝突的負擔","B":"作業員能力的缺乏","C":"管理不關心或冷淡","D":"矛盾的品質規格","E":"工作空間，設備與環境"},"ans":"B","ansText":null,"expl":"依裘蘭的分類，錯誤分「管理可控」與「作業員可控」：優先權衝突、管理冷淡、矛盾規格、工作環境都是管理面造成；「作業員能力（技巧）的缺乏」屬作業員面的技術性錯誤。","flag":false,"num":2,"id":1677},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"下列各人員中，以誰來發起品質管制的專案改善工作，成功的機會比較大？","opts":{"A":"具合格證書的品管工程師","B":"訂定有合約者","C":"公司或機構的決策者","D":"有經驗的品管經理"},"ans":"C","ansText":null,"expl":"品質改善活動成敗的第一關鍵＝高階主管（決策者）的支持與發起——有資源、有政策高度，全員才會動起來。","flag":false,"num":3,"id":1678},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"製程中，有關的工程技術資料，當需要加以變更時，誰可以在圖面上直接刪改？","opts":{"A":"誰發現，誰改","B":"廠長、品管部門主管","C":"管理圖面的人","D":"設計部門經理與各單位主管協調或決議後統一更改"},"ans":"D","ansText":null,"expl":"工程圖面屬管制文件，變更須經設計權責單位與相關單位協調決議後統一修改（文件變更管制），不能個人逕自刪改。","flag":false,"num":4,"id":1679},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"品管圈的活動應求：","opts":{"A":"自我發揮","B":"排除異己","C":"和諧氣氛","D":"唯命是從"},"ans":"C","ansText":null,"expl":"老師解答：(3) 和諧氣氛。品管圈精神在尊重人性、建立明朗愉快（和諧）的工作現場；「排除異己」「唯命是從」違背精神，「自我發揮」是誘答——圈活動強調的是團隊和諧氣氛下的相互啟發。","flag":false,"num":5,"id":1680},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"為逐步誘導品質管制人員，使其具備努力執行品管作業以發揮最佳績效的意願，最有效的長期鼓勵措施與最好的誘因為：","opts":{"A":"發給獎金","B":"公開口頭稱讚","C":"私下口頭稱讚","D":"公開口頭稱讚並同時給予適度的獎金"},"ans":"D","ansText":null,"expl":"長期激勵要精神（公開表揚）與物質（適度獎金）並用：只給獎金會鈍化、只稱讚少了實質回饋；齊頭式或單一手段都缺乏長期激勵效果。","flag":false,"num":6,"id":1681},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"下列方法中哪一項對於改進員工效率、改善員工氣氛以提升產品品質與公司利潤，長期而言最為有效？","opts":{"A":"提供各項獎金、稱讚、分紅等誘因","B":"嚴格紀律以消除錯誤、懶散與草率","C":"透過發展公司與員工間具體的品質目標以建立具有建設性的態度","D":"強調態度上的誘導，對於各項激勵的誘因、紀律與要求則審慎的加以應用"},"ans":"C","ansText":null,"expl":"長期而言，靠公司與員工「共同訂定具體品質目標」建立建設性態度（方針管理／目標共有）最有效；單靠誘因或紀律都是短期手段。","flag":false,"num":7,"id":1682},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"某公司實施 QCC 制度，下列哪一項品質成本可能不降低卻反而增加，且增加之幅度最大？","opts":{"A":"預防成本","B":"評鑑成本","C":"內部失敗成本","D":"外部失敗成本"},"ans":"A","ansText":null,"expl":"QCC＝教育訓練、圈會、改善活動，都屬「預防成本」的投入，所以預防成本上升；換來的是內外部失敗成本（報廢、客訴）下降。","flag":false,"num":8,"id":1683},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"品管圈是：","opts":{"A":"要對品質負責","B":"全面品質管制","C":"一群自動自發之作業人員組織而成","D":"美國蕭華特博士所創始的"},"ans":"C","ansText":null,"expl":"品管圈＝同一工作場所的人員「自動自發（志願）」組成的小團體。創始人是日本石川馨（不是蕭華特）；品管圈只是 TQC/CWQC 的一環，也不是要單獨對品質負全責。","flag":false,"num":9,"id":1684},{"src":"乙｜品管圈(考題)","ch":"品管圈活動","type":"single","q":"將業務作業方式做重大革新，從根本重新思考、重新設計的是下列哪一項技術？","opts":{"A":"流程再造","B":"持續改善","C":"全面品質管理","D":"國際品質標準"},"ans":"A","ansText":null,"expl":"「根本重新思考、徹底重新設計、重大革新」＝流程再造（BPR）的定義關鍵字；持續改善（Kaizen）是漸進式小步改善，方向相反。","flag":false,"num":10,"id":1685},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"「改善提案」之意是","opts":{"A":"先改善後提案","B":"先提案後改善","C":"改善與提案同時進行","D":"依個案而定"},"ans":"A","ansText":null,"expl":"改善提案＝提案人自己先完成改善再提案（現行制度方向）；提案改善＝先提案、改善由被建議單位執行（早期提案箱制度）。記法：「案」字在後＝改善已完成。","flag":false,"num":1,"id":1686},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"目標著重公司制度與作業程序的改善，這是屬於改善的哪一個層次？","opts":{"A":"個人導向的改善","B":"團體導向的改善","C":"管理導向的改善"},"ans":"C","ansText":null,"expl":"改善三層次：管理導向＝公司制度與作業程序（專案團隊）；團體導向＝工作現場作業（品質小組）；個人導向＝個人本身工作範圍。","flag":false,"num":2,"id":1687},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"下列提案應作不受理決定的是","opts":{"A":"提升顧客滿意度","B":"呆滯料之利用","C":"相關業務之改善","D":"對單位或個人批評"},"ans":"D","ansText":null,"expl":"不受理範圍：非建設性、對單位或個人批評攻擊、無具體內容、重複提案、上級指示事項、個人薪資人事問題等。顧客滿意、呆廢料利用、業務改善都是受理範圍。","flag":false,"num":3,"id":1688},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"提案制度之目的在於","opts":{"A":"提高員工士氣","B":"追求經濟效益","C":"提升創意思考能力","D":"以上皆是"},"ans":"D","ansText":null,"expl":"提案制度三大目的：提升創造性的構想、求取經濟效益、提高工作士氣——三者皆是，選「以上皆是」。","flag":false,"num":4,"id":1689},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"改善的內容與提案人的學經歷之相比較程度，是改善提案評審要點之一，它屬於哪一項評審項目？","opts":{"A":"問題意識","B":"創意構想","C":"努力程度","D":"改善成果"},"ans":"C","ansText":null,"expl":"拿改善內容跟提案人的學經歷（能力水準）相比，看他付出多少＝「努力程度」（配分 30 分；問題意識 10、創意 20、成果 40）。","flag":false,"num":5,"id":1690},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"下列何者不是全面品質管理(TQM)常用的激勵活動？","opts":{"A":"目標管理","B":"品管圈","C":"無缺點計畫","D":"提案改善制度"},"ans":"A","ansText":null,"expl":"TQM 常用激勵活動＝品管圈、無缺點計畫（ZD）、提案改善制度（由下而上、激發參與）；目標管理（MBO）是由上而下的管理制度，不屬激勵活動。","flag":false,"num":6,"id":1691},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"下列何者不是進行參與管理(Management by Objectives, MBO)時的常用方法?","opts":{"A":"提案制度","B":"品管圈活動","C":"計畫評核術","D":"目標管理"},"ans":"C","ansText":null,"expl":"參與管理常用：提案制度、品管圈、目標管理（讓員工參與訂目標、提意見）；計畫評核術（PERT）是專案時程規劃技術，與參與管理無關。","flag":false,"num":7,"id":1692},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"腦力激盪法(Brain Storming)進行中所要注意的四大原則不包括","opts":{"A":"嚴禁批判","B":"自由發想","C":"質重於量","D":"結合改善"},"ans":"C","ansText":null,"expl":"BS 四大原則：嚴禁批判、自由發想、「量重於質」（先撒網大量發想）、結合改善（搭便車）。「質重於量」剛好講反，是本題陷阱。","flag":false,"num":8,"id":1693},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"特性列舉法用於產品研發、設計改善，一一列出然後檢討每一項特性，是否有改良之處。但不包括","opts":{"A":"名詞特性","B":"形容詞特性","C":"代名詞特性","D":"動詞特性"},"ans":"C","ansText":null,"expl":"特性列舉法列的是：名詞特性（材質、部位）、形容詞特性（性質）、動詞特性（機能動作）三種——沒有「代名詞特性」。","flag":false,"num":9,"id":1694},{"src":"乙｜提案制度(考題)","ch":"提案改善制度","type":"single","q":"提案成功的關鍵掌握三個發展階段，對於「質的提升」屬於","opts":{"A":"企劃階段","B":"能力開發階段","C":"默契形成階段","D":"成果階段"},"ans":"B","ansText":null,"expl":"三個發展階段：企劃階段＝量的提升（養成改善習慣）→能力開發階段＝質的提升（強化解決問題與創造思考能力）→成果階段＝質量並重＋指導能力。","flag":false,"num":10,"id":1695},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"有關 ISO 9000 系列標準之驗證程序，以下說明何者正確？","opts":{"A":"認證機構為各國的主管機關，直接稽核並發與企業證書","B":"一般企業可用驗證(certified)或認證(accredited)來對外宣傳","C":"顧問公司是來協助企業內部人員建置品質系統的，沒有顧問公司協助則無法推動","D":"整個過程包括企業、顧問公司、驗證機構(certification body)與認證機構(accreditation body)等四個團體"},"ans":"D","ansText":null,"expl":"體系分工：驗證機構稽核企業並發證書；認證機構（如 TAF）認可驗證機構的資格，不直接發證給企業（A 錯）；企業取得的是「驗證」（B 混用錯）；顧問公司非必要（C 錯）。整個過程共四個團體（D 對）。","flag":false,"num":1,"id":1696},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"以下哪個關於 ISO 9000 系列的敘述是錯誤的？","opts":{"A":"公司一旦通過 ISO 9001 的驗證之後，必須定期接受稽核，以維持證書的有效性","B":"通過 ISO 9001 的驗證並不保證顧客就會對該公司完全滿意","C":"ISO 9000 系列的內容都著重在品質的改善活動","D":"ISO 9001 的證書並不能保證產品的品質"},"ans":"C","ansText":null,"expl":"ISO 9000 系列著重的是「品質管理系統的要求與保證」（把制度寫下來、照著做、留紀錄），不是品質改善活動本身，故 C 錯誤。定期追查稽核、不保證顧客滿意、不保證產品品質皆為正確敘述。","flag":false,"num":2,"id":1697},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"建立及維持 ISO 9000 品質系統時，通常會將公司的品質政策、目的、目標、範圍即使命等定義在下列哪一個文件當中？","opts":{"A":"工作說明書與作業標準書","B":"品質手冊","C":"作業程序書","D":"表單、資料與記錄"},"ans":"B","ansText":null,"expl":"品質手冊＝第一階文件，載明品質政策、目標、範圍與使命；程序書（二階）、作業標準書（三階）、表單紀錄（四階）依序往下展開。","flag":false,"num":3,"id":1698},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"有關新版 ISO 9001:2015 與 ISO 9001:2008 之差異及其改版重點，不包括下列哪一項？","opts":{"A":"勞資契約關係","B":"風險管理","C":"外包管制","D":"領導管理"},"ans":"A","ansText":null,"expl":"2015 改版重點：風險思維（取代預防措施）、外部提供（採購＋外包）管制、強化領導（刪管理代表）、文件化資訊等——沒有「勞資契約關係」。","flag":false,"num":4,"id":1699},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"關於品質系統標準的敘述，以下何者不正確?","opts":{"A":"ISO 9001 算是最通用的品質系統標準","B":"ISO/TS16949 是特別設計給通訊相關產業的品質系統標準","C":"在 TL9000 的標準中有部份與 ISO9001 的標準相同","D":"品質系統標準是在規範公司內部的品質管理系統應該要包括的內容"},"ans":"B","ansText":null,"expl":"ISO/TS 16949（現 IATF 16949）＝汽車產業供應鏈的品質系統標準；通訊（電信）業用的是 TL 9000。B 張冠李戴。","flag":false,"num":5,"id":1700},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"一個公司通過了 ISO 9000 系列的驗證，通常會在公司員工的名片或是產品包裝上印刷相關字樣，以下哪一個寫法是正確的?","opts":{"A":"本公司榮獲 ISO 9000 國際品保認證","B":"本公司品保制度榮獲 ISO 9001:2015 驗證","C":"本產品已取得 ISO 9001:2015 認證","D":"以上的寫法都是正確的"},"ans":"B","ansText":null,"expl":"三個判斷點：驗的是「品保制度」不是產品（C 錯）；通過的是 ISO 9001（9000 是系列總稱與指導綱要，不能驗證）；企業取得的是「驗證」不是「認證」（A 錯）。","flag":false,"num":6,"id":1701},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"下列有關國際品質標準認證觀念，何者陳述不正確？","opts":{"A":"ISO 9000 系列品質標準由國際標準組織的技術委員會於 1987 年所擬定，是一種具強制性的國際標準","B":"ISO 9000(2000年版)將 20 項品質要素精簡為流(過)程導向模式","C":"ISO 9000(2008年版)以八項品質管理原則為理論基礎","D":"ISO 9000(2015年版)刪除管理代表規定"},"ans":"A","ansText":null,"expl":"1987 年由 ISO 技術委員會擬定沒錯，但 ISO 標準是「自願性」標準、不具強制性，故 A 不正確。2000 版流程導向、2008 版八項原則、2015 版刪管理代表皆正確。","flag":false,"num":7,"id":1702},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"ISO/TS 16949 品質管理體系(QMS)標準適用於下列那一產業的供應鏈？","opts":{"A":"食品產業","B":"醫療器材","C":"航太產業","D":"汽車產業"},"ans":"D","ansText":null,"expl":"ISO/TS 16949（現 IATF 16949）＝汽車產業供應鏈。食品＝ISO 22000；醫材＝ISO 13485；航太＝AS 9100。","flag":false,"num":8,"id":1703},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"下列關於 ISO 敘述何者不正確？","opts":{"A":"ISO 9001：以提高顧客滿意度及持續性改善為重點","B":"ISO 14000：與環境管理技術、工具、方法與策略有關","C":"ISO 22000：適用於食品供應鏈範圍內所有類型的組織","D":"ISO 27001：與醫療器材產業有關"},"ans":"D","ansText":null,"expl":"ISO/IEC 27001＝資訊安全管理系統（ISMS），與醫療器材無關；醫療器材是 ISO 13485。其餘敘述皆正確。","flag":false,"num":9,"id":1704},{"src":"乙｜ISO品質管理系統(考題)","ch":"ISO 9000系列與驗證","type":"single","q":"ISO 9001：2015 年版中涵蓋了品質管理相關學說的七項原則何者為非?","opts":{"A":"關係管理導向","B":"顧客導向","C":"流程導向","D":"系統管理導向"},"ans":"D","ansText":null,"expl":"2015 版由八項原則精簡為七項：刪除「系統管理（管理的系統方法）」併入流程導向；「供應商互利關係」改為「關係管理」。故「系統管理導向」已不在七項原則內。","flag":false,"num":10,"id":1705},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"每一職位必須要有職位說明書，這是屬於組織的那一原則","opts":{"A":"權力原則","B":"定義原則","C":"職責原則","D":"目標原則","E":"授權原則"},"ans":"B","ansText":null,"expl":"定義原則指組織中每一職位之職掌、權責均應以書面（職位說明書）明確定義。","flag":false,"num":1,"id":1706},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"品質管制部門不能對下列那項工作負責","opts":{"A":"準備品管作業手冊","B":"定期向上級提出報告","C":"重要品質問題決定","D":"完成品管計劃與制度","E":"實施品管方法及品管概念之訓練"},"ans":"C","ansText":null,"expl":"重要品質問題之決定屬高階經營層（或品管委員會）權責，非品管部門單獨負責。","flag":false,"num":2,"id":1707},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"書面協調主要優點為何?","opts":{"A":"使協調快速","B":"使臨時事項受重視","C":"減少協調作業之繁雜","D":"使平常性協調事項順利受重視","E":"以上皆是"},"ans":"D","ansText":null,"expl":"書面協調適用於例行性、平常性之協調事項，使其順利進行並受重視。","flag":false,"num":3,"id":1708},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"為使品管部門發揮更大的效果，它應該隸屬","opts":{"A":"廠長之幕僚","B":"技術部門","C":"製造部門","D":"品管委員會","E":"為其他一級幕僚單位"},"ans":"E","ansText":null,"expl":"依 Day3 官方解答為 (E)：品管部門應為其他一級幕僚單位，獨立於製造體系之外方能發揮效果。","flag":false,"num":4,"id":1709},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"下列各項工作，那一項應非品質管制委員會之任務","opts":{"A":"介紹推行及訓練有關之品管業務","B":"管制圖的繪製及識別","C":"核定品質標準","D":"核定作業標準","E":"負品管追查責任"},"ans":"B","ansText":null,"expl":"管制圖之繪製及識別屬現場執行層工作，非委員會之決策協調任務。","flag":false,"num":5,"id":1710},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"對製造公司而言應最先規劃的是","opts":{"A":"人力資源","B":"成本分析","C":"銷售需求預測","D":"交貨速度"},"ans":"C","ansText":null,"expl":"製造公司之規劃以銷售需求預測為起點，據以安排產能與資源。","flag":false,"num":6,"id":1711},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"所謂「滿足顧客期望」係從下列何者的觀點來看","opts":{"A":"企業經營者","B":"經銷商","C":"客戶","D":"供應商"},"ans":"C","ansText":null,"expl":"滿足顧客期望係站在客戶（顧客）的觀點來衡量。","flag":false,"num":7,"id":1712},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"在品管組織中兼顧職能劃分與目的劃分優點的方式是何種組織結構","opts":{"A":"矩陣式","B":"環圈式","C":"簡單式","D":"網路式"},"ans":"A","ansText":null,"expl":"矩陣式組織兼具職能別與目的（專案／產品）別劃分之優點。原卷印為「距陣式」應為「矩陣式」之誤。","flag":false,"num":8,"id":1713},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"根據產品規格以訂定作業標準時，應以那一部門作為裁決者?","opts":{"A":"營業部門","B":"製造部門","C":"技術部門","D":"總經理","E":"董事長"},"ans":"B","ansText":null,"expl":"依 Day3 官方解答為 (B) 製造部門：作業標準由實際執行作業之製造部門裁決訂定（技術部門提供產品規格依據）。","flag":false,"num":9,"id":1714},{"src":"乙｜練習題(第九堂課)","ch":"品管組織","type":"single","q":"預防組織設立的觀點是為了","opts":{"A":"可靠性試驗","B":"檢驗工作改善","C":"預防儀器偏差","D":"缺點 指該電表","opts":{"A":"壽命為1.0×10年","B":"誤差在滿刻度±1%以內","C":"精密度為1.0刻度以內","D":"於1sec內指出滿刻度"},"ans":"B","ansText":null,"expl":"CLASS 1.0＝準確度等級，誤差在滿刻度 ±1% 以內。→ 乙二十七§8（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）（《電子儀表》5-1 #15 官方解答一致）","flag":false,"num":2,"id":1788},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"各種量測儀器為何要週期性實施校驗工作。","opts":{"A":"美軍規範中有規定","B":"因器具用久了以後精密度會差影響產品品質","C":"因校驗工作人員要求校驗","D":"以上皆是"},"ans":"B","ansText":null,"expl":"週期校驗的理由是儀器使用後精度劣化會影響產品品質；規範要求或人員要求都不是根本理由。→ 乙二十七§6（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":3,"id":1789},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"如果一個試驗數據無法支持品管工程師的期望值，則最好做下列何事?","opts":{"A":"如果數據只有微小差距，我們可調整數據來支持期望者","B":"省略無法支持結論對數據，來作期望之結論","C":"根據試驗的數據重新求出期望值","D":"告知該數據與期望之結論此不相關"},"ans":"C","ansText":null,"expl":"數據不可調整或省略；應依據試驗數據重新求出期望值。→ 乙二十七§10（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":4,"id":1790},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"在決定是否零件的抽樣檢驗較百分之百檢驗經濟時，必需決定下列各項，何者除外","opts":{"A":"檢驗零件的成本","B":"修正不良零件的成本","C":"不良品沒被發現的成本","D":"改善生產製程的成本"},"ans":"D","ansText":null,"expl":"抽樣 vs 全檢的經濟比較只看檢驗成本、修正成本、漏檢成本；改善製程的成本與此決策無關。→ 乙二十七§2（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":5,"id":1791},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"檢驗計畫的目的是：","opts":{"A":"估計製程平均值","B":"估計產品品質","C":"決定製程是否失控","D":"決定每批貨的品質是否達到預定之標準"},"ans":"D","ansText":null,"expl":"檢驗（驗收抽樣）的目的是判定批允收/拒收，不是估計品質也不是管制製程（那是管制圖）。→ 乙一§1、乙二十七§2（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":6,"id":1792},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"對某一零件何以會失效能提供答案的技術是:","opts":{"A":"FMEA","B":"FTA","C":"初期設計討論","D":"管制圖"},"ans":"A","ansText":null,"expl":"FMEA（失效模式與效應分析）由零件失效模式出發分析原因與影響；FTA 由頂端事件往下找原因。題問「某一零件何以會失效」→ FMEA。⚠️ 亦有教材以 FTA 作答，建議核對。（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":true,"num":7,"id":1793},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"MIL-I-45662規範中規定契約商之檢驗方式應如何?","opts":{"A":"必須依政府指定的檢驗程序及儀器檢驗","B":"應由第三家代理公司檢驗","C":"應使用政府部門所發展的檢驗程序及儀器檢驗","D":"可以使用任何自行決定之檢驗程序及儀器檢驗，但須經政府部門同意"},"ans":"D","ansText":null,"expl":"MIL-I-45662（校正系統要求）：契約商可自行決定檢驗程序與儀器，但須經政府同意。→ 乙二十七§6（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":8,"id":1794},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"國際標準制之基本單位中：","opts":{"A":"長度以mm","B":"時間以秒","C":"電流以mA","D":"溫度以 ℃"},"ans":"B","ansText":null,"expl":"SI 七基本單位：m、kg、s、A、K、cd、mol。mm、mA 不是基本單位，溫度基本單位是 K 不是 ℃。→ 乙二十七§7（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":9,"id":1795},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"對同一檢驗員而言，執行缺點率愈高之產品檢驗時，檢驗員犯錯之可能性如何?","opts":{"A":"較高","B":"較低","C":"無顯著差別","D":"無法判斷"},"ans":"A","ansText":null,"expl":"缺點率愈高，檢驗員負荷與判斷次數愈多，犯錯可能性愈高。→ 乙二十七§10（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":10,"id":1796},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"一個人檢驗同類產品之數十項缺點與檢驗數十項產品之單一缺點，之比較結果將如何?","opts":{"A":"效率完全一樣","B":"前者效率較後者差","C":"前者效率較後者佳","D":"無從判斷"},"ans":"B","ansText":null,"expl":"一人同時看數十項缺點，注意力分散、效率較差；單一缺點的專責檢驗效率較佳。→ 乙二十七§10（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":11,"id":1797},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"如何管制量測標準?A.為管制發展一套只有術語與數目的量測標準表。B.為量測標準決定校準區間與校準來源。C.保持適宜的環境條件，並保持對國際標準局準確的追溯性。","opts":{"A":"A.B","B":"A.C","C":"B.C","D":"A.B.C"},"ans":"C","ansText":null,"expl":"管制量測標準要決定校準區間/來源、維持環境並追溯至國家/國際標準；「只有術語與數目的標準表」無管制功能。→ 乙二十七§6（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":12,"id":1798},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"當用試驗儀器作量測時，精密度(precision)與準確度(accuracy)意義","opts":{"A":"相同","B":"相反","C":"分別是一致性(consistency)與正確性(correctness)","D":"分別是精確性(exactness)與追溯性(traceability)"},"ans":"C","ansText":null,"expl":"精密度＝反覆量測的一致性（分配寬度）；準確度＝與真值的正確性（平均值偏差）。→ 乙二十七§3（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":13,"id":1799},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"下列各項中，何者為在使用目測檢驗的狀況下最好的降低檢驗錯誤的方法之一？","opts":{"A":"檢驗員多休息","B":"經常對檢驗員施以再訓練","C":"有一個經常檢驗眼睛的措施","D":"設定基準做為作業中對照的依據"},"ans":"D","ansText":null,"expl":"目測檢驗最有效的方法是設定基準（限度樣本）供作業中對照，把主觀判斷客觀化。→ 乙二十七§4（官能檢驗做限度樣本）（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":14,"id":1800},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"檢定效力是指：","opts":{"A":"製程並未改變時，判斷已發生改變之機率","B":"製程並未改變時，正確判斷未發生變化之機率","C":"製程已發生變化，判斷已發生變化之機率","D":"製程已發生變化，判斷未發生變化之機率"},"ans":"C","ansText":null,"expl":"檢定力 power＝1−β＝製程已變且正確判定已變的機率。(1)＝α，(2)＝1−α，(4)＝β。→ 乙二十七§10（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":15,"id":1801},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"游標卡尺的副尺與主尺間的相對滑動部分，發生磨損之後，在量測圓棒的外徑時，最容易發生的誤差是：","opts":{"A":"餘弦誤差","B":"阿貝誤差","C":"接觸變形誤差","D":"視覺誤差"},"ans":"B","ansText":null,"expl":"游標卡尺刻度軸線與量測軸線不重合，不符合阿貝原則；滑動部磨損使測爪傾斜 → 阿貝誤差。→ 乙二十七§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":16,"id":1802},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"量測標準器中：","opts":{"A":"標準球為端點標準之儀器","B":"光學尺為線刻度標準之儀器","C":"分厘卡為端點標準之儀器","D":"多邊稜規為長度標準之儀器"},"ans":"B","ansText":null,"expl":"線刻度標準＝以刻劃線間距為準（光學尺、標準尺）；端點標準＝以兩端面距離為準（塊規）。分厘卡是量具不是標準器，多邊稜規是角度標準。（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）（已與《量測習題解答》第2/3章官方解答核對一致）","flag":false,"num":17,"id":1803},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"量測誤差中：","opts":{"A":"阿貝 (Abbe) 誤差為系統誤差","B":"阿貝誤差為既無法消除亦無法修正","C":"溫度變化為隨機誤差","D":"磨耗誤差為隨機誤差"},"ans":"A","ansText":null,"expl":"阿貝誤差、磨耗、溫度都屬系統誤差（可修正）。→ 乙二十七§4~5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":18,"id":1804},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"有一游標卡尺，在12 mm長度內，主尺分為24格，副尺分為25格，則此游標卡尺之精度為：","opts":{"A":"0.02 mm","B":"0.01 mm","C":"0.04 mm","D":"0.05 mm"},"ans":"A","ansText":null,"expl":"主尺每格 12/24＝0.5 mm，副尺每格 12/25＝0.48 mm，精度＝0.5−0.48＝0.02 mm。→ 乙二十七§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":19,"id":1805},{"src":"乙｜檢驗測試(第十堂課)","ch":"檢驗與測試","type":"single","q":"有關游標卡尺，下列何項為不正確：","opts":{"A":"可用於量測孔槽深度","B":"可作工件劃線工具","C":"可用於量孔之尺寸","D":"不可用於找粗圓棒端面之中心點"},"ans":"B","ansText":null,"expl":"游標卡尺可量深度、內孔、外徑；一般機工教材認為不宜當劃線工具（傷測爪）。（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）（已與《量測習題解答》第2/3章官方解答核對一致）","flag":false,"num":20,"id":1806},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"ISO 17025:2017 第 6.6「外部提供的產品與服務」章節，其適用範圍不包括:","opts":{"A":"對實驗室活動有影響之內部提供的服務","B":"專業能力測試(能力試驗)服務","C":"評鑑及稽核服務","D":"外部校正服務、外包測試服務"},"ans":"A","ansText":null,"expl":"6.6 只管「外部」提供的產品與服務（校正、抽樣、測試、維修、能力試驗、評鑑稽核服務）；內部提供的不在此章。→ 乙二十八§4（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":1,"id":1807},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"報告(試驗、校正)的共通要求事項不包含那項。","opts":{"A":"執行實驗室活動的場所","B":"物件保存期限","C":"實驗室活動執行的日期","D":"報告發行的日期"},"ans":"B","ansText":null,"expl":"7.8.2.1 共通要求 16 項含場所、執行日期、發行日期、收件/抽樣日期等；「物件保存期限」不在其中。→ 乙二十八§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":2,"id":1808},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"下列哪一項情形時，量測設備應予校正：","opts":{"A":"量測不確定度影響報告結果之效力時","B":"為建立報告結果之計量追溯性，此設備的校正被要求時","C":"量測準確度影響報告結果之效力時","D":"以上皆是"},"ans":"D","ansText":null,"expl":"6.4.6：量測準確度或不確定度影響結果有效性時，或為建立計量追溯性而要求校正時，皆應校正。→ 乙二十八§4（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":3,"id":1809},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"實驗室抱怨處理的過程應至少包括下列要素與方法：","opts":{"A":"抱怨之接收","B":"必要時，通知顧客並召回不良品","C":"確保已採取退換貨之措施","D":"以上皆是"},"ans":"A","ansText":null,"expl":"7.9.3 三要素：抱怨之接收/確認/調查與回應措施的過程說明、追蹤與記錄、確保已採取適當措施。召回、退換貨不是抱怨條款的必要要素（召回屬 7.10 不符合工作）。→ 乙二十八§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":4,"id":1810},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"報告中包含:本報告未經實驗室同意不得複製，惟全文複製除外之聲明，能提供部分報告不被分離使用的保證，係屬:","opts":{"A":"免責聲明","B":"有效聲明","C":"特定聲明","D":"以上皆是"},"ans":"C","ansText":null,"expl":"7.8.2.1 備考：這是「特定聲明」；免責聲明是 7.8.2.2 顧客提供資訊影響結果時用。→ 乙二十八§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":5,"id":1811},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"實驗室需求、標單及合約的審查，下列哪一項不正確：","opts":{"A":"需求或標單與合約間的任何差異，應在實驗室活動開始後才解決","B":"需求或標單與合約間的任何差異，應在實驗室活動開始前解決","C":"雙方接受","D":"發生偏離合約通知顧客"},"ans":"A","ansText":null,"expl":"7.1.4 差異應在活動「開始前」解決。→ 乙二十八§5（原檔未附解答，本答案依講義判定；⚠️ 者建議與老師核對）","flag":false,"num":6,"id":1812},{"src":"乙｜檢驗測試(第十堂課)","ch":"ISO 17025","type":"single","q":"實驗室在報告符合性聲明時，聲明應清楚識別：","opts":{"A":"符合性聲明適用哪些結果","B":"滿足或
