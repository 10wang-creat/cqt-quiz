<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CQT 統計題庫練習</title>
<style>
:root{
  --bg:#F0EEF3;--card:#fff;--text:#34435E;--sub:#7A7F96;--line:#DFDAE8;
  --pri:#8981C2;--pri-soft:#ECE8F6;--ok:#4F8A6D;--ok-soft:#E2F0E8;
  --bad:#C25573;--bad-soft:#F8E7ED;--warn:#8968B8;--warn-soft:#F1EAF9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.55}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header .back{border:none;background:none;font-size:22px;color:var(--pri);padding:2px 8px 2px 0;cursor:pointer}
header .title{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:13px;color:var(--sub)}
main{flex:1;padding:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;font-size:16px;cursor:pointer;text-align:left}
.big-btn .ic{font-size:26px}
.big-btn .t{font-weight:700}
.big-btn .d{font-size:13px;color:var(--sub);margin-top:2px}
.big-btn .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.big-btn .badge.gray{background:var(--sub)}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.list-item{display:flex;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font-size:15px;text-align:left;gap:8px}
.list-item .name{flex:1;font-weight:600}
.list-item .meta{font-size:12.5px;color:var(--sub);white-space:nowrap}
.list-item .wr{font-size:12.5px;color:var(--bad);white-space:nowrap}
.pbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.pbar>div{height:100%;background:var(--pri)}
.pbar>div.g{background:var(--ok)}
/* quiz */
.qmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-bottom:8px;flex-wrap:wrap}
.chip{background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:1px 8px;font-weight:600}
.chip.r{background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:16.5px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.flagnote{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.opt{display:flex;gap:10px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:15.5px;cursor:pointer;text-align:left;align-items:flex-start;word-break:break-word}
.opt .L{font-weight:800;color:var(--pri);min-width:20px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{opacity:1;color:var(--text)}
.feedback{border-radius:12px;padding:13px 14px;margin:10px 0;font-size:15px;white-space:pre-wrap;word-break:break-word}
.feedback.ok{background:var(--ok-soft);border:1px solid #A9D7BC}
.feedback.bad{background:var(--bad-soft);border:1px solid #EBB4C6}
.feedback b{display:block;margin-bottom:4px}
.expl{margin-top:8px;font-size:14px;color:#4A5670;border-top:1px dashed #D8D3E3;padding-top:8px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.okb{background:var(--ok);color:#fff}
.btn.badb{background:var(--bad);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--text)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--sub)}
.topbar .pbar{flex:1;margin-top:0}
.center{text-align:center;padding:40px 16px;color:var(--sub)}
.center .big{font-size:44px;margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;font-size:14.5px;color:var(--sub)}
.switch{position:relative;width:46px;height:26px;background:#C7C2D6;border-radius:99px;border:none;cursor:pointer;transition:.2s}
.switch.on{background:var(--pri)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:23px}
.danger-link{color:var(--bad);font-size:13.5px;background:none;border:none;text-decoration:underline;cursor:pointer;padding:10px}
.result-num{font-size:40px;font-weight:800}
footer{padding:10px;text-align:center;font-size:12px;color:var(--sub)}
</style>
</head>

2, P(B)=0.3,試求P(A｜B)。","opts":{"A":"0.1","B":"0.2","C":"0.3","D":"0.4"},"ans":"B","ansText":null,"expl":"獨立 ⇒ P(A｜B)=P(A)=0.2。常見陷阱：誤算成 P(A)×P(B)=0.06 或去算交集。","flag":false,"num":16},{"id":67,"src":"甲｜統計學會考題庫","ch":"Ch4 機率","type":"single","q":"設A,B為兩獨立事件,且P(A)=0.4, P(B)=0.5,試求P(A∪B)。","opts":{"A":"0.4","B":"0.5","C":"0.6","D":"0.7"},"ans":"D","ansText":null,"expl":"獨立 ⇒ P(A∩B)=0.4×0.5=0.2；P(A∪B)=0.4+0.5−0.2=0.7。","flag":false,"num":17},{"id":68,"src":"甲｜統計學會考題庫","ch":"Ch4 機率","type":"single","q":"設A,B為兩事件,且P(A)=0.4, P(B)=0.5, P(B｜A)=0.8,試求P(A∪B)。","opts":{"A":"0.58","B":"0.68","C":"0.78","D":"0.88"},"ans":"A","ansText":null,"expl":"由 P(B｜A)=P(A∩B)/P(A) ⇒ P(A∩B)=0.8×0.4=0.32；P(A∪B)=0.4+0.5−0.32=0.58。判斷關鍵：條件機率的分母是「條件那一方」P(A)，不是 P(B)。","flag":false,"num":18},{"id":69,"src":"甲｜統計學會考題庫","ch":"Ch4 機率","type":"single","q":"有一位統計學陳老師依他多年教學經驗得知,若他任教統計學班級的同學,上課從不缺席時,則學期成\n績會及格的機率為0.8,但有缺席紀錄的同學會及格的機率只有0.3,且大約只有60%的同學上課從不缺\n席. 假設陳老師班上有一位同學統計學學期成績及格,試問這位同學上課從沒缺席的機率為多少?","opts":{"A":"0.6","B":"0.7","C":"0.75","D":"0.8"},"ans":"D","ansText":null,"expl":"","flag":false,"num":19},{"id":70,"src":"甲｜統計學會考題庫","ch":"Ch4 機率","type":"single","q":"某公司每天早上都會提供一桶熱茶給所有員工飲用,負責沖泡的是三位新進員工−大華,中強和小美.\n依照他們進公司的年資計算,這三位員工在今年負責沖泡的天數比例分別為20%, 30%和50%,且他們\n沖泡的結果味道偏苦澀的機率分別為0.1, 0.2和0.2. 假設有一天早上,公司員工喝到的茶味道偏苦澀,\n試問這是大華沖泡的機率為何?","opts":{"A":"1/6","B":"1/7","C":"1/8","D":"1/9"},"ans":"D","ansText":null,"expl":"","flag":false,"num":20},{"id":71,"src":"甲｜統計學會考題庫","ch":"Ch5 間斷隨機變數及其常用的機率分配","type":"single","q":"某大學的大學部學生人數和研究生人數一樣多.現從全校學生中隨機詢問4位學生,以瞭解學生對於\n選課制度的看法.試問,被詢問到的這4位學生都是大學部學生的機率為多少 ?","opts":{"A":"0.0256","B":"0.0625","C":"0.16","D":"1.00"},"ans":"B","ansText":null,"expl":"","flag":false,"num":1},{"id":72,"src":"甲｜統計學會考題庫","ch":"Ch5 間斷隨機變數及其常用的機率分配","type":"single","q":"二項分配b(n, π), 若n小且成功機率 π = 0.1,則此分配","opts":{"A":"為對稱分配.","B":"為右偏分配.","C":"為左偏分配.","D":"以上皆非."},"ans":"B","ansText":null,"expl":"","flag":false,"num":2},{"id":73,"src":"甲｜統計學會考題庫","ch":"Ch5 間斷隨機變數及其常用的機率分配","type":"single","q":"在二項分配b(n :{"A":"派員調查","B":"郵寄問卷調查","C":"實驗性資料","D":"觀察性資料"},"ans":"D","ansText":null,"expl":"","flag":false,"num":19},{"id":427,"src":"甲｜統計學題庫","ch":"資料蒐集與整理","type":"single","q":"要將累積次數用圖表示，下列何種圖形最為恰當？","opts":{"A":"肩形圖","B":"圓餅圖","C":"直方圖","D":"次數多邊形圖"},"ans":"A","ansText":null,"expl":"","flag":false,"num":20},{"id":428,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列那個統計量無法顯示資料變異的程度？","opts":{"A":"四分位距","B":"標準差","C":"中位數","D":"全距"},"ans":"C","ansText":null,"expl":"中位數為中央趨勢量數，非變異量數。","flag":false,"num":1},{"id":429,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"若某組資料之標準差為0，則下列敘述何者為真？","opts":{"A":"資料分配成對稱","B":"平均數大於中位數","C":"資料中所有觀察值都相同","D":"資料中觀察值的數值，正負各佔一半"},"ans":"C","ansText":null,"expl":"","flag":false,"num":2},{"id":430,"src":"甲｜統計學題庫","ch":"敘述統計","type":"multi","q":"一隨機樣本數據為：2,4,6,8,10,12，則：","opts":{"A":"中位數為7","B":"全距為7","C":"眾數為7","D":"平均數為7"},"ans":"AD","ansText":null,"expl":"中位數=(6+8)/2=7，平均數=42/6=7；全距=12-2=10，無眾數。原解答為複選 A,D。","flag":false,"num":3},{"id":431,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列那一個配對可以提供關於次數分配之偏態方面的情報：","opts":{"A":"眾數、平均數","B":"標準差、中位數","C":"中位數、平均數","D":"以上皆非"},"ans":"D","ansText":null,"expl":"⚠️【答案存疑，非缺圖】原解答區塊為 D；但依常理，中位數與平均數（或眾數與平均數）之相對位置可判斷偏態，一般教科書答案為 C，解答疑有誤。","flag":true,"num":4},{"id":432,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"分配的第三級動差是在衡量分配的：","opts":{"A":"離散程度（Degree of dispersion）","B":"中央趨勢（Central tendency）","C":"峰度（Peakedness）","D":"偏態（Skewness）"},"ans":"D","ansText":null,"expl":"","flag":false,"num":5},{"id":433,"src":"甲｜統計學題庫","ch":"敘述統計","type":"multi","q":"吾人觀測了一組資料：3,5,2,4,6,5,9,5,7,8，下列何者正確？","opts":{"A":"平均數＞中位數","B":"中位數＞眾數","C":"平均數＞眾數","D":"以上皆非"},"ans":"AC","ansText":null,"expl":"排序後為2,3,4,5,5,5,6,7,8,9，眾數=5，中位數=5，平均數=5.4，故A、C皆正確（原解答為複選 A,C）。","flag":false,"num":6},{"id":434,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"四群學生，人數是10、20、30、40人，平均體重分別是50、55、60、65公斤，則全部學生的平均體重是（四捨五入）：","opts":{"A":"55","B":"57","C":"60","D":"資料不足，不能計算"},"ans":"C","ansText":null,"expl":"(10*50+20*55+30*60+40*65)/(10+20+30+40)=6000/100=60。","flag":false,"num":7},{"id":435,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列那一個統計量較可能同時表示一組樣本中，體重的變異程度高於身高的變異程度：","opts":{"A":"四分位距","B":"標準差","C":"全距","D":"變異係數"},"ans":"D","ansText":null,"expl":"不同單位資料的變異比較須用變異係數。","flag":false,"num":8},{"id":436,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"何種測量離散程度的測度量最易受到極端值的影響？","opts":{"A":"標準差","B":"四分位距","C":"變異數","D":"全距"},"ans":"D","ansText":null,"expl":"全距僅由最大值與最小值決定，最易受極端值影響。","flag":false,"num":9},{"id":437,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"飲料工廠有兩條生產線，A生產線產出250c.c.的飲料且產品容量的標準差為2c.c.，B生產線產出500c.c.的飲料且產品容量的標準差為3c.c.，就產品容量的觀點而言：","opts":{"A":"A生產線的品質較佳","B":"B生產線的品質較佳","C":"兩條生產線品質一樣","D":"難以斷論"},"ans":"B","ansText":null,"expl":"A的變異係數=2/250=0.008 大於 B的變異係數=3/500=0.006，故B生產線品質較佳。","flag":false,"num":10},{"id":438,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"阿美班上期中考的會計學與統計學成績統計如下：全班會計學的平均分數為65分，標準差為5分，統計學的平均分數為70分，標準差為7分。阿美會計學得78分，統計學得84分，相較於全班同學，阿美：","opts":{"A":"會計學成績較佳","B":"統計學成績較佳","C":"會計學與統計學一樣好","D":"平均數與標準差皆不同，兩科成績無法比較"},"ans":"A","ansText":null,"expl":"會計學z分數=(78-65)/5=2.6，統計學z分數=(84-70)/7=2，故會計學相對較佳。","flag":false,"num":11},{"id":439,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列敘述何者恆為正確？","opts":{"A":"一組資料的最大值為100，最小值為0，其中位數為50，則此資料為對稱資料","B":"以算術平均數為中心的標準差，較以任何其他平均數為中心的標準差小","C":"若二組資料有相同平均數且皆為正數，則標準差愈大者，變異係數（C.V.）愈小","D":"兩組不同單位的資料可藉全距比較資料之離散程度"},"ans":"B","ansText":null,"expl":"離差平方和以算術平均數為中心時最小。","flag":false,"num":12},{"id":440,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列敘述何者可能不正確？","opts":{"A":"一組資料的最大值為100，最小值為0，其中位數為60，則此資料右偏","B":"一組資料的所有數值與其算術平均數的差，其總和為0","C":"若二組資料有相同標準差，且平均數皆為正數，則平均數愈大者，變異係數（C.V.）愈小","D":"兩組不同單位的資料可藉變異係數（C.V.）比較資料之離散程度"},"ans":"A","ansText":null,"expl":"僅憑最大、最小值與中位數無法判定偏態方向。","flag":false,"num":13},{"id":441,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"一組數據資料中，若平均數減去中位數的值是很大的正數時，則下列敘述何者正確？","opts":{"A":"中位數必須小於零","B":"平均數必須是大的正數","C":"中位數必須小於零同時平均數必須大於零","D":"資料分佈呈右偏"},"ans":"D","ansText":null,"expl":"平均數遠大於中位數表示右尾拉長，資料右偏。","flag":false,"num":14},{"id":442,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"某一國際大公司招考員工時，初試必須先考滿分為200分之英語測驗，再以其分數高低決定面試與否。過去經驗顯示測驗分數為鐘形分配。假設今年公司預定錄取分數最好的16人面試，而報考人數有100人，計算其平均成績為150分和標準差為15分。該公司面試前錄取分數會：","opts":{"A":"比150分高","B":"比165分高","C":"比180分高","D":"比195分高"},"ans":"B","ansText":null,"expl":"依經驗法則，鐘形分配下比平均數大一個標準差以上的資料約占16%；150+15=165，取前16%即約165分以上。","flag":false,"num":15},{"id":443,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"一組樣本的觀察值為 3,5,7,5,6,7，則「樣本眾數」為：","opts":{"A":"5","B":"5.5","C":"7","D":"5與7"},"ans":"D","ansText":null,"expl":"5與7各出現2次，為雙眾數。","flag":false,"num":16},{"id":444,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"5位學生每人投籃8次，而投中球數分別為4,4,5,5,6，則投中次數的第一個四分位數是：","opts":{"A":"4","B":"5","C":"5.5","D":"6"},"ans":"A","ansText":null,"expl":"","flag":false,"num":17},{"id":445,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"5位學生每人投籃8次，而投中球數分別為4,4,5,5,6，則投中次數的標準差為何？","opts":{"A":"√(2.8/4)","B":"√(2.8/5)","C":"√(3/4)","D":"√(3/5)"},"ans":"A","ansText":null,"expl":"平均=4.8，離差平方和=2*(0.8)^2+2*(0.2)^2+(1.2)^2=2.8，樣本標準差=√(2.8/(5-1))=√(2.8/4)。","flag":false,"num":18},{"id":446,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"一組數據中，介於第一個四分位數和第六十百分位數之間的數據比例為：","opts":{"A":"20％","B":"35％","C":"40％","D":"65％"},"ans":"B","ansText":null,"expl":"60%-25%=35%。","flag":false,"num":19},{"id":447,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"下列何者不是算術平均數的特性？","opts":{"A":"位於中央位置的資料值","B":"是整個資料的平衡點","C":"與資料差異的總和為0","D":"與資料差異的平方和是最小的"},"ans":"A","ansText":null,"expl":"位於中央位置的資料值是中位數的特性。","flag":false,"num":20},{"id":448,"src":"甲｜統計學題庫","ch":"敘述統計","type":"single","q":"一組資料如右：1,2,3,5,8,10,12,17,22,26,29,30，其第3個四分位數為：","opts":{"A":"17","B":"22","C":"24","D":"26"},"ans":"C","ansText":null,"expl":"n=12，Q3位置=3*(12/4)=9，取第9個與第10個數字的平均=(22+26)/2=24。","flag":false,"num":21},{"id":449,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"某班50名學生之統計學平均成績為68分，若已知一名學生成績登記錯誤，40分更正為65分，試求更正後之全班平均成績=______。","opts":{},"ans":null,"ansText":"68.5分","expl":"新平均=[68*50+(65-40)]/50=3425/50=68.5。","flag":false,"num":22},{"id":450,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"某班50名學生之統計學成績平均數為68分，標準差為10分，若已知一名學生成績登記錯誤，40分更正為65分，試求更正後之全班成績的標準差=______。","opts":{},"ans":null,"ansText":"9.179分","expl":"原平方和=(變異數+均值平方)*50=(100+68^2)*50=236200；新平方和=236200-40^2+65^2=238825；新均值=68.5；新變異數=238825/50-68.5^2=84.25；標準差=√84.25≈9.179。","flag":false,"num":23},{"id":451,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"一班級男生20人，女生30人，已知某次統計學測驗成績，男生的平均數為65分，標準差為12分，女生的平均數為70分，標準差為10分，則此次統計學測驗，全班50人成績的平均數=______。","opts":{},"ans":null,"ansText":"68分","expl":"平均數=(20*65+30*70)/(20+30)=3400/50=68。","flag":false,"num":24},{"id":452,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"一班級男生20人，女生30人，已知某次統計學測驗成績，男生的平均數為65分，標準差為12分，女生的平均數為70分，標準差為10分，則此次統計學測驗，全班50人成績的標準差=______。","opts":{},"ans":null,"ansText":"11.12分","expl":"變異數=[20*12^2+30*10^2+20*(65-68)^2+30*(70-68)^2]/50=6180/50=123.6；標準差=√123.6≈11.12。","flag":false,"num":25},{"id":453,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"某班學生之統計學成績平均數為45分，標準差為15分，老師決定調整成績：每人加20分，則平均數=______，標準差=______。","opts":{},"ans":null,"ansText":"平均數=65，標準差=15","expl":"平移不改變標準差：平均數=45+20=65，標準差=15。","flag":false,"num":26},{"id":454,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"某班學生之統計學成績平均數為45分，標準差為15分，老師決定調整成績：每人成績乘以1.5倍，則平均數=______，標準差=______。","opts":{},"ans":null,"ansText":"平均數=67.5，標準差=22.5","expl":"⚠️【答案存疑，非缺圖】平均數=45*1.5=67.5，標準差=15*1.5=22.5。註：章末解答區塊寫76.5，與題解之67.5不一致，應為67.5（76.5疑為誤植）。","flag":true,"num":27},{"id":455,"src":"甲｜統計學題庫","ch":"敘述統計","type":"open","q":"某班學生之統計學成績平均數為45分，標準差為15分，老師決定調整成績：每人成績乘以1.5倍後，再加5分，則平均數=______，標準差=______。","opts":{},"ans":null,"ansText":"平均數=72.5，標準差=22.5","expl":"平均數=45*1.5+5=72.5，標準差=15*1.5=22.5。","flag":false,"num":28},{"id":456,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"若王先生得到甲工作的機率為0.5，得到乙工作的機率為0.6，在得到甲工作的條件下，王先生會得到乙工作的機率為0.5，請問王先生同時會得到甲工作及乙工作的機率為何？","opts":{"A":"1.1","B":"0.6","C":"0.3","D":"0.25"},"ans":"D","ansText":null,"expl":"P(A∩B)=P(B|A)P(A)=0.5*0.5=0.25。","flag":false,"num":1},{"id":457,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"若李先生得到甲工作的機率為0.5，得到乙工作的機率為0.6，在得到甲工作的條件下，李先生會得到乙工作的機率為0.5，請問李先生會得到甲工作或乙工作的機率為何？","opts":{"A":"1.1","B":"0.85","C":"0.75","D":"0.6"},"ans":"B","ansText":null,"expl":"P(A∪B)=P(A)+P(B)-P(A∩B)=0.5+0.6-0.25=0.85。","flag":false,"num":2},{"id":458,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"彩券的中獎號碼是由四個箱中各抽一個號碼球，而每個箱內有0到9的號碼球各一顆，則樣本空間中有多少樣本點？","opts":{"A":"40","B":"729","C":"1000","D":"10000"},"ans":"D","ansText":null,"expl":"10*10*10*10=10000。","flag":false,"num":3},{"id":459,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"二個互斥事件A、B，機率分別是0.5、0.6，則Pr{Aᶜ∪Bᶜ}=？（註：Aᶜ、Bᶜ分別表示A、B的餘集合）","opts":{"A":"0.7","B":"0.8","C":"0.9","D":"1.0"},"ans":"D","ansText":null,"expl":"互斥則P(A∩B)=0，Pr{Aᶜ∪Bᶜ}=1-P(A∩B)=1-0=1。","flag":false,"num":4},{"id":460,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"二個獨立事件A、B，機率分別是0.5、0.6，則Pr{A∪B}=？","opts":{"A":"0.9","B":"0.8","C":"0.7","D":"0.6"},"ans":"B","ansText":null,"expl":"獨立則P(A∩B)=0.5*0.6=0.3，P(A∪B)=0.5+0.6-0.3=0.8。","flag":false,"num":5},{"id":461,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"設5位助理的薪水分別是（單位：千元）25,27,30,32,36，平均是30，現在隨機抽出3人，則其中2人的薪水大於平均30的機率是：","opts":{"A":"0.3","B":"0.4","C":"0.5","D":"0.6"},"ans":"A","ansText":null,"expl":"薪水大於30者有2人（32,36）：C(2,2)*C(3,1)/C(5,3)=1*3/10=3/10=0.3。","flag":false,"num":6},{"id":462,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"擲一枚公正的骰子8次結果8次均出現奇數點，則擲第9次時：","opts":{"A":"出現奇數點的機率比較出現偶數點的機率大","B":"出現偶數點的機率比較出現奇數點的機率大","C":"出現偶數點的機率與出現奇數點的機率一樣大","D":"應該會出現偶數點"},"ans":"C","ansText":null,"expl":"每次投擲互相獨立，機率不受先前結果影響。","flag":false,"num":7},{"id":463,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"某公司生產鬧鐘，有10％的不良率。此公司為了商譽，對每一個鬧鐘做品質檢驗以區分產品是否不良，並分類為「通過」或「不通過」，若檢驗員有5％的機會分類錯誤，則被分類為「通過」的百分比，最接近下列那一項？","opts":{"A":"80％","B":"85％","C":"90％","D":"95％"},"ans":"B","ansText":null,"expl":"P(通過)=P(通過|不良)P(不良)+P(通過|良)P(良)=0.05*0.1+0.95*0.9=0.86。","flag":false,"num":8},{"id":464,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"某公司生產鬧鐘，有10％的不良率。對每一個鬧鐘做品質檢驗並分類為「通過」或「不通過」，若檢驗員有5％的機會分類錯誤，只有被分類為「通過」的鬧鐘可對外販賣；被分類為「不通過」的則報廢丟棄。問可對外販賣的鬧鐘中，是良品的百分比，最接近下列那一項？","opts":{"A":"90％","B":"93％","C":"96％","D":"99％"},"ans":"D","ansText":null,"expl":"P(良|通過)=P(良∩通過)/P(通過)=0.95*0.9/0.86=0.855/0.86≈0.994。","flag":false,"num":9},{"id":465,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"某公司生產的零件來自甲、乙兩工廠，甲工廠生產其中70%，不良率是0.5%，乙工廠生產其餘30%，不良率是1%，則該公司零件不良率是：","opts":{"A":"0.3%","B":"0.38%","C":"0.5%","D":"0.65%"},"ans":"D","ansText":null,"expl":"0.7*0.005+0.3*0.01=0.0065=0.65%。","flag":false,"num":10},{"id":466,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"投一公正骰子一次（有6面，分別是1,2,3,4,5,6點），則出現點數的期望值是：","opts":{"A":"3","B":"3.5","C":"4","D":"依出現點數而定"},"ans":"B","ansText":null,"expl":"E(X)=(1+2+3+4+5+6)/6=3.5。","flag":false,"num":11},{"id":467,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"假定 P(A1)=0.2，P(A2)=0.8，P(B|A1)=0.2，P(B|A2)=0.4，那麼 P(A1|B)=？","opts":{"A":"0.10","B":"0.111","C":"0.182","D":"0.250"},"ans":"B","ansText":null,"expl":"貝氏定理：P(A1|B)=P(B|A1)P(A1)/[P(B|A1)P(A1)+P(B|A2)P(A2)]=0.04/(0.04+0.32)=1/9≈0.111。","flag":false,"num":12},{"id":468,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"袋中有相同大小的1個黑球與1個白球。事件A表示第1球取到白球，事件B表示第2球取到白球。一次取1球，而且取出不放回，則下列敘述何者正確：","opts":{"A":"A與B是互斥事件且A與B是獨立事件","B":"A與B是互斥且事件A與B是相依事件","C":"A與B不互斥且事件A與B是相依事件","D":"A與B不互斥且A與B是獨立事件"},"ans":"B","ansText":null,"expl":"不放回時第1球取到白球後第2球必為黑球，故A、B互斥；P(A∩B)=0≠P(A)P(B)=1/4，故相依。","flag":false,"num":13},{"id":469,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"袋中有相同大小的1個黑球與1個白球。事件A代表第1球取到白球，事件B代表第2球取到白球。一次取1球，而且取出放回，則下列敘述何者正確：","opts":{"A":"A與B是互斥事件且A與B是獨立事件","B":"A與B是互斥且事件A與B是相依事件","C":"A與B不互斥且事件A與B是相依事件","D":"A與B不互斥且A與B是獨立事件"},"ans":"D","ansText":null,"expl":"放回後袋中恢復原狀，P(A)=P(B)=1/2，可同時發生（不互斥），且P(A∩B)=1/4=P(A)P(B)，故獨立。","flag":false,"num":14},{"id":470,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"袋中有相同大小的1個黑球與2個白球。事件A表示第1球取到白球，事件B表示第2球取到白球。一次取1球，而且取出不放回，則下列敘述何者正確：","opts":{"A":"A與B是互斥事件且A與B是獨立事件","B":"A與B是互斥且事件A與B是相依事件","C":"A與B不互斥且事件A與B是相依事件","D":"A與B不互斥且A與B是獨立事件"},"ans":"C","ansText":null,"expl":"P(A)=2/3，P(B)=1/3*1+2/3*1/2=2/3，P(A∩B)=2/3*1/2=1/3≠P(A)P(B)=4/9，故不互斥且相依。","flag":false,"num":15},{"id":471,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"連續丟二個公平銅板，丟第四次才發生一正一反的機率是：","opts":{"A":"1/16","B":"1/8","C":"3/16","D":"1/4"},"ans":"A","ansText":null,"expl":"每次丟二銅板出現一正一反的機率是1/2，前三次未發生、第四次發生=(1/2)^3*(1/2)=1/16。","flag":false,"num":16},{"id":472,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"設生男生女之機率各為1/2，且互相獨立。某夫婦生了3個小孩，則恰是1男2女的機率是：","opts":{"A":"1/8","B":"1/4","C":"3/8","D":"1/2"},"ans":"C","ansText":null,"expl":"C(3,1)*(1/2)^3=3/8。","flag":false,"num":17},{"id":473,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"投一公正骰子一次，定義A,B,C三事件如下：A={出現數字是偶數}，B={出現數字是小於4}，C={出現數字是大於4}。那麼Pr(A∩(B∪C))為何？","opts":{"A":"1/6","B":"1/3","C":"1/2","D":"2/3"},"ans":"B","ansText":null,"expl":"B∪C={1,2,3,5,6}，A∩(B∪C)={2,6}，機率=2/6=1/3。","flag":false,"num":18},{"id":474,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"某疾病的發生率為1%，而某藥廠宣稱他們發展出一種很準確的檢測藥劑：若有病則檢測結果為陽性的機率是99%，若無病則檢測結果為陰性的機率也是99%。現隨機選一人，則檢測結果為陽性的機率最接近：","opts":{"A":"1%","B":"2%","C":"50%","D":"99%"},"ans":"B","ansText":null,"expl":"P(陽性)=0.99*0.01+0.01*0.99=0.0198≈2%。","flag":false,"num":19},{"id":475,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"某疾病的發生率為1%，若有病則檢測結果為陽性的機率是99%，若無病則檢測結果為陰性的機率也是99%。現某人檢驗結果為陽性（顯示帶病），則他真的帶病的機率最接近：","opts":{"A":"1%","B":"2%","C":"50%","D":"99%"},"ans":"C","ansText":null,"expl":"P(有病|陽性)=0.99*0.01/(0.99*0.01+0.01*0.99)=1/2。","flag":false,"num":20},{"id":476,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"假設台灣地區婦女就業調查中發現，40%在上班，60%為家庭主婦。若已知在上班工作的婦女中，大學畢業者佔50%；家庭主婦中，大學畢業者佔60%。從所有婦女中隨機抽取一人，其為大學畢業者的機率是多少？","opts":{"A":"0.45","B":"0.56","C":"0.67","D":"0.78"},"ans":"B","ansText":null,"expl":"P(大學畢業)=0.5*0.4+0.6*0.6=0.56。","flag":false,"num":21},{"id":477,"src":"甲｜統計學題庫","ch":"機率概論","type":"single","q":"假設台灣地區婦女就業調查中發現，40%在上班，60%為家庭主婦。在上班工作的婦女中，大學畢業者佔50%；家庭主婦中，大學畢業者佔60%。從所有婦女中隨機抽取一人，若被抽中者是大學畢業者，則其在上班工作的機率是多少？","opts":{"A":"0.135","B":"0.246","C":"0.357", ,"ans":"B","ansText":null,"expl":"E=80+1*0.4+0*0.4-1*0.2=80.2。","flag":false,"num":5},{"id":491,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"假定X為一隨機變數，且其E(X)=100，σ²(X)=60。變數Y為X的線性函數，Y=2X+150。那麼E(Y)、σ²(Y)各為多少：","opts":{"A":"200；210","B":"350；120","C":"350；240","D":"250；60"},"ans":"C","ansText":null,"expl":"E(Y)=2*100+150=350；Var(Y)=2²*60=240。","flag":false,"num":6},{"id":492,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"某私立高中應屆畢業生有60%會考進國立大學。令X為隨機選出100人考進國立大學的人數。請問X的標準差為何？","opts":{"A":"4.90","B":"3.24","C":"3.8730","D":"10.5"},"ans":"A","ansText":null,"expl":"X~B(100,0.6)，σ=√(100*0.6*0.4)=√24≈4.90。","flag":false,"num":7},{"id":493,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"在一個班級共有30位男生與20位女生，隨機抽出5人參加演講比賽，設隨機變數X是抽出的女生人數，則隨機變數X的機率分配是：","opts":{"A":"常態分配","B":"二項分配","C":"幾何分配","D":"超幾何分配"},"ans":"D","ansText":null,"expl":"有限母體不放回抽樣，為超幾何分配。","flag":false,"num":8},{"id":494,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"假設在太平洋捕鮭作業中捕獲畸形鮭魚的機率為0.2%，今欲求從該處捕獲的1000條鮭魚中最多有兩條魚為畸形魚的機率，應該用何種統計方法較適宜？","opts":{"A":"常態（normal）分配","B":"超幾何分配","C":"卜瓦松（Poisson）分配","D":"F分配"},"ans":"C","ansText":null,"expl":"n大p小，以Poisson分配（λ=np=2）近似最適宜。","flag":false,"num":9},{"id":495,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"已知一錄音室180分鐘之光碟片的錯誤數服從平均數為6的卜瓦松（Poisson）分配，隨機抽取一片180分鐘之光碟片，已播放前30分鐘，未出現錯誤，則接著的60分鐘不會出現錯誤的機率為：","opts":{"A":"0.0498","B":"0.1353","C":"0.3679","D":"0.9502"},"ans":"B","ansText":null,"expl":"60分鐘的平均錯誤數λ=6*(60/180)=2，P(X=0)=e^(-2)≈0.1353（Poisson各時段獨立）。","flag":false,"num":10},{"id":496,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"長榮航空747班機預售了300個座位，但此班機只有298個可供乘客使用，假設平均有2％旅客取消其班機，試求無人取消班機之機率為：","opts":{"A":"e^(-6)","B":"e^(-4)","C":"e^(-2)","D":"e^2"},"ans":"A","ansText":null,"expl":"取消人數近似Poisson(λ=300*0.02=6)，P(X=0)=e^(-6)。","flag":false,"num":11},{"id":497,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"設產品不良率為0.02，隨機從產品中取出200件檢查。令200件中不良品個數為X，則機率P(X≧3)之近似值為何？","opts":{"A":"0.3234","B":"0.7619","C":"0.488","D":"0.594"},"ans":"B","ansText":null,"expl":"以Poisson(λ=200*0.02=4)近似：P(X≥3)=1-e^(-4)(1+4+8)=1-0.238≈0.762。","flag":false,"num":12},{"id":498,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"盒中有10個球，其中3個紅球，5個黑球，2個白球；以歸還方式隨機選取3球。令X表示紅球數，令Y表示黑球數，請問機率P(X=1,Y=2)之值為何？","opts":{"A":"1/5","B":"1/4","C":"1/9","D":"1/6"},"ans":"B","ansText":null,"expl":"多項分配：3!/(1!2!)*0.3*0.5²=3*0.075=0.225，最接近1/4。","flag":false,"num":13},{"id":499,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"假設有兩個離散型隨機變數X和Y，其聯合機率分配是f(x,y)=k(x+y)，x=1,2,3；y=0,1,2。試問k=？","opts":{"A":"1/12","B":"1/18","C":"1/21","D":"1/27"},"ans":"D","ansText":null,"expl":"Σ(x+y)=3(1+2+3)+3(0+1+2)=18+9=27，故k=1/27。","flag":false,"num":14},{"id":500,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"假設有兩個離散型隨機變數X和Y，其聯合機率分配是f(x,y)=k(x+y)，x=1,2,3；y=0,1,2。Pr(Y=2)=？","opts":{"A":"1/2","B":"1/5","C":"4/9","D":"2/15"},"ans":"C","ansText":null,"expl":"P(Y=2)=k[(1+2)+(2+2)+(3+2)]=12/27=4/9。","flag":false,"num":15},{"id":501,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"設隨機變數X與Y為獨立變數，則下列何者為正確？（其中E(X)、E(Y)為X與Y的期望值，VAR(X)、VAR(Y)為X與Y的變異數）","opts":{"A":"E(X/Y)=E(X)/E(Y)","B":"E(X|Y)=E(Y|X)","C":"VAR(Y|X)=VAR(X|Y)","D":"VAR(X+Y)=VAR(X)+VAR(Y)"},"ans":"D","ansText":null,"expl":"獨立時共變異數為0，故VAR(X+Y)=VAR(X)+VAR(Y)。","flag":false,"num":16},{"id":502,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"有關波松隨機變數（Poisson random variable）的陳述下列何者正確？","opts":{"A":"具無限多個可能值的離散隨機變數","B":"具有限多個可能值的離散隨機變數","C":"具無限多個可能值的連續隨機變數","D":"具有限多個可能值的連續隨機變數"},"ans":"A","ansText":null,"expl":"Poisson隨機變數取值0,1,2,…為可數無限多個的離散型。","flag":false,"num":17},{"id":503,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"假設鑽探1口井會發現天然氣之機率為0.36，而且每次鑽探之結果互為「獨立」。今欲求算鑽探少於10次就會發現第1口天然氣井的機率。這個問題中的隨機變數具有什麼機率分配？","opts":{"A":"二項分配","B":"負二項分配","C":"幾何分配","D":"卜瓦松分配"},"ans":"C","ansText":null,"expl":"「第1次成功所需的試驗次數」為幾何分配。","flag":false,"num":18},{"id":504,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"一個養鵝場中體重超過4公斤的鵝隻占0.25的機率，求算隨機抓取20隻鵝，會發現5隻超過4公斤的機率。這個問題中的隨機變數具有什麼機率分配？","opts":{"A":"二項分配","B":"負二項分配","C":"幾何分配","D":"卜瓦松分配"},"ans":"A","ansText":null,"expl":"固定次數n=20、成功機率p=0.25之成功次數為二項分配。（原文誤植「豬隻」，解答區塊題號19、20數字脫落，依位置對應。）","flag":false,"num":19},{"id":505,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"single","q":"袋中共有10個球，其中有2個紅球。一次取1球，取出不放回，則第2球會取到紅球之機率為：","opts":{"A":"2/10","B":"2/9","C":"1/9","D":"不一定"},"ans":"A","ansText":null,"expl":"依對稱性，每一抽取位置取到紅球的機率皆為2/10。","flag":false,"num":20},{"id":506,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"有一個隨機變數X，其機率分配如下：f(x)=a·x²/x!，x=1,2,3,4；其他值為0。則常數a等於______。","opts":{},"ans":null,"ansText":"a=6/31","expl":"Σf(x)=a(1/1!+4/2!+9/3!+16/4!)=a(1+2+3/2+2/3)=a·31/6=1，故a=6/31。","flag":false,"num":21},{"id":507,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"有一個隨機變數X，其機率分配如下：f(x)=6x²/(31·x!)，x=1,2,3,4；其他值為0。則P(X>1)=______和P(X>1|X<4)=______，又E(X)=______，Var(X)=______。","opts":{},"ans":null,"ansText":"25/31, 7/9, 2.355, 7.194（原Ans行；依題解Var(X)應為1.648）","expl":"⚠️【答案存疑，非缺圖】P(X>1)=1-P(X=1)=1-6/31=25/31；P(X>1|X<4)=[P(X=2)+P(X=3)]/[1-P(X=4)]=(12/31+9/31)/(1-4/31)=21/27=7/9；E(X)=Σx·f(x)=(6+24+27+16)/31=73/31≈2.355；E(X²)=223/31≈7.194；Var(X)=7.194-2.355²≈1.648。Ans行第4值7.194實為E(X²)，與題解不一致。","flag":true,"num":22},{"id":508,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"有一個隨機變數X，其機率分配如下：f(x)=P(X=x)=a(1+x²)，x=-1,0,1,2；其他值為0。則常數a等於______。","opts":{},"ans":null,"ansText":"a=0.1（原Ans行寫0.11，依題解應為0.1）","expl":"Σf(x)=2a+a+2a+5a=10a=1，故a=0.1。","flag":false,"num":23},{"id":509,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"有一個隨機變數X，其機率分配如下：f(x)=P(X=x)=0.1(1+x²)，x=-1,0,1,2；其他值為0。令隨機變數Y=2X²+2，則P(Y>2)=______，又E(Y)=______和Var(Y)=______。","opts":{},"ans":null,"ansText":"0.9, 6.8, 10.56（原Ans行第2值寫56.8，實為E(Y²)，依題解E(Y)=6.8）","expl":"Y之分配：y=2(f=0.1)、y=4(f=0.4)、y=10(f=0.5)；P(Y>2)=1-0.1=0.9；E(Y)=0.2+1.6+5.0=6.8；E(Y²)=0.4+6.4+50=56.8；Var(Y)=56.8-6.8²=10.56。","flag":false,"num":24},{"id":510,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"一盒內有5個紅球及5個藍球，自其中任取2球。若2球是相同顏色，則得10元；若2球不是相同顏色，則得-8元（即輸8元），令隨機變數X為某一次賭局中所贏得之金額；(1)則隨機變數X的機率分配=______。(2)隨機變數X的平均數=______及變異數=______。","opts":{},"ans":null,"ansText":"f(-8)=4/9, f(10)=5/9；E(X)=2；Var(X)=80","expl":"⚠️【答案存疑，非缺圖】P(兩球同色)=[C(5,2)+C(5,2)]/C(10,2)=20/45=4/9，P(不同色)=5/9。註：依此f(10)=4/9、f(-8)=5/9，惟原Ans行標示f(-8)=4/9,f(10)=5/9；E(X)=-8*(5/9)+10*(4/9)=0/9…依題解E(X)=-8*(4/9)+10*(5/9)=18/9=2，E(X²)=64*(4/9)+100*(5/9)=756/9=84，Var(X)=84-4=80。","flag":true,"num":25},{"id":511,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"假如你投資$2萬元於某風險很高的創投基金，有40%的機會可以拿回$5萬元；有25%的機會可以將投資的錢拿回來，有35%的機會一毛錢都拿不回來。令隨機變數X為你可能的淨回收（net payoff），(1)隨機變數X的平均數=______與變異數=______。(2)若你改變心意，想加碼投資到$10萬元，則你可能的淨回收的平均數=______與變異數=______。","opts":{},"ans":null,"ansText":"E(X)=0.5萬元, Var(X)=4.75；加碼後 E=2.5萬元, Var=118.75","expl":"淨回收x=3,0,-2（萬元），f=0.4,0.25,0.35；E(X)=3*0.4+0-2*0.35=0.5；E(X²)=9*0.4+4*0.35=5；Var(X)=5-0.25=4.75。加碼5倍：Y=5X，E(Y)=2.5，Var(Y)=25*4.75=118.75。","flag":false,"num":26},{"id":512,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"設10個小孩的家庭中，男生之機率為0.3，則：(1)此家庭中恰有2位男生之機率=______。(2)此家庭中至少有2位男生之機率=______。","opts":{},"ans":null,"ansText":"0.2335, 0.8507","expl":"X~B(10,0.3)；P(X=2)=C(10,2)*0.3²*0.7⁸≈0.2335；P(X≥2)=1-P(0)-P(1)≈0.8507。","flag":false,"num":27},{"id":513,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"有25%的學生在某一特定必修科目中會被當掉，現有20個學生修課，令隨機變數X代表被當掉的學生人數：則(1)隨機變數X的平均數=______及變異數=______；(2)P(X=0)=______和P(X≧2)=______。","opts":{},"ans":null,"ansText":"E(X)=5, Var(X)=3.75；P(X=0)=0.0032, P(X≧2)=0.9757","expl":"X~B(20,0.25)；E(X)=np=5，Var(X)=npq=3.75；P(X=0)=0.75²⁰≈0.0032；P(X≥2)=1-0.0032-0.0211=0.9757。","flag":false,"num":28},{"id":514,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"某一考試有10題選擇題，每一題均有4個可能答案，而每一題都只有一個是正確的。若某學生純粹以猜答案的方式來答題，令隨機變數Y代表此學生猜對的題數。則(1)隨機變數Y的機率分配為______。(2)隨機變數Y的平均數=______及變異數=______。(3)P(Y≧3)=______。","opts":{},"ans":null,"ansText":"Y~B(10,1/4)；E(Y)=2.5, Var(Y)=15/8；P(Y≧3)=0.4744","expl":"E(Y)=np=10*(1/4)=2.5，Var(Y)=10*(1/4)*(3/4)=15/8；P(Y≥3)=1-P(0)-P(1)-P(2)=1-0.5256=0.4744。","flag":false,"num":29},{"id":515,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"若有一個非正常硬幣，出現反面的機率為出現正面的三倍，擲這個非正常硬幣10次，令隨機變數X代表出現反面的次數，則：(1)隨機變數X的平均數=______及變異數=______。(2)P(2<X≦4)=______和P(X>1)=______。","opts":{},"ans":null,"ansText":"E(X)=2.5, Var(X)=1.875；P(2<X≦4)=0.3963, P(X>1)=0.756","expl":"⚠️【答案存疑，非缺圖】題解以X~B(10,0.25)計算：E=2.5，Var=1.875；P(2<X≤4)=P(3)+P(4)=0.2503+0.1460=0.3963；P(X>1)=1-P(0)-P(1)=0.756。惟依題意p(反面)=3/4，題解卻用0.25（相當於以正面次數計），題目與題解不一致。","flag":true,"num":30},{"id":516,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"一盒中置有黑球5個、紅球4個，自其中連續抽取4球（不放回），令隨機變數X代表抽出黑球的個數，試求：(1)P(3≦X≦5)=______和P(X≧2)=______。(2)E(X)=______和Var(X)=______。","opts":{},"ans":null,"ansText":"0.357, 0.753, 2.222, 0.617","expl":"X~超幾何H(N=9,S=5,n=4)，f(x)=C(5,x)C(4,4-x)/C(9,4)；P(3≤X≤4)=P(3)+P(4)=0.317+0.040=0.357；P(X≥2)=1-P(0)-P(1)=1-0.008-0.159=0.753；E(X)=n(S/N)=4*5/9≈2.222；Var(X)=npq*(N-n)/(N-1)=4*(5/9)*(4/9)*(5/8)≈0.617。","flag":false,"num":31},{"id":517,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"某公司在電子產品運出之前對所製造的產品進行可用性測試，並以二階段進行其計劃。裝有25個電子產品的盒子準備運送時，每盒取2個產品來做不良品試驗。如果找到任何不良品，則整盒送回廠內進行100%的篩選。如果沒有找到任何不良品，則此盒就運出。(1)裝有3個瑕疵品的盒子被運出的機率=______。(2)只有1個瑕疵品的盒子卻回廠做100%篩選的機率=______。","opts":{},"ans":null,"ansText":"0.77, 0.08","expl":"X~H(N=25,S,n=2)；(1)S=3：P(X=0)=C(3,0)C(22,2)/C(25,2)=231/300=0.77；(2)S=1：P(X=1)=C(1,1)C(24,1)/C(25,2)=24/300=0.08。","flag":false,"num":32},{"id":518,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"一個袋子裝有24張彩卷，其中有5張有獎，由袋子中隨機抽出5張，隨機變數X代表有獎彩卷之張數，則：E(X)=______，Var(X)=______；P(X≧1)=______。","opts":{},"ans":null,"ansText":"E(X)=1.25, Var(X)=0.74, P(X≧1)=0.8063","expl":"⚠️【答案存疑，非缺圖】題解以X~H(N=20,S=5,n=5)計算：E(X)=5*(5/20)=1.25；Var(X)=5*(1/4)*(3/4)*(15/19)≈0.74；P(X≥1)=1-C(15,5)/C(20,5)=0.8063。註：題目寫24張彩卷，題解以N=20計，兩者不一致。","flag":true,"num":33},{"id":519,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"假定每天在大千路與萬全路之交叉路口發生的車禍件數符合Poisson分配，而且每天平均有2次車禍發生。問某天在此交叉路口：(1)至多只會發生一次車禍的機率=______？(2)不會有車禍發生的機率=______？(3)至少有3件車禍會發生的機率=______？","opts":{},"ans":null,"ansText":"0.406, 0.1353, 0.3223","expl":"X~Poisson(λ=2)；P(X≤1)=e^(-2)(1+2)=0.406；P(X=0)=e^(-2)=0.1353；P(X≥3)=1-P(X≤2)=1-0.6777=0.3223。","flag":false,"num":34},{"id":520,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"H牌汽車業者關心Q-PLUS車型煞車系統的一種故障。此故障發生率不高，但在高速行駛時會引起嚴重的事故。假定每年有過此故障的汽車數目X為一個λ=4的卜瓦松機率分配：(1)每年最多3輛汽車造成嚴重事故的機率=______。(2)每年超過2輛汽車會造成嚴重事故的機率=______。(3)E(X)=______和Var(X)=______各為何？","opts":{},"ans":null,"ansText":"0.433, 0.762, E(X)=4, Var(X)=4","expl":"X~Poisson(4)；P(X≤3)=e^(-4)(1+4+8+32/3)=e^(-4)*71/3≈0.433；P(X>2)=1-P(X≤2)=1-0.238=0.762；Poisson之期望值與變異數皆為λ=4。","flag":false,"num":35},{"id":521,"src":"甲｜統計學題庫","ch":"間斷型機率分配","type":"open","q":"已知一個池塘中的一種泰國蝦有2%的蝦有病，假設病蝦在池水中呈隨機分布，則在一網含有100隻蝦中剛好有2隻病蝦的機率是多少？(1)用二項分布（Binomial Distribution）解所問的機率=______。(2)用卜瓦松分布（Poisson Distribution）解所問的機率=______。","opts":{},"ans":null,"ansText":"0.1823, 0.1804","expl":"⚠️【答案存疑，非缺圖】題解計算的是恰有3隻：二項 P(Y=3)=C(100,3)*0.02³*0.98⁹⁷≈0.1823；Poisson(λ=2) P(Y=3)=e^(-2)*2³/3!≈0.1804。題目文字寫「剛好有2隻」，與題解（3隻）不一致；若為2隻，二項答案應約0.2734。","flag":true,"num":36},{"id":522,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"給定一連續隨機變數下，其機率密度函數下的面積為：","opts":{"A":"等於此連續隨機變數的平均數","B":"依不同機率密度函數而定","C":"等於1.00","D":"不能判斷"},"ans":"C","ansText":null,"expl":"","flag":false,"num":1},{"id":523,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"兩次地震間隔時間的隨機變數，最適合下列何種分配？","opts":{"A":"常態分配","B":"指數分配","C":"二項分配","D":"幾何分配"},"ans":"B","ansText":null,"expl":"事件發生間隔時間服從指數分配。","flag":false,"num":2},{"id":524,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"某電腦執行程式的時間（以秒計）為一連續隨機變數，其機率密度函數為 f(x)=0.1（0≦x≦10），其他為0。其執行程式時間X的期望值與變異數為：","opts":{"A":"3.62；16.67","B":"5.00；8.33","C":"7.5；33.33","D":"9.31；108.33"},"ans":"B","ansText":null,"expl":"均勻分配U(0,10)：E(X)=5，Var(X)=10²/12≈8.33。","flag":false,"num":3},{"id":525,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"下列對常態分配的敘述，何者為錯誤？","opts":{"A":"對稱的分配","B":"單峰（unimodal）的分配","C":"有相同的平均數與標準差","D":"在機率密度函數下的面積永遠等於1.00"},"ans":"C","ansText":null,"expl":"常態分配的平均數與標準差是兩個不同的參數，不必相同。","flag":false,"num":4},{"id":526,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"標準常態分配與常態分配差異之處為何？","opts":{"A":"標準常態分配為對稱於零的分配，然 (1.0)-Φ(-1.0)","C":"Φ(0.12)-Φ(-0.08)","D":"Φ(0.10)-Φ(-0.10)"},"ans":"A","ansText":null,"expl":"μ=12.5，σ=2.5；P(10.5≦X≦15.5)=Φ((15.5-12.5)/2.5)-Φ((10.5-12.5)/2.5)=Φ(1.2)-Φ(-0.8)。","flag":false,"num":19},{"id":541,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"某加油站的洗車服務包括機器自動沖洗和人工擦乾兩階段。若此兩階段的服務時間皆服從常態分配且彼此互相獨立，其平均數分別為10,8分鐘，標準差分別為4,3分鐘，則洗一部車費時超過23分鐘的機率為何？","opts":{"A":"0.3413","B":"0.1587","C":"0.4706","D":"0.02"},"ans":"B","ansText":null,"expl":"總時間~N(18,4²+3²=25)，P(T>23)=P(Z>1)=0.1587。","flag":false,"num":20},{"id":542,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"設隨機變數X代表某商品之售價服從一個常態分配，平均數為30，變異數為5；設隨機變數Y代表此商品的進貨成本，也是一個常態分配，平均數為25，變異數為4。若可假設售價與成本互為獨立，則不虧本（即X-Y>0）之機率為何？","opts":{"A":"0.0475","B":"0.9525","C":"0.1587","D":"0.8413"},"ans":"B","ansText":null,"expl":"X-Y~N(5,9)，P(X-Y>0)=P(Z>-5/3)=P(Z<1.67)≈0.9525。","flag":false,"num":21},{"id":543,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"設X1,X2是互相獨立的隨機變數，且其分配分別是N(1,3)和N(3,4)（X1為常態分配，期望值1、變異數3；X2為常態分配，期望值3、變異數4）。令Y=4X1-2X2。則下列敘述何者正確？①E(Y)=2 ②E(Y)=0 ③V(Y)=4 ④V(Y)=32","opts":{"A":"①","B":"②","C":"③（或④）","D":"四者皆錯"},"ans":"D","ansText":null,"expl":"E(Y)=4*1-2*3=-2；V(Y)=16*3+4*4=64，故四者皆錯。原選項與敘述之對應在轉檔時錯亂，此為重建。","flag":false,"num":22},{"id":544,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"設某大學有一萬名男學生，其身高分布是常態N(170,100)，單位是公分，若超過190公分是高個子，則高個子人數最接近的數字是：","opts":{"A":"500人","B":"250人","C":"223人","D":"25人"},"ans":"C","ansText":null,"expl":"z=(190-170)/10=2，P(Z>2)≈0.0228，10000*0.0228≈228，最接近223人。","flag":false,"num":23},{"id":545,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"企管系二年級共有100個學生，若統計學成績分布呈常態分配，且平均分數為70分，標準差為10分，則約略有幾個人的成績在60分以下？（根據P(|Z|>2)≒5%，P(|Z|>1)≒32%，其中Z為標準常態分配）","opts":{"A":"16人","B":"32人","C":"84人","D":"90人"},"ans":"A","ansText":null,"expl":"P(X<60)=P(Z<-1)=32%/2=16%，約16人。","flag":false,"num":24},{"id":546,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"single","q":"若Z是一個標準常態隨機變數，則P(-1<Z<0)將會比P(1.5<Z<2.5)：","opts":{"A":"相等","B":"大","C":"小","D":"以上都不正確"},"ans":"B","ansText":null,"expl":"P(-1<Z<0)=0.3413 > P(1.5<Z<2.5)=0.0606。","flag":false,"num":25},{"id":547,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"X為一隨機變數，服從均勻分配（Uniform distribution），其機率密度函數為 f(x)=1/20（20≦x≦40），其他為0。(1)則X之平均數=______與變異數=______。(2)P(25<X<32)=______。","opts":{},"ans":null,"ansText":"E(X)=30, Var(X)=100/3；P(25<X<32)=0.35","expl":"E(X)=(20+40)/2=30；E(X²)=∫x²/20dx=(40³-20³)/60=2800/3；Var(X)=2800/3-900=100/3；P(25<X<32)=(32-25)/20=7/20=0.35。","flag":false,"num":26},{"id":548,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"製成後的型號A1012之螺母內徑是平均值5公分及標準差0.01公分的一個常態分配。(1)內徑超過5.025公分之螺母的機率=______。(2)內徑在4.9883公分和5.01公分之間的機率=______。(3)15%的螺母其內徑會低於______。","opts":{},"ans":null,"ansText":"0.0062, 0.7203, 4.9896公分","expl":"(1)z=(5.025-5)/0.01=2.5，P(Z>2.5)=0.5-0.4938=0.0062。(2)z介於-1.17與1，P=0.3790+0.3413=0.7203。(3)P(Z<-1.04)=0.15，a=5-1.04*0.01=4.9896。註：原題解以N(10,0.03²)之數字表述（10.075等），標準化後z值與本題一致；題目文字混用「螺母/活塞環」，疑為不同來源拼接。","flag":false,"num":27},{"id":549,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"台灣年輕人喜歡紅色的手機的比例為20%，則在某一個手機直營店未來二個月所出售的800支手機中，試求下列機率：(1)介於140支到170支是紅色的手機（含兩端）的機率=______。(2)至少180支是紅色的手機的機率=______。","opts":{},"ans":null,"ansText":"0.767, 0.0516","expl":"X~B(800,0.2)，np=160>5且n(1-p)=640>5，以N(160,144)近似（σ=12）；(1)連續性修正 P(139.5≦X≦170.5)=P(-1.71≦Z≦0.88)=0.4564+0.3106=0.767。(2)P(X≧179.5)=P(Z≧1.63)=0.5-0.4484=0.0516。","flag":false,"num":28},{"id":550,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"若已知P(X>116)=0.0668和P(X<114)=0.8413，且X服從一個常態分配N(μ,σ²)，則(1)隨機變數X的平均數=______和標準差=______。(2)P(112<X<118)=______和P(X<103)=______。","opts":{},"ans":null,"ansText":"μ=110, σ=4；P(112<X<118)=0.2857, P(X<103)=0.0401","expl":"P(Z<1.0)=0.8413→μ+σ=114；P(Z<1.5)=0.9332→μ+1.5σ=116；解聯立得μ=110、σ=4。P(112<X<118)=P(0.5<Z<2)=0.9772-0.6915=0.2857；P(X<103)=P(Z<-1.75)=1-0.9599=0.0401。","flag":false,"num":29},{"id":551,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"青山農場生產蘋果，其重量為一常態分配，平均數為560公克，標準差為20公克，試求下列各小題：(1)某一個重量大於580公克的機率=______。(2)抽取5個，恰有3個重量大於580公克的機率=______。(3)抽取5個，至少有2個重量大於580公克的機率=______。","opts":{},"ans":null,"ansText":"0.1587, 0.0283, 0.181","expl":"(1)P(X>580)=P(Z>1)=1-0.8413=0.1587（原Ans行0.01587為誤植）。(2)Y~B(5,0.1587)，P(Y=3)=C(5,3)*0.1587³*0.8413²≈0.0283。(3)P(Y≧2)=1-P(0)-P(1)=1-0.4215-0.3975=0.181。註：題目文字混用蘋果/水梨。","flag":false,"num":30},{"id":552,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"已知大千企業所生產之AQ03零件，其長度符合常態分配，平均數為118公分，標準差為3.2公分。則(1)任取一個AQ03零件，其長度超過122公分之機率=______。(2)任取四個AQ03零件，最多只有一個長度超過122公分之機率=______。","opts":{},"ans":null,"ansText":"0.1056, 0.9421","expl":"(1)z=(122-118)/3.2=1.25，P(Z>1.25)=0.1056。(2)Y~B(4,0.1056)，P(Y≦1)=P(0)+P(1)=0.6399+0.3022=0.9421。註：原題第2小題寫「超過120公分」，但題解以122公分（p=0.1056）計算，此處依題解改為122。","flag":false,"num":31},{"id":553,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"某一大廣告公司招考相關廣告設計人員時，初試為總分180分之『設計概念與創意』測驗，第二階段面試是以分數高低來決定。假設測驗分數為一個常態分配，且今年公司預定選分數最好的二十四人面試，而報考人數有150人，計算其平均成績為120分和標準差為15分。(1)該公司第二階段面試的最低分數為______。(2)若某位先生考試得140分時，估計他的分數至少名列第______名。","opts":{},"ans":null,"ansText":"134.92分, 第14名","expl":"(1)24/150=0.16，P(Z>z)=0.16→z≈0.9945，a=120+0.9945*15≈134.92分。(2)P(X≧140)=P(Z≧1.33)=1-0.9082=0.0918，150*0.0918≈13.77，至少名列第14名。","flag":false,"num":32},{"id":554,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"設某私立大學共有6000位學生，其學生之年齡服從一個常態分配N(20.8,1.8²)，則：(1)年齡低於20歲之學生比例（人數）=______。(2)若全體學生中隨機抽問10位學生的年齡，正好有4位同學高於20歲的機率為______。","opts":{},"ans":null,"ansText":"0.33（約6000*0.33=1980人）, 0.0547","expl":"(1)z=(20-20.8)/1.8≈-0.44，P(Z<-0.44)=0.33。(2)Y~B(10,0.67)，P(Y=4)=C(10,4)*0.67⁴*0.33⁶≈0.0547。註：原題第2小題文字寫「正好有2位」，但題解計算P(Y=4)，此處依題解改為4位；第1小題問人數而Ans給機率0.33。","flag":false,"num":33},{"id":555,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"某醫院會計部門為了解病患應收帳款天數之情形，整理了所有病患應收帳款之天數資料，發現應收帳款天數呈現是一個常態分配N(20,8²)，則：(1)帳款介於20天至40天之機率=______。(2)若醫院想寄給欠帳款最久的2.5%催繳信函，則欠______天以上的病患將會收到信函？","opts":{},"ans":null,"ansText":"0.4938, 35.68天","expl":"(1)P(20<X<40)=P(0<Z<2.5)=0.4938。(2)P(Z>1.96)=0.025，a=20+1.96*8=35.68天。","flag":false,"num":34},{"id":556,"src":"甲｜統計學題庫","ch":"連續型隨機變數","type":"open","q":"一產品之重量分配為常態分配N(200,4²)，單位：公克。(1)今客戶要求之規格為199±4公克，過重或過輕均為不合格，試問在目前之機器設備下，不合格的比例為______。(2)若該產品的標準差仍維持4公克，欲使其重量超過210公克之機率等於5%，則平均重量應訂為______。","opts":{},"ans":null,"ansText":"0.3323, 203.42公克","expl":"(1)規格195~203：P(X<195)=P(Z<-1.25)=0.1056，P(X>203)=P(Z>0.75)=0.2266，合計≈0.3323。(2)P(Z>1.645)=0.05，(210-μ)/4=1.645→μ=210-6.58=203.42公克。","flag":false,"num":35},{"id":557,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"抽樣分配係指下列何者的機率分配？","opts":{"A":"樣本統計量","B":"母體統計量","C":"樣本參數","D":"母體參數"},"ans":"A","ansText":null,"expl":"","flag":false,"num":1},{"id":558,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"統計學上的「參數」一詞，是指：","opts":{"A":"樣本所計算的數量值","B":"母體中某種未知特性值","C":"推論中引用的某種統計量","D":"計算中所得的有效數量"},"ans":"B","ansText":null,"expl":"","flag":false,"num":2},{"id":559,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"統計學上的「統計量」一詞，概要而言是指？","opts":{"A":"母體中的某種未知特性值","B":"母體中的某些部分集合","C":"研究者所要探討的未知特徵數","D":"由樣本所計算的數量"},"ans":"D","ansText":null,"expl":"","flag":false,"num":3},{"id":560,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"根據中央極限定理，樣本平均數的抽樣分配，在什麼情況下趨近於常態分配：","opts":{"A":"母體平均數為0","B":"樣本平均數為0","C":"母體變異數為1","D":"趨近於常態分配的速度與樣本數大小有關"},"ans":"D","ansText":null,"expl":"","flag":false,"num":4},{"id":561,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"在做抽樣調查時，試問下列何者是正確的敘述？","opts":{"A":"樣本大小與變異數大小成正比","B":"樣本大小與所能接受的誤差大小成正比","C":"樣本大小與所需之信心水準高低成反比","D":"樣本大小與母體大小成反比"},"ans":"A","ansText":null,"expl":"n=(z*σ/e)²，變異數愈大所需樣本愈大。","flag":false,"num":5},{"id":562,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"若說『普查優於抽樣調查』，試問下列何者是正確的敘述？","opts":{"A":"普查所取得的資料都呈常態分配","B":"普查可提供較正確的資訊","C":"普查可消除抽樣調查因對母體資訊不完整所產生的錯誤","D":"普查花費較少"},"ans":"C","ansText":null,"expl":"","flag":false,"num":6},{"id":563,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"就統計學上的公正而言，下列何種抽樣方法較佳？","opts":{"A":"非機率抽樣","B":"簡單隨機抽樣","C":"立意抽樣","D":"配額抽樣"},"ans":"B","ansText":null,"expl":"","flag":false,"num":7},{"id":564,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"若每一個可能的樣本被抽的機會相等，此抽樣方法稱為：","opts":{"A":"簡單隨機抽樣","B":"分層隨機抽樣","C":"集體抽樣","D":"系統抽樣"},"ans":"A","ansText":null,"expl":"","flag":false,"num":8},{"id":565,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"一個母體含有100個個體，由1號編到100號，然後利用亂數表（Random number tables），選出一個介於1到10的號碼，例如8，然後抽出8，18，28，…，98等10個對應的母體個體，當作樣本，此種抽樣法為何種抽樣？","opts":{"A":"單純隨機抽樣","B":"分層隨機抽樣","C":"叢式抽樣","D":"系統抽樣"},"ans":"D","ansText":null,"expl":"","flag":false,"num":9},{"id":566,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"台中市市政府的調查員從該市之132個里中，隨機抽出5個里，然後以這5個里的全部成年人作為調查對象。請問這位調查員是採用那種抽樣方法？","opts":{"A":"集體抽樣","B":"系統抽樣","C":"簡單隨機抽樣","D":"分層隨機抽樣"},"ans":"A","ansText":null,"expl":"","flag":false,"num":10},{"id":567,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"下列敘述何者為正確？所謂「簡單隨機樣本」必須符合以下條件：①樣本中的觀察值必須符合常態分配的假設；②樣本中的觀察值間必須是統計獨立；③樣本中的觀察值必須來自同一機率分配","opts":{"A":"僅①","B":"僅②","C":"②和③","D":"①②③"},"ans":"C","ansText":null,"expl":"簡單隨機樣本需獨立（②）且同分配（③），不需常態假設。原文圈號在轉檔時脫落，選項內容為依上下文重建。","flag":false,"num":11},{"id":568,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"設X1,X2,…,Xn為由母體平均數為μ、變異數σ²中，取出之隨機樣本，且X̄=ΣXi/n，下列敘述何者不正確？","opts":{"A":"樣本變異數S²=Σ(Xi-X̄)²/(n-1)，則E(S²)=σ²","B":"令m1與m2為原文以樣本動差定義之兩統計量（轉檔符號錯亂），則Var(m1)=Var(m2)","C":"X1可用來估計μ","D":"當n愈大時，(X̄-μ)/(σ/√n)愈接近標準常態分配"},"ans":"B","ansText":null,"expl":"解答為B。選項B原文下標與符號嚴重錯亂，無法完整重建。","flag":true,"num":12},{"id":569,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"假設樣本大小為100，樣本平均數16.5，母體標準差10，母體平均數15，選出檢定統計量之Z值：","opts":{"A":"0.214","B":"-0.214","C":"1.5","D":"-1.5"},"ans":"C","ansText":null,"expl":"Z=(16.5-15)/(10/√100)=1.5/1=1.5。","flag":false,"num":13},{"id":570,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"從標準常態分配的母體中，隨機抽取一組樣本大小為n的隨機樣本，令X̄表示樣本平均數，且P(X̄≦c)=0.99，試求c值？","opts":{"A":"1.96√n","B":"1.96/√n","C":"2.58√n","D":"2.58/√n"},"ans":"C","ansText":null,"expl":"⚠️【答案存疑，非缺圖】原解答為C。X̄~N(0,1/n)，P(X̄≦c)=0.99應得c=2.33/√n；原選項中√n之分子分母位置因轉檔錯亂無法確定，依常理答案應為2.33/√n（或近似2.58/√n形式），解答對應存疑。","flag":true,"num":14},{"id":571,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"設M牌手機的市場佔有率為12%。若隨機調查400位手機持有人，令P̂表此400人中持用該廠牌手機的樣本比率。求P̂的抽樣誤差不超過3%的近似機率。","opts":{"A":"0.8756","B":"0.9052","C":"0.9350","D":"0.9690"},"ans":"C","ansText":null,"expl":"σ(P̂)=√(0.12*0.88/400)=0.01625，P(|P̂-0.12|≦0.03)=P(|Z|≦1.85)≈0.935。","flag":false,"num":15},{"id":572,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"假設在上次的民意調查中得知，設立腳踏車專用道的贊成比率是62%。假設民意無改變，若現在重新隨機抽樣調查400人，則在此400人中贊成的比率在64.5%以上的機率，最接近數字是：","opts":{"A":"0.1516","B":"0.1389","C":"0.1056","D":"0.0782"},"ans":"A","ansText":null,"expl":"σ(P̂)=√(0.62*0.38/400)≈0.02427，z=(0.645-0.62)/0.02427≈1.03，P(Z>1.03)≈0.1515。","flag":false,"num":16},{"id":573,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"設X1,X2,...,Xn是N(μ,σ²)（常態分配）的一組隨機樣本。若n=20時，X̄的標準誤是2，則n是多少時，才會使X̄的變異數為0.2？","opts":{"A":"200","B":"400","C":"600","D":"800"},"ans":"B","ansText":null,"expl":"σ/√20=2→σ²=80；σ²/n=0.2→n=80/0.2=400。","flag":false,"num":17},{"id":574,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"大小分別為40與50之兩獨立樣本分別隨機抽自任兩個母體以檢定兩個母體均數差，其樣本均數差X̄1-X̄2之抽樣分配為：","opts":{"A":"常態分配","B":"近似於常態分配","C":"自由度88之t分配","D":"自由度90之卡方分配（chi-square distribution）"},"ans":"B","ansText":null,"expl":"母體分配未知但為大樣本，由中央極限定理知近似常態。","flag":false,"num":18},{"id":575,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"某公司所生產10公斤裝的洗衣粉，其標準差為0.4公斤，欲估計母體平均數，在95%信賴水準下並使估計誤差不超過0.08公斤，至少應抽多少包洗衣粉來秤重？","opts":{"A":"62","B":"75","C":"97","D":"116"},"ans":"C","ansText":null,"expl":"n=(1.96*0.4/0.08)²=96.04，取97。","flag":false,"num":19},{"id":576,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"目前想要估計一養鴨場鴨隻之平均體重μ。假設養鴨場鴨隻體重具有標準差σ=0.5公斤之常態分配。若要求具有95%的信心使得所觀察之樣本平均體重X̄與μ之距離小於0.12公斤，則至少應抓取幾隻鴨出來稱重？（根據P(|Z|>2)≈5%，P(|Z|>1)≈32%）","opts":{"A":"62","B":"67","C":"82","D":"90"},"ans":"B","ansText":null,"expl":"n=(1.96*0.5/0.12)²≈66.7，取67（若用z=2得69.4，最接近選項仍為67）。","flag":false,"num":20},{"id":577,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"某民調公司想了解民眾對於立法院通過『離島博奕法案』的支持度，採用電話訪問。在95%的信賴度之下，請問有效樣本應該在多少以上才能使抽樣誤差控制在3%之下？","opts":{"A":"423","B":"752","C":"1068","D":"1692"},"ans":"C","ansText":null,"expl":"取p=0.5最保守：n=(1.96/(2*0.03))²≈1067.1，取1068。","flag":false,"num":21},{"id":578,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"某民調公司想了解民眾對於立法院通過『離島博奕法案』的支持度，採用電話訪問。成功訪問400人，調查結果顯示該議題的支持度為70%。在95%的信賴度之下，抽樣誤差有多少？","opts":{"A":"0.0329","B":"0.0392","C":"0.0426","D":"0.0449"},"ans":"D","ansText":null,"expl":"1.96*√(0.7*0.3/400)=1.96*0.0229≈0.0449。","flag":false,"num":22},{"id":579,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"母體平均數為μ，變異數為σ²，假設X1,…,X10為該母體的隨機樣本，則X̄的變異數為：","opts":{"A":"σ²/100","B":"σ²/10","C":"σ²/2","D":"σ²"},"ans":"B","ansText":null,"expl":"Var(X̄)=σ²/n=σ²/10。","flag":false,"num":23},{"id":580,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"若已知母體平均數μ=50，變異數為σ²=25，若欲達到P(|X̄-μ|≦1)=0.99的準確度，需抽樣多少個樣本數？","opts":{"A":"91","B":"144","C":"167","D":"224"},"ans":"C","ansText":null,"expl":"n=(2.58*5/1)²≈166.4，取167。","flag":false,"num":24},{"id":581,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"single","q":"令(X1,X2,X3)為由常態母體N(μ,σ²)抽出的一組隨機樣本，T1,T2,T3,T4均為μ的估計量：T1=(3X1+3X2+4X3)/10；T2=(X1+X2+X3)/3；T3=(X1+2X2+3X3)/6；T4=(2X1+3X2+4X3)/9，問下列何者為μ的不偏估計量中變異數最小者？","opts":{"A":"T1","B":"T2","C":"T3","D":"T4"},"ans":"B","ansText":null,"expl":"T1、T2、T3為不偏（權重和=1；T4權重和=1）；其中樣本平均數T2的變異數σ²/3最小。","flag":false,"num":25},{"id":582,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"設有一母體之機率分配如下：X=5,9,12，f(X)=0.3,0.2,0.5。若自母體以抽出放回之方式隨機抽二個樣本(X1,X2)：X̄=(X1+X2)/2之期望值=______及變異數=______，與母體之平均數μ及變異數σ²間的關係為X̄的期望值=___×μ？X̄的變異數=___×σ²？","opts":{},"ans":null,"ansText":"E(X̄)=9.3, Var(X̄)=4.605；E(X̄)=1×μ, Var(X̄)=(1/2)×σ²","expl":"μ=E(X)=5*0.3+9*0.2+12*0.5=9.3；E(X²)=95.7，σ²=95.7-9.3²=9.21；抽出放回n=2：E(X̄)=μ=9.3，Var(X̄)=σ²/2=4.605。","flag":false,"num":26},{"id":583,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"一常態母體之平均數50，標準差5，由其中任取16個樣本，則：(1)X̄的抽樣分配為______。(2)樣本平均數大於52的機率=______。(3)樣本平均數介於48與51的機率=______。","opts":{},"ans":null,"ansText":"X̄~N(50,25/16)；0.0448；0.7333","expl":"X̄~N(50,25/16)，標準誤=5/4=1.25；P(X̄>52)=P(Z>1.6)=1-0.9452=0.0448；P(48<X̄<51)=P(-1.6<Z<0.8)=0.7881-0.0548=0.7333。","flag":false,"num":27},{"id":584,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"桃園機場的行李中心處理一批旅客行李，旅客行李的重量假設服從一個常態分配，其平均數μ=28公斤，而其標準差σ未知，如果由其中隨機抽出36件行李，並稱其重量，得到樣本標準差s=4公斤。(1)旅客行李之樣本平均重量X̄之抽樣分配為______？(2)以μ=28公斤為中心，而機率為0.95之X̄的區間為______。(3)樣本平均重量X̄落在[26.8,29.2]之間的機率為______。","opts":{},"ans":null,"ansText":"X̄近似N(28,16/36)；[26.69,29.31]；0.9282","expl":"大樣本以s代σ：X̄~N(28,16/36)，標準誤=4/6；(2)28±1.96*(4/6)=[26.69,29.31]；(3)P(26.8≦X̄≦29.2)=P(-1.8≦Z≦1.8)=0.9641-0.0359=0.9282。","flag":false,"num":28},{"id":585,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"已知某一20-60歲成年人族群的收縮壓分布呈雙峰分布，一個高峰在120 mmHg處，另一個高峰在170 mmHg處，而此分布的平均值與標準差則分別為128 mmHg與24 mmHg。今從此成年人族群中隨機抽出36人，此36人的平均收縮壓為X̄，而X̄為一隨機變數，X̄介於120到132的機率=______。","opts":{},"ans":null,"ansText":"0.8185","expl":"母體非常態但n=36為大樣本，由中央極限定理X̄~N(128,24²/36)，標準誤=4；P(120≦X̄≦132)=P(-2≦Z≦1)=0.8413-0.0228=0.8185。","flag":false,"num":29},{"id":586,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"自具有常態母體N(100,σ²)抽出一組n=16的隨機樣本，並得到s=9，則(1)P(X̄≧96.056)=______。(2)以μ=100為中心，而機率為0.95之X̄的區間為______。","opts":{},"ans":null,"ansText":"0.95；[95.21,104.79]","expl":"母體常態、小樣本且σ未知：t=(X̄-μ)/(s/√n)~t(15)；(1)t=(96.056-100)/(9/4)=-1.753，P(X̄≧96.056)=P(t≧-1.753)=1-0.05=0.95。(2)100±2.131*(9/4)=[95.21,104.79]。","flag":false,"num":30},{"id":587,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"高雄市的市民中，習慣以捷運系統來當做交通工具的人佔總市民人數的36%。(1)若隨機抽選225名高雄市民，其中習慣以捷運系統來當做交通工具的比例P̂的分配趨近的分配為______，其變異數=______。(2)樣本比例P̂介於[0.3,0.4]之間的機率為______。(3)以p=0.36為中心，而機率為0.90之P̂的區間為______。","opts":{},"ans":null,"ansText":"P̂近似N(0.36,0.001024)；0.864；[0.3074,0.4126]","expl":"Var(P̂)=0.36*0.64/225=0.001024，標準誤=0.032；(2)P(0.3≦P̂≦0.4)=P(-1.875≦Z≦1.25)=0.8944-0.0304=0.864；(3)0.36±1.645*0.032=[0.3074,0.4126]。","flag":false,"num":31},{"id":588,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"青山農場生產蘋果，其重量為一常態分配，平均數為460公克，標準差為18公克，則：(1)抽取25個蘋果，25個蘋果平均重量大於470公克的機率=______。(2)將9個蘋果裝成一盒，則一盒蘋果重量（只計算蘋果重量）的平均數=______與變異數=______。(3)若要求一盒的蘋果重量要在4525~4675之間時，則有______%盒的蘋果不符合規定？","opts":{},"ans":null,"ansText":"0.0027；平均數=4140公克, 變異數=2916；6.44%","expl":"⚠️【答案存疑，非缺圖】(1)X̄~N(460,18²/25)，z=(470-460)/(18/5)=2.78，P=1-0.9973=0.0027。(2)一盒總重~N(9*460=4140,9*18²=2916)。(3)題解以區間[4040,4240]計：z=±1.85，P(符合)=0.9678-0.0322=0.9356，不符合=6.44%。註：題目文字之區間4525~4675與題解所用4040~4240不一致（且4140±100才對應z=±1.85）。","flag":true,"num":32},{"id":589,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"隨機變數X代表草莓點心中的草莓個數，有下列非常態分配：x=4,5,6,7；P(X=x)=0.2,0.4,0.3,0.1。(1)抽出36塊草莓點心為一組隨機樣本，則利用中央極限定理，樣本平均數X̄的平均數=______和變異數=______。(2)P(X̄≦5.5)=______和P(X̄>5.12)=______。","opts":{},"ans":null,"ansText":"5.3, 0.0225, 0.9082, 0.1151","expl":"E(X)=0.8+2+1.8+0.7=5.3；E(X²)=28.9，Var(X)=28.9-5.3²=0.81；X̄~N(5.3,0.81/36=0.0225)，標準誤=0.15；P(X̄≦5.5)=P(Z≦1.33)=0.9082；P(X̄>5.12)…依題解 P(Z≦-1.2)=0.1151（即X̄<5.12之機率，原文不等號方向轉檔錯亂）。","flag":false,"num":33},{"id":590,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"設X1,X2,...,Xn是一組隨機樣本，P(Xi=1)=0.65，P(Xi=0)=0.35，對i=1,2,...,n。(1)當n=10時，P(P̂≧0.8)=______？(2)當n=100時，P(P̂≧0.8)=______？","opts":{},"ans":null,"ansText":"0.2616, 0.0008","expl":"(1)n=10時P̂≧0.8即成功數≧8，以二項計算：P=1-P(X≦7)=1-0.7384=0.2616（依題解數值）。(2)n=100為大樣本，P̂~N(0.65,0.65*0.35/100)，標準誤≈0.0477，z=(0.8-0.65)/0.0477≈3.14，P=1-0.9992=0.0008。","flag":false,"num":34},{"id":591,"src":"甲｜統計學題庫","ch":"抽樣分配","type":"open","q":"哈林企業所生產的花式磁杯，其重量為一常態分配，平均數為147.8公克，標準差為3.51公克，現抽出25個花式磁杯，其中X̄和S²代表此組樣本的平均重量及其重量的變異數，則：(1)此組樣本的變異數大於18.69的機率=______。(2)P(5.5728≦S²≦22.063)=______。","opts":{},"ans":null,"ansText":"0.05, 0.98","expl":"母體常態：(n-1)S²/σ²~χ²(24)；(1)P(S²>18.69)=P(χ²>24*18.69/3.51²)=P(χ²>36.408)=0.05。(2)界限化為χ²值10.856與42.98，P=0.99-0.01=0.98。","flag":false,"num":35},{"id":592,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"袋中有10個紅球、1個白球，每個球大小質地相同，每次從袋中取一球，求取到白球的機率。","opts":{},"ans":null,"ansText":"1/11","expl":"將10個相同紅球視為相異，樣本空間有11個機會均等的元素，取到白球的機率為1/11。","flag":false,"num":1},{"id":593,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"擲二粒相同的骰子，求：(1)擲出1點、2點的機率；(2)擲出1點、1點的機率。","opts":{},"ans":null,"ansText":"(1) 1/18，(2) 1/36","expl":"將相同骰子視為相異，n(S)=36；(1) A={(1,2),(2,1)}，P=2/36=1/18；(2) B={(1,1)}，P=1/36。","flag":false,"num":2},{"id":594,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"[例題1(擲骰子)] 任意丟擲二粒質料均勻的骰子（各點出現機會均等），求其點數和為5的機率。","opts":{},"ans":null,"ansText":"1/9","expl":"n(S)=36，點數和為5的有(1,4)(2,3)(3,2)(4,1)共4種，P=4/36=1/9。","flag":false,"num":3},{"id":595,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"[例題1(袋中取球)] 一袋中有紅球3個，黃球5個，白球2個。(1)任取一球，取出紅球的機率？(2)任取二球為同色的機率？","opts":{},"ans":null,"ansText":"(1) 3/10，(2) 14/45","expl":"(1) 3/10；(2) (C(3,2)+C(5,2)+C(2,2))/C(10,2)=(3+10+1)/45=14/45。","flag":false,"num":4},{"id":598,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"[例題4] 投擲一粒骰子，假設點數出現的機率與該點數成正比。設A表出現偶數點的事件，B表出現奇數點的事件，C表出現質數點的事件。試求 (1)出現2點的機率 (2)P(A)、P(B)、P(C) (3)P(B∩C)。","opts":{},"ans":null,"ansText":"(1) 2/21，(2) P(A)=4/7、P(B)=3/7、P(C)=10/21，(3) 8/21","expl":"點數k出現機率為k/21；P(A)=(2+4+6)/21=4/7，P(B)=9/21=3/7，P(C)=(2+3+5)/21=10/21，P(B∩C)=(3+5)/21=8/21。","flag":false,"num":7},{"id":599,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習1) 投擲2粒公正的骰子，點數和大於7的機率為何？","opts":{},"ans":null,"ansText":"5/12","expl":"點數和8~12的情形數為5+4+3+2+1=15，P=15/36=5/12。","flag":false,"num":8},{"id":600,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習2) 投擲3粒公正的骰子，(1)3粒點數均相異的機率？(2)恰有2粒點數相同的機率？","opts":{},"ans":null,"ansText":"(1) 5/9，(2) 90/216","expl":"(1) 6×5×4/6^3=5/9；(2) 選相同點數與相異點數再排位置：3×6×5/216=90/216=5/12。","flag":false,"num":9},{"id":601,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習3) 設某一隨機試驗的樣本空間S={a1,a2,a3,a4}，已知事件{a2,a3}、{a2,a4}、{a3,a4}發生的機率分別為 2/3、1/2、1/2，則事件{a1,a2}發生的機率為何？","opts":{},"ans":null,"ansText":"1/2","expl":"解聯立得P(a2)=1/3、P(a3)=1/3、P(a4)=1/6、P(a1)=1/6，故P({a1,a2})=1/6+1/3=1/2。","flag":false,"num":10},{"id":603,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習6) 擲一骰子三次，求下列各事件的機率：(a)第一次6點 (b)第三次1點 (c)第一次6點或第三次1點。","opts":{},"ans":null,"ansText":"(a) 1/6，(b) 1/6，(c) 11/36","expl":"(a)(b)各為1/6；(c)由取捨原理 1/6+1/6−1/36=11/36。","flag":false,"num":12},{"id":605,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習8) 自10到99中任取一數，求下列事件的機率：(1)個位數>十位數 (2)個位數=十位數。","opts":{},"ans":null,"ansText":"(1) 2/5，(2) 1/10","expl":"共90個數；個位=十位有9個，P=1/10；個位>十位有36個，P=36/90=2/5。","flag":false,"num":14},{"id":606,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(練習9) 六面均塗綠漆之正方體木塊，鋸成1000個大小相同的小正立方體，混合放在一個袋子中，今自其中任取一塊，其6面均無綠漆之機率為何？","opts":{},"ans":null,"ansText":"64/125","expl":"內部無漆的小方塊有8^3=512個，P=512/1000=64/125。","flag":false,"num":15},{"id":633,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(綜合練習4) 設二公正的骰子，二個骰子的六面點數分別是1,1,1,2,2,3和1,2,2,3,3,3，今將此二骰子同時擲出，問擲得點數和為哪一個數時，機率最大？","opts":{},"ans":null,"ansText":"點數和為4時機率最大（機率7/18）","expl":"列表計算各點數和的機率，和為4的情形數最多（14/36=7/18）。","flag":false,"num":42},{"id":634,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"single","q":"(綜合練習5) 假設有一種特製的骰子，其六個面上的點數各為2,3,4,5,6,7。現在同時投擲兩顆公正的這種骰子，則其點數和為幾點時機率最大？(90自)","opts":{"A":"6","B":"7","C":"8","D":"9","E":"10"},"ans":"D","ansText":"(D) 9","expl":"點數和由4到14，中間值9的組合數最多（6種），機率最大。","flag":false,"num":43},{"id":635,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(綜合練習6) 使用一儀器測量一個高為70單位長的建築物50次，所得數據為：測量值68,69,70,71,72單位長的次數分別為5,15,10,15,5。依據此數據推測，若再用這個儀器測量此建築物三次，則三次測得的平均值為71單位長的機率為何？","opts":{},"ans":null,"ansText":"9/125","expl":"各測量值的機率為0.1,0.3,0.2,0.3,0.1；三次和為213的組合(69,72,72),(70,71,72),(71,71,71),(69,71,73)…計算各排列機率相加得9/125。","flag":false,"num":44},{"id":636,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(綜合練習7) 擲3粒公正骰子，問恰有兩個點數相同的機率為何？(88學科)","opts":{},"ans":null,"ansText":"90/216","expl":"選相同的點數6種、相異點數5種、位置C(3,2)=3種，P=6×5×3/216=90/216=5/12。","flag":false,"num":45},{"id":645,"src":"甲｜講義-機率統計","ch":"機率｜古典機率與樣本空間","type":"open","q":"(綜合練習16) 設甲乙丙三人猜拳（剪刀石頭布）時，甲得勝的機率為多少？三人不分勝負之機率為多少？","opts":{},"ans":null,"ansText":"1/9，1/3","expl":"n(S)=27；甲一人獨勝有3種，P=3/27=1/9；不分勝負為三人全同或全異，(3+6)/27=1/3。","flag":false,"num":54},{"id":597,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"[例題3] 設A,B為樣本空間S中的二事件，P(A)=1/3，P(B)=1/4，P(A∪B)=2/5，求 (1)P(A∩B) (2)P(A') (3)P(A'∩B) (4)P(A'∪B)。","opts":{},"ans":null,"ansText":"(1) 11/60，(2) 2/3，(3) 1/15，(4) 17/20","expl":"P(A∩B)=1/3+1/4−2/5=11/60；P(A')=2/3；P(A'∩B)=P(B)−P(A∩B)=1/15；P(A'∪B)=1−P(A)+P(A∩B)=17/20。","flag":false,"num":6},{"id":602,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"(練習4) A,B為二事件，若P(A'∩B')=1/4，P(A)=1/3，則 (1)P(A∪B)=？ (2)P(A'−B')=？","opts":{},"ans":null,"ansText":"(1) 3/4，(2) 5/12","expl":"P(A∪B)=1−P(A'∩B')=3/4；P(A'−B')=P(A'∩B)=P(A∪B)−P(A)=3/4−1/3=5/12。","flag":false,"num":11},{"id":607,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"[例題5(機率性質的應用)] 假設任意取得之統一發票，其號碼之個位數字為0,1,2,…,9中任一數字，且這些數字出現的機率相等。今自三不同場所各取得一張統一發票，則三張發票號碼個位數字中 (1)至少有一個為0的機率為 (A)0.081 (B)0.243 (C)0.271 (D)0.300 (E)0.333 (2)至少有一個為0，且至少有一個為9的機率為 (A)0.048 (B)0.054 (C)0.096 (D)0.488 (E)0.667。(80自)","opts":{},"ans":null,"ansText":"(1) C，(2) B","expl":"(1) 1−0.9^3=0.271；(2) 由取捨原理 1−2×0.9^3+0.8^3=0.054。","flag":false,"num":16},{"id":624,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"(練習18) 任意丟擲一粒質料均勻的骰子三次。設三次中至少出現一次1點的事件為A，三次中至少出現一次2點的事件為B。試求 (1)A不發生的機率 (2)A發生的機率 (3)A與B都發生的機率 (4)A或B發生的機率。","opts":{},"ans":null,"ansText":"(1) 125/216，(2) 91/216，(3) 5/36，(4) 19/27","expl":"(1) (5/6)^3=125/216；(2) 1−125/216=91/216；(4) P(A∪B)=1−(4/6)^3=19/27；(3) P(A∩B)=P(A)+P(B)−P(A∪B)=5/36。","flag":false,"num":33},{"id":630,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"(綜合練習1) 設A、B、C表三事件，且P(A)=P(B)=P(C)=1/4，P(A∩B)=P(B∩C)=0，P(A∩C)=1/8，求三事件至少發生一件的機率。","opts":{},"ans":null,"ansText":"5/8","expl":"由排容原理 P(A∪B∪C)=3×1/4−0−0−1/8+0=5/8（A∩B=φ故A∩B∩C=φ）。","flag":false,"num":39},{"id":631,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"single","q":"(綜合練習2) 設事件A發生之機率為1/2，事件B發生之機率為1/3，若以p表事件A或事件B發生之機率，則p值的範圍為何？(87學科)","opts":{"A":"p≤1/6","B":"1/6<p≤1/3","C":"1/3<p≤1/2","D":"1/2<p≤5/6","E":"5/6<p"},"ans":"D","ansText":"(D) 1/2<p≤5/6","expl":"B⊆A時p=P(A∪B)最小為1/2（但p可等於1/2嗎：B⊆A時恰為1/2，故下界含或不含依選項設計取(D)）；A,B互斥時最大為1/2+1/3=5/6。","flag":false,"num":40},{"id":632,"src":"甲｜講義-機率統計","ch":"機率｜機率的性質","type":"open","q":"(綜合練習3) 設有A、B、C三球隊進入決賽爭取冠軍獎盃。若A得冠軍的機會為B的2倍，B得冠軍的機會為C的3倍，則A隊得冠軍的機率為何？","opts":{},"ans":null,"ansText":"3/5","expl":"設P(C)=x，則P(B)=3x、P(A)=6x，x+3x+6x=1得x=1/10，P(A)=6/10=3/5。","flag":false,"num":41},{"id":596,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題2] 把C,C,E,E,I,N,S七個字母分別寫在七張同樣的卡片上放入盒中，隨意一張一張取出並按先後順序排成一列，試問排列結果恰好拼成 SCIENCE 的機率是多少？","opts":{},"ans":null,"ansText":"1/1260","expl":"相異排列數為7!/(2!2!)=1260，其中恰有一種拼成SCIENCE，故機率為1/1260。","flag":false,"num":5},{"id":604,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習7) 一袋中有3個白球，4個黑球，5個紅球，從袋中任取3球，求下列各事件的機率：(1)取出1個黑球，2個紅球 (2)此3球同色 (3)此3球顏色都不同 (4)恰有2種顏色球。","opts":{},"ans":null,"ansText":"(1) 2/11，(2) 3/44，(3) 3/11，(4) 29/44","expl":"n(S)=C(12,3)=220；(1) C(4,1)C(5,2)/220=2/11；(2) (C(3,3)+C(4,3)+C(5,3))/220=3/44；(3) 3×4×5/220=3/11；(4) 1−3/44−3/11=29/44。","flag":false,"num":13},{"id":608,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題6(投擲骰子)] 投擲一顆骰子5次，出現點數以x,y,z,u,v表示，求下列事件發生的機率：(1) x,y,z,u,v不全相異 (2) (x−y)(y−z)(z−u)(u−v)=0。","opts":{},"ans":null,"ansText":"(1) 49/54，(2) 671/1296","expl":"(1) 1−P(5,6)... 即1−(6×5×4×3×2)/6^5=1−720/7776=49/54；(2) 1−P(相鄰皆不同)=1−6×5^4/6^5=1−625/1296=671/1296。","flag":false,"num":17},{"id":609,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題7(配對問題)] 同尺寸同式樣的黑鞋3雙，白鞋2雙，任取4隻，則能配成2雙之機率為何？","opts":{},"ans":null,"ansText":"23/105","expl":"分左右腳的鞋共10隻，計算取4隻恰成2雙（同色成雙）的情形數除以C(10,4)=210，得23/105。","flag":false,"num":18},{"id":610,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題8(撲克牌問題)] 從一副撲克牌任取5張，求下列各種情形之機率：(1)同花大順(Royal Flush) (2)葫蘆(Full House) (3)兩對(Two Pairs) (4)鐵枝(如AAAAQ)。","opts":{},"ans":null,"ansText":"(1) 1/649740，(2) 6/4165，(3) 198/4165，(4) 1/4165","expl":"分母均為C(52,5)=2598960；(1) C(4,1)/C(52,5)；(2) C(13,1)C(4,3)C(12,1)C(4,2)/C(52,5)；(3) C(13,2)C(4,2)C(4,2)C(11,1)C(4,1)/C(52,5)；(4) C(13,1)C(4,4)C(12,1)C(4,1)/C(52,5)。","flag":false,"num":19},{"id":612,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題10] 一盒中有10個球，球上分別印有號碼1到10；今由盒中取4球，則4球的號碼中第二大數目是7的機率為何？(84社)","opts":{},"ans":null,"ansText":"3/14","expl":"第二大為7：比7大的取1個(C(3,1))、7必取、比7小的取2個(C(6,2))，P=C(3,1)×C(6,2)/C(10,4)=45/210=3/14。","flag":false,"num":21},{"id":613,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題11(取數字)] 自1,2,3,…,10中任取相異3數，則 (1)此三數成等差之機率？(2)此三數成等比之機率？","opts":{},"ans":null,"ansText":"(1) 1/6，(2) 1/30","expl":"n(S)=C(10,3)=120；等差需最大最小同奇偶，2×C(5,2)=20組，P=1/6；等比有{1,2,4},{2,4,8},{1,3,9},{4,6,9}共4組，P=1/30。","flag":false,"num":22},{"id":614,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題12(分組與分堆)] 12張標示以1,2,…,12的卡片，任意分成兩疊，每疊各6張。(1)求1,2,3三張在同一疊的機率 (2)求1,2,3,4四張中，每疊各有兩張的機率。","opts":{},"ans":null,"ansText":"(1) 2/11，(2) 5/11","expl":"(1) C(9,3)/C(12,6)×2... 即2×84/924=2/11；(2) C(4,2)×C(8,4)/C(12,6)=420/924=5/11。","flag":false,"num":23},{"id":615,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"[例題13(先取完球)] 袋子中有3個紅球，5個白球，每次取一球，直到取完球為止，則白球先被取完的機率為何？","opts":{},"ans":null,"ansText":"3/8","expl":"白球先取完等價於最後一球為紅球，機率為3/8。","flag":false,"num":24},{"id":616,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習10) 一副撲克牌的大牌(10,J,Q,K,A)有20張，從中任取4張，求下列各事件發生的機率：(1)花色相同 (2)恰含兩種花色 (3)恰為兩對(如JJKK)。","opts":{},"ans":null,"ansText":"(1) 4/969，(2) 80/323，(3) 24/323","expl":"n(S)=C(20,4)=4845；(1) 4×C(5,4)/4845=4/969；(2) 恰兩種花色情形數1200，P=80/323；(3) C(5,2)×C(4,2)^2/4845=360/4845=24/323。","flag":false,"num":25},{"id":617,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習11) 設N個人中至少二人在同一個月出生的機率為P(N)，求 (1)P(5) (2)P(14)。","opts":{},"ans":null,"ansText":"(1) 1−P(12,5)/12^5，(2) 1","expl":"(1) 餘事件為5人生月全不同，P(5)=1−P(12,5)/12^5；(2) 14人必有同月出生者（鴿籠原理），P(14)=1。","flag":false,"num":26},{"id":618,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習12) 從一副52張的撲克牌中任意抽出二張，則這二張號碼相同的機率是多少？又兩張號碼不同的機率為何？","opts":{},"ans":null,"ansText":"1/17，16/17","expl":"號碼相同：13×C(4,2)/C(52,2)=78/1326=1/17；號碼不同為餘事件16/17。","flag":false,"num":27},{"id":619,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習13) 同尺寸同式樣的黑襪3雙，白襪2雙，任取4隻（襪子不分左右腳），則能配成2雙之機率為何？","opts":{},"ans":null,"ansText":"53/105","expl":"襪子不分左右，同色任2隻即成雙，計算取4隻可配成2雙的情形除以C(10,4)=210，得53/105。","flag":false,"num":28},{"id":620,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習14) 有A,B,C三房間，各可住4人、3人、3人，今有甲乙丙等10人前往住宿，則甲乙丙三人中至少有二人同住一間房間的機率為何？","opts":{},"ans":null,"ansText":"7/10","expl":"餘事件為甲乙丙三人分住三房，P=1−(分住三房的情形)/(全部分房法)=1−3/10=7/10。","flag":false,"num":29},{"id":621,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習15) 從5對夫妻中任選4人，(1)恰為二對夫妻之機率？(2)恰為一對夫妻之機率？","opts":{},"ans":null,"ansText":"(1) 1/21，(2) 4/7","expl":"n(S)=C(10,4)=210；(1) C(5,2)/210=1/21；(2) C(5,1)×C(4,2)×2×2/210=120/210=4/7。","flag":false,"num":30},{"id":622,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習16) 甲乙丙丁戊5人各出一張名片，將5張名片放入一袋內，今每人取出一張，求 (1)恰有2人拿到自己的名片之機率 (2)每個人都拿到自己的名片之機率 (3)每個人都沒有拿到自己的名片之機率。","opts":{},"ans":null,"ansText":"(1) 1/6，(2) 1/120，(3) 11/30","expl":"n(S)=5!=120；(1) C(5,2)×D3=10×2=20，P=1/6；(2) 1/120；(3) 錯排D5=44，P=44/120=11/30。","flag":false,"num":31},{"id":623,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習17) 甲乙兩人分別從0至99的100個數，各自選出3個不同的數，則兩人所選的數完全相同的機率為何？至少有一數相同的機率為何？","opts":{},"ans":null,"ansText":"1/161700，713/8085","expl":"完全相同：1/C(100,3)=1/161700；至少一數相同：1−C(97,3)/C(100,3)=713/8085。","flag":false,"num":32},{"id":625,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習19) 袋子中有20球，分別編有1,2,3,…,20號的球各一個，任取3球，求下列各種情形之機率：(1)3球之號碼和為3之倍數 (2)3球之號碼成等差數列 (3)3球中任2球之號碼均不連續。","opts":{},"ans":null,"ansText":"(1) 32/95，(2) 3/38，(3) 68/95","expl":"n(S)=C(20,3)=1140；(1) 依餘數0,1,2各分類計數得384種，P=32/95；(2) 首尾同奇偶2×C(10,2)=90，P=3/38；(3) C(18,3)=816，P=68/95。","flag":false,"num":34},{"id":626,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習20) 投一骰子三次，出現的點數依次為a,b,c，求滿足下列各條件的事件的機率：(1) a<b<c (2) a≤b≤c (3) a+b+c=11 (4) (a−b)(b−c)=0 (5) (a−b)(b−c)=2。","opts":{},"ans":null,"ansText":"(1) 5/54，(2) 7/27，(3) 1/8，(4) 11/36，(5) 1/18","expl":"n(S)=216；(1) C(6,3)/216=5/54；(2) H(6,3)/216=56/216=7/27；(3) 和為11有27種，P=1/8；(4) 1−P(a≠b且b≠c)=1−150/216=11/36；(5) 因數分解計數得12種，P=1/18。","flag":false,"num":35},{"id":628,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習22) 袋中有20個燈泡，其中有3個斷了燈絲。現在逐一檢查，在檢查到第7個燈泡時，恰好是第3個斷了燈絲的燈泡之機率為何？","opts":{},"ans":null,"ansText":"1/76","expl":"前6個中恰2個壞且第7個為壞：P=C(6,2)×(3×2×1×排列數)/(20×19×18)=15×6/6840=1/76。","flag":false,"num":37},{"id":629,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(練習23) 袋子中有m個紅球，n個白球，每次取一球，直到取完球為止，則白球先被取完的機率為何？","opts":{},"ans":null,"ansText":"m/(m+n)","expl":"白球先取完等價於最後一球為紅球，機率為m/(m+n)。","flag":false,"num":38},{"id":637,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習8) 金先生在提款時忘了帳號密碼，但他還記得密碼的四位數字中，有兩個3，一個8，一個9，於是他就用這四個數字隨意排成一個四位數輸入提款機嘗試。請問他只試一次就成功的機率有多少？(92學科)","opts":{},"ans":null,"ansText":"1/12","expl":"四數字的相異排列有4!/2!=12種，只有一種正確，P=1/12。","flag":false,"num":46},{"id":638,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"multi","q":"(綜合練習9) 從1,2,…,10這十個數中隨意任取兩個，以p表示其和為偶數之機率，q表示其和為奇數之機率。試問下列哪些敘述是正確的？(93學科)","opts":{"1":"p+q=1","2":"p=q","3":"|p−q|≤1/10","4":"|p−q|≥1/20","5":"p≥1/2"},"ans":"14","ansText":"(1)(4)","expl":"p=(C(5,2)+C(5,2))/C(10,2)=20/45=4/9，q=25/45=5/9；p+q=1成立，|p−q|=1/9≥1/20成立，其餘不成立。","flag":false,"num":47},{"id":639,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習10) 已知編號為1,2,3,…,10的十盞路燈中，有三盞是故障的，則編號4與編號5都是故障的機率為何？(85社)","opts":{},"ans":null,"ansText":"1/15","expl":"P=C(8,1)/C(10,3)=8/120=1/15（另一故障燈在其餘8盞中）。","flag":false,"num":48},{"id":640,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習11) 袋中有7個相同的球，分別標示1、2、…、7號；若自袋中隨機取出4個球（取出之球不再放回），則取出之球上的標號和為奇數的機率為何？(86社)","opts":{},"ans":null,"ansText":"17/35","expl":"⚠️【答案存疑，非缺圖】和為奇數需1奇3偶或3奇1偶：(C(4,1)C(3,3)+C(4,3)C(3,1))/C(7,4)=(4+12)/35…重算為(C(4,1)×1+C(4,3)×3)/35=16/35？依講義解答為17/35：奇數球4個偶數球3個，1奇3偶C(4,1)C(3,3)=4、3奇1偶C(4,3)C(3,1)=12，共16/35；講義答案17/35與計算不符。","flag":true,"num":49},{"id":641,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"single","q":"(綜合練習12) 樂透是由1~42個號碼開出6個號碼，請問開出的6個號碼都是偶數的機率，最接近下列哪一個值？(2003指定乙)","opts":{"1":"1/2","2":"6/42","3":"1/23","4":"1/12","5":"1/26"},"ans":"5","ansText":"(5) 1/26","expl":"P=C(21,6)/C(42,6)=54264/5245786≈0.0103≈1/26。","flag":false,"num":50},{"id":642,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"single","q":"(綜合練習13) 小樂透玩法是「42選6」：從01~42中任選六個號碼，六個號碼與開出號碼完全相同(不計次序)時得頭獎；台北銀行曾考慮改發行「39選5」的小小樂透。假設小樂透中頭獎的機率是R，小小樂透中頭獎的機率是r，試問比值r/R最接近下列哪一個選項？(2005學測)","opts":{"1":"3","2":"5","3":"7","4":"9","5":"11"},"ans":"4","ansText":"(4) 9","expl":"r/R=C(42,6)/C(39,5)=5245786/575757≈9.1，最接近9。","flag":false,"num":51},{"id":643,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"single","q":"(綜合練習14) 在4×4的棋盤方格（共16個格子，如原題附圖）中，隨機任意選取兩個格子。選出的兩個格子不在同一行（有無同列無所謂）的機率為何？(2006學測)","opts":{"1":"1/20","2":"1/4","3":"3/4","4":"3/5","5":"4/5"},"ans":"5","ansText":"(5) 4/5","expl":"16格中取2格共C(16,2)=120種。同一行（同一橫列）的取法=4行×C(4,2)=4×6=24種，P(同行)=24/120=1/5，故不同行=1−1/5=4/5。（原附圖為4×4方格，已依原卷補回格局）","flag":false,"num":52},{"id":646,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習17) 自1,2,3,…,100中任取相異3數，則此三數成等差之機率為何？","opts":{},"ans":null,"ansText":"1/66","expl":"三數等差需最大與最小同奇偶，情形數2×C(50,2)=2450，P=2450/C(100,3)=2450/161700=1/66。","flag":false,"num":55},{"id":647,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習18) 設集合M={1,2,3,…,10}中，任取三個數字，求下列事件發生的機率：(a)出現三個連續數字 (b)恰出現二個連續數字 (c)不出現連續數字。","opts":{},"ans":null,"ansText":"(a) 1/15，(b) 7/15，(c) 7/15","expl":"n(S)=C(10,3)=120；(a) 8/120=1/15；(c) C(8,3)/120=56/120=7/15；(b) 1−1/15−7/15=7/15。","flag":false,"num":56},{"id":648,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習19) 袋子中有42個相同的球，分別標上1,2,3,…,42等42個號碼，甲乙兩人各自袋中任意取出一球比較數字大小（各人取球後仍放回袋中），則甲取出之球上數字不小於乙取出之球上數字的機率為何？","opts":{},"ans":null,"ansText":"43/84","expl":"P=1−P(甲<乙)=1−C(42,2)/42^2=1−861/1764=903/1764=43/84。","flag":false,"num":57},{"id":649,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習20) 設HBL共有16隊參賽，先抽籤均分成甲乙丙丁4組進行分組預賽（每組4隊），則松山高中、再興中學、三民家商在預賽中分在不同組的機率為何？","opts":{},"ans":null,"ansText":"16/35","expl":"固定松山後，再興不同組機率12/15，三民再不同組機率8/14，相乘得16/35。","flag":false,"num":58},{"id":650,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習21) 樂透自01~42中開出6個號碼及一個特別號碼。若6個號碼全猜中，則得頭獎；若6個號碼中猜中5個再猜中特別號，則得貳獎；若6個號碼中猜中5個但沒猜中特別號碼，則為三獎；若6個號碼中猜中4個，則為四獎；若6個號碼中猜中3個，則為五獎。試求出各獎發生的機率。","opts":{},"ans":null,"ansText":"頭獎 1/C(42,6)，貳獎 6/C(42,6)，三獎 C(6,5)×C(35,1)/C(42,6)，四獎 C(6,4)×C(36,2)/C(42,6)，五獎 C(6,3)×C(36,3)/C(42,6)","expl":"以C(42,6)為樣本空間，依猜中個數與是否含特別號分別計數。題目前段文字在講義中缺漏，依標準玩法補全。","flag":false,"num":59},{"id":651,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習22) 某休旅車有3排座位，每排坐2人，今有3男3女入坐，則每排均坐1男1女之機率為何？","opts":{},"ans":null,"ansText":"2/5","expl":"6人入座共6!種；每排1男1女：3!×3!×2^3=288，P=288/720=2/5。","flag":false,"num":60},{"id":652,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習23) 自1,2,3,4,5中取出3個相異數字作成三位數，則 (a)此三位數是偶數的機率？(b)此三位數是4的倍數的機率？","opts":{},"ans":null,"ansText":"(a) 2/5，(b) 1/5","expl":"共60個三位數；個位為2或4的有24個，P=2/5；4的倍數（末二位為12,24,32,52,․24等）共12個，P=1/5。","flag":false,"num":61},{"id":653,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習24) 任意而且獨立地用4或5代入二階行列式 |a b; c d| 的四個元a,b,c,d，所得的行列式值為奇數的機率為何？","opts":{},"ans":null,"ansText":"3/8","expl":"ad−bc為奇數需ad與bc一奇一偶；ad為奇數機率1/4、偶數3/4，P=2×(1/4)×(3/4)=3/8。","flag":false,"num":62},{"id":654,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習25) 設有一電梯自1樓開始升到6樓，今有4人自1樓乘坐，電梯在二、三、四、五、六樓均有停留，則在某樓至少有二人走出之機率為何？","opts":{},"ans":null,"ansText":"101/125","expl":"餘事件為每樓至多一人走出：P=1−P(5,4)/5^4=1−120/625=101/125。","flag":false,"num":63},{"id":655,"src":"甲｜講義-機率統計","ch":"機率｜排列組合計數應用","type":"open","q":"(綜合練習26) 把r個相同的球隨機放入n個箱子，假設每個箱子都可以一次放r個球，試求每個箱子至多有一個球的機率。(n≥r)","opts":{},"ans":null,"ansText":"C(n,r)×r!/n^r","expl":"總放法n^r；每箱至多一球即選r個箱子排列，P=C(n,r)×r!/n^r=P(n,r)/n^r。","flag":false,"num":64},{"id":611,"src":"甲｜講義-機率統計","ch":"機率｜重複試驗","type":"open","q":"[例題9(重複實驗)] 擲一均勻骰子10次，求恰好出現7次6點的機率是多少？","opts":{},"ans":null,"ansText":"C(10,7)×5^3/6^10","expl":"選出出現6點的7次，其餘3次各有5種點數，P=C(10,7)×5^3/6^10。","flag":false,"num":20},{"id":627,"src":"甲｜講義-機率統計","ch":"機率｜重複試驗","type":"open","q":"(練習21) 擲一均勻骰子10次，求恰好出現4次6點的機率是多少？","opts":{},"ans":null,"ansText":"C(10,4)×5^6/6^10","expl":"選出出現6點的4次，其餘6次各有5種點數，P=C(10,4)×5^6/6^10。","flag":false,"num":36},{"id":644,"src":"甲｜講義-機率統計","ch":"機率｜重複試驗","type":"open","q":"(綜合練習15) 投擲一粒公正骰子4次，每個點出現的機會均等，試求 (a)恰好有2次出現1點之機率 (b)至少有2次出現1點的機率。","opts":{},"ans":null,"ansText":"(a) 25/216，(b) 171/1296","expl":"(a) C(4,2)(1/6)^2(5/6)^2=150/1296=25/216；(b) 1−(5/6)^4−C(4,1)(1/6)(5/6)^3=1−1125/1296=171/1296。講義解答印為155/1296，與計算值171/1296不符。","flag":false,"num":53},{"id":656,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題1】擲一粒公正的骰子，求下列各機率：(1)擲出的點數是偶數的機率 (2)擲出點數大於4點的機率。","opts":{},"ans":null,"ansText":"(1) 1/2，(2) 1/3","expl":"n(S)=6；(1) A={2,4,6}，P=3/6=1/2；(2) B={5,6}，P=2/6=1/3。","flag":false,"num":65},{"id":657,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題1】從數字1到50中任選一數，求下列各機率：(1)選到3的倍數的機率 (2)選到質數的機率。","opts":{},"ans":null,"ansText":"(1) 8/25，(2) 3/10","expl":"n(S)=50；3的倍數有16個，P=16/50=8/25；50以內質數有15個，P=15/50=3/10。","flag":false,"num":66},{"id":658,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題2】丟擲大小2個骰子，求下列各機率：(1)兩個骰子點數相同的機率 (2)出現點數乘積是6的機率。","opts":{},"ans":null,"ansText":"(1) 1/6，(2) 1/9","expl":"n(S)=36；(1) 相同點數6種，P=1/6；(2) 乘積為6有(1,6)(2,3)(3,2)(6,1)共4種，P=4/36=1/9。","flag":false,"num":67},{"id":659,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題2】擲一粒公正的骰子兩次，求下列各機率：(1)兩次點數均大於3 (2)第一次的點數大於第二次的點數。","opts":{},"ans":null,"ansText":"(1) 1/4，(2) 5/12","expl":"n(S)=36；(1) 3×3=9種，P=1/4；(2) C(6,2)=15種，P=15/36=5/12。","flag":false,"num":68},{"id":660,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題3】袋中有6個大小相同的球，其中紅球3個，白球2個，黑球1個。(1)從中任取一球，求取到白球的機率 (2)取一球後不放回，再取一球，求兩球都是紅球的機率 (3)從中同時取出2球，求兩球顏色相同的機率。","opts":{},"ans":null,"ansText":"(1) 1/3，(2) 1/5，(3) 4/15","expl":"(1) 2/6=1/3；(2) P(6,2)=30種取法，紅紅P(3,2)=6種，P=6/30=1/5；(3) n(S)=C(6,2)=15，同色C(3,2)+C(2,2)=4，P=4/15。","flag":false,"num":69},{"id":661,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題3】袋中有8個大小相同的球，其中紅球5個，白球3個。今自袋中任取4球，求下列各機率：(1)均為紅球的機率 (2)紅球比白球多的機率。","opts":{},"ans":null,"ansText":"(1) 1/14，(2) 1/2","expl":"n(S)=C(8,4)=70；(1) C(5,4)/70=5/70=1/14；(2) 4紅或3紅1白：(C(5,4)+C(5,3)C(3,1))/70=35/70=1/2。","flag":false,"num":70},{"id":662,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題4】同時丟兩個硬幣，求下列各機率：(1)出現一正面一反面的機率 (2)兩硬幣出現同一面的機率。","opts":{},"ans":null,"ansText":"(1) 1/2，(2) 1/2","expl":"n(S)=4；一正一反有2種，P=1/2；同一面有(正,正)(反,反)2種，P=1/2。","flag":false,"num":71},{"id":663,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題4】同時丟三個硬幣，求 (1)三個都出現反面的機率 (2)三個硬幣中恰有兩個正面的機率。","opts":{},"ans":null,"ansText":"(1) 1/8，(2) 3/8","expl":"n(S)=8；(1) 1/8；(2) 恰兩正有C(3,2)=3種，P=3/8。","flag":false,"num":72},{"id":664,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題5】丟擲兩粒公正骰子，試求點數和至少為9的機率。","opts":{},"ans":null,"ansText":"5/18","expl":"點數和9,10,11,12的情形數為4+3+2+1=10，P=10/36=5/18。","flag":false,"num":73},{"id":665,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題5】丟擲三粒公正骰子，試求 (1)點數和為5的機率 (2)最大點數為5、最小點數為2的機率。","opts":{},"ans":null,"ansText":"(1) 1/36，(2) 1/12","expl":"(1) 和為5的排列有6種（(1,1,3)型3種+(1,2,2)型3種），P=6/216=1/36；(2) (5,5,2)(5,2,2)各3種、(5,2,3)(5,2,4)各6種，共18種，P=18/216=1/12。","flag":false,"num":74},{"id":666,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題6】設A,B為樣本空間S中的二事件，且P(A)=1/2，P(B)=1/3，P(A∩B)=1/10，求下列各值：(1)P(A∪B) (2)P(A∩B')。","opts":{},"ans":null,"ansText":"(1) 11/15，(2) 2/5","expl":"(1) 1/2+1/3−1/10=11/15；(2) P(A)−P(A∩B)=1/2−1/10=2/5。","flag":false,"num":75},{"id":667,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題6】設A,B為樣本空間S中的二事件，且P(A)=1/3，P(A∩B)=1/4，P(A∪B)=3/4，求P(A'∩B)。","opts":{},"ans":null,"ansText":"5/12","expl":"P(B)=P(A∪B)−P(A)+P(A∩B)=3/4−1/3+1/4=2/3；P(A'∩B)=P(B)−P(A∩B)=2/3−1/4=5/12。","flag":false,"num":76},{"id":668,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【例題7】從8個正數、5個負數中任取4個數相乘，求其乘積為負數的機率。","opts":{},"ans":null,"ansText":"72/143","expl":"乘積為負需3正1負或1正3負：(C(8,3)C(5,1)+C(8,1)C(5,3))/C(13,4)=(280+80)/715=72/143。","flag":false,"num":77},{"id":669,"src":"甲｜講義-機率統計","ch":"古典機率｜機率的性質","type":"open","q":"【類題7】自6位男生4位女生中選出一個5人委員會，求 (1)男女生至少各2人的機率 (2)男生最多2人的機率。","opts":{},"ans":null,"ansText":"(1) 5/7，(2) 11/42","expl":"n(S)=C(10,5)=252；
