數X之值為-2、0、2，各數值發生的機率分別為0.3、0.5、0.2，試求(1)E(2X+1)。(2)Var(3X-2)。","opts":{},"ans":null,"ansText":"(1)0.6，(2)17.64","expl":"E(X)=-0.2、Var(X)=1.96，故E(2X+1)=2E(X)+1=0.6，Var(3X-2)=9Var(X)=17.64。","flag":false,"num":10},{"id":708,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設兩組獨立隨機變數X、Y，期望值E(X)=5，E(Y)=-4，變異數Var(X)=1，Var(Y)=2。試求(1)E(8X-6Y)。(2)Var(2X-4Y)。","opts":{},"ans":null,"ansText":"(1)64，(2)36","expl":"E(8X-6Y)=8×5-6×(-4)=64；獨立時Var(2X-4Y)=4Var(X)+16Var(Y)=4+32=36。","flag":false,"num":11},{"id":713,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"假設X為一個隨機變數，若Var(3X+5)=117，試求Var(5X+7)。","opts":{},"ans":null,"ansText":"325","expl":"9Var(X)=117得Var(X)=13，故Var(5X+7)=25×13=325。","flag":false,"num":16},{"id":714,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"若E(X+8)=10，且E[(X+3)^2]=116，試求(1)E(X)。(2)Var(2X-3)。","opts":{},"ans":null,"ansText":"(1)2，(2)364","expl":"E(X)=10-8=2；展開E[(X+3)^2]=E(X^2)+6E(X)+9=116得E(X^2)=95，Var(2X-3)=4(95-4)=364。","flag":false,"num":17},{"id":782,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設X是隨機變數，已知E(X)=56，求E(0.9X+10)。","opts":{},"ans":null,"ansText":"60.4","expl":"E(0.9X+10)=0.9×56+10=60.4。","flag":false,"num":85},{"id":785,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設X是隨機變數，且Y=(2/5)X+60，已知Var(X)=100，求Var(Y)。","opts":{},"ans":null,"ansText":"16","expl":"Var(Y)=(2/5)^2×100=16。","flag":false,"num":88},{"id":787,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設X是隨機變數，且Y=(2/5)X+60，已知σX=10，求σY。","opts":{},"ans":null,"ansText":"4","expl":"σY=(2/5)×σX=(2/5)×10=4。","flag":false,"num":90},{"id":788,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設X為隨機變數，且σX=2.92，若變數Y=5X+2，求σY。","opts":{},"ans":null,"ansText":"14.6","expl":"σY=|5|×σX=5×2.92=14.6。","flag":false,"num":91},{"id":794,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-1 期望值與變異數的性質(aX+b)","type":"open","q":"設X是隨機變數，且Y=(3/4)X+20，已知Var(X)=200，求Var(Y)。","opts":{},"ans":null,"ansText":"225/2","expl":"Var(Y)=(3/4)^2×200=9/16×200=225/2。","flag":false,"num":97},{"id":773,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"設隨機變數X的值由擲一粒公正骰子決定，骰子點數大於4（即5或6）時X=1；其餘點數（1,2,3,4）時X=0。試問X是否遵循白努利分布？若是，其參數p為何？","opts":{},"ans":null,"ansText":"是，p=1/3","expl":"X之值只有0與1，且f(1)=1/3、f(0)=2/3，故為參數p=1/3的白努利分布。","flag":false,"num":76},{"id":776,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"設隨機變數X是參數2/3的白努利分布，求X的期望值。","opts":{},"ans":null,"ansText":"2/3","expl":"E(X)=1×2/3+0×1/3=2/3。","flag":false,"num":79},{"id":790,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"設隨機變數X遵循參數為p的白努利分布，f為其機率質量函數，且3f(0)=5f(1)，求p。","opts":{},"ans":null,"ansText":"3/8","expl":"f(1)=p，f(0)=1-p，由3(1-p)=5p得8p=3，p=3/8。","flag":false,"num":93},{"id":792,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"求下列隨機變數X的期望值及變異數。(1)X遵循等機率分布且可能值為1至100的正整數。(2)X遵循參數為1/3的白努利分布。","opts":{},"ans":null,"ansText":"(1)期望值101/2，變異數3333/4，(2)期望值1/3，變異數2/9","expl":"(1)E(X)=(1+...+100)/100=101/2，E(X^2)=(100×101×201/6)/100=6767/2，Var=6767/2-(101/2)^2=3333/4；(2)E=1/3，Var=1/3-(1/3)^2=2/9。","flag":false,"num":95},{"id":800,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"設隨機變數X遵循白努利分布，其機率函數f滿足f(1):f(0)=2:3，求參數p。","opts":{},"ans":null,"ansText":"2/5","expl":"p:(1-p)=2:3，即2(1-p)=3p，5p=2，p=2/5。","flag":false,"num":103},{"id":802,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"求下列隨機變數X的期望值。(1)X遵循等機率分布且可能值為x1, x2, …, xn。(2)X遵循參數為p的白努利分布。","opts":{},"ans":null,"ansText":"(1)(x1+x2+…+xn)/n，(2)p","expl":"(1)每個值機率1/n，期望值為算術平均；(2)E(X)=0×(1-p)+1×p=p。","flag":false,"num":105},{"id":805,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-2 白努利與二項分布","type":"open","q":"求下列隨機變數X的變異數。(1)X遵循等機率分布且可能值為x1, x2, …, xn。(2)X遵循參數為p的白努利分布。","opts":{},"ans":null,"ansText":"(1)(1/n)Σxk^2-((1/n)Σxk)^2，(2)p(1-p)","expl":"(1)由Var(X)=E(X^2)-μ^2代入等機率分布；(2)E(X)=p，E(X^2)=p，Var=p-p^2=p(1-p)。","flag":false,"num":108},{"id":709,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"隨機變數X取值0、1、2、3，機率依序為8/27、12/27、6/27、1/27，試求(1)X的期望值。(2)X的標準差。","opts":{},"ans":null,"ansText":"(1)1，(2)√6/3","expl":"E(X)=(12+12+3)/27=1；E(X^2)=5/3，Var(X)=5/3-1=2/3，標準差√(2/3)=√6/3。","flag":false,"num":12},{"id":710,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設隨機變數X的取值為x=i（i=1,2,3,4），機率分別為p_i=(2i-1)/16，試求(1)X的期望值。(2)X的變異數。","opts":{},"ans":null,"ansText":"(1)25/8，(2)55/64","expl":"E(X)=1×1/16+2×3/16+3×5/16+4×7/16=25/8；E(X^2)=(1+12+45+112)/16，Var(X)=E(X^2)-(25/8)^2=55/64。","flag":false,"num":13},{"id":711,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設10支籤中3支有獎，其中1支獎金100元、1支獎金50元、1支獎金20元，則(1)任抽一支獎金的期望值為何？變異數為何？(2)任抽兩支獎金和的期望值為何？變異數為何？","opts":{},"ans":null,"ansText":"(1)期望值17元、變異數1001，(2)期望值34元、變異數16016/9","expl":"E(X1)=(100+50+20)/10=17，Var(X1)=(100^2+50^2+20^2)/10-17^2=1001；兩支時E=34，由各金額組合的機率計算得Var=16016/9。","flag":false,"num":14},{"id":712,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"某人擲一顆均勻的骰子，若出現奇數點可得15元，若出現6點則賠9元，若出現2或4點則賠6元，求此人丟此骰子一次得到錢數的期望值與變異數為何？","opts":{},"ans":null,"ansText":"E(X)=4，Var(X)=122","expl":"E(X)=15×3/6-9×1/6-6×2/6=4；E(X^2)=(15^2×3+9^2+6^2×2)/6=138，Var(X)=138-16=122。","flag":false,"num":15},{"id":786,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設擲一公正骰子，出現1點可得300元，出現2、3點可得600元，出現4、5、6點可得900元，求所得金額的平均數及標準差。","opts":{},"ans":null,"ansText":"平均數700元，標準差100√5元","expl":"E(X)=300/6+600×2/6+900×3/6=700，E(X^2)=540000，Var=50000，σ=100√5。","flag":false,"num":89},{"id":793,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設袋中有3個紅球、4個白球，從中任取3球，求取得紅球個數的期望值及變異數。","opts":{},"ans":null,"ansText":"期望值9/7，變異數24/49","expl":"P(X=0..3)=4/35、18/35、12/35、1/35，E(X)=45/35=9/7，E(X^2)=75/35=15/7，Var=15/7-(9/7)^2=24/49。","flag":false,"num":96},{"id":795,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設隨機變數X的機率分布為P(X=k)=k/15（k=1,2,3,4,5），求X的平均數μ及標準差σ。","opts":{},"ans":null,"ansText":"μ=11/3，σ=√14/3","expl":"μ=(1+4+9+16+25)/15=55/15=11/3，E(X^2)=225/15=15，Var=15-121/9=14/9，σ=√14/3。","flag":false,"num":98},{"id":807,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-3 期望值與變異數綜合","type":"open","q":"設隨機變數X的機率分布為P(X=k)=k/10（k=1,2,3,4），求X的平均數μ及標準差σ。","opts":{},"ans":null,"ansText":"μ=3，σ=1","expl":"μ=(1+4+9+16)/10=3，E(X^2)=(1+8+27+64)/10=10，Var=10-9=1，σ=1。","flag":false,"num":110},{"id":783,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-4 變異數與標準差","type":"open","q":"求擲一公正骰子所得點數的變異數。","opts":{},"ans":null,"ansText":"35/12","expl":"E(X)=7/2，E(X^2)=91/6，Var(X)=91/6-49/4=35/12。","flag":false,"num":86},{"id":784,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-4 變異數與標準差","type":"open","q":"設袋中有2個紅球、3個白球，從中任取3球，求取得白球個數的變異數。","opts":{},"ans":null,"ansText":"9/25","expl":"E(X)=9/5，E(X^2)=18/5，Var(X)=18/5-(9/5)^2=9/25。","flag":false,"num":87},{"id":806,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-4 變異數與標準差","type":"open","q":"設袋中有2個紅球、3個白球，從中任取3球，求取得紅球個數的變異數。","opts":{},"ans":null,"ansText":"9/25","expl":"E(X)=6/5，E(X^2)=(6+12)/10=9/5，Var=9/5-36/25=9/25。","flag":false,"num":109},{"id":698,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"投擲公正骰子兩粒，令隨機變數X為兩粒骰子的點數和，求(1)P(X=7)。(2)P(X≤4)。(3)機率函數f(x)。(4)作機率分布圖。","opts":{},"ans":null,"ansText":"(1)1/6，(2)1/6，(3)f(x)=(6-|x-7|)/36（x=2,3,…,12），(4)見解析（分布圖）","expl":"X=7有6種組合、X≤4有6種組合，各除以36得1/6；由點數和的對稱性可歸納出f(x)=(6-|x-7|)/36。","flag":false,"num":1},{"id":699,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"投擲兩枚公正銅板，隨機變數X表出現正面次數，求機率函數。","opts":{},"ans":null,"ansText":"P(X=0)=1/4，P(X=1)=1/2，P(X=2)=1/4","expl":"樣本空間四種等可能結果中，反反1種、一正一反2種、正正1種。","flag":false,"num":2},{"id":700,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"設隨機變數X的機率函數如下表：X的值為0、1、2、3、x，對應機率f(x)依序為0.1、x、0.3、0.1、0.2。(1)求x。(2)求P(X≤2)。","opts":{},"ans":null,"ansText":"(1)0.3，(2)0.9","expl":"由機率總和0.1+x+0.3+0.1+0.2=1得x=0.3；P(X≤2)=P(X=0)+P(X=0.3)+P(X=1)+P(X=2)=0.1+0.3+0.3+0.2=0.9。","flag":false,"num":3},{"id":701,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"一盒中有A型藥12片、B型藥8片，今自盒中任取兩片，令隨機變數X表取出藥片中為B型之片數，求機率函數f(x)。","opts":{},"ans":null,"ansText":"P(X=0)=33/95，P(X=1)=48/95，P(X=2)=14/95","expl":"以超幾何分布計算：P(X=0)=C(12,2)/C(20,2)、P(X=1)=C(12,1)C(8,1)/C(20,2)、P(X=2)=C(8,2)/C(20,2)。","flag":false,"num":4},{"id":702,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"將n個公正骰子同擲，出現之最大點數為X，此隨機變數X之機率分布為何？","opts":{},"ans":null,"ansText":"P(X=k)=(k^n-(k-1)^n)/6^n，k=1,2,3,4,5,6","expl":"n個點數皆不大於k的機率為(k/6)^n，故P(X=k)=(k/6)^n-((k-1)/6)^n。","flag":false,"num":5},{"id":703,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"將一骰子連續擲n次，令出現點數之最小值為隨機變數X，則(1)求X≥3之機率。(2)求X之機率分布。","opts":{},"ans":null,"ansText":"(1)(2/3)^n，(2)P(X=k)=((7-k)^n-(6-k)^n)/6^n，k=1,2,…,6","expl":"X≥3表每次都出現3~6，機率(4/6)^n=(2/3)^n；最小值為k即每次點數≥k扣掉每次點數≥k+1。","flag":false,"num":6},{"id":704,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"箱中有紅球、白球各4個，今任取一球看完其顏色後，再另加同色之球兩個與原取之球放回箱中，如此共作三次，令隨機變數X表取到紅球之數，求X的機率分布。","opts":{},"ans":null,"ansText":"P(X=0)=1/5，P(X=1)=3/10，P(X=2)=3/10，P(X=3)=1/5","expl":"三白：(4/8)(6/10)(8/12)=1/5，與三紅相同；一紅二白三種順序相加得3/10，與二紅一白相同。","flag":false,"num":7},{"id":705,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"有一點P在數線坐標系的原點，今投一硬幣，若出現正面則向正的方向移動3個單位；若出現反面則往負的方向移動2個單位。今連投11次，求最後落在(1)坐標為-7之點的機率。(2)原點的機率。","opts":{},"ans":null,"ansText":"(1)165/2048，(2)0","expl":"設正面x次、反面y次，x+y=11且3x-2y=-7，解得x=3、y=8，機率C(11,3)(1/2)^11=165/2048；落在原點需3x=2y與x+y=11無非負整數解，機率為0。","flag":false,"num":8},{"id":715,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"盒中有面額分別為100、100、500、500、1000、1000、2000、2000的紙幣，從盒中一次取一張不放回，直到取出面額相同的紙幣才停止。以隨機變數X表示抽取的次數，以隨機變數Y表示取出的金額總和，(1)求E(X)。(2)求E(Y)。","opts":{},"ans":null,"ansText":"(1)128/35，(2)23040/7","expl":"分別算出恰需2、3、4、5次停止的機率1/7、2/7、12/35、8/35，加權得E(X)=128/35；再由每張期望面額900元推得E(Y)=23040/7。","flag":false,"num":18},{"id":717,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-5 機率分布與機率函數","type":"open","q":"根據調查，有25%的外國人最愛的臺灣小吃為蚵仔煎。若任選四位外國朋友且互不影響，試問(1)最愛蚵仔煎人數的機率分布。(2)至少有二人最愛吃蚵仔煎的機率。","opts":{},"ans":null,"ansText":"(1)P(X=k)=C(4,k)(1/4)^k(3/4)^(4-k)，即81/256、27/64、27/128、3/64、1/256， alse,"num":40},{"id":740,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"依據經驗某人完成一件工作，可能是1天、2天、3天、4天，機會分別是0.2、0.4、0.3、0.1，請問完成此工作天數的期望值是多少？","opts":{},"ans":null,"ansText":"2.3天","expl":"E=1×0.2+2×0.4+3×0.3+4×0.1=2.3。","flag":false,"num":43},{"id":742,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"依據過去經驗，在松山機場排班的計程車，載客人數1人的機率是60%，2人的機率是30%，3人的機率是5%，4人的機率是5%，請問一部計程車載客人數的期望值是多少？","opts":{},"ans":null,"ansText":"1.55人","expl":"E=0.6×1+0.3×2+0.05×3+0.05×4=1.55。","flag":false,"num":45},{"id":744,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設骰子A的六面標示點數為1、1、1、2、2、3；骰子B的六面標示點數為1、2、2、3、3、3。今同擲二骰子A、B出現點數依次為a、b，試求(1)a+b的期望值。(2)ab的期望值。","opts":{},"ans":null,"ansText":"(1)4，(2)35/9","expl":"a+b之值2~6的機率為3/36、8/36、14/36、8/36、3/36，期望值4；ab之值1,2,3,4,6,9的機率為3/36、8/36、10/36、4/36、8/36、3/36，期望值35/9。","flag":false,"num":47},{"id":745,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設拋物線Γ：y=ax^2+bx+c，a,b,c∈{-1,2}，若-1、2被選取的機會均等，且a、b、c的選取互不影響，試求Γ與x軸交點個數的期望值。","opts":{},"ans":null,"ansText":"9/8","expl":"由判別式D=b^2-4ac判斷：D=0僅(a,b,c)=(-1,2,1)型1組，D>0有4組，其餘D<0，期望值=2×4/8+1×1/8=9/8。","flag":false,"num":48},{"id":747,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"擲一公正骰子，當出現點數x時，log10(x^3+3)的整數部分之值為y，試求y值的期望值。","opts":{},"ans":null,"ansText":"7/6","expl":"x=1~6時x^3+3=4,11,30,67,128,219，y依序為0,1,1,1,2,2，期望值=(0+3+4)/6=7/6。","flag":false,"num":50},{"id":748,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"一骰子擲n次，出現最大的點數為M_n，最小的點數為L_n，求(1)M_n=5的機率。(2)L_n=3的機率。(3)M_n=5且L_n=3的機率。(4)L_3的期望值。","opts":{},"ans":null,"ansText":"(1)(5/6)^n-(4/6)^n，(2)(4/6)^n-(3/6)^n，(3)(3^n-2×2^n+1)/6^n，(4)49/24","expl":"最大值=5即全部≤5扣掉全部≤4；(3)用排容原理；(4)n=3時L_3=1~6的機率為91/216、61/216、37/216、19/216、7/216、1/216，加權得49/24。","flag":false,"num":51},{"id":749,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設A君的箱子中有2紅球1白球，B君的箱子中有2紅球2白球。今從A開始，A與B輪流從自己箱子中取出1球，取出後不再放回，以先取得白球為勝。(1)試問A與B何人得勝的機率大？(2)當勝負決定時，試求二人箱中剩下球 /3)^3=32/81，E(X)=4/3。","flag":false,"num":71},{"id":775,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設某生國文、英文、數學的成績依序為80、65、90，若取權數比為1:2:3，則這三科成績的加權平均數為何？","opts":{},"ans":null,"ansText":"80","expl":"加權平均=(80×1+65×2+90×3)/6=480/6=80。","flag":false,"num":78},{"id":777,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"求擲一公正骰子所得點數的期望值。","opts":{},"ans":null,"ansText":"7/2","expl":"E=(1+2+3+4+5+6)/6=21/6=7/2。","flag":false,"num":80},{"id":778,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設袋中有2個紅球、3個白球，從中任取3球，求取得白球個數的期望值。","opts":{},"ans":null,"ansText":"9/5","expl":"白球數X=1,2,3的機率為3/10、6/10、1/10，E(X)=(3+12+3)/10=18/10=9/5。","flag":false,"num":81},{"id":781,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"一袋中有10個彈珠，其中4個藍色、6個黃色，從中任取5個，求取到藍色彈珠個數的期望值。","opts":{},"ans":null,"ansText":"2個","expl":"藍色數X=0~4的機率為6/252、60/252、120/252、60/252、6/252，E(X)=2；亦即超幾何期望5×4/10=2。","flag":false,"num":84},{"id":796,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"擲一粒公正的骰子兩次，設兩次的點數差的絕對值為X。(1)寫出隨機變數X的所有可能值及各可能值發生的機率。(2)求X的期望值。","opts":{},"ans":null,"ansText":"(1)X=0~5的機率依序為6/36、10/36、8/36、6/36、4/36、2/36，(2)35/18","expl":"列舉36種點數組合得各機率，E(X)=(10+16+18+16+10)/36=70/36=35/18。","flag":false,"num":99},{"id":803,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-6 期望值計算(抽取與點數)","type":"open","q":"設袋中有2個紅球、3個白球，從中任取3球，求取得紅球個數的期望值。","opts":{},"ans":null,"ansText":"6/5","expl":"P(X=0,1,2)=1/10、6/10、3/10，E(X)=(6+6)/10=12/10=6/5。","flag":false,"num":106},{"id":716,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"露露想投資基金，理財員給她兩方案：基金A在景氣成長、持平、衰退時盈利6、3、-2萬元，機率0.7、0.2、0.1；基金B在景氣成長、持平、衰退時盈利12、4、-5萬元，機率0.4、0.3、x。(1)求x。(2)以盈利期望值高低評估，露露應選擇基金A或基金B？","opts":{},"ans":null,"ansText":"(1)0.3，(2)基金A","expl":"x=1-0.4-0.3=0.3；A的期望值4.6萬元，B的期望值4.5萬元，故選A。","flag":false,"num":19},{"id":718,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"某電子公司欲擴廠，大、中、小三種建廠規模在四種景氣情況（高度成長、微幅成長、持平、衰退，機率依序為0.3、0.1、0.4、0.2）下的年利潤（百萬元）如下：大廠50、10、5、-30；中廠40、30、10、-10；小廠30、20、5、-2。以利潤期望值最大作決策，應採哪一種建廠規模？最大利潤期望值為何？","opts":{},"ans":null,"ansText":"建中規模廠，最大年利潤期望值17百萬元","expl":"大、中、小廠期望值分別為12、17、12.6百萬元，中廠最大。","flag":false,"num":21},{"id":721,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"同時擲三粒骰子，如果恰有兩粒點數相同可得200元獎金，三粒點數都相同可得500元獎金，其餘沒獎金，求此試驗得獎金的期望值。","opts":{},"ans":null,"ansText":"875/9元","expl":"恰兩粒相同機率90/216、三粒全同機率6/216，期望值=(200×90+500×6)/216=875/9。","flag":false,"num":24},{"id":725,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"某地發行彩券50萬張，其中有1張獎金300萬元，2張獎金各50萬元，50張獎金各1萬元，試問每張彩券獎金的期望值為何？","opts":{},"ans":null,"ansText":"9元","expl":"E=3000000×1/500000+500000×2/500000+10000×50/500000=6+2+1=9元。","flag":false,"num":28},{"id":728,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"老張過去買釋迦的經驗是平均5斤中就有1斤內長蟲不能吃須丟掉。有次買釋迦時老板說今天每斤70元，如果要求當場打開則售價提高至每斤80元，但打開有蟲可退回。試以期望值的觀點來看，老張應否要求打開？","opts":{},"ans":null,"ansText":"應要求打開","expl":"不打開時花350元只買到約4斤可吃，平均每斤87.5元，比打開保證好的80元貴。","flag":false,"num":31},{"id":729,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"一袋中有9個硬幣，其中5個為五元硬幣，其他4個同值。若從袋中一次取出2個硬幣之期望值為6元，求其他4個硬幣之值。","opts":{},"ans":null,"ansText":"0.5元","expl":"取2枚為(五元,五元)、(五元,x)、(x,x)的機率為10/36、20/36、6/36，由10×10/36+(5+x)×20/36+2x×6/36=6解得x=0.5。","flag":false,"num":32},{"id":731,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"同時擲六粒均勻的骰子，若恰有五粒點數相同則可得6480元，求其期望值。","opts":{},"ans":null,"ansText":"25元","expl":"恰五粒點數相同的機率P=C(6,1)C(6,5)(1/6)^5(5/6)=5/6^4=5/1296，期望值=6480×5/1296=25元。","flag":false,"num":34},{"id":734,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"一盒子裡有5元硬幣5個、10元硬幣3個、50元硬幣2個，任取3個，求得款的期望值。","opts":{},"ans":null,"ansText":"93/2元","expl":"任取1個的期望值為(5×5+10×3+50×2)/10=31/2元，取3個為3×31/2=93/2元。","flag":false,"num":37},{"id":738,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲一骰子，若出現點數為偶數，可得與點數相同的金額；若出現點數為奇數，須賠與點數相同的金額，求每擲一次的期望值。","opts":{},"ans":null,"ansText":"1/2","expl":"E=(-1+2-3+4-5+6)/6=3/6=1/2。","flag":false,"num":41},{"id":739,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲兩粒骰子，若兩粒出現點數的差為r（r≥0），則可得r元，求其期望值。","opts":{},"ans":null,"ansText":"35/18元","expl":"點數差0~5的機率為6/36、10/36、8/36、6/36、4/36、2/36，期望值=(10+16+18+16+10)/36=70/36=35/18。","flag":false,"num":42},{"id":741,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"過年時父親以抽球方式給壓歲錢，袋中有5個球，號碼為1、2、2、4、6，獎額是號碼數的1000倍。(1)小明拿到的壓歲錢最多是多少？(2)小明的壓歲錢期望值是多少？(3)如果改為抽到6號給10000元、其餘號碼給1000元，此種給獎方式與原來的給獎方式何者對小明較有利？","opts":{},"ans":null,"ansText":"(1)6000元，(2)3000元，(3)原來的較有利","expl":"期望值=(1000+2000×2+4000+6000)/5=3000元；新方式期望值=(10000+1000×4)/5=2800元，較小。","flag":false,"num":44},{"id":746,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"一條售價20元的麵包成本12元，某小店賣出之麵包經75日統計：一日所需70、80、90、100、110、120條的日數分別為2、8、16、23、19、7日。今日準備100條麵包出售，賣不完則隔日丟棄，試求本日利潤的期望值。","opts":{},"ans":null,"ansText":"698又2/3元（2096/3元）","expl":"成本1200元，賣出x條收入20x；利潤期望=(200×2+400×8+600×16+800×49)/75=2096/3元（需求≥100時皆賣100條）。","flag":false,"num":49},{"id":753,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲3粒骰子，若出現k（k=1,2,3）個1點則贏k元；否則輸a元。若此賭局是公平的（即期望值為0），則a之值為何？","opts":{},"ans":null,"ansText":"108/125","expl":"出現1、2、3個1點的機率為75/216、15/216、1/216，無1點為125/216，由75+30+3=125a/…即(75+30+3)/216=a×125/216，得a=108/125。","flag":false,"num":56},{"id":755,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"某人擲二骰子，若擲出之點數和為9時可得100元並得繼續投擲之權利，若第二回又擲出9點則又可得100元並得繼續投擲，將此方法反覆進行，則此人所得之期望值為何？","opts":{},"ans":null,"ansText":"12.5元","expl":"擲出9點的機率為4/36=1/9，所得為幾何級數型，E(X)=100×(1/9)/(1-1/9)…整理得100/8=12.5元。","flag":false,"num":58},{"id":758,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"某公司考慮在甲、乙兩地間選擇一地投資設新廠。在甲地設廠，獲利可得10000萬元，不獲利將虧損7000萬元；在乙地設廠，獲利可得6000萬元，不獲利將虧損5000萬元。新廠在甲、乙兩地獲利的機率分別為0.6、0.7。如以獲利期望值為決策準則，該公司應選擇甲地或乙地投資？","opts":{},"ans":null,"ansText":"甲地","expl":"甲地期望值=10000×0.6-7000×0.4=3200萬元，乙地=6000×0.7-5000×0.3=2700萬元，選甲地。","flag":false,"num":61},{"id":761,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"學科能力測驗數學的單一選擇題，每題有5個選項，答對得5分，答錯不倒扣，未作答不給分亦不扣分。試問隨意猜測的情況下，每題得分的期望值。","opts":{},"ans":null,"ansText":"1分","expl":"E=5×1/5+0×4/5=1分。","flag":false,"num":64},{"id":762,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"指定科目考試數學的單一選擇題，每題有4個選項，答對得6分，答錯倒扣2分，未作答不給分亦不扣分。試問隨意猜測的情況下，每題得分的期望值。","opts":{},"ans":null,"ansText":"0分","expl":"E=6×1/4+(-2)×3/4=0分。","flag":false,"num":65},{"id":763,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"指定科目考試數學的多重選擇題，每題有4個選項，每選項獨立計分，每答對一個選項得2分，每答錯一個選項倒扣2分，整題未作答不給分亦不扣分。試問隨意猜測的情況下，每題得分的期望值。","opts":{},"ans":null,"ansText":"0分","expl":"每一選項期望得分=2×1/2+(-2)×1/2=0，四個選項合計仍為0分。","flag":false,"num":66},{"id":764,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"學科能力測驗數學的多重選擇題，每題有5個選項且至少有一個選項正確，答對得5分，只錯一個可獲2.5分，錯兩個或以上不給分。某題正確答案為A、B，甲不知道而隨意猜測，試問該題得分的期望值。","opts":{},"ans":null,"ansText":"35/62分","expl":"非空作答共31種：得5分1種，得2.5分5種（A、B、ABC、ABD、ABE），其餘0分；E=(5+2.5×5)/31=35/62分。","flag":false,"num":67},{"id":769,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"一袋中藏有5個白球、4個黑球，今自袋中一次取出兩個球，每一個白球可折換5元，每一個黑球可折換k元。若折換金額的數學期望值為6元，試問k值。","opts":{},"ans":null,"ansText":"0.5元","expl":"取一球的折換期望值須為3元：5×5/9+k×4/9=3，解得k=0.5。","flag":false,"num":72},{"id":779,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"一袋中有3個紅球、4個白球、5個黃球，從中任取一球，若抽中紅球可得300元，抽中白球可得200元，抽中黃球可得100元，求抽取一球可得金額的期望值。","opts":{},"ans":null,"ansText":"550/3元","expl":"E=300×3/12+200×4/12+100×5/12=2200/12=550/3元。","flag":false,"num":82},{"id":780,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲三粒骰子，出現k粒6點，贏k×1000元（k=1,2,3），沒有6點輸1000元，求輸贏的期望值。","opts":{},"ans":null,"ansText":"輸2125/27元","expl":"輸1000、贏1000、2000、3000的機率為125/216、75/216、15/216、1/216，E=-17000/216=-2125/27元。","flag":false,"num":83},{"id":797,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲四粒公正的骰子，出現k粒6點，贏k×200元（k=1,2,3,4），沒有6點輸200元，求輸贏的期望值。","opts":{},"ans":null,"ansText":"贏5975/162元","expl":"輸200與贏200、400、600、800的機率為625/1296、500/1296、150/1296、20/1296、1/1296，E=47800/1296=5975/162元。","flag":false,"num":100},{"id":804,"src":"甲｜講義-機率統計","ch":"3-1｜Ch3-7 期望值應用：賭局與決策","type":"open","q":"擲三粒骰子，出現一粒6點贏1元，兩粒6點贏2元，三粒6點贏3元，沒有6點輸1元，求輸贏的期望值。","opts":{},"ans":null,"ansText":"輸17/216元","expl":"輸1元與贏1、2、3元的機率為125/216、75/216、15/216、1/216，E=(-125+75+30+3)/216=-17/216元。","flag":false,"num":107},{"id":808,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"袋中有10個號碼球{1,2,2,3,3,3,4,4,4,4}，由袋中任取一球，令X表取出球的號碼，請問X是否為隨機變數？如是，請寫出其機率分布。","opts":{},"ans":null,"ansText":"X是隨機變數；P(X=k)=k/10（k=1,2,3,4）","expl":"k號球有k個，共10球，故P(X=k)=k/10。","flag":false,"num":111},{"id":809,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"設函數f(x)：當x=1,2,3時f(x)=1/2^x；當x=4時f(x)=a；其他值f(x)=0。若f(x)為一機率函數，求a的值並畫機率函數圖。","opts":{},"ans":null,"ansText":"a=1/8，圖見解析","expl":"a=1-(1/2+1/4+1/8)=1/8。","flag":false,"num":112},{"id":810,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"某生產線生產幾百萬件產品，假設產品是良品所占比例是90%，隨機抽查100件產品，令X表100件抽查產品中不良品的件數。(1)寫出X的可能值。(2)求P(X=0)。","opts":{},"ans":null,"ansText":"(1)X=0,1,2,…,100共101種可能值，(2)(0.9)^100","expl":"X=0表示100件全為良品，機率為0.9^100。","flag":false,"num":113},{"id":811,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"若X為離散型隨機變數，X的可能值為-2、-1、0、1、2，機率依序為0.1、0.2、0.2、0.3、0.2。求(1)E(X)。(2)E(X^2)。(3)E(5X+3)。(4)Var(X)。","opts":{},"ans":null,"ansText":"(1)0.3，(2)1.7，(3)4.5，(4)1.61","expl":"E(X)=-0.2-0.2+0.3+0.4=0.3，E(X^2)=0.4+0.2+0.3+0.8=1.7，E(5X+3)=5×0.3+3=4.5，Var=1.7-0.09=1.61。","flag":false,"num":114},{"id":812,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"甲、乙與丙三人玩擲一均勻銅板遊戲，由丙擲銅板兩次，每出現一次正面，丙需付給甲5元、乙50元；每出現一次反面，甲需付給丙5元、乙需付給丙50元。令X、Y分別表丙擲銅板兩次後甲、乙所得的錢。(1)求X、Y的期望值。(2)隨機變數Y與X有線性關係（Y=10X），所以它們的期望值也有線性關係（即E(10X)=10E(X)），對否？","opts":{},"ans":null,"ansText":"(1)E(X)=0，E(Y)=0，(2)對","expl":"X之值-10、0、10的機率為1/4、2/4、1/4，E(X)=0；同理E(Y)=0，且E(10X)=10E(X)成立。","flag":false,"num":115},{"id":813,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"若刮刮樂彩券設計有16格，其中有一格中獎，16格中只能任意選刮一格，刮中可得2000元，否則得0元，令X表得獎金的隨機變數。(1)求X的期望值。(2)刮刮樂彩券一張賣150元，彩券券商每月平均賣3000張，請問彩券券商每月平均賺多少？","opts":{},"ans":null,"ansText":"(1)125元，(2)75000元","expl":"E(X)=2000×1/16=125元；每張賺150-125=25元，每月賺25×3000=75000元。","flag":false,"num":116},{"id":814,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"甲、乙、丙三人玩擲骰子遊戲，由丙擲兩個公正骰子：點數和小於5時甲輸丙1元（乙丙無輸贏）；點數和為5、6、7時乙輸丙1元（甲丙無輸贏）；點數和為8、9、10時甲贏丙1元（乙丙無輸贏）；點數和大於10時甲贏丙2元、乙贏丙3元。令X、Y分別表丙擲一次後甲、乙所得的錢。(1)求X、Y的機率分布。(2)求E(X)、E(Y)。","opts":{},"ans":null,"ansText":"(1)X=-1,0,1,2的機率為6/36、15/36、12/36、3/36；Y=0,-1,3的機率為18/36、15/36、3/36，(2)E(X)=1/3，E(Y)=-1/6","expl":"點數和<5、=5~7、=8~10、>10的機率依序為6/36、15/36、12/36、3/36，代入計算期望值。","flag":false,"num":117},{"id":815,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"袋中有5紅球3藍球，張三由袋中取球，每次取一球，共取4次，令X表取到藍球的次數，分別在放回、不放回兩種情況，寫出(1)X的可能值。(2)X的機率質量函數。","opts":{},"ans":null,"ansText":"(1)放回時X=0,1,2,3,4；不放回時X=0,1,2,3，(2)放回時P(X=k)=C(4,k)(3/8)^k(5/8)^(4-k)；不放回時P(X=k)=C(5,4-k)C(3,k)/C(8,4)","expl":"放回為二項分布B(4,3/8)；不放回為超幾何分布，藍球最多3個。","flag":false,"num":118},{"id":816,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"網球比賽約定先勝6局者為勝，勝者可得獎金16000元。依過去比賽經驗，甲、乙兩人實力相當，這次比賽甲已連勝前5局，由於下雨不再繼續比賽，以現在成績分配獎金，請問甲、乙兩人如何分配才公平？","opts":{},"ans":null,"ansText":"甲得15750元，乙得250元","expl":"乙須連勝6局才贏，機率(1/2)^6=1/64；甲贏機率63/64，按機率比分配16000元。","flag":false,"num":119},{"id":817,"src":"甲｜講義-機率統計","ch":"3-2｜隨機的意義","type":"open","q":"一個袋子中有10個球，分別標有1,2,…,10號，若每次取3個球，令X表這3個球之中位數的隨機變數。(1)求P(X=6)。(2)求X的機率分布。(3)畫X的機率函數圖。","opts":{},"ans":null,"ansText":"(1)1/6，(2)X=2~9的機率依序為8/120、14/120、18/120、20/120、20/120、18/120、14/120、8/120，(3)圖見解析","expl":"中位數為6須從1~5取一球、7~10取一球，P=C(5,1)C(4,1)/C(10,3)=20/120=1/6；一般P(X=m)=(m-1)(10-m)/120。","flag":false,"num":120},{"id":818,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"丟1個銅板3次，若前面丟出結果不會影響後面，令A表第一次丟出正面的事件，B表第二次丟出正面的事件，C表第三次丟出正面的事件。求(1)P(A∩B)。(2)三次都丟出正面的機率P(A∩B∩C)。(3)3次中恰有兩次丟出正面的機率。","opts":{},"ans":null,"ansText":"(1)1/4，(2)1/8，(3)3/8","expl":"各次獨立，P(A∩B)=1/4，P(A∩B∩C)=1/8；恰兩次正面=C(3,2)(1/2)^2(1/2)=3/8。","flag":false,"num":121},{"id":819,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"大明抽撲克牌兩次，抽牌後放回，令A表第一次抽到A的事件，B表第二次抽到K的事件。(1)請問A、B兩事件是否為獨立事件？(2)兩次都抽到K的機率是多少？","opts":{},"ans":null,"ansText":"(1)是獨立事件，(2)1/169","expl":"抽後放回故獨立；兩次都抽到K的機率=(4/52)^2=(1/13)^2=1/169。","flag":false,"num":122},{"id":820,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"某公司每月生產電子零件幾百萬件，與其客戶約定以隨機抽樣抽2件檢查，如果檢查的2件都是良品就接受此批貨，否則退貨。假設電子零件中不良品所占比率為5%，請問此批貨被接受的機率約為多少？","opts":{},"ans":null,"ansText":"0.9025","expl":"母體很大可視為獨立，2件都是良品的機率=(0.95)^2=0.9025。","flag":false,"num":123},{"id":821,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"小強罰球命中率7成，每次罰兩球，每投進一球得1分。(1)試求每次罰球得2分的機率。(2)如果小強有3次罰球，得6分的機率是多少？","opts":{},"ans":null,"ansText":"(1)0.49，(2)約0.1176","expl":"每次罰球兩球全中的機率0.7^2=0.49；3次罰球都得2分的機率0.49^3≈0.1176。","flag":false,"num":124},{"id":822,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"丟一個公正銅板5次，令X表5次中出現正面的次數，求(1)P(X=0)。(2)P(X=1)。(3)P(1≤X≤3)。(4)E(X)。(5)Var(X)。","opts":{},"ans":null,"ansText":"(1)0.03125，(2)0.15625，(3)0.78125，(4)2.5，(5)1.25","expl":"X~B(5,0.5)：P(X=0)=0.5^5，P(X=1)=5×0.5^5，P(1≤X≤3)=(5+10+10)×0.5^5；E=np=2.5，Var=np(1-p)=1.25。","flag":false,"num":125},{"id":823,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"丟一個公正銅板6次，請問恰有3次正面、3次反面的機率是多少？","opts":{},"ans":null,"ansText":"0.3125","expl":"P(X=3)=C(6,3)(0.5)^6=20/64=0.3125。","flag":false,"num":126},{"id":824,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"擲一個公正的骰子5次，問(1)出現3次點數是2的機率是多少？(2)出現5次點數是2的機率是多少？(3)出現點數是2次數的期望值是多少？(4)出現點數是2次數的變異數是多少？","opts":{},"ans":null,"ansText":"(1)C(5,3)(1/6)^3(5/6)^2=250/7776≈0.03215，(2)(1/6)^5≈0.00013，(3)5/6，(4)25/36","expl":"次數X~B(5,1/6)，E(X)=5/6，Var(X)=5×(1/6)×(5/6)=25/36。","flag":false,"num":127},{"id":825,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"人的某種特徵會依據一對基因，d表顯性基因，r表隱性基因；有dd或rd基因者外觀上有某種特徵，rr基因者沒有。小孩自父母各接受一個基因，若父母均具有一對rd基因，他們生四個小孩，請問四個小孩中至少有一位具有某種特徵的機率是多少？","opts":{},"ans":null,"ansText":"1-(1/4)^4=255/256≈0.996","expl":"小孩具特徵的機率3/4，不具為1/4；四個都不具的機率(1/4)^4，取補集。","flag":false,"num":128},{"id":826,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"張三棒球打擊率是3成，假設每場球張三都上場打擊4次，某次球賽張三上場打擊，試問他擊出2支安打的機率。","opts":{},"ans":null,"ansText":"0.2646","expl":"C(4,2)(0.3)^2(0.7)^2=6×0.09×0.49=0.2646。","flag":false,"num":129},{"id":827,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"若X~B(20, 0.4)，計算P(X=8)及P(X≤8)。","opts":{},"ans":null,"ansText":"P(X=8)≈0.1797，P(X≤8)≈0.5956","expl":"P(X=8)=C(20,8)(0.4)^8(0.6)^12≈0.1797；累積機率可用Excel求得≈0.5956。","flag":false,"num":130},{"id":828,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"隨機從全市有2個小孩的家庭抽樣，假設(男,男)、(男,女)、(女,男)、(女,女)4種情形機率相等，令A表抽到的家庭最多只有1個男孩的事件，B表抽到的家庭男、女孩都有的事件。(1)請問事件A、B是否獨立？(2)若改為有3個小孩的家庭（8種情形機率相等），請問事件A、B是否獨立？","opts":{},"ans":null,"ansText":"(1)不獨立，(2)獨立","expl":"(1)P(A∩B)=2/4≠P(A)P(B)=(3/4)(2/4)；(2)P(A∩B)=3/8=P(A)P(B)=(4/8)(6/8)，故獨立。","flag":false,"num":131},{"id":829,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"袋中有10個號碼球：1號球1個、2號球2個、3號球3個、4號球4個。大華從袋中隨機抽取1球，抽出一球後放回，共抽5球，令X表抽到1號球的次數。問(1)X=1的機率是多少？(2)P(X≤2)。(3)E(X)。","opts":{},"ans":null,"ansText":"(1)約0.3281，(2)約0.9914，(3)0.5","expl":"X~B(5,0.1)：P(X=1)=C(5,1)(0.1)(0.9)^4≈0.3281；P(X≤2)為前三項和≈0.9914；E(X)=5×0.1=0.5。","flag":false,"num":132},{"id":830,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"某砲手射擊目標命中率8成，今對一目標射擊，他要發射幾發砲彈，方能保證擊中目標的機率在0.99以上？","opts":{},"ans":null,"ansText":"3發","expl":"1-0.2^n>0.99，即0.2^n<0.01，取對數得n>log0.01/log0.2≈2.86，故n=3。","flag":false,"num":133},{"id":831,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"假設某生產線每天生產零件的不良率是4%，品管人員由生產的零件中抽樣50件，試問(1)抽到不良品件數的期望值是多少？(2)抽到的不良品所占比率p^=4%的機率是多少？(3)抽到的不良品比率p^<4%的機率是多少？","opts":{},"ans":null,"ansText":"(1)2件，(2)約0.2762，(3)約0.4005","expl":"X~B(50,0.04)：E(X)=2；p^=4%即X=2，P(X=2)=C(50,2)(0.04)^2(0.96)^48≈0.2762；p^<4%即X≤1，P(X=0)+P(X=1)≈0.4005。","flag":false,"num":134},{"id":832,"src":"甲｜講義-機率統計","ch":"3-2｜二項分布","type":"open","q":"設飛機引擎在飛行中故障的機率是p，且每部引擎故障是獨立，若一架飛機至少有一半的引擎正常，飛機就能安全飛行，請問p要多大時，一架四部引擎飛機才比一架二部引擎飛機安全？","opts":{},"ans":null,"ansText":"p≤1/3","expl":"四引擎安全機率(1-p)^4+4p(1-p)^3+6p^2(1-p)^2 ≥ 二引擎安全機率(1-p)^2+2p( d":846,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"令X表某百貨公司一天顧客人數（單位：千人次）的隨機變數，若X的機率函數為f(x)=x/a，x=1,2,3,…,10。求(1)a。(2)P(X=5)。(3)P(X<5)。(4)一天顧客人數超過6千人次的機率。(5)E(X)。","opts":{},"ans":null,"ansText":"(1)55，(2)1/11，(3)2/11，(4)34/55，(5)7","expl":"Σf(x)=55/a=1得a=55；P(X=5)=5/55=1/11；P(X<5)=10/55=2/11；P(X>6)=34/55；E(X)=Σk^2/55=385/55=7。","flag":false,"num":149},{"id":847,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"丟一個公正的銅板8次，令X表出現正面的次數。(1)求P(X=2)。(2)若出現k次正面得k×20元，請問此試驗的期望值是多少？(3)若出現k次正面得k^2元，請問此試驗的期望值是多少？","opts":{},"ans":null,"ansText":"(1)7/64，(2)80元，(3)18元","expl":"X~B(8,0.5)：P(X=2)=C(8,2)/256=7/64；E(20X)=20×4=80；E(X^2)=Var(X)+E(X)^2=2+16=18。","flag":false,"num":150},{"id":848,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"袋中有3顆白球與4顆黑球，每次隨機從袋中抽出1球，抽出後不放回，直到抽中黑球時遊戲結束。若在第k次抽到黑球，則得到k元獎金，求此遊戲可獲得獎金的數學期望值是多少元？（化為最簡分數）","opts":{},"ans":null,"ansText":"8/5元","expl":"第1~4次抽中黑球的機率為4/7、2/7、4/35、1/35，E=1×4/7+2×2/7+3×4/35+4×1/35=8/5元。","flag":false,"num":151},{"id":849,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"在一次考試中，選擇題有4題，每題都是5選1，張三沒有準備，都用猜的作答。請問(1)4題都猜對的機率是多少？(2)4題只猜對1題的機率是多少？(3)猜對題數的期望值是多少？(4)猜對題數的標準差是多少？","opts":{},"ans":null,"ansText":"(1)0.0016，(2)0.4096，(3)0.8，(4)0.8","expl":"X~B(4,0.2)：P(X=4)=0.2^4=0.0016；P(X=1)=4×0.2×0.8^3=0.4096；E=0.8；σ=√(4×0.2×0.8)=0.8。","flag":false,"num":152},{"id":850,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"某校有男生3000人、女生2000人，如想估計此校平均身高，以性別做分層抽樣100人，請問男生應抽多少人？","opts":{},"ans":null,"ansText":"60人","expl":"男生應抽100×3000/5000=60人。","flag":false,"num":153},{"id":851,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"調查500位市民對居住品質是否滿意，結果有240位滿意，求居住滿意比率p的95%信賴區間。","opts":{},"ans":null,"ansText":"[0.4353, 0.5247]","expl":"p^=0.48，e=2√(0.48×0.52/500)≈0.0447，區間為[0.48-0.0447, 0.48+0.0447]。","flag":false,"num":154},{"id":852,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"某地區有甲、乙兩校，高二數學段考成績呈常態分布：甲校800人，平均63分，標準差6分；乙校500人，平均70分，標準差5分。(1)甲、乙兩校超過75分的人數各有多少位？(2)若已知一位學生的成績超過75分，則他是甲校學生的機率是多少？","opts":{},"ans":null,"ansText":"(1)甲校約20人，乙校約80人，(2)0.2","expl":"甲校75分為μ+2σ，800×0.025=20人；乙校75分為μ+σ，500×0.16=80人；超過75分共100人，甲校占20/100=0.2。","flag":false,"num":155},{"id":853,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"某次數學測驗共有25題單一選擇題，每題都有五個選項，每答對一題得4分，答錯倒扣1分。某生確定其中16題可答對；有6題他確定五個選項中有兩個選項不正確，因此這6題他從剩下的選項中分別猜選一個；另外3題只好亂猜，則他這次測驗得分之期望值為多少？","opts":{},"ans":null,"ansText":"68分","expl":"6題中猜對數X~B(6,1/3)，E(X)=2；3題中猜對數Y~B(3,1/5)，E(Y)=0.6；總分期望=16×4+(2×4-4×1)+(0.6×4-2.4×1)=64+4+0=68分。","flag":false,"num":156},{"id":854,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"某營養學研究者想了解女生有服保健食品的比率，最近有人做了類似調查，100位中有20位有服保健食品。他想要達到信心水準為95%，而誤差在2%以內，他需要抽樣多少樣本？","opts":{},"ans":null,"ansText":"1600人","expl":"n=(2√(0.2×0.8)/0.02)^2=1600人。","flag":false,"num":157},{"id":855,"src":"甲｜講義-機率統計","ch":"3-2｜總習題","type":"open","q":"某公司生產的零件長度是常態分布X~N(80, 25)。若零件長度在75到90之間，每件可獲利100元；若零件長度超過90，每件可獲利40元；若零件不足75，每件損失30元。設此公司每月生產10000件，請問每月獲利的期望值是多少？","opts":{},"ans":null,"ansText":"777000元（每件期望獲利77.7元）","expl":"σ=5，P(75<X<90)=P(-1<Z<2)≈0.815，P(X>90)≈0.025，P(X<75)≈0.16；每件期望=100×0.815+40×0.025-30×0.16=77.7元，每月77.7×10000=777000元。","flag":false,"num":158},{"id":856,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"某校高二學生2000人，期末數學成績呈常態分配，平均成績70分，標準差10分，已知及格者成績皆大於60分，若須參加補考者（40分（含）以上、60分（不含）以下）有x人，則x最接近下列哪一數字？","opts":{"A":"300","B":"310","C":"320","D":"330","E":"340"},"ans":"C","ansText":"320","expl":"40~60分約為μ-3σ至μ-σ，比例約(1-68%)/2≈16%（扣除3σ外極少數），2000×16%=320人。","flag":false,"num":159},{"id":857,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"參加期末考試的學生有1000位，已知全體數學成績平均為65分，標準差為15分，且成績呈常態分配，則成績高於80分的大約有多少人？","opts":{"A":"120","B":"140","C":"160","D":"180","E":"200"},"ans":"C","ansText":"160","expl":"80=μ+σ，高於80分的比例=(1-68%)/2=16%，1000×0.16=160人。","flag":false,"num":160},{"id":858,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"某次英語檢定考試參加的考生有1200名，已知成績呈常態分配且平均54分，標準差6分。若60分以上的考生有a名，分數在42到60分的考生有b名，依據68-95-99.7的經驗法則，a、b的取值最接近下列哪一選項？","opts":{"A":"a=816，b=978","B":"a=192，b=978","C":"a=570，b=816","D":"a=408，b=570","E":"a=192，b=570"},"ans":"B","ansText":"a=192，b=978","expl":"60分以上占50%-34%=16%，a=1200×16%=192；42~60分占68%+13.5%=81.5%，b=1200×81.5%=978。","flag":false,"num":161},{"id":859,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"某生解對一題機率為3/4，此次考試共20題，解對一題可得6分，則某生得分的期望值為幾分？","opts":{"A":"70","B":"75","C":"80","D":"85","E":"90"},"ans":"E","ansText":"90","expl":"E=6×20×3/4=90分。","flag":false,"num":162},{"id":860,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"一個骰子連擲50次，么點的次數出現r次的機率為Pr，當Pr為最大時，則其r的值為","opts":{"A":"7","B":"8","C":"9","D":"10","E":"皆非"},"ans":"B","ansText":"8","expl":"Pr=C(50,r)(1/6)^r(5/6)^(50-r)，由Pr≥Pr+1且Pr≥Pr-1解得7.5≤r≤8.5，故r=8。","flag":false,"num":163},{"id":861,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"甲、乙二隊比賽，若平均甲隊五場勝二場，今甲、乙二隊比賽五場，甲隊恰勝三場之機率為","opts":{"A":"3/5","B":"(3/5)^3","C":"大於3/5","D":"小於3/5","E":"小於(3/5)^3"},"ans":"D","ansText":"小於3/5","expl":"甲一場獲勝機率2/5，五場勝三場=C(5,3)(2/5)^3(3/5)^2=10×(8/125)(9/25)=144/625≈0.23＜3/5。","flag":false,"num":164},{"id":862,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"若某校800位學生的數學段考成績平均分數是65分，樣本標準差是5分，且成績分布呈常態分配。試問全校約有多少人數學成績低於60分？（依68-95-99.7經驗法則）","opts":{"A":"約64人","B":"約128人","C":"約256人","D":"約328人","E":"約272人"},"ans":"B","ansText":"約128人","expl":"60=65-5=μ-σ，低於60分者占(1-68%)/2=16%，800×16%=128人。","flag":false,"num":165},{"id":863,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"若常態分配其平均數為μX，變異數為100，且已知P(X>a)=0.5，則a值為","opts":{"A":"μX-100","B":"μX+100","C":"μX","D":"μX-10","E":"μX+10"},"ans":"C","ansText":"a=μX","expl":"P(X>a)=0.5表示a右側占全體的一半，故a為平均數的位置。","flag":false,"num":166},{"id":864,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"設某高中女生之身高分配為常態分配，已知平均數為162公分，變異數為9平方公分，則該校女生身高超過165公分的人數占全校女生之比例為（註：標準常態分配Z中，P(Z<1)=0.8413，P(Z<2)=0.9772）","opts":{"A":"16%","B":"32%","C":"68%","D":"95%","E":"99.7%"},"ans":"A","ansText":"16%","expl":"σ=3，P(X>165)=P(Z>1)=1-0.8413≈0.16。","flag":false,"num":167},{"id":865,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"設甲、乙兩班人數一樣多，若某次考試兩班均全數參加，且成績呈常態分配。統計結果：甲班平均數為70分，標準差為10分；乙班平均數為75分，標準差為5分，則兩班中成績超過80分的人數","opts":{"A":"大約一樣","B":"甲班較多","C":"乙班較多","D":"不可能一樣多","E":"無法確定"},"ans":"A","ansText":"大約一樣","expl":"80分對兩班皆為平均數加一個標準差，故超過80分的比例都約16%，人數大約一樣多。","flag":false,"num":168},{"id":866,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"設A、B為兩獨立事件，且P(A)=1/2，P(B)=2/5，則P(A'∩B')=","opts":{"A":"3/5","B":"3/10","C":"2/3","D":"1/5","E":"4/5"},"ans":"B","ansText":"3/10","expl":"A、B獨立則A'、B'亦獨立，P(A'∩B')=(1-1/2)(1-2/5)=1/2×3/5=3/10。","flag":false,"num":169},{"id":867,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"設甲袋中有白球4個、紅球5個，乙袋中有白球2個、紅球1個、黑球3個。今自兩袋中任選一袋，再由此袋中任取一球，則取出之球為白球的機率為","opts":{"A":"5/9","B":"7/9","C":"5/18","D":"7/18","E":"11/18"},"ans":"D","ansText":"7/18","expl":"P(白)=1/2×4/9+1/2×2/6=2/9+1/6=7/18。","flag":false,"num":170},{"id":868,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"一袋中有紅球6個、白球4個，由甲、乙兩人輪流取出一球，取出後不放回。今由甲先取，先取得紅球者獲勝，則甲獲勝的機率為","opts":{"A":"37/210","B":"43/210","C":"37/105","D":"53/105","E":"74/105"},"ans":"E","ansText":"74/105","expl":"P(甲勝)=6/10+(4/10)(3/9)(6/8)+(4/10)(3/9)(2/8)(1/7)(6/6)=74/105。","flag":false,"num":171},{"id":869,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"若某校1000位學生的數學段考成績平均分數是65.24分，樣本標準差是5.24分，且成績分布呈常態分配。試問全校約有多少人數學成績低於60分？","opts":{"A":"約80人","B":"約160人","C":"約240人","D":"約320人","E":"約400人"},"ans":"B","ansText":"約160人","expl":"60~70.48分（μ±σ）間約有68%即680人，低於60分約(1000-680)/2=160人。","flag":false,"num":172},{"id":870,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"某校高三學生在一次考試中，成績呈常態分配，且已知其分數之平均數為70分，標準差為10分。若從這次考試的學生中隨機抽出一位學生，則這位學生的成績低於60分的機率最接近以下哪一選項？","opts":{"A":"0.16","B":"0.32","C":"0.34","D":"0.68","E":"0.84"},"ans":"A","ansText":"0.16","expl":"60=μ-σ，P(X<60)=(100%-68%)/2=16%=0.16。","flag":false,"num":173},{"id":871,"src":"甲｜講義-機率統計","ch":"綜合試題（二項分布與常態分布）","type":"single","q":"甲、乙兩校有一樣多的學生參加數學能力測驗，兩校學生測驗成績的分布都很接近常態分布，其中甲校學生的平均分數為60 ,"ans":null,"ansText":"P25=60，P30=60.5","expl":"P25位置i=50×25/100=12.5→取第13個值60；P30位置i=50×30/100=15為整數→取(X15+X16)/2=(60+61)/2=60.5。","flag":false,"num":15},{"id":891,"src":"甲｜講義-機率統計","ch":"基礎統計｜3-2 離散趨勢量數","type":"open","q":"設有一組樣本資料如下：3,4,1,4,6，試求全距。","opts":{},"ans":null,"ansText":"R=5","expl":"R=最大值-最小值=6-1=5。","flag":false,"num":16},{"id":892,"src":"甲｜講義-機率統計","ch":"基礎統計｜3-2 離散趨勢量數","type":"open","q":"設有一組樣本資料如下：3,4,1,4,6，試求四分位距。","opts":{},"ans":null,"ansText":"IQR=1","expl":"排序後Q1=3、Q3=4，IQR=Q3-Q1=4-3=1。","flag":false,"num":17},{"id":893,"src":"甲｜講義-機率統計","ch":"基礎統計｜3-2 離散趨勢量數","type":"open","q":"設有一組樣本資料如下：3,4,1,4,6，試求變異數及標準差。","opts":{},"ans":null,"ansText":"S^2=3.3，S≈1.8166","expl":"x̄=3.6，Σ(x-x̄)^2=13.2，S^2=13.2/(5-1)=3.3，S=√3.3≈1.8166。","flag":false,"num":18},{"id":894,"src":"甲｜講義-機率統計","ch":"基礎統計｜3-2 離散趨勢量數","type":"open","q":"設有一組樣本資料如下：3,4,1,4,6，試求變異係數。","opts":{},"ans":null,"ansText":"CV≈50.46%","expl":"CV=S/x̄×100%=1.8166/3.6×100%≈50.46%。","flag":false,"num":19},{"id":895,"src":"甲｜講義-機率統計","ch":"基礎統計｜3-3 柴比雪夫與經驗法則","type":"open","q":"有100位學生修課，期中考成績之平均數為70，標準差為5。有多少學生的分數介於60與80之間？(1)用柴比雪夫 (2)用經驗法則，分別算出。","opts":{},"ans":null,"ansText":"(1)至少75人，(2)約95人","expl":"K=(80-70)/5=2；柴比雪夫至少1-1/K^2=3/4，100×3/4=75人；經驗法則2個標準差內約95%，100×0.95=95人。","flag":false,"num":20},{"id":896,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習3","type":"open","q":"有一組樣本資料值為8, 3, 10, 3, 11, 4，請計算其平均數、眾數、中位數、全距、Q1、Q2、Q3、IQR、變異數、標準差、變異係數。","opts":{},"ans":null,"ansText":"平均數6.5，眾數3，中位數6，全距8，Q1=3，Q2=6，Q3=10，IQR=7，變異數13.1，標準差≈3.6194，變異係數≈55.68%","expl":"排序3,3,4,8,10,11；x̄=39/6=6.5；Me=(4+8)/2=6；Σ(x-x̄)^2=65.5，S^2=65.5/5=13.1，S≈3.62，CV=3.62/6.5≈55.68%。附錄確認Mo=3、Q1=3、Q3=10、IQR=7。","flag":false,"num":21},{"id":897,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習3","type":"open","q":"若母體有10個，平均數為16，標準差為5，其中有一數正確應為23，卻誤為32，問修正後平均數及標準差應為多少？","opts":{},"ans":null,"ansText":"修正後平均數15.1，標準差≈1.868","expl":"原總和160，修正後151，μ=15.1；原Σx²=10(25+16²)=2810，修正為2810-32²+23²=2315，σ²=231.5-15.1²=3.49，σ≈1.868。附錄確認μ=15.1。","flag":false,"num":22},{"id":898,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習3","type":"open","q":"全班有55人，若平均數為72分，標準差為4分，欲算出64分到80分有多少人？(1)若利用柴比雪夫，有多少人？(2)若利用經驗法則，有多少人？","opts":{},"ans":null,"ansText":"(1)至少42人，(2)約53人","expl":"K=(80-72)/4=2；柴比雪夫55×3/4=41.25→至少42人；經驗法則55×0.95=52.25→約53人（附錄答案）。","flag":false,"num":23},{"id":899,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-1 樣本空間及事件","type":"open","q":"(1)擲一顆骰子，其樣本空間為何？(2)擲二顆骰子，其樣本空間為何？","opts":{},"ans":null,"ansText":"(1)S={1,2,3,4,5,6}共6個樣本點，(2)S={(1,1),(1,2),…,(6,6)}共36個樣本點","expl":"一顆骰子有6種出象；二顆骰子為有序數對，共6×6=36個樣本點。","flag":false,"num":24},{"id":900,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-2 排列與組合","type":"open","q":"王先生的銀行存款欲設定四個不相同的數字的密碼，問共有幾種方式可設定？","opts":{},"ans":null,"ansText":"5040種","expl":"由0~9十個數字取4個排列，P(10,4)=10!/6!=10×9×8×7=5040。","flag":false,"num":25},{"id":901,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-2 排列與組合","type":"open","q":"自5位科長中，隨機抽取2位，則共有多少樣本點？","opts":{},"ans":null,"ansText":"10個","expl":"不計順序之組合C(5,2)=5!/(2!3!)=10。","flag":false,"num":26},{"id":902,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-3 機率理論","type":"open","q":"投擲一顆骰子兩次，點數和為6的機率為何？","opts":{},"ans":null,"ansText":"5/36","expl":"n(S)=36；和為6的事件E={(1,5),(2,4),(3,3),(4,2),(5,1)}共5個，P(E)=5/36。","flag":false,"num":27},{"id":903,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-3 機率理論","type":"open","q":"擲二枚硬幣，出現一枚正面的機率？","opts":{},"ans":null,"ansText":"0.5","expl":"S={正正,正反,反正,反反}，恰一正面E={正反,反正}，P(E)=2/4=0.5。","flag":false,"num":28},{"id":904,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-4 事件機率","type":"open","q":"已知P(A)=0.4，P(B)=0.5，P(A∩B)=0.3，求：(1)P(A∪B) (2)P(A′∪B′) (3)P(A′∪B) (4)P(A∩B′)（′表餘事件）","opts":{},"ans":null,"ansText":"(1)0.6，(2)0.7，(3)0.9，(4)0.1","expl":"(1)0.4+0.5-0.3=0.6；(2)P(A′∪B′)=1-P(A∩B)=0.7；(3)P(A′∪B)=P(A′)+P(B)-P(A′∩B)=0.6+0.5-0.2=0.9；(4)P(A)-P(A∩B)=0.1。","flag":false,"num":29},{"id":905,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-4 事件機率","type":"open","q":"若A、B是獨立事件，P(A)=0.4，P(B)=0.5，求：(1)P(A∩B) (2)P(A∪B) (3)P(A′∪B)（′表餘事件）","opts":{},"ans":null,"ansText":"(1)0.2，(2)0.7，(3)0.8","expl":"獨立故P(A∩B)=0.4×0.5=0.2；P(A∪B)=0.4+0.5-0.2=0.7；P(A′∪B)=P(A′)+P(B)-P(A′∩B)=0.6+0.5-0.3=0.8。","flag":false,"num":30},{"id":906,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-7 條件機率","type":"open","q":"已知某公司有A、B兩種產品，A產品良品480、不良品20，B產品良品450、不良品50。(1)任選一件產品為A產品的機率為何？(邊際機率) (2)任選一件產品為A產品且不良品的機率為何？(聯合機率) (3)隨機抽取一件B產品，其結果為不良品的機率為何？(條件機率)","opts":{},"ans":null,"ansText":"(1)0.5，(2)0.02，(3)0.1","expl":"總數1000件；P(A)=500/1000=0.5；P(A∩不良)=20/1000=0.02；P(不良|B)=50/500=0.1。","flag":false,"num":31},{"id":907,"src":"甲｜講義-機率統計","ch":"基礎統計｜4-7 條件機率","type":"open","q":"準時飛之機率0.83，準時到之機率0.92，準時飛且準時到之機率0.78。(1)若已知準時飛，則準時到之機率？(2)若已知準時到，則準時飛之機率？","opts":{},"ans":null,"ansText":"(1)0.78/0.83≈0.94，(2)0.78/0.92≈0.85","expl":"條件機率P(到|飛)=P(到∩飛)/P(飛)=0.78/0.83≈0.94；P(飛|到)=0.78/0.92≈0.85。","flag":false,"num":32},{"id":908,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習4","type":"open","q":"擲二顆骰子，(1)出現點數和為7的機率？(2)出現點數和為7或第一顆為4點的機率？","opts":{},"ans":null,"ansText":"(1)1/6，(2)11/36","expl":"和為7有6種，6/36=1/6；第一顆為4有6種，交集{(4,3)}1種，P=6/36+6/36-1/36=11/36。","flag":false,"num":33},{"id":909,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習4","type":"open","q":"令A、B分別表示擲一顆骰子兩次點數和為6及點數和為奇數的事件，請問A、B是否為獨立事件？或為互斥事件？","opts":{},"ans":null,"ansText":"A、B為互斥事件，且不是獨立事件","expl":"和為6為偶數，A∩B=空集合，故互斥；P(A∩B)=0≠P(A)P(B)=(5/36)(1/2)，故不獨立。","flag":false,"num":34},{"id":910,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習4","type":"open","q":"若A、B是獨立事件，P(A)=0.6，P(B)=0.3，求：(1)P(A|B)與P(A′|B) (2)P(A∩B)與P(A∩B′) (3)P(A∪B)與P(A∪B′)（′表餘事件）","opts":{},"ans":null,"ansText":"(1)P(A|B)=0.6、P(A′|B)=0.4，(2)P(A∩B)=0.18、P(A∩B′)=0.42，(3)P(A∪B)=0.72、P(A∪B′)=0.88","expl":"獨立故P(A|B)=P(A)=0.6；P(A∩B)=0.18，P(A∩B′)=0.6×0.7=0.42；P(A∪B)=0.6+0.3-0.18=0.72，P(A∪B′)=0.6+0.7-0.42=0.88。附錄確認0.42、0.88。","flag":false,"num":35},{"id":911,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習4","type":"open","q":"若P(A)=0.3，P(B)=0.2，P(A∪B)=0.4，(1)P(A∩B)=? (2)P(A′∪B′)=?（′表餘事件）","opts":{},"ans":null,"ansText":"(1)0.1，(2)0.9","expl":"(1)P(A∩B)=0.3+0.2-0.4=0.1；(2)P(A′∪B′)=1-P(A∩B)=0.9。第(2)小題之餘事件符號因轉檔遺失，依附錄答案0.9重建。","flag":false,"num":36},{"id":912,"src":"甲｜講義-機率統計","ch":"基礎統計｜綜合練習4","type":"open","q":"某公
